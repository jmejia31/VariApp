<div class="cuentas-bancarias-container">
  <div class="header-section">
    <h1>Cuentas Bancarias</h1>
    <button mat-raised-button color="primary" *ngIf="puedeCrear()" (click)="mostrarFormulario.set(!mostrarFormulario())">
      {{ mostrarFormulario() ? 'Cancelar' : 'Nueva Cuenta' }}
    </button>
  </div>

  <div *ngIf="mostrarFormulario()" class="form-section">
    <h2>Registrar Nueva Cuenta</h2>
    <form [formGroup]="formulario" (ngSubmit)="guardarCuenta()">
      <div class="form-grid">
        <mat-form-field>
          <mat-label>ID de Banco</mat-label>
          <input matInput type="number" formControlName="bancoId" />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Nombre</mat-label>
          <input matInput formControlName="nombre" />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Número de Cuenta</mat-label>
          <input matInput formControlName="numeroCuenta" />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Moneda</mat-label>
          <input matInput formControlName="moneda" />
        </mat-form-field>
        <mat-form-field>
          <mat-label>Saldo Inicial</mat-label>
          <input matInput type="number" formControlName="saldoInicial" />
        </mat-form-field>
      </div>
      <button mat-raised-button color="primary" type="submit" [disabled]="formulario.invalid">Guardar Cuenta</button>
    </form>
  </div>

  <div class="filters-section">
    <mat-form-field>
      <mat-label>Buscar</mat-label>
      <input matInput [(ngModel)]="search" (ngModelChange)="onSearchChange($event)" />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Estado</mat-label>
      <mat-select [(ngModel)]="estadoFilter" (ngModelChange)="aplicarFiltros()">
        <mat-option [value]="null">Todos</mat-option>
        <mat-option [value]="1">Activa</mat-option>
        <mat-option [value]="2">Inactiva</mat-option>
      </mat-select>
    </mat-form-field>
    <button mat-button (click)="limpiarFiltros()">Limpiar Filtros</button>
  </div>

  <div class="table-container">
    <div class="loading-shade" *ngIf="loading()">
      <mat-spinner></mat-spinner>
    </div>
    <table mat-table [dataSource]="cuentas()">
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let element">{{ element.nombre }}</td>
      </ng-container>
      <ng-container matColumnDef="numeroCuenta">
        <th mat-header-cell *matHeaderCellDef>Número</th>
        <td mat-cell *matCellDef="let element">{{ element.numeroCuenta }}</td>
      </ng-container>
      <ng-container matColumnDef="moneda">
        <th mat-header-cell *matHeaderCellDef>Moneda</th>
        <td mat-cell *matCellDef="let element">{{ element.moneda }}</td>
      </ng-container>
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let element">{{ element.estado === 1 ? 'Activa' : 'Inactiva' }}</td>
      </ng-container>
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let element" class="acciones-cell">
          <button mat-button color="primary" *ngIf="puedeActivar() && element.estado === 2" (click)="activar(element)">Activar</button>
          <button mat-button color="warn" *ngIf="puedeDesactivar() && element.estado === 1" (click)="desactivar(element)">Desactivar</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnasMostradas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnasMostradas"></tr>
    </table>
  </div>
</div>
