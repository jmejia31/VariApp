<main class="purchase-report-page" aria-labelledby="purchase-report-title">
  <header class="page-header">
    <div>
      <p class="eyebrow">Centro de reportes</p>
      <h1 id="purchase-report-title">Reporte de compras</h1>
      <p>Consulta hechos persistidos de órdenes, facturación, recepción y devoluciones sin inferir FX, SLA, rankings ni puntajes compuestos.</p>
    </div>
  </header>

  <section class="panel" aria-labelledby="base-filters-title">
    <h2 id="base-filters-title">Filtros base</h2>
    <app-reporte-compras-filtros
      [disabled]="state === 'loading'"
      (filterChanged)="aplicarFiltros($event)">
    </app-reporte-compras-filtros>
  </section>

  <section class="panel" aria-labelledby="state-filters-title">
    <h2 id="state-filters-title">Estados</h2>
    <div class="state-grid">
      <app-estado-selector tipoEstado="EstadoOrden" label="Estado de orden" [control]="estadoOrden" (selectionChange)="aplicarEstados()"></app-estado-selector>
      <app-estado-selector tipoEstado="EstadoFactura" label="Estado de factura" [control]="estadoFactura" (selectionChange)="aplicarEstados()"></app-estado-selector>
      <app-estado-selector tipoEstado="EstadoRecepcion" label="Estado de recepción" [control]="estadoRecepcion" (selectionChange)="aplicarEstados()"></app-estado-selector>
      <app-estado-selector tipoEstado="EstadoDevolucion" label="Estado de devolución" [control]="estadoDevolucion" (selectionChange)="aplicarEstados()"></app-estado-selector>
    </div>
  </section>

  <app-purchase-report-disclosure [state]="state" [errorMessage]="errorMessage"></app-purchase-report-disclosure>

  @if (state === 'loaded' && result) {
    <section class="panel results" aria-labelledby="results-title">
      <h2 id="results-title">Resultados</h2>
      <app-reportes-compras-tabla
        [result]="result"
        [isLoading]="false"
        (pageChanged)="cambiarPagina($event)">
      </app-reportes-compras-tabla>
    </section>
  }
</main>
