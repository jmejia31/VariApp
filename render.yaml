services:
  - type: web
    name: variapp-api-desarrollo
    runtime: docker
    plan: free
    region: oregon
    branch: Desarrollo
    autoDeployTrigger: checksPass
    healthCheckPath: /health/ready
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Staging
      - key: AllowedHosts
        value: variapp-api-desarrollo.onrender.com
      - key: Database__ServerVersion
        value: 8.4.3
      - key: Database__ApplyMigrationsOnStartup
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: VariApp.Desarrollo.API
      - key: Jwt__Audience
        value: VariApp.Desarrollo.Frontend
      - key: Jwt__ExpiraMinutos
        value: "120"
      - key: Security__LoginRateLimitPerMinute
        value: "20"
      - key: Cloudinary__CloudName
        sync: false
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false
      - key: Cloudinary__EnvironmentPrefix
        value: varistorehn_desarrollo
      - key: Cors__AllowedOrigins__0
        value: https://variapp-desarrollo.vercel.app
      - key: AppSettings__BackendPublicUrl
        value: https://variapp-api-desarrollo.onrender.com
      - key: AppSettings__LogoPublicUrl
        value: https://variapp-desarrollo.vercel.app/assets/varistorehn-logo.png
      - key: AppSettings__EnlacePublicoFacturaHorasValidez
        value: "24"
      - key: AppSettings__EnlacePublicoFacturaMaximoAccesos
        value: "10"
      - key: AppSettings__CorreoFacturaIdempotenciaMinutos
        value: "15"
      - key: Swagger__Enabled
        value: "false"
      - key: Smtp__Host
        sync: false
      - key: Smtp__Port
        value: "587"
      - key: Smtp__UsuarioSmtp
        sync: false
      - key: Smtp__PasswordSmtp
        sync: false
      - key: Smtp__UsarSsl
        value: "true"
      - key: Smtp__RequiereAutenticacion
        value: "true"
      - key: Smtp__CorreoRemitente
        sync: false
      - key: Smtp__CorreoRespuesta
        sync: false
      - key: Smtp__NombreRemitente
        value: VariStorehn Desarrollo
      - key: Smtp__TimeoutSeconds
        value: "60"
      - key: Smtp__MaxAttempts
        value: "3"
      - key: Smtp__RetryBaseDelayMilliseconds
        value: "500"
      - key: SeedAdmin__Username
        sync: false
      - key: SeedAdmin__Password
        sync: false