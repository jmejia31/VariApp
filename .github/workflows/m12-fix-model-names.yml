name: M12 - Corregir nombres de modelo
on:
  push:
    branches: [Desarrollo]
    paths: [.github/workflows/m12-fix-model-names.yml]
permissions:
  contents: write
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - name: Aplicar correcciones verificadas por CI
        shell: bash
        run: |
          set -euo pipefail
          f='backend/src/Infrastructure/Services/AutomatizacionService.cs'
          sed -i 's/\.StockMinimo/.UmbralStockBajo/g' "$f"
          sed -i 's/_db\.MovimientoFinancieros/_db.MovimientosFinancieros/g' "$f"
          sed -i 's/_db\.EmpresaConfiguracion\./_db.EmpresaConfiguraciones./g' "$f"
          sed -i 's/AnyAsync(x => x\.Activo && !string.IsNullOrEmpty(x\.NombreComercial)/AnyAsync(x => x.Activa \&\& !string.IsNullOrEmpty(x.NombreComercial)/g' "$f"
          rm .github/workflows/m12-fix-model-names.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$f" .github/workflows/m12-fix-model-names.yml
          git diff --cached --check
          git commit -m 'fix(m12): alinear motor con entidades reales [ChatGPT]'
          git push origin HEAD:Desarrollo
