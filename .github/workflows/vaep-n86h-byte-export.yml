name: VAEP N8.6.H Byte Export

on:
  push:
    branches:
      - Desarrollo
    paths:
      - .github/workflows/vaep-n86h-byte-export.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Publish guarded byte-preserving append
        shell: bash
        run: |
          set -euo pipefail
          marker='## 2026-09-17 — ERP-N8.6 WhatsApp real — revalidación current-standard append-only'
          if grep -Fq "$marker" CHANGELOG_AI.md; then
            echo 'N8.6.H changelog append already present; no write required.'
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          src = Path('CHANGELOG_AI.md').read_bytes()
          source_git = subprocess.check_output(['git', 'hash-object', 'CHANGELOG_AI.md'], text=True).strip()
          assert source_git == 'e17e716b02a8460341d06ff2bdafc71222003ad6', source_git
          append = (
              "\n\n"
              "## 2026-09-17 — ERP-N8.6 WhatsApp real — revalidación current-standard append-only\n\n"
              "**Responsable:** VAEP :48 Debt bajo `docs/VAEP_AUTHORITY.md`.\n\n"
              "**Objetivo/alcance:** resolver `CHANGELOG_AI_ADDITIVE_RECONCILIATION` de `N8.6.H` de forma estrictamente aditiva/history-preserving, sin reabrir runtime ya revalidado ni ampliar el alcance de WhatsApp hacia una API de proveedor inexistente.\n\n"
              "**Evidencia current-standard:** `N8.6.A-G=LISTO` bajo revalidación vigente; `N8.6.G` receipt `vaep/evidence/receipts/N8.6.G_REVALIDATED_CURRENT_STANDARD_LISTO_20260917T084800Z_SUP36.json`, REVIEW_FIRST P0=0/P1=0 y gate causal de handoff `wa.me` en PASS. El contrato certificado es `USER_INITIATED_HANDOFF`: no se afirma envío server-side, delivery ni read receipt de Meta/Twilio. `TASKS.md` ya fue reconciliado de forma aditiva con compare `additions=11/deletions=0`.\n\n"
              "**Control:** esta publicación resuelve únicamente el P1 documental de `CHANGELOG_AI.md`. No declara por sí sola `N8.6.H=LISTO`: todavía exige REVIEW_FIRST fresco P0=0/P1=0, equivalencia funcional, receipt H persistido/releído y reconciliación de `COLA/CONFIG` antes de promover `N8.7.A`. Sin cambios a `main`, Producción, deploys, secretos, DNS/certificados ni PR #2.\n"
          ).encode('utf-8')
          out = src + append
          assert out.startswith(src)
          assert len(out) > len(src)
          Path('CHANGELOG_AI.md').write_bytes(out)
          PY

          test "$(git diff --name-only)" = 'CHANGELOG_AI.md'
          read -r additions deletions path < <(git diff --numstat -- CHANGELOG_AI.md)
          test "$path" = 'CHANGELOG_AI.md'
          test "$additions" -gt 0
          test "$deletions" -eq 0
          git diff --check -- CHANGELOG_AI.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG_AI.md
          git commit -m '[N8.6.H] append current-standard certification changelog'
          git push origin HEAD:Desarrollo
