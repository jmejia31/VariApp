name: VAEP N8.9.H Byte Export

on:
  push:
    branches:
      - Desarrollo
    paths:
      - .github/workflows/vaep-n86h-byte-export.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Publish guarded byte-preserving append
        shell: bash
        run: |
          set -euo pipefail
          marker='## 2026-09-17 — ERP-N8.9 Restore real — revalidación current-standard append-only'
          if grep -Fq "$marker" CHANGELOG_AI.md; then
            echo 'N8.9.H changelog append already present; no write required.'
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          src = Path('CHANGELOG_AI.md').read_bytes()
          source_git = subprocess.check_output(['git', 'hash-object', 'CHANGELOG_AI.md'], text=True).strip()
          assert source_git == '90fdb8689221cce42a0dbbc5af1a4816eaeb1cf3', source_git
          append = (
              "\n\n"
              "## 2026-09-17 — ERP-N8.9 Restore real — revalidación current-standard append-only\n\n"
              "**Responsable:** `CHATGPT_CONTROLLER` bajo `docs/VAEP_AUTHORITY.md`.\n\n"
              "**Objetivo/alcance:** resolver `CHANGELOG_AI_ADDITIVE_RECONCILIATION` de `N8.9.H` de forma estrictamente aditiva/history-preserving, sin reabrir runtime ya certificado ni ejecutar un restore destructivo del servicio administrado.\n\n"
              "**Evidencia current-standard:** `N8.9.A-G=LISTO`; certificación canónica `docs/CERTIFICACION_N8_9_RESTORE.md`; gate causal M11 `35223693868`, job `105209822216`, `SUCCESS`, restaurando el backup en MySQL descartable, validando integridad y arrancando la API contra la base restaurada. La equivalencia vigente del workflow/scripts de backup/restore permanece demostrada y no existe delta de migraciones dentro del scope N8.9. `TASKS.md` fue reconciliado en `34285b38fe15a05763e83668d228d456a1d0ce52` con compare `additions=13/deletions=0`.\n\n"
              "**Seguridad:** no se ejecutó restore/fork/upgrade en Aiven, no se tocó Producción, `main`, PR #2, secretos, DNS/certificados ni datos productivos.\n\n"
              "**Control:** este append resuelve el último P1 documental. `N8.9.H` sólo puede pasar a `LISTO` tras REVIEW_FIRST documental final P0=0/P1=0, exact-head/equivalencia, receipt persistido/releído y write/readback del control-plane; únicamente entonces puede promoverse `N8.10.A`.\n"
          ).encode('utf-8')
          out = src + append
          assert out.startswith(src)
          assert len(out) > len(src)
          Path('CHANGELOG_AI.md').write_bytes(out)
          PY

          test "$(git diff --name-only)" = 'CHANGELOG_AI.md'
          read -r additions deletions path < <(git diff --numstat -- CHANGELOG_AI.md)
          test "$path" = 'CHANGELOG_AI.md'
          test "$additions" -gt 0
          test "$deletions" -eq 0
          git diff --check -- CHANGELOG_AI.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG_AI.md
          git commit -m '[N8.9.H] append current-standard restore certification changelog'
          git push origin HEAD:Desarrollo
