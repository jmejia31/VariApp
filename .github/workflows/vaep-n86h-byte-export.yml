name: VAEP N8.6.H Byte Export

on:
  push:
    branches:
      - Desarrollo
    paths:
      - .github/workflows/vaep-n86h-byte-export.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Build byte-preserving N8.6.H candidate
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import subprocess

          marker = "## 2026-09-17 — ERP-N8.6 WhatsApp real — revalidación current-standard append-only"
          src = Path("CHANGELOG_AI.md").read_bytes()
          if marker.encode("utf-8") in src:
              Path("ALREADY_APPLIED").write_text("true\n", encoding="utf-8")
              Path("CHANGELOG_AI.source.md").write_bytes(src)
              Path("CHANGELOG_AI.final.md").write_bytes(src)
              Path("BYTE_EXPORT_METADATA.txt").write_text("already_applied=true\n", encoding="utf-8")
              raise SystemExit(0)

          append = """

## 2026-09-17 — ERP-N8.6 WhatsApp real — revalidación current-standard append-only

**Responsable:** VAEP :48 Debt bajo `docs/VAEP_AUTHORITY.md`.

**Objetivo/alcance:** resolver `CHANGELOG_AI_ADDITIVE_RECONCILIATION` de `N8.6.H` de forma estrictamente aditiva/history-preserving, sin reabrir runtime ya revalidado ni ampliar el alcance de WhatsApp hacia una API de proveedor inexistente.

**Evidencia current-standard:** `N8.6.A-G=LISTO` bajo revalidación vigente; `N8.6.G` receipt `vaep/evidence/receipts/N8.6.G_REVALIDATED_CURRENT_STANDARD_LISTO_20260917T084800Z_SUP36.json`, REVIEW_FIRST P0=0/P1=0 y gate causal de handoff `wa.me` en PASS. El contrato certificado es `USER_INITIATED_HANDOFF`: no se afirma envío server-side, delivery ni read receipt de Meta/Twilio. `TASKS.md` ya fue reconciliado de forma aditiva con compare `additions=11/deletions=0`.

**Control:** esta publicación resuelve únicamente el P1 documental de `CHANGELOG_AI.md`. No declara por sí sola `N8.6.H=LISTO`: todavía exige REVIEW_FIRST fresco P0=0/P1=0, equivalencia funcional, receipt H persistido/releído y reconciliación de `COLA/CONFIG` antes de promover `N8.7.A`. Sin cambios a `main`, Producción, deploys, secretos, DNS/certificados ni PR #2.
""".encode("utf-8")
          out = src + append
          assert out.startswith(src)
          assert len(out) > len(src)
          Path("CHANGELOG_AI.source.md").write_bytes(src)
          Path("CHANGELOG_AI.final.md").write_bytes(out)
          source_git = subprocess.check_output(["git", "hash-object", "CHANGELOG_AI.source.md"], text=True).strip()
          final_git = subprocess.check_output(["git", "hash-object", "CHANGELOG_AI.final.md"], text=True).strip()
          Path("BYTE_EXPORT_METADATA.txt").write_text(
              f"source_bytes={len(src)}\n"
              f"final_bytes={len(out)}\n"
              f"source_sha256={hashlib.sha256(src).hexdigest()}\n"
              f"final_sha256={hashlib.sha256(out).hexdigest()}\n"
              f"source_git_blob={source_git}\n"
              f"final_git_blob={final_git}\n",
              encoding="utf-8",
          )
          assert source_git == "e17e716b02a8460341d06ff2bdafc71222003ad6", source_git

      - name: Upload exact bytes
        uses: actions/upload-artifact@v4
        with:
          name: n86h-byte-export
          path: |
            CHANGELOG_AI.source.md
            CHANGELOG_AI.final.md
            BYTE_EXPORT_METADATA.txt
          if-no-files-found: error

      - name: Publish guarded append only
        if: ${{ hashFiles('ALREADY_APPLIED') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          cp CHANGELOG_AI.final.md CHANGELOG_AI.md
          git diff --name-only -- CHANGELOG_AI.md | grep -qx 'CHANGELOG_AI.md'
          read -r additions deletions path < <(git diff --numstat -- CHANGELOG_AI.md)
          test "$path" = "CHANGELOG_AI.md"
          test "$additions" -gt 0
          test "$deletions" -eq 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG_AI.md
          git commit -m "[N8.6.H] append current-standard certification changelog"
          git push origin HEAD:Desarrollo
