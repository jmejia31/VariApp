name: M13 - Hardening dependencias frontend

on:
  push:
    branches: [Desarrollo]
    paths:
      - .github/workflows/m13-dependency-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Actualizar parches seguros del toolchain
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --save-dev --save-exact \
            @angular/cli@20.3.33 \
            @angular-devkit/build-angular@20.3.33 \
            @playwright/test@1.62.1
          # Solo parches que npm puede resolver sin --force ni salto mayor.
          npm audit fix || true
          # Runtime/producción debe quedar sin high/critical.
          npm audit --omit=dev --audit-level=high
          # El tooling completo se registra para M13, pero advisories exclusivos de
          # desarrollo no fuerzan una migración mayor de Angular sin necesidad funcional.
          npm audit --audit-level=high > ../m13-npm-tooling-after-hardening.txt || true
          npm run lint
          npm run build:prod
      - name: Publicar hardening y retirar workflow temporal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m13-dependency-hardening.yml
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'No hay cambios de dependencias por publicar.'
            exit 0
          fi
          git commit -m 'chore(m13): endurecer dependencias frontend [ChatGPT]'
          git push origin HEAD:Desarrollo
