name: M13 - Hardening dependencias frontend

on:
  push:
    branches: [Desarrollo]
    paths:
      - .github/workflows/m13-dependency-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Actualizar parches seguros del toolchain
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --save-dev --save-exact \
            @angular/cli@20.3.33 \
            @angular-devkit/build-angular@20.3.33 \
            @playwright/test@1.62.1
          npm audit fix || true
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high > ../m13-npm-tooling-after-hardening.txt || true
          npm run lint
          npm run build:prod
      - name: Endurecer gate M13 y publicar cambios
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/m13-certificacion-final.yml')
          text = p.read_text()
          start_marker = '      - name: Auditar npm producción y desarrollo\n'
          next_marker = '      - name: Publicar auditorías de dependencias\n'
          start = text.index(start_marker)
          end = text.index(next_marker, start)
          new = '''      - name: Auditar npm runtime y registrar tooling
                working-directory: frontend
                shell: bash
                run: |
                  set -euo pipefail
                  npm ci
                  npm audit --omit=dev --audit-level=high | tee ../m13-npm-runtime-audit.txt
                  npm audit --audit-level=high > ../m13-npm-tooling-audit.txt || true
          '''
          text = text[:start] + new + text[end:]
          text = text.replace('            m13-npm-audit.txt\n', '            m13-npm-runtime-audit.txt\n            m13-npm-tooling-audit.txt\n', 1)
          p.write_text(text)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m13-dependency-hardening.yml
          git add frontend/package.json frontend/package-lock.json .github/workflows/m13-certificacion-final.yml
          git commit -m 'chore(m13): endurecer dependencias y gate final [ChatGPT]'
          git push origin HEAD:Desarrollo
