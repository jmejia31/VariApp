name: VAEP Jules B Trusted Secondary Worker

on:
  push:
    branches:
      - Desarrollo
    paths:
      - "vaep/jules-b/dispatch/*.json"

permissions:
  contents: read
  issues: write

concurrency:
  group: vaep-jules-b-secondary
  cancel-in-progress: false

jobs:
  dispatch-jules-b:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      EXPECTED_OWNER: jmejia31
      EXPECTED_REPO: VariApp
      EXPECTED_BRANCH: Desarrollo
      DISPATCH_PATH: vaep/jules-b/dispatch
      SESSION_TITLE_PREFIX: "VAEP-B "
      ARTIFACT_PREFIX: vaep-jules-b
      ISSUE_PREFIX: "[VAEP-JULES-B]"
      WORKER_LABEL: Jules B
      WORKER_ID: JULES_B
      VAEP_JULES_LANE_BUDGET_SECONDS: 1200
      JULES_API_KEY: ${{ secrets.JULES_B_API_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Execute VAEP Jules v3.27 deterministic clarification guard
        shell: bash
        run: bash .github/scripts/vaep-jules-no-clarification-v327.sh

      - name: Upload Jules B result artifact
        if: always() && env.RESULT_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: error
          retention-days: 14
