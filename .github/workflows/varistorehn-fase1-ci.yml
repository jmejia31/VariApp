name: VariStoreHn Fase 1 - verificación temporal

on:
  push:
    branches: [codex/varistorehn-fase1]
    paths:
      - 'frontend/src/app/features/varistorehn/**'
      - 'frontend/scripts/validate-varistorehn-fase1.mjs'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/varistorehn-fase1-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: varistorehn-fase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Fase 1
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node scripts/validate-varistorehn-fase1.mjs
      - run: npm run build:prod
