name: Catálogos y correcciones - aceptación aislada

on:
  push:
    branches:
      - Desarrollo
    paths:
      - .github/workflows/catalogos-aceptacion.yml
      - frontend/e2e/catalogos-mantenimientos.spec.ts
      - frontend/src/**
      - backend/src/**
      - backend/tests/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/catalogos-aceptacion.yml
      - frontend/e2e/catalogos-mantenimientos.spec.ts
      - frontend/src/**
      - backend/src/**
      - backend/tests/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogos-aceptacion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: CRUD, variantes, categorías y accesibilidad
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inventoryapp_catalogos_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: '5005'
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=inventoryapp_catalogos_e2e;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'true'
      Jwt__Secret: 'Catalogos-E2E-Only-Secret-With-More-Than-32-Characters-2026'
      Jwt__Issuer: 'InventoryApp.API'
      Jwt__Audience: 'InventoryApp.Frontend'
      Jwt__ExpiraMinutos: '120'
      SeedAdmin__Username: 'e2e_admin'
      SeedAdmin__Password: 'E2E.Admin#2026!'
      Cors__AllowedOrigins__0: 'http://127.0.0.1:4200'
      Cors__AllowedOrigins__1: 'http://localhost:4200'
      AppSettings__BackendPublicUrl: 'https://preview.variapp.invalid'
      AppSettings__LogoPublicUrl: 'https://varistorehn.vercel.app/assets/varistorehn-logo.png'
      AppSettings__EnlacePublicoFacturaHorasValidez: '1'
      AppSettings__EnlacePublicoFacturaMaximoAccesos: '5'
      Cloudinary__CloudName: 'e2e-not-used'
      Cloudinary__ApiKey: 'e2e-not-used'
      Cloudinary__ApiSecret: 'e2e-not-used'
      Smtp__Host: 'e2e-not-used'
      Smtp__Port: '587'
      Smtp__UsuarioSmtp: 'e2e-not-used@example.invalid'
      Smtp__PasswordSmtp: 'e2e-not-used'
      Smtp__UsarSsl: 'true'
      Smtp__CorreoRemitente: 'e2e-not-used@example.invalid'
      Smtp__NombreRemitente: 'VariApp E2E'
      PHASE7_API_URL: 'http://127.0.0.1:5005'
      PHASE7_ADMIN_USERNAME: 'e2e_admin'
      PHASE7_ADMIN_PASSWORD: 'E2E.Admin#2026!'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'

    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Restaurar y compilar backend
        working-directory: backend
        run: |
          dotnet restore InventoryApp.sln
          dotnet build InventoryApp.sln --configuration Release --no-restore

      - name: Iniciar API con MySQL descartable
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          nohup dotnet run \
            --project src/API/InventoryApp.API.csproj \
            --configuration Release \
            --no-build \
            --no-launch-profile \
            > catalogos-api.log 2>&1 &
          echo $! > catalogos-api.pid

      - name: Esperar API y migraciones
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5005/health > /dev/null; then
              echo 'API lista y migraciones aplicadas.'
              exit 0
            fi
            sleep 2
          done
          cat catalogos-api.log >&2 || true
          exit 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar frontend y Chromium
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test@latest
          npx playwright install --with-deps chromium

      - name: Iniciar Angular
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > catalogos-frontend.log 2>&1 &
          echo $! > catalogos-frontend.pid

      - name: Esperar Angular
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4200/login > /dev/null; then
              echo 'Angular listo.'
              exit 0
            fi
            sleep 2
          done
          cat catalogos-frontend.log >&2 || true
          exit 1

      - name: Ejecutar aceptación Playwright
        working-directory: frontend
        run: npx playwright test e2e/catalogos-mantenimientos.spec.ts --config=playwright.config.ts

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogos-e2e-evidence
          path: |
            backend/catalogos-api.log
            frontend/catalogos-frontend.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
