name: Temporal ChatGPT - limpiar cierre escáner 2C.4

on:
  push:
    branches:
      - Desarrollo
    paths:
      - .github/workflows/chatgpt-fase2c4-reintento.yml

permissions:
  contents: write

jobs:
  validar-y-limpiar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias exactas
        working-directory: frontend
        run: npm ci

      - name: Validar TypeScript y contrato 2C.4
        working-directory: frontend
        run: npm run lint

      - name: Compilar frontend de producción
        working-directory: frontend
        run: npm run build:prod

      - name: Retirar workflow temporal
        run: rm -f .github/workflows/chatgpt-fase2c4-reintento.yml

      - name: Publicar limpieza en Desarrollo
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/workflows/chatgpt-fase2c4-reintento.yml
          git config user.name 'jmejia31'
          git config user.email '93171442+jmejia31@users.noreply.github.com'
          git add -A
          git commit -m 'chore(ci): retirar temporales del frontend del escáner 2C.4 [ChatGPT]'
          git push origin HEAD:Desarrollo
