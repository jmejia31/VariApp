name: Desarrollo - Gobierno de matrices

on:
  push:
    branches: [Desarrollo]
    paths:
      - 'docs/matrices-evaluacion/**'
      - 'scripts/validate_matrix_governance.py'
      - 'scripts/validate_n8_17_c_data_contracts.py'
      - 'scripts/validate_n8_17_d_backend_contracts.py'
      - '.github/workflows/matrix-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-matrix-governance:
    name: MATRIX_ID, catálogo y plantilla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar gobierno canónico de matrices
        run: python scripts/validate_matrix_governance.py
      - name: Validar contratos de datos N8.17.C
        run: python scripts/validate_n8_17_c_data_contracts.py
      - name: Validar contratos backend N8.17.D
        run: python scripts/validate_n8_17_d_backend_contracts.py
