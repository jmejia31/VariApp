name: VAEP Control Plane CI Guard

on:
  push:
    branches:
      - Desarrollo
    paths:
      - '.github/workflows/vaep-control-plane-ci-guard.yml'

permissions:
  contents: write

concurrency:
  group: vaep-n311h-exact-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_BLOB: 3888a9bd46c59674de2d02ef49cd5c2999f2e6d7
      TARGET_BLOB: 8f4460c960e829c1d9c5f45d8d4bcce3e6f82f92
      TARGET_SHA256: 4612decc393e42b0d0dc4c0bab65ff0dbf5dfcf0ba6950e9ddbf5c14b94ad3bd
      APPEND_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - name: Publish exact N3.11.H changelog target
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            git fetch origin Desarrollo
            git reset --hard origin/Desarrollo
            current="$(git hash-object CHANGELOG_AI.md)"
            if [ "$current" = "$TARGET_BLOB" ]; then exit 0; fi
            if [ "$current" != "$SOURCE_BLOB" ]; then echo "FAIL_CLOSED source=$current" >&2; exit 41; fi
            printf '%s' "$APPEND_B64" | base64 -d >> CHANGELOG_AI.md
            test "$(git hash-object CHANGELOG_AI.md)" = "$TARGET_BLOB"
            test "$(sha256sum CHANGELOG_AI.md | cut -d' ' -f1)" = "$TARGET_SHA256"
            test "$(git diff --name-only)" = 'CHANGELOG_AI.md'
            git diff --check
            test "$(git diff --numstat -- CHANGELOG_AI.md)" = $'14\t0\tCHANGELOG_AI.md'
            git config user.name 'VAEP Closure Governor'
            git config user.email '93171442+jmejia31@users.noreply.github.com'
            git add CHANGELOG_AI.md
            git commit -m 'docs(N3.11.H): publicar cierre POS history-preserving [VAEP MASTER] [skip ci]'
            if git push origin HEAD:Desarrollo; then exit 0; fi
            sleep 2
          done
          exit 42
