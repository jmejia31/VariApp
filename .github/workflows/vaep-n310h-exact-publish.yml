# VAEP MASTER exact history-preserving closure publisher for N3.10.H.
name: VAEP N3.10.H Exact Closure Publisher

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/vaep-n310h-exact-publish.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: vaep-n310h-exact-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Append N3.10 closure and hard verify history preservation
        shell: bash
        env:
          EXPECTED_TASKS_SOURCE_BLOB: 0da9b2c46c699b839fd4bb2c9808783257220539
          EXPECTED_CHANGELOG_SOURCE_BLOB: 2374be85a7a3fd72ab4cff7cba03b76c09e9ec0e
          EXPECTED_CERT_BLOB: 35148b6165917234fd1aa54fd1521a832a7605ca
        run: |
          set -euo pipefail
          git fetch origin Desarrollo --depth=1
          test "$(git rev-parse origin/Desarrollo)" = "$GITHUB_SHA"
          test "$(git hash-object TASKS.md)" = "$EXPECTED_TASKS_SOURCE_BLOB"
          test "$(git hash-object CHANGELOG_AI.md)" = "$EXPECTED_CHANGELOG_SOURCE_BLOB"
          test "$(git hash-object docs/CERTIFICACION_N3_10_CREDITO_CLIENTE.md)" = "$EXPECTED_CERT_BLOB"
          cp TASKS.md /tmp/TASKS.source
          cp CHANGELOG_AI.md /tmp/CHANGELOG_AI.source

          cat > /tmp/tasks.append <<'EOF'
          
          ## ERP-N3.10 — Crédito de cliente — ROLLUP SUPERSEDING 2026-08-27
          
          Este bloque es aditivo y supersede únicamente el estado operativo stale de N3.9/N3.10 registrado arriba; no elimina ni reescribe historia previa.
          
          - [x] N3.9.H quedó cerrado formalmente antes de N3.10; `CHANGELOG_AI.md` contiene el cierre canónico history-preserving.
          - [x] N3.10.A auditoría/preflight — `LISTO_REAL`.
          - [x] N3.10.B dominio/contratos — `LISTO_REAL`; la capacidad de crédito permanece integrada a Cliente y no introduce un motor autónomo de scoring ni una segunda autoridad comercial.
          - [x] N3.10.C persistencia/migración/datos — `LISTO_REAL` en `619a0ba2a53ad70fb332c9f61198eb3b022ddcc1`; Development #33068581067, Acceptance #33068581028, Fase 8 #33068581188 y M13 #33068581299 `SUCCESS`.
          - [x] N3.10.D Application/API — `LISTO_REAL` en `3c5a2c30a3d8427d0d0764ef1d4bc4e895d4d585`; Development #33073610169, Acceptance #33073610154, Fase 8 #33073610151 y M13 #33073610159 `SUCCESS`.
          - [x] N3.10.E Frontend/UX — `LISTO_REAL` en `615d1a4878854bf22770b945256db39fea44e08f`; M10 #33083576709 `SUCCESS`.
          - [x] N3.10.F RBAC/auditoría/seguridad/observabilidad — `LISTO_REAL` en `98b7777555cd6f7ee881edb76321cd1226ca69eb`; Development #33086814120, Acceptance #33086814176, Fase 8 #33086814189, M13 #33086814163 y M10 #33086818401 `SUCCESS`.
          - [x] N3.10.G QA/regresión/CI — `LISTO_REAL`, reutilizando la misma autoridad exact-head `98b7777555cd6f7ee881edb76321cd1226ca69eb` sin fabricar evidencia duplicada.
          - [x] N3.10.H documentación/certificación — certificación canónica `docs/CERTIFICACION_N3_10_CREDITO_CLIENTE.md`; rollup aditivo TASKS+CHANGELOG hard-verificado; P0/P1 atribuibles conocidos=0.
          
          **ERP-N3.10 queda formalmente cerrado. Siguiente parent dependency-valid: `N3.11.A`; su promoción solo ocurre después de este cierre real.**
          EOF
          sed 's/^          //' /tmp/tasks.append >> TASKS.md

          cat > /tmp/changelog.append <<'EOF'
          
          ## 2026-08-27 — ERP-N3.10 Crédito del cliente — CIERRE FORMAL
          
          **Responsable:** ChatGPT/VAEP MASTER Closure Governor mediante QA takeover documental y hard verify history-preserving.
          
          **Objetivo/alcance:** cerrar formalmente N3.10.A-H con base en las autoridades certificadas, manteniendo la capacidad de crédito integrada a Cliente. Este cierre no introduce una segunda autoridad comercial, motor autónomo de scoring, ledger paralelo, nuevos permisos RBAC ni efectos automáticos adicionales sobre venta, factura, stock, Kardex, caja o contabilidad.
          
          **Evidencia:** N3.10.C=`619a0ba2a53ad70fb332c9f61198eb3b022ddcc1`; N3.10.D=`3c5a2c30a3d8427d0d0764ef1d4bc4e895d4d585`; N3.10.E=`615d1a4878854bf22770b945256db39fea44e08f`; N3.10.F/G=`98b7777555cd6f7ee881edb76321cd1226ca69eb`; certificación canónica=`docs/CERTIFICACION_N3_10_CREDITO_CLIENTE.md`. Los gates causales aplicables de estas autoridades están certificados y P0/P1 atribuibles conocidos al cierre=0.
          
          **Cierre documental/control:** este bloque y el rollup paralelo de `TASKS.md` son exclusivamente aditivos. Todo el contenido histórico previo de ambos archivos debe permanecer byte-prefix intacto; PR #2 continúa Draft `Desarrollo → main`, sin merge.
          
          **Promoción:** con esta publicación `N3.10.H` queda formalmente `LISTO_REAL`; el selector fail-closed puede promover `N3.11.A` y mantener N3.11.B/C como pipeline SAFE según dependencias.
          EOF
          sed 's/^          //' /tmp/changelog.append >> CHANGELOG_AI.md

          cmp -n "$(stat -c%s /tmp/TASKS.source)" /tmp/TASKS.source TASKS.md
          cmp -n "$(stat -c%s /tmp/CHANGELOG_AI.source)" /tmp/CHANGELOG_AI.source CHANGELOG_AI.md
          test "$(git diff --name-only | sort)" = $'CHANGELOG_AI.md\nTASKS.md'
          while IFS=$'\t' read -r added deleted path; do
            test "$deleted" = "0"
            test "$added" -gt 0
            case "$path" in TASKS.md|CHANGELOG_AI.md) ;; *) exit 1 ;; esac
          done < <(git diff --numstat -- TASKS.md CHANGELOG_AI.md)
          test "$(git diff --numstat -- TASKS.md CHANGELOG_AI.md | wc -l)" -eq 2
          git diff --check

          echo "TASKS_TARGET_BLOB=$(git hash-object TASKS.md)"
          echo "CHANGELOG_TARGET_BLOB=$(git hash-object CHANGELOG_AI.md)"
          echo "TASKS_SHA256=$(sha256sum TASKS.md | awk '{print $1}')"
          echo "CHANGELOG_SHA256=$(sha256sum CHANGELOG_AI.md | awk '{print $1}')"

          git config user.name 'VAEP Controller'
          git config user.email 'actions@users.noreply.github.com'
          git add TASKS.md CHANGELOG_AI.md
          git commit -m 'docs(N3.10.H): cerrar CréditoCliente de forma history-preserving [VAEP MASTER] [skip ci]'

          git fetch origin Desarrollo --depth=1
          test "$(git rev-parse origin/Desarrollo)" = "$GITHUB_SHA"
          git push origin HEAD:Desarrollo
