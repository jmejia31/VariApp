name: VAEP N3.11.H Exact Changelog Publisher

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/vaep-n311h-exact-changelog-publisher.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vaep-n311h-exact-changelog-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Publish exact history-preserving N3.11 closure
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_BLOB='3888a9bd46c59674de2d02ef49cd5c2999f2e6d7'
          TARGET_BLOB='8f4460c960e829c1d9c5f45d8d4bcce3e6f82f92'
          TARGET_SHA256='4612decc393e42b0d0dc4c0bab65ff0dbf5dfcf0ba6950e9ddbf5c14b94ad3bd'

          for attempt in 1 2 3 4 5; do
            git fetch origin Desarrollo
            git reset --hard origin/Desarrollo

            current="$(git hash-object CHANGELOG_AI.md)"
            if [[ "$current" == "$TARGET_BLOB" ]]; then
              echo "Exact target already published."
              exit 0
            fi
            if [[ "$current" != "$SOURCE_BLOB" ]]; then
              echo "FAIL_CLOSED: unexpected CHANGELOG source blob: $current" >&2
              exit 41
            fi

            python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('CHANGELOG_AI.md')
          source = path.read_bytes()
          assert len(source) == 79173, len(source)
          assert hashlib.sha256(source).hexdigest() == '025b64513769b01d1ee303528c9767b541080e047f08483754f6d57337458446'

          append = b'\n' + """## 2026-08-27 — ERP-N3.11 POS / Venta rápida — CIERRE FORMAL

          **Responsable:** ChatGPT/VAEP MASTER Closure Governor mediante QA takeover documental y hard verify history-preserving.

          **Objetivo/alcance:** cerrar formalmente N3.11.A-H con base en las autoridades certificadas, reutilizando la autoridad existente de Venta para el alcance de venta rápida. La experiencia existente (ventas/nueva) provee la funcionalidad requerida sin introducir una segunda superficie POS independiente en dominio, persistencia, API, frontend o permisos.

          **Evidencia:** N3.11.A-G están certificados para el alcance vigente (LISTO_REAL / QA_TAKEOVER_CERTIFIED). Certificación canónica = `docs/CERTIFICACION_N3_11_POS.md`. P0/P1 atribuibles conocidos al cierre: 0.

          **Decisiones pendientes:** cashier/session/terminal, split-tender/change, suspension/reprint, offline, POS-specific idempotency y POS-specific RBAC quedan explícitamente como DECISION_PENDING. No se materializan en el producto hasta un requisito autoritativo futuro.

          **Cierre documental/control:** este bloque es exclusivamente aditivo sobre el histórico existente. PR #2 continúa Draft `Desarrollo → main`, sin merge.

          **Promoción:** con esta publicación, N3.11.H quedará formalmente LISTO (TARGET_AFTER_PUBLICATION).""".encode('utf-8') + b'\n'

          assert len(append) == 1285, len(append)
          target = source + append
          assert len(target) == 80458, len(target)
          assert hashlib.sha256(target).hexdigest() == '4612decc393e42b0d0dc4c0bab65ff0dbf5dfcf0ba6950e9ddbf5c14b94ad3bd'
          path.write_bytes(target)
          PY

            [[ "$(git hash-object CHANGELOG_AI.md)" == "$TARGET_BLOB" ]]
            [[ "$(sha256sum CHANGELOG_AI.md | awk '{print $1}')" == "$TARGET_SHA256" ]]
            [[ "$(git diff --name-only)" == 'CHANGELOG_AI.md' ]]
            git diff --check
            read -r additions deletions changed_path < <(git diff --numstat -- CHANGELOG_AI.md)
            [[ "$additions" == '14' && "$deletions" == '0' && "$changed_path" == 'CHANGELOG_AI.md' ]]

            git config user.name 'VAEP Closure Governor'
            git config user.email '93171442+jmejia31@users.noreply.github.com'
            git add CHANGELOG_AI.md
            git commit -m 'docs(N3.11.H): publicar cierre POS history-preserving [VAEP MASTER] [skip ci]'

            if git push origin HEAD:Desarrollo; then
              echo "Published exact N3.11 target on attempt $attempt."
              exit 0
            fi
            echo "Concurrent HEAD advance detected; retrying on fresh Desarrollo."
            sleep 2
          done

          echo 'FAIL_CLOSED: unable to fast-forward exact target after retries.' >&2
          exit 42