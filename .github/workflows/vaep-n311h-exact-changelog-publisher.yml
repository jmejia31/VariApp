name: VAEP Exact Changelog Publisher

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/vaep-n311h-exact-changelog-publisher.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vaep-exact-changelog-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Publish exact history-preserving N4.4 closure
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_BLOB='8f4460c960e829c1d9c5f45d8d4bcce3e6f82f92'
          TARGET_BLOB='57cc6ac6054758b3a1a7a4a687cdd1cb355f487e'
          TARGET_SHA256='f9b3b80aac83e27550966a60893761fe28a07a43117605dfacfb90648dcc29cb'

          for attempt in 1 2 3 4 5; do
            git fetch origin Desarrollo
            git reset --hard origin/Desarrollo

            current="$(git hash-object CHANGELOG_AI.md)"
            if [[ "$current" == "$TARGET_BLOB" ]]; then
              echo "Exact N4.4 target already published."
              exit 0
            fi
            if [[ "$current" != "$SOURCE_BLOB" ]]; then
              echo "FAIL_CLOSED: unexpected CHANGELOG source blob: $current" >&2
              exit 41
            fi

            python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('CHANGELOG_AI.md')
          source = path.read_bytes()
          assert len(source) == 80458, len(source)
          assert hashlib.sha256(source).hexdigest() == '4612decc393e42b0d0dc4c0bab65ff0dbf5dfcf0ba6950e9ddbf5c14b94ad3bd'

          append = b'\n' + """## 2026-09-03 — ERP-N4.4 Cuentas por cobrar — CIERRE DOCUMENTAL

          Responsable ChatGPT/VAEP v3.25 Closure Governor / Jules A; objective finalización lógica N4.4 A-G; evidence A-F LISTO_REAL and G LISTO_REAL with docs/CERTIFICACION_N4_4_CUENTAS_POR_COBRAR.md and docs/RUNBOOK_N4_4_CUENTAS_POR_COBRAR.md; closure H is NOT declared LISTO_REAL.""".encode('utf-8') + b'\n'

          assert len(append) == 346, len(append)
          target = source + append
          assert len(target) == 80804, len(target)
          assert hashlib.sha256(target).hexdigest() == 'f9b3b80aac83e27550966a60893761fe28a07a43117605dfacfb90648dcc29cb'
          path.write_bytes(target)
          PY

            [[ "$(git hash-object CHANGELOG_AI.md)" == "$TARGET_BLOB" ]]
            [[ "$(sha256sum CHANGELOG_AI.md | awk '{print $1}')" == "$TARGET_SHA256" ]]
            [[ "$(git diff --name-only)" == 'CHANGELOG_AI.md' ]]
            git diff --check
            read -r additions deletions changed_path < <(git diff --numstat -- CHANGELOG_AI.md)
            [[ "$additions" == '4' && "$deletions" == '0' && "$changed_path" == 'CHANGELOG_AI.md' ]]

            git config user.name 'VAEP Closure Governor'
            git config user.email '93171442+jmejia31@users.noreply.github.com'
            git add CHANGELOG_AI.md
            git commit -m 'docs(N4.4.H): publicar cierre CxC history-preserving [VAEP v3.29] [skip ci]'

            if git push origin HEAD:Desarrollo; then
              echo "Published exact N4.4 target on attempt $attempt."
              exit 0
            fi
            echo "Concurrent HEAD advance detected; retrying on fresh Desarrollo."
            sleep 2
          done

          echo 'FAIL_CLOSED: unable to fast-forward exact target after retries.' >&2
          exit 42