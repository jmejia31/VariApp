name: VAEP engine lightweight checks

on:
  push:
    branches: [Desarrollo]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate JSON schemas
        run: node -e "for (const f of ['vaep/schemas/jules-dispatch.schema.json','vaep/schemas/evidence-fragment.schema.json','vaep/metrics/baseline.json']) JSON.parse(require('fs').readFileSync(f)); console.log('schemas valid')"
      - name: Validate VAEP scripts
        run: node --check scripts/vaep/dispatch-preflight.mjs && node --check scripts/vaep/aggregate-evidence.mjs && node --check scripts/vaep/bundles.mjs && node --check scripts/vaep/sync-bitacora.mjs && node --check scripts/vaep/reconcile-status.mjs && node --check scripts/vaep/metrics.mjs && python3 -m py_compile scripts/vaep/jules_integration_metrics.py scripts/vaep/jules_runtime_contract.py
      - name: Validate Bash syntax
        run: bash -n .github/scripts/vaep-policy-parser.sh .github/scripts/vaep-jules-master.sh .github/scripts/vaep-jules-worker.sh .github/scripts/vaep-jules-autorefill.sh .github/scripts/vaep-jules-autorefill-core.sh .github/scripts/vaep-jules-catalog-floor.sh .github/scripts/vaep-parent-close.sh .github/scripts/vaep-checkpoint.sh
      - name: Validate parser fail-closed self-test
        run: bash .github/scripts/vaep-policy-parser.sh --self-test
      - name: Validate AntiG StaticOnly
        shell: pwsh
        run: ./scripts/antig/antig-self-test.ps1 -StaticOnly
      - name: Validate VAEP/Jules MASTER
        run: bash .github/scripts/vaep-jules-master.sh --static-self-test
      - name: Validate VAEP/Jules worker runtime jq preflight
        run: bash .github/scripts/vaep-jules-worker.sh --runtime-preflight
      - name: Run VAEP/Jules MASTER runtime self-test
        run: bash .github/scripts/vaep-jules-master.sh --self-test
      - name: Validate post-terminal refill preserves REVIEW_FIRST and refills in parallel
        run: |
          grep -q "AUTOREFILL_TERMINAL_HANDOFF" .github/scripts/vaep-jules-autorefill.sh
          grep -q "CONTINUE_TO_CORE_REVIEW_FIRST_IN_PARALLEL" .github/scripts/vaep-jules-autorefill.sh
          grep -q "reviewResult:\"PENDING_REVIEW_FIRST\"" .github/scripts/vaep-jules-worker.sh
          ! grep -q "NO_POST_TERMINAL_REFILL" .github/scripts/vaep-jules-autorefill.sh
      - name: Validate control-plane base equivalence guard
        run: |
          grep -q "CONTROL_PLANE_BASE_EQUIVALENCE" docs/VAEP_AUTHORITY.md
          grep -q "write_base_equivalence" .github/scripts/vaep-jules-worker.sh
          grep -q -- "--base-equivalence" .github/scripts/vaep-jules-worker.sh
          grep -q "recoverable_attempt1_entry" .github/scripts/vaep-jules-autorefill-core.sh
          grep -q "WAIT_CAUSAL_CI" .github/scripts/vaep-checkpoint.sh
          grep -q "vaep/evidence/\*" .github/scripts/vaep-jules-autorefill-core.sh
          grep -q "vaep/evidence/\*" .github/scripts/vaep-parent-close.sh
          grep -q "MASTER_TIMEOUT_HANDOFF" .github/scripts/vaep-jules-master.sh
      - name: Validate recovery exact-manifest contract
        run: |
          for wf in .github/workflows/vaep-jules-{a,b,c,d}-recovery.yml; do
            grep -q "manifest_commit:" "$wf"
            grep -q "required: true" "$wf"
            grep -q "VAEP_DISPATCH_SHA:" "$wf"
            grep -q -- "--transport-preflight" "$wf"
          done
      - name: Validate review-first and lane-continuity contract
        run: |
          grep -q "READY_FOR_VAEP_REVIEW_FIRST_REQUIRED_NO_REFILL" .github/scripts/vaep-jules-worker.sh
          ! grep -q "review_first_debt_exists" .github/scripts/vaep-jules-autorefill.sh
          grep -q "CONTINUE_TO_CORE_REVIEW_FIRST_IN_PARALLEL" .github/scripts/vaep-jules-autorefill.sh
          grep -q "PREARM_BEFORE_TERMINAL" docs/VAEP_AUTHORITY.md
          grep -q "other_live_lane_run_exists" .github/scripts/vaep-jules-autorefill-core.sh
          grep -q "VAEP_LANE_RUN_ID" .github/workflows/vaep-jules-secondary.yml
      - name: Validate scheduled checkpoint controller
        run: |
          test "$(grep -c "cron:" .github/workflows/vaep-checkpoints.yml)" -eq 5
          grep -q "workflow_run:" .github/workflows/vaep-checkpoints.yml
          grep -q "VAEP engine lightweight checks" .github/workflows/vaep-checkpoints.yml
          grep -q "github.event.workflow_run.conclusion == 'success'" .github/workflows/vaep-checkpoints.yml
          grep -q "VAEP_CHECKPOINTS=:00,:12,:24,:36,:48" docs/VAEP_AUTHORITY.md
          bash .github/scripts/vaep-checkpoint.sh --self-test
          bash .github/scripts/vaep-parent-close.sh --self-test
      - name: Validate Jules synthetic dispatch matrix
        run: python3 scripts/vaep/jules_runtime_contract.py --self-test
      - name: Validate operational KPI evaluator
        run: node scripts/vaep/metrics.mjs --self-test
      - name: Validate Jules integration receipt contract
        run: python3 scripts/vaep/jules_integration_metrics.py --self-test
      - name: Validate HEAD integration receipt
        run: python3 scripts/vaep/jules_integration_metrics.py --validate-head HEAD
      - name: Report useful Jules throughput rolling 24h
        run: python3 scripts/vaep/jules_integration_metrics.py --rolling-hours 24
      - name: Run VAEP self-tests
        run: node scripts/vaep/dispatch-preflight-self-test.mjs && node scripts/vaep/block2-self-test.mjs && node scripts/vaep/block3-self-test.mjs
