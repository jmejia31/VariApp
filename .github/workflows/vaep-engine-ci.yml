name: VAEP engine lightweight checks

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/scripts/vaep-*.sh'
      - '.github/workflows/vaep-*.yml'
      - 'scripts/vaep/**'
      - 'vaep/**'
      - 'docs/VAEP_AUTHORITY.md'
      - 'AGENTS.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JSON and executable syntax
        run: |
          node -e "for (const f of ['vaep/schemas/jules-dispatch.schema.json','vaep/schemas/evidence-fragment.schema.json','vaep/metrics/baseline.json','vaep/control/jules-workers.json','vaep/control/jules-autorefill-catalog.json']) JSON.parse(require('fs').readFileSync(f)); console.log('json valid')"
          node --check scripts/vaep/dispatch-preflight.mjs
          node --check scripts/vaep/aggregate-evidence.mjs
          node --check scripts/vaep/bundles.mjs
          node --check scripts/vaep/sync-bitacora.mjs
          node --check scripts/vaep/reconcile-status.mjs
          node --check scripts/vaep/metrics.mjs
          python3 -m py_compile scripts/vaep/j1_j6_registry_check.py scripts/vaep/j1_j6_cutover.py scripts/vaep/jules_integration_metrics.py scripts/vaep/jules_runtime_contract.py scripts/vaep/terminal_handoff.py
          bash -n .github/scripts/vaep-policy-parser.sh .github/scripts/vaep-jules-master.sh .github/scripts/vaep-jules-worker.sh .github/scripts/vaep-jules-autorefill.sh .github/scripts/vaep-jules-autorefill-core.sh .github/scripts/vaep-jules-catalog-floor.sh .github/scripts/vaep-parent-close.sh .github/scripts/vaep-checkpoint.sh

      - name: Validate MASTER and canonical J1-J6 registry
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/vaep-policy-parser.sh --self-test
          bash .github/scripts/vaep-policy-parser.sh --validate docs/VAEP_AUTHORITY.md
          python3 scripts/vaep/j1_j6_registry_check.py
          python3 scripts/vaep/j1_j6_cutover.py
          jq -e '.cutoverEnabled == true and .phase == "F2_ACTIVE_CUTOVER" and .activeLegacyWorkers == [] and .activeWorkers == ["J1","J2","J3","J4","J5","J6"]' vaep/control/jules-workers.json >/dev/null
          grep -Fq 'JULES_ACTIVE_WORKERS=J1,J2,J3,J4,J5,J6' docs/VAEP_AUTHORITY.md
          grep -Fq 'JULES_TASKS_TARGET_ROLLING_24H_TOTAL=600' docs/VAEP_AUTHORITY.md
          grep -Fq 'JULES_PROGRAMMED_BACKLOG_TARGET_TOTAL=72' docs/VAEP_AUTHORITY.md
          grep -Fq 'LANE_REFILL_DEADLINE_SECONDS=30' docs/VAEP_AUTHORITY.md
          grep -Fq 'J1/J2/J3/J4/J5/J6' AGENTS.md

      - name: Validate canonical dispatch schema and catalog
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.properties.worker.enum[:6] == ["J1","J2","J3","J4","J5","J6"]' vaep/schemas/jules-dispatch.schema.json >/dev/null
          jq -e '.policy.programmedBacklogTargetTotal == 72 and .policy.activeWorkerCount == 6 and .policy.activeWorkers == ["J1","J2","J3","J4","J5","J6"] and (.lanes|keys|sort) == ["J1","J2","J3","J4","J5","J6"]' vaep/control/jules-autorefill-catalog.json >/dev/null
          node scripts/vaep/dispatch-preflight-self-test.mjs

      - name: Validate six canonical worker lanes
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            wf=".github/workflows/vaep-jules-j${i}.yml"
            test -f "$wf"
            grep -Fq "WORKER_ID: J${i}" "$wf"
            grep -Fq "secrets.JULES_J${i}_API_KEY" "$wf"
            grep -Fq 'VAEP_LANE_RUN_ID:' "$wf"
            grep -Fq 'manifest_commit:' "$wf"
            grep -Fq -- '--transport-preflight' "$wf"
            test "$(grep -c '0|78|79|80|81|82' "$wf")" -eq 2
          done

      - name: Validate legacy entry points are disabled
        shell: bash
        run: |
          set -euo pipefail
          for wf in .github/workflows/vaep-jules-secondary.yml .github/workflows/vaep-jules-secondary-b.yml .github/workflows/vaep-jules-secondary-c.yml .github/workflows/vaep-jules-secondary-d.yml; do
            grep -Fq 'Legacy' "$wf"
            grep -Fq 'LEGACY_WORKER_DISABLED_AFTER_J1_J6_CUTOVER' "$wf"
          done
          for wf in .github/workflows/vaep-jules-a-recovery.yml .github/workflows/vaep-jules-b-recovery.yml .github/workflows/vaep-jules-c-recovery.yml .github/workflows/vaep-jules-d-recovery.yml; do
            grep -Fq 'Legacy' "$wf"
            grep -Fq 'LEGACY_RECOVERY_DISABLED_AFTER_J1_J6_CUTOVER' "$wf"
          done

      - name: Validate canonical checkpoint health stop and diagnostic controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'cron:' .github/workflows/vaep-checkpoints.yml)" -eq 5
          grep -Fq 'worker: [J1, J2, J3, J4, J5, J6]' .github/workflows/vaep-checkpoints.yml
          for i in 1 2 3 4 5 6; do
            grep -Fq "J${i}_API_KEY: ${{ secrets.JULES_J${i}_API_KEY }}" .github/workflows/vaep-checkpoints.yml
            grep -Fq "J${i}_API_KEY: ${{ secrets.JULES_J${i}_API_KEY }}" .github/workflows/vaep-jules-stop.yml
            grep -Fq "J${i}_KEY: ${{ secrets.JULES_J${i}_API_KEY }}" .github/workflows/vaep-jules-session-health.yml
          done
          grep -Fq 'test("^J[1-6]$")' .github/workflows/vaep-jules-stop.yml
          grep -Fq 'secrets.JULES_J1_API_KEY' .github/workflows/vaep-jules-diagnostic.yml
          active=(.github/workflows/vaep-jules-j{1,2,3,4,5,6}.yml .github/workflows/vaep-checkpoints.yml .github/workflows/vaep-jules-stop.yml .github/workflows/vaep-jules-session-health.yml .github/workflows/vaep-jules-diagnostic.yml)
          if grep -En 'secrets\.JULES_(API_KEY|B_API_KEY|C_API_KEY|D_API_KEY)' "${active[@]}"; then
            echo 'LEGACY_SECRET_REFERENCE_FOUND_IN_ACTIVE_RUNTIME' >&2
            exit 1
          fi
          bash .github/scripts/vaep-checkpoint.sh --self-test
          bash .github/scripts/vaep-parent-close.sh --self-test

      - name: Validate VAEP/Jules runtime contracts
        run: |
          bash .github/scripts/vaep-jules-master.sh --static-self-test
          bash .github/scripts/vaep-jules-worker.sh --runtime-preflight
          bash .github/scripts/vaep-jules-master.sh --self-test
          python3 scripts/vaep/jules_runtime_contract.py --self-test
          python3 -m unittest discover -s scripts/vaep -p test_terminal_handoff.py
          python3 -m unittest discover -s scripts/vaep -p test_clarification_resolver.py

      - name: Validate no-busywork and continuity guards
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'AUTOREFILL_UNIQUE_WORK_EXHAUSTED' .github/scripts/vaep-jules-autorefill-core.sh
          grep -Fq 'result=UNIQUE_WORK_EXHAUSTED' .github/scripts/vaep-checkpoint.sh
          grep -Fq 'CONTINUE_LANE_REFILL_REVIEW_FIRST_IN_PARALLEL' .github/scripts/vaep-jules-autorefill.sh
          grep -Fq 'other_live_lane_run_exists' .github/scripts/vaep-jules-autorefill-core.sh
          grep -Fq 'NO_R2_REVIEW_OR_QA' .github/scripts/vaep-jules-autorefill-core.sh
          grep -Fq 'EVIDENCE_GAP_REVIEW_REQUIRED' scripts/vaep/jules_runtime_contract.py
          grep -Fq 'EVIDENCE_GAP_REVIEW_REQUIRED' scripts/vaep/terminal_handoff.py

      - name: Validate supporting VAEP self-tests
        shell: bash
        run: |
          set -euo pipefail
          pwsh ./scripts/antig/antig-self-test.ps1 -StaticOnly
          node scripts/vaep/block2-self-test.mjs
          node scripts/vaep/block3-self-test.mjs
          node scripts/vaep/metrics.mjs --self-test
          python3 scripts/vaep/jules_integration_metrics.py --self-test
          python3 scripts/vaep/jules_integration_metrics.py --rolling-hours 24

      - name: Verify clean repository diff
        run: git diff --check
