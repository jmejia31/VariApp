name: Fase 4 - endurecer stock de variantes

on:
  push:
    branches: [Desarrollo]
    paths:
      - .github/checkpoints/fase4-endurecer-stock-variantes

permissions:
  contents: write

concurrency:
  group: fase4-endurecer-stock-variantes
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - name: Aplicar reglas de stock físico y selección activa
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              if old not in text:
                  raise SystemExit(f'Patrón no encontrado en {path}: {old[:140]}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          replace(
              'backend/src/Application/Services/ProductoVarianteService.cs',
              '''        var variantes = await _repository.GetByProductoIdAsync(producto.Id, incluirInactivas: false);
        var total = variantes.Sum(v => v.Cantidad);
        producto.Cantidad = total;
        if (variantes.Count > 0)
        {
            producto.Costo = total > 0
                ? Math.Round(variantes.Sum(v => (v.Costo ?? 0m) * v.Cantidad) / total, 2, MidpointRounding.AwayFromZero)
                : variantes.Average(v => v.Costo ?? 0m);
            producto.Precio = variantes.Min(v => v.Precio ?? producto.Precio);
            producto.ColorId = variantes.Count == 1 ? variantes[0].ColorId : null;
        }''',
              '''        var variantes = await _repository.GetByProductoIdAsync(producto.Id, incluirInactivas: true);
        var activas = variantes.Where(v => v.Activo).ToList();
        var total = variantes.Sum(v => v.Cantidad);
        producto.Cantidad = total;
        if (variantes.Count > 0)
        {
            producto.Costo = total > 0
                ? Math.Round(variantes.Sum(v => (v.Costo ?? 0m) * v.Cantidad) / total, 2, MidpointRounding.AwayFromZero)
                : variantes.Average(v => v.Costo ?? 0m);
            var variantesPrecio = activas.Count > 0 ? activas : variantes;
            producto.Precio = variantesPrecio.Min(v => v.Precio ?? producto.Precio);
            producto.ColorId = variantes.Count == 1 ? variantes[0].ColorId : null;
        }''')

          for path in [
              'backend/src/Application/Services/CompraService.cs',
              'backend/src/Application/Services/VentaService.cs'
          ]:
              replace(path,
                  'else if (producto.Variantes.Any(v => v.Activo && !v.Eliminado))',
                  'else if (producto.Variantes.Any(v => !v.Eliminado))')

          replace(
              'backend/tests/InventoryApp.Tests/ProductoVarianteServiceTests.cs',
              '        Assert.Equal(2, _producto.Cantidad);\n        Assert.Equal(230, _producto.Precio);',
              '        Assert.Equal(5, _producto.Cantidad);\n        Assert.Equal(98, _producto.Costo);\n        Assert.Equal(230, _producto.Precio);')

          for path in [
              'frontend/src/app/features/ventas/venta-form.component.ts',
              'frontend/src/app/features/compras/compra-form.component.ts'
          ]:
              replace(path,
              '''  variantesDisponibles(group: AbstractControl): ProductoVariante[] {
    return (this.productoSeleccionado(group)?.variantes ?? []).filter((v) => v.activo);
  }''',
              '''  tieneVariantesActivas(producto: Producto): boolean {
    return (producto.variantes ?? []).some((variante) => variante.activo);
  }

  variantesDisponibles(group: AbstractControl): ProductoVariante[] {
    return (this.productoSeleccionado(group)?.variantes ?? []).filter((v) => v.activo);
  }''')

          replace(
              'frontend/src/app/features/ventas/venta-form.component.html',
              '[disabled]="p.estaAgotado || p.cantidad === 0"',
              '[disabled]="p.estaAgotado || p.cantidad === 0 || (p.usaVariantes && !tieneVariantesActivas(p))"')

          replace(
              'frontend/src/app/features/compras/compra-form.component.html',
              '<mat-option [value]="p.id">{{ p.nombre }} — {{ p.marca }} {{ p.modelo }} · stock {{ p.cantidad }}</mat-option>',
              '<mat-option [value]="p.id" [disabled]="p.usaVariantes && !tieneVariantesActivas(p)">{{ p.nombre }} — {{ p.marca }} {{ p.modelo }} · stock {{ p.cantidad }}</mat-option>')
          PY
      - name: Publicar endurecimiento
        run: |
          git config user.name 'VariApp Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/src backend/tests frontend/src
          git commit -m 'fix: preservar stock físico y exigir variantes activas'
          git push origin HEAD:Desarrollo
