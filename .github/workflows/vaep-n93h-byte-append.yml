name: VAEP N9.3.H byte-safe closure append

on:
  push:
    branches:
      - Desarrollo
    paths:
      - .github/workflows/vaep-n93h-byte-append.yml

permissions:
  contents: write

jobs:
  append-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Append N9.3 closure byte-safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import subprocess

          expected = {
              "TASKS.md": "09d2ab1d1fa7eff8a0db55b997f0478301b74199",
              "CHANGELOG_AI.md": "98c1ef97025d0a393c82fdd3c0d19f2ebf1ad5e5",
          }
          encoded = {
              "TASKS.md": "",
              "CHANGELOG_AI.md": "",
          }

          for name, expected_blob in expected.items():
              path = Path(name)
              actual_blob = subprocess.check_output(["git", "hash-object", str(path)], text=True).strip()
              if actual_blob != expected_blob:
                  raise SystemExit(f"{name} blob drift: expected {expected_blob}, got {actual_blob}")
              old = path.read_bytes()
              if b"ERP-N9.3" in old:
                  raise SystemExit(f"{name} already contains N9.3 closure marker; refusing duplicate append")
              block = base64.b64decode(encoded[name])
              new = old + block
              if not new.startswith(old) or len(new) <= len(old):
                  raise SystemExit(f"{name} prefix/addition invariant failed before write")
              path.write_bytes(new)
              if path.read_bytes()[:len(old)] != old:
                  raise SystemExit(f"{name} prefix invariant failed after write")
          PY

          changed="$(git diff --name-only | sort)"
          expected_changed="$(printf '%s\n' CHANGELOG_AI.md TASKS.md | sort)"
          test "$changed" = "$expected_changed"

          for file in TASKS.md CHANGELOG_AI.md; do
            numstat="$(git diff --numstat -- "$file")"
            echo "$numstat"
            adds="$(printf '%s\n' "$numstat" | awk '{print $1}')"
            dels="$(printf '%s\n' "$numstat" | awk '{print $2}')"
            test "$adds" != "-"
            test "$dels" != "-"
            test "$adds" -gt 0
            test "$dels" -eq 0
          done
          git diff --check

      - name: Commit and push append only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vaep-supervisor-24"
          git config user.email "93171442+jmejia31@users.noreply.github.com"
          git add -- TASKS.md CHANGELOG_AI.md
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --name-only | grep -Fx 'TASKS.md'
          git diff --cached --name-only | grep -Fx 'CHANGELOG_AI.md'
          git commit -m "[N9.3.H] append closure records byte-safely"
          git push origin HEAD:Desarrollo
