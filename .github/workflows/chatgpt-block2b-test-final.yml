name: Temporal ChatGPT Block 2B Test Final

on:
  push:
    branches:
      - Desarrollo
    paths:
      - .github/workflows/chatgpt-block2b-test-final.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Alinear escenario de edición conservadora
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/e2e/fase4-variantes.spec.ts')
          text = path.read_text(encoding='utf-8')
          marker_start = "  test('Formulario principal permite agregar colores y muestra la suma del stock'"
          marker_end = "\n\n  test('Angular exige la variante exacta en compra y venta'"
          if text.count(marker_start) != 1:
              raise SystemExit('No se encontró exactamente una vez el escenario obsoleto esperado.')
          start = text.index(marker_start)
          end = text.index(marker_end, start)
          replacement = "\n".join([
              "  test('Formulario principal separa metadatos de la administración de variantes', async ({ page }) => {",
              "    await loginUi(page);",
              "",
              "    await page.goto(`/productos/${productoId}/editar`);",
              "    await expect(page.getByRole('heading', { name: 'Colores y existencias' })).toBeVisible();",
              "    await expect(page.getByText('Stock total calculado')).toBeVisible();",
              "    await expect(page.locator('.variant-card')).toHaveCount(2);",
              "    await expect(page.locator('.stock-summary').getByText('14 unidades', { exact: true })).toBeVisible();",
              "",
              "    await expect(page.getByRole('button', { name: 'Agregar otro color' })).toHaveCount(0);",
              "    const cantidades = page.locator('input[formcontrolname=\"cantidad\"]');",
              "    await expect(cantidades).toHaveCount(2);",
              "    await expect(cantidades.nth(0)).toBeDisabled();",
              "    await expect(cantidades.nth(1)).toBeDisabled();",
              "",
              "    const administrarVariantes = page.getByRole('link', { name: 'Administrar variantes' });",
              "    await expect(administrarVariantes).toBeVisible();",
              "    await expect(administrarVariantes).toHaveAttribute('href', `/productos/${productoId}/variantes`);",
              "  });"
          ])
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Validar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint

      - name: Publicar corrección en Desarrollo
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'jmejia31'
          git config user.email '93171442+jmejia31@users.noreply.github.com'
          git add frontend/e2e/fase4-variantes.spec.ts
          if git diff --cached --quiet; then
            echo 'No hay cambios para publicar.'
            exit 1
          fi
          git commit -m 'test(e2e): certificar separación de metadatos y variantes [ChatGPT]'
          git push origin HEAD:Desarrollo
