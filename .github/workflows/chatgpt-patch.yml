name: Temporal ChatGPT Patch Runner

on:
  push:
    branches:
      - Desarrollo
    paths:
      - .github/patches/chatgpt_patch_matrix.py
      - .github/workflows/chatgpt-patch.yml

permissions:
  contents: write

concurrency:
  group: chatgpt-patch-desarrollo
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Aplicar matriz controlada
        run: python3 .github/patches/chatgpt_patch_matrix.py

      - name: Validar formato del diff
        run: git diff --check

      - name: Restaurar, compilar y probar backend unitario
        working-directory: backend
        run: |
          dotnet restore InventoryApp.sln
          dotnet build InventoryApp.sln --configuration Release --no-restore
          dotnet test InventoryApp.sln --configuration Release --no-build --filter "Category!=Integration"

      - name: Validar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build:prod

      - name: Publicar matriz en Desarrollo
        run: |
          if [ -z "$(git status --porcelain -- backend frontend)" ]; then
            echo "La matriz no produjo cambios."
            exit 1
          fi
          git config user.name "jmejia31"
          git config user.email "93171442+jmejia31@users.noreply.github.com"
          git add backend frontend
          git commit -m "test(inventario): ampliar matriz documental concurrente MySQL [ChatGPT]"
          git push origin HEAD:Desarrollo
