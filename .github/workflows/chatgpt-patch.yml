name: Temporal ChatGPT Patch Runner

on:
  push:
    branches:
      - Desarrollo
    paths:
      - .github/patches/chatgpt_patch.py

permissions:
  contents: write

concurrency:
  group: chatgpt-patch-desarrollo
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Aplicar parche controlado
        run: python3 .github/patches/chatgpt_patch.py

      - name: Validar formato del diff
        run: git diff --check

      - name: Restaurar, compilar y probar backend unitario
        working-directory: backend
        run: |
          dotnet restore InventoryApp.sln
          dotnet build InventoryApp.sln --configuration Release --no-restore
          dotnet test InventoryApp.sln --configuration Release --no-build --filter "Category!=Integration"

      - name: Publicar corrección en Desarrollo
        run: |
          if git diff --quiet; then
            echo "El parche no produjo cambios."
            exit 1
          fi
          git config user.name "jmejia31"
          git config user.email "93171442+jmejia31@users.noreply.github.com"
          git add backend
          git commit -m "feat(inventario): conectar ajustes formales con control de concurrencia [ChatGPT]"
          git push origin HEAD:Desarrollo
