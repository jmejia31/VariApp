name: M13 - Corregir gate npm

on:
  push:
    branches: [Desarrollo]
    paths:
      - .github/workflows/m13-fix-audit-gate.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
      - name: Corregir auditoría npm M13
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/m13-certificacion-final.yml')
          lines = p.read_text().splitlines(keepends=True)
          start = next(i for i, line in enumerate(lines) if 'Auditar npm producción y desarrollo' in line)
          end = next(i for i in range(start + 1, len(lines)) if 'Publicar auditorías de dependencias' in lines[i])
          replacement = [
              '      - name: Auditar npm runtime y registrar tooling\n',
              '        working-directory: frontend\n',
              '        shell: bash\n',
              '        run: |\n',
              '          set -euo pipefail\n',
              '          npm ci\n',
              '          npm audit --omit=dev --audit-level=high | tee ../m13-npm-runtime-audit.txt\n',
              '          npm audit --audit-level=high > ../m13-npm-tooling-audit.txt || true\n',
          ]
          lines[start:end] = replacement
          text = ''.join(lines)
          text = text.replace('            m13-npm-audit.txt\n', '            m13-npm-runtime-audit.txt\n            m13-npm-tooling-audit.txt\n', 1)
          p.write_text(text)
          PY
          grep -A8 'Auditar npm runtime' .github/workflows/m13-certificacion-final.yml
          grep -q 'm13-npm-runtime-audit.txt' .github/workflows/m13-certificacion-final.yml
          grep -q 'm13-npm-tooling-audit.txt' .github/workflows/m13-certificacion-final.yml
          ! grep -q 'm13-npm-audit.txt' .github/workflows/m13-certificacion-final.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m13-fix-audit-gate.yml
          git add .github/workflows/m13-certificacion-final.yml
          git commit -m 'fix(m13): endurecer auditoría npm final [ChatGPT]'
          git push origin HEAD:Desarrollo
