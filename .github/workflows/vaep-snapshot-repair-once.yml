name: VAEP N6.4.C EF Snapshot Repair Once

on:
  push:
    branches:
      - Desarrollo
    paths:
      - '.github/workflows/vaep-snapshot-repair-once.yml'

permissions:
  contents: write

jobs:
  repair-snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend
        run: dotnet restore backend/InventoryApp.sln

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 8.0.2

      - name: Regenerate EF model snapshot from current model
        shell: bash
        run: |
          set -euo pipefail
          dotnet ef migrations add N64CSnapshotSyncTemporary \
            --project backend/src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project backend/src/API/InventoryApp.API.csproj \
            --output-dir Migrations

          find backend/src/Infrastructure/Migrations -maxdepth 1 -type f \
            -name '*N64CSnapshotSyncTemporary*.cs' -delete

          grep -q 'InventoryApp.Domain.Entities.UsuarioEmpresa' \
            backend/src/Infrastructure/Migrations/AppDbContextModelSnapshot.cs

          git diff --check
          git diff -- backend/src/Infrastructure/Migrations/AppDbContextModelSnapshot.cs

      - name: Commit snapshot only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/Infrastructure/Migrations/AppDbContextModelSnapshot.cs
          if git diff --cached --quiet; then
            echo 'Snapshot did not change; refusing false repair.'
            exit 1
          fi
          git commit -m 'fix(n6.4.c): synchronize EF model snapshot'
          git push origin HEAD:Desarrollo
