name: VAEP QA N4.9.C snapshot takeover

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/vaep-qa-n49c-snapshot.yml'

permissions:
  contents: write

concurrency:
  group: vaep-qa-n49c-snapshot
  cancel-in-progress: false

jobs:
  qa-takeover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore canonical snapshot base and apply reviewed R2 patch
        shell: bash
        run: |
          set -euo pipefail
          SNAP='backend/src/Infrastructure/Migrations/AppDbContextModelSnapshot.cs'
          git show 98d190ed58a0e049452b5d5a639d5be7f1ec3395:"$SNAP" > "$SNAP"
          cat > /tmp/n49c.patch.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/n49c.patch.b64 > /tmp/n49c.patch
          git apply --check /tmp/n49c.patch
          git apply /tmp/n49c.patch
          git diff --check
      - name: Validate exact EF reconciliation
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore InventoryApp.sln
          dotnet build InventoryApp.sln --configuration Release --no-restore -warnaserror
          dotnet tool install --global dotnet-ef --version 8.0.8
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations has-pending-model-changes --project src/Infrastructure/InventoryApp.Infrastructure.csproj --startup-project src/API/InventoryApp.API.csproj --context AppDbContext
      - name: Commit QA takeover result and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT VAEP QA'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/vaep-qa-n49c-snapshot.yml
          git add backend/src/Infrastructure/Migrations/AppDbContextModelSnapshot.cs .github/workflows/vaep-qa-n49c-snapshot.yml
          git diff --cached --check
          git commit -m 'fix(ef): QA reconcile N4.9.C snapshot [ChatGPT]'
          git push origin HEAD:Desarrollo
