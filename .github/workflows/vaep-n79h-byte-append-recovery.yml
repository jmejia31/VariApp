name: VAEP N7.9.H byte append recovery

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/vaep-n79h-byte-append-recovery.yml'

permissions:
  contents: write

concurrency:
  group: vaep-n79h-byte-append-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Recover N7.9.H append-only docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Verify exact blobs and append bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object TASKS.md)" = "652e2e4c53073633153e35d3aedc1bd086c2ca8e"
          test "$(git hash-object CHANGELOG_AI.md)" = "af258b4f744752199b03a22dfa2201acf869348e"
          cp TASKS.md /tmp/TASKS.before
          cp CHANGELOG_AI.md /tmp/CHANGELOG.before
          tasks_last="$(tail -c 1 /tmp/TASKS.before | od -An -t x1 | tr -d ' \n')"
          changelog_last="$(tail -c 1 /tmp/CHANGELOG.before | od -An -t x1 | tr -d ' \n')"
          cat >> TASKS.md <<'TASKS_EOF'

          ## ERP-N7.9 — Ecommerce — ROLLUP DOCUMENTAL 2026-09-14

          Este bloque es estrictamente aditivo/history-preserving y supersede únicamente snapshots operativos stale; la autoridad viva continúa en `CONFIG/COLA` bajo `docs/VAEP_AUTHORITY.md`.

          - [x] N7.9.A-G — `LISTO_REAL` con receipts/evidencia VAEP y P0/P1 atribuibles conocidos=0.
          - [x] N7.9.G — TEST_CI certificado sobre functional candidate `5de96492290218639f18c1648668215339c34a1e`; receipt `vaep/evidence/receipts/N7.9.G_LISTO_REAL_20260914T230920Z_SUP00.json`; workflow causal `34905794077` con backend, Docker, frontend, higiene y MySQL/migraciones en `SUCCESS`.
          - [x] N7.9.H — certificación canónica `docs/CERTIFICACION_N7_9_ECOMMERCE.md` preparada para cierre documental.
          - [x] Este rollup resuelve `TASKS_ADDITIVE_STATE_RECONCILIATION` preservando byte-for-byte toda historia previa; `CHANGELOG_AI_ADDITIVE_RECONCILIATION` se publica en el mismo recovery commit mediante append byte-exacto.
          - [ ] N7.9.H sólo pasa a `LISTO_REAL` después de hard verify de prefijo/tamaño, REVIEW_FIRST fresco P0=0/P1=0, equivalencia funcional contra `5de96492290218639f18c1648668215339c34a1e` y receipt H persistido/releído.

          **CURRENT_PARENT=N7.9.H. NEXT_PARENT_PREARMED=N7.10.A. No se promueve N7.10.A antes del cierre real de H. FALSE_PASS=NO. FALSE_LISTO=NO.**
          TASKS_EOF
          cat >> CHANGELOG_AI.md <<'CHANGELOG_EOF'

          ## 2026-09-14 — ERP-N7.9 Ecommerce — reconciliación documental append-only

          **Responsable:** VAEP / DOC_CERT N7.9.H.

          **Objetivo/alcance:** cerrar documentalmente N7.9 sin reabrir lógica ya certificada ni ampliar alcance. Esta entrada y el rollup de `TASKS.md` preservan byte-for-byte sus históricos previos.

          **Evidencia funcional:** N7.9.A-G=`LISTO_REAL`; functional candidate final `5de96492290218639f18c1648668215339c34a1e`; receipt G `vaep/evidence/receipts/N7.9.G_LISTO_REAL_20260914T230920Z_SUP00.json`; REVIEW_FIRST G P0=0/P1=0/P2=0. El workflow causal `34905794077` terminó con backend Release/pruebas, Docker, frontend producción, higiene y MySQL/migraciones en `SUCCESS`; backend registró 2245 passed, 0 failed, 0 skipped. Los commits posteriores al candidate hasta el receipt G son exclusivamente evidencia y no introducen delta funcional de producto/schema.

          **Control:** esta publicación resuelve los P1 documentales mediante append byte-exacto. No declara por sí sola `N7.9.H=LISTO_REAL`: exige hard verify de prefijo/tamaño, REVIEW_FIRST fresco P0=0/P1=0, equivalencia funcional y receipt H persistido/releído antes de promover `N7.10.A`. Sin cambios a `main`, Producción, deploys, secretos ni PR #2.
          CHANGELOG_EOF
          sed -i 's/^          //' /tmp/nonexistent 2>/dev/null || true
          tasks_before_size="$(wc -c < /tmp/TASKS.before)"
          changelog_before_size="$(wc -c < /tmp/CHANGELOG.before)"
          cmp -n "$tasks_before_size" /tmp/TASKS.before TASKS.md
          cmp -n "$changelog_before_size" /tmp/CHANGELOG.before CHANGELOG_AI.md
          test "$(wc -c < TASKS.md)" -gt "$tasks_before_size"
          test "$(wc -c < CHANGELOG_AI.md)" -gt "$changelog_before_size"
          changed="$(git diff --name-only)"
          test "$changed" = $'CHANGELOG_AI.md\nTASKS.md' || test "$changed" = $'TASKS.md\nCHANGELOG_AI.md'
          for f in TASKS.md CHANGELOG_AI.md; do
            stats="$(git diff --numstat -- "$f")"
            adds="$(printf '%s\n' "$stats" | awk '{print $1}')"
            dels="$(printf '%s\n' "$stats" | awk '{print $2}')"
            test -n "$adds" && test "$adds" -gt 0
            if [ "$dels" -ne 0 ]; then
              if [ "$f" = "TASKS.md" ]; then old_last="$tasks_last"; else old_last="$changelog_last"; fi
              test "$old_last" != "0a"
              test "$dels" -le 1
            fi
          done
          git diff --check

      - name: Commit rollups and retire recovery workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VAEP Recovery"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/vaep-n79h-byte-append-recovery.yml
          git add TASKS.md CHANGELOG_AI.md
          git diff --cached --check
          git commit -m "docs(n7.9.h): append byte-safe closure rollups"
          git push origin HEAD:Desarrollo
