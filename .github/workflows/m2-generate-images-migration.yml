name: M2 generar migración imágenes por variante

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/m2-generate-images-migration.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generar migración oficial
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore InventoryApp.sln
          dotnet tool install --global dotnet-ef --version 8.0.8
          dotnet ef migrations add M2ImagenesPorVariante \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext \
            --output-dir Migrations
          dotnet build InventoryApp.sln --configuration Release --no-restore

      - name: Publicar migración y autoeliminar workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/m2-generate-images-migration.yml
          git config user.name 'VariApp Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/src/Infrastructure/Migrations
          git add -u .github/workflows/m2-generate-images-migration.yml
          git commit -m 'feat(m2): agregar migración imágenes por variante [ChatGPT]'
          git push origin HEAD:Desarrollo
