name: M2 diagnóstico Playwright

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/m2-playwright-diagnostico.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inventoryapp_catalogos_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: '5005'
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=inventoryapp_catalogos_e2e;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'true'
      Jwt__Secret: 'Catalogos-E2E-Only-Secret-With-More-Than-32-Characters-2026'
      Jwt__Issuer: 'InventoryApp.API'
      Jwt__Audience: 'InventoryApp.Frontend'
      Jwt__ExpiraMinutos: '120'
      Security__LoginRateLimitPerMinute: '300'
      SeedAdmin__Username: 'e2e_admin'
      SeedAdmin__Password: 'E2E.Admin#2026!'
      Cors__AllowedOrigins__0: 'http://127.0.0.1:4200'
      Cors__AllowedOrigins__1: 'http://localhost:4200'
      AppSettings__BackendPublicUrl: 'https://preview.variapp.invalid'
      AppSettings__LogoPublicUrl: 'https://variapp-desarrollo.vercel.app/assets/varistorehn-logo.png'
      AppSettings__EnlacePublicoFacturaHorasValidez: '1'
      AppSettings__EnlacePublicoFacturaMaximoAccesos: '5'
      AppSettings__CorreoFacturaIdempotenciaMinutos: '15'
      Cloudinary__CloudName: 'e2e-not-used'
      Cloudinary__ApiKey: 'e2e-not-used'
      Cloudinary__ApiSecret: 'e2e-not-used'
      Smtp__Host: '127.0.0.1'
      Smtp__Port: '1025'
      Smtp__UsuarioSmtp: 'smtp-user'
      Smtp__PasswordSmtp: 'smtp-pass'
      Smtp__UsarSsl: 'false'
      Smtp__RequiereAutenticacion: 'true'
      Smtp__CorreoRemitente: 'facturas@desarrollo.test'
      Smtp__CorreoRespuesta: 'soporte@desarrollo.test'
      Smtp__NombreRemitente: 'VariApp E2E'
      Smtp__TimeoutSeconds: '10'
      Smtp__MaxAttempts: '3'
      Smtp__RetryBaseDelayMilliseconds: '100'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
      PLAYWRIGHT_JSON_OUTPUT_NAME: '/tmp/m2-playwright.json'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Iniciar API descartable
        working-directory: backend
        run: |
          dotnet restore InventoryApp.sln
          dotnet build InventoryApp.sln --configuration Release --no-restore
          nohup dotnet run --project src/API/InventoryApp.API.csproj --configuration Release --no-build --no-launch-profile > /tmp/m2-api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5005/health/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/m2-api.log
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Iniciar frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          nohup npm start -- --host 127.0.0.1 --port 4200 > /tmp/m2-angular.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/m2-angular.log
          exit 1
      - name: Reproducir primer fallo
        id: playwright
        continue-on-error: true
        working-directory: frontend
        run: |
          npx playwright test \
            e2e/catalogos-mantenimientos.spec.ts \
            e2e/productos-filtros.spec.ts \
            e2e/fase3-interfaz.spec.ts \
            e2e/fase4-responsive.spec.ts \
            e2e/fase4-variantes.spec.ts \
            e2e/fase5-cargas-masivas.spec.ts \
            e2e/fase5-imagenes.spec.ts \
            e2e/fase6-facturacion-impresion.spec.ts \
            e2e/fase6-reportes-administrativos.spec.ts \
            e2e/fase7-validacion-integral.spec.ts \
            e2e/fase8-validacion-completa.spec.ts \
            e2e/fase7-correo.spec.ts \
            e2e/sesion-inactividad.spec.ts \
            e2e/matriz-modulos-visual.spec.ts \
            e2e/phase7-admin-role.spec.ts \
            e2e/phase7-user-isolation.spec.ts \
            e2e/phase7.spec.ts \
            e2e/fase2c4-escaner-frontend.spec.ts \
            e2e/fase2c5-autocomplete-remoto.spec.ts \
            e2e/fase2c5-regresiones-compatibilidad.spec.ts \
            --grep-invert="Angular exige la variante exacta en compra y venta|Compras y Ventas muestran imágenes o fallback en listas, formularios y detalles" \
            --max-failures=1 --reporter=json --config=playwright.config.ts
      - name: Extraer resumen seguro
        run: |
          python3 <<'PY'
          import json, pathlib, re
          source = pathlib.Path('/tmp/m2-playwright.json')
          out = pathlib.Path('docs/M2_PLAYWRIGHT_DIAGNOSTICO_TEMPORAL.md')
          if not source.exists():
              out.write_text('# Diagnóstico temporal M2\n\nNo se generó JSON de Playwright.\n', encoding='utf-8')
          else:
              data = json.loads(source.read_text(encoding='utf-8'))
              failures = []
              def walk(suite, parents=None):
                  parents = parents or []
                  title = suite.get('title')
                  chain = parents + ([title] if title else [])
                  for spec in suite.get('specs', []):
                      for test in spec.get('tests', []):
                          for result in test.get('results', []):
                              if result.get('status') not in ('passed', 'skipped'):
                                  err = result.get('error') or {}
                                  message = err.get('message') or ''
                                  message = re.sub(r'\x1b\[[0-9;]*m', '', message)
                                  failures.append({
                                      'file': spec.get('file') or suite.get('file') or '',
                                      'line': spec.get('line') or '',
                                      'title': ' > '.join(chain + [spec.get('title','')]),
                                      'status': result.get('status',''),
                                      'message': message[:6000]
                                  })
                  for child in suite.get('suites', []): walk(child, chain)
              for suite in data.get('suites', []): walk(suite)
              lines = ['# Diagnóstico temporal M2', '', f'Fallos capturados: {len(failures)}', '']
              for f in failures[:3]:
                  lines += [f"## {f['title']}", '', f"- Archivo: `{f['file']}:{f['line']}`", f"- Estado: `{f['status']}`", '', '```text', f['message'], '```', '']
              out.write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Publicar solo diagnóstico y autoeliminar workflow
        run: |
          rm -f .github/workflows/m2-playwright-diagnostico.yml
          git config user.name 'VariApp Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/M2_PLAYWRIGHT_DIAGNOSTICO_TEMPORAL.md
          git add -u .github/workflows/m2-playwright-diagnostico.yml
          git commit -m 'chore(m2): publicar diagnóstico Playwright temporal [ChatGPT]'
          git push origin HEAD:Desarrollo
