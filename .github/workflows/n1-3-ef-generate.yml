name: ERP-N1.3 - Finalizar persistencia Ubicaciones

on:
  push:
    branches:
      - Desarrollo
    paths:
      - '.github/workflows/n1-3-ef-generate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalizar-persistencia:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inventoryapp_n13_ubicaciones
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=inventoryapp_n13_ubicaciones;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Jwt__Secret: 'N13-Ubicaciones-CI-Only-Secret-With-More-Than-32-Characters-2026'
      Jwt__Issuer: 'InventoryApp.API'
      Jwt__Audience: 'InventoryApp.Frontend'
      Cors__AllowedOrigins__0: 'http://localhost:4200'
      Cloudinary__CloudName: 'ci-not-used'
      Cloudinary__ApiKey: 'ci-not-used'
      Cloudinary__ApiSecret: 'ci-not-used'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar solución
        working-directory: backend
        run: dotnet restore InventoryApp.sln

      - name: Instalar dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 8.0.8

      - name: Generar delta EF y reconciliar snapshot condensado
        run: |
          set -euo pipefail
          cp backend/src/Infrastructure/Migrations/AppDbContextModelSnapshot.cs /tmp/n13-base-snapshot.cs
          dotnet ef migrations add N1_3_UbicacionAlmacenPersistencia \
            --project backend/src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project backend/src/API/InventoryApp.API.csproj \
            --context AppDbContext \
            --output-dir Migrations
          python scripts/n1_3_finalize_persistence.py
          python - <<'PY'
          from pathlib import Path

          migrations = Path('backend/src/Infrastructure/Migrations')
          files = [p for p in migrations.glob('*_N1_3_UbicacionAlmacenPersistencia.cs') if not p.name.endswith('.Designer.cs')]
          if len(files) != 1:
              raise SystemExit(f'Se esperaba una migración N1.3 y se hallaron {len(files)}')
          path = files[0]
          text = path.read_text(encoding='utf-8-sig')

          old_checks = '''                ALTER TABLE UbicacionesAlmacen
                    ADD CONSTRAINT CK_UbicacionesAlmacen_Codigo_NoVacio CHECK (CHAR_LENGTH(TRIM(Codigo)) > 0),
                    ADD CONSTRAINT CK_UbicacionesAlmacen_Nombre_NoVacio CHECK (CHAR_LENGTH(TRIM(Nombre)) > 0),
                    ADD CONSTRAINT CK_UbicacionesAlmacen_Tipo_Valido CHECK (Tipo BETWEEN 1 AND 6),
                    ADD CONSTRAINT CK_UbicacionesAlmacen_Padre_NoSelf CHECK (UbicacionPadreId IS NULL OR UbicacionPadreId <> Id);
'''
          new_checks = '''                ALTER TABLE UbicacionesAlmacen
                    ADD CONSTRAINT CK_UbicacionesAlmacen_Codigo_NoVacio CHECK (CHAR_LENGTH(TRIM(Codigo)) > 0),
                    ADD CONSTRAINT CK_UbicacionesAlmacen_Nombre_NoVacio CHECK (CHAR_LENGTH(TRIM(Nombre)) > 0),
                    ADD CONSTRAINT CK_UbicacionesAlmacen_Tipo_Valido CHECK (Tipo BETWEEN 1 AND 6);
'''
          if old_checks not in text:
              raise SystemExit('No se encontró bloque CHECK esperado para parche MySQL')
          text = text.replace(old_checks, new_checks, 1)

          post_marker = '''            migrationBuilder.Sql("""
                DROP TEMPORARY TABLE IF EXISTS __N13CPostGuard;
'''
          trigger_block = '''            migrationBuilder.Sql("""
                CREATE TRIGGER TR_UbicacionesAlmacen_NoSelf_Insert
                AFTER INSERT ON UbicacionesAlmacen
                FOR EACH ROW
                BEGIN
                    IF NEW.UbicacionPadreId IS NOT NULL AND NEW.UbicacionPadreId = NEW.Id THEN
                        SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'Una ubicacion no puede ser su propio padre.';
                    END IF;
                END;
                """);

            migrationBuilder.Sql("""
                CREATE TRIGGER TR_UbicacionesAlmacen_NoSelf_Update
                BEFORE UPDATE ON UbicacionesAlmacen
                FOR EACH ROW
                BEGIN
                    IF NEW.UbicacionPadreId IS NOT NULL AND NEW.UbicacionPadreId = NEW.Id THEN
                        SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT = 'Una ubicacion no puede ser su propio padre.';
                    END IF;
                END;
                """);

'''
          if post_marker not in text:
              raise SystemExit('No se encontró marcador de postcheck')
          text = text.replace(post_marker, trigger_block + post_marker, 1)

          old_post = '''                SELECT 8, CASE WHEN COUNT(*) = 4 THEN 0 ELSE 1 END
                  FROM information_schema.table_constraints
                 WHERE constraint_schema = DATABASE()
                   AND table_name = 'UbicacionesAlmacen'
                   AND constraint_type = 'CHECK'
                   AND constraint_name IN (
                        'CK_UbicacionesAlmacen_Codigo_NoVacio',
                        'CK_UbicacionesAlmacen_Nombre_NoVacio',
                        'CK_UbicacionesAlmacen_Tipo_Valido',
                        'CK_UbicacionesAlmacen_Padre_NoSelf');

                DROP TEMPORARY TABLE __N13CPostGuard;
'''
          new_post = '''                SELECT 8, CASE WHEN COUNT(*) = 3 THEN 0 ELSE 1 END
                  FROM information_schema.table_constraints
                 WHERE constraint_schema = DATABASE()
                   AND table_name = 'UbicacionesAlmacen'
                   AND constraint_type = 'CHECK'
                   AND constraint_name IN (
                        'CK_UbicacionesAlmacen_Codigo_NoVacio',
                        'CK_UbicacionesAlmacen_Nombre_NoVacio',
                        'CK_UbicacionesAlmacen_Tipo_Valido');

                INSERT INTO __N13CPostGuard (Id, Violaciones)
                SELECT 9, CASE WHEN COUNT(*) = 2 THEN 0 ELSE 1 END
                  FROM information_schema.triggers
                 WHERE trigger_schema = DATABASE()
                   AND event_object_table = 'UbicacionesAlmacen'
                   AND trigger_name IN (
                        'TR_UbicacionesAlmacen_NoSelf_Insert',
                        'TR_UbicacionesAlmacen_NoSelf_Update');

                DROP TEMPORARY TABLE __N13CPostGuard;
'''
          if old_post not in text:
              raise SystemExit('No se encontró postcheck de CHECKs esperado')
          text = text.replace(old_post, new_post, 1)
          path.write_text(text, encoding='utf-8-sig')
          print(f'Compatibilidad MySQL aplicada a {path.name}: self-parent protegido por triggers.')
          PY

      - name: Verificar snapshot sin drift
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project backend/src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project backend/src/API/InventoryApp.API.csproj \
            --context AppDbContext

      - name: Compilar y probar backend
        working-directory: backend
        run: |
          dotnet build InventoryApp.sln --configuration Release --no-restore -warnaserror
          dotnet test InventoryApp.sln --configuration Release --no-build --filter "Category!=Integration"

      - name: Aplicar historial completo en MySQL 8.4
        run: |
          dotnet ef database update \
            --project backend/src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project backend/src/API/InventoryApp.API.csproj \
            --context AppDbContext

      - name: Publicar persistencia final y auto-retirar helpers
        run: |
          set -euo pipefail
          git fetch origin Desarrollo
          test "$(git rev-parse origin/Desarrollo)" = "$(git rev-parse HEAD)"
          git config user.name 'VariApp VAEP Runner'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/n1-3-ef-generate.yml scripts/n1_3_finalize_persistence.py
          git add backend/src/Infrastructure/Migrations backend/src/Infrastructure/Persistence/Configurations/UbicacionAlmacenConfiguration.cs
          git diff --cached --check
          git commit -m 'feat(N1.3.C): persistir ubicaciones internas fail-closed'
          git push origin HEAD:Desarrollo
