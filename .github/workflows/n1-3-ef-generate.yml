name: ERP-N1.3 - Generar artefactos EF Ubicaciones

on:
  push:
    branches: [Desarrollo]
    paths:
      - 'backend/src/Infrastructure/Persistence/Configurations/UbicacionAlmacenConfiguration.cs'
      - '.github/workflows/n1-3-ef-generate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generar-ef:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restaurar solución
        run: dotnet restore InventoryApp.sln
      - name: Instalar dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 8.0.8
      - name: Generar migración y snapshot EF
        run: |
          set -euo pipefail
          dotnet ef migrations add N1_3_UbicacionAlmacenPersistencia \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext \
            --output-dir Migrations
          dotnet ef migrations has-pending-model-changes \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext
          cd ..
          mkdir -p /tmp/n13-ef
          git status --porcelain -- backend/src/Infrastructure/Migrations | cut -c4- > /tmp/n13-files.txt
          test -s /tmp/n13-files.txt
          while IFS= read -r file; do
            mkdir -p "/tmp/n13-ef/$(dirname "$file")"
            cp "$file" "/tmp/n13-ef/$file"
          done < /tmp/n13-files.txt
          cp /tmp/n13-files.txt /tmp/n13-ef/GENERATED_FILES.txt
      - name: Publicar artefactos EF
        uses: actions/upload-artifact@v4
        with:
          name: n1-3-ubicaciones-ef-generated
          path: /tmp/n13-ef
          if-no-files-found: error
          retention-days: 3
