name: ERP-N1.3 - Preparar DI Ubicaciones

on:
  push:
    branches:
      - Desarrollo
    paths:
      - '.github/workflows/n1-3-d-program-artifact.yml'

permissions:
  contents: read

jobs:
  preparar-program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Program.cs con DI
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('backend/src/API/Program.cs')
          text = source.read_text(encoding='utf-8-sig')
          repo_anchor = 'builder.Services.AddScoped<IAlmacenRepository, AlmacenRepository>();\n'
          repo_line = 'builder.Services.AddScoped<IUbicacionAlmacenRepository, UbicacionAlmacenRepository>();\n'
          svc_anchor = 'builder.Services.AddScoped<IAlmacenService, AlmacenService>();\n'
          svc_line = 'builder.Services.AddScoped<IUbicacionAlmacenService, UbicacionAlmacenService>();\n'
          if repo_line not in text:
              if repo_anchor not in text:
                  raise SystemExit('Anchor IAlmacenRepository no encontrado')
              text = text.replace(repo_anchor, repo_anchor + repo_line, 1)
          if svc_line not in text:
              if svc_anchor not in text:
                  raise SystemExit('Anchor IAlmacenService no encontrado')
              text = text.replace(svc_anchor, svc_anchor + svc_line, 1)
          out = Path('/tmp/n13-program')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'Program.cs').write_text(text, encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: n1-3-d-program-di
          path: /tmp/n13-program/Program.cs
          if-no-files-found: error
          retention-days: 1
