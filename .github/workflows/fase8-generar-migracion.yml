name: Fase 8 - generar migración aditiva de facturación

on:
  push:
    branches:
      - Desarrollo
    paths:
      - .github/checkpoints/fase8-generar-migracion
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fase8-generar-migracion
  cancel-in-progress: false

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar backend
        working-directory: backend
        run: dotnet restore

      - name: Instalar EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 8.*

      - name: Generar migración aditiva
        working-directory: backend
        env:
          ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=inventoryapp_migration_design;User=root;Password=root;SslMode=None;
          Database__ServerVersion: 8.4.0
          Jwt__Secret: Fase8-Migration-Design-Only-Secret-With-More-Than-32-Characters
          Jwt__Issuer: InventoryApp.API
          Jwt__Audience: InventoryApp.Frontend
          Cors__AllowedOrigins__0: http://localhost:4200
        run: |
          dotnet ef migrations add Fase8FacturacionPagosCostosEnvioVariantes \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext \
            --output-dir Migrations

      - name: Validar que la migración sea aditiva
        run: |
          if git diff -- backend/src/Infrastructure/Migrations | grep -E '^\+.*Drop(Table|Column|ForeignKey)' ; then
            echo 'La migración contiene una operación destructiva no autorizada.' >&2
            exit 1
          fi

      - name: Compilar y probar
        working-directory: backend
        run: |
          dotnet build --configuration Release --no-restore
          dotnet test --configuration Release --no-build

      - name: Publicar migración en Desarrollo
        run: |
          if git diff --quiet -- backend/src/Infrastructure/Migrations; then
            echo 'No se generaron cambios de migración.'
            exit 0
          fi
          git config user.name 'VariApp Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/src/Infrastructure/Migrations
          git commit -m 'feat: agregar migración aditiva de facturación y pagos'
          git push origin HEAD:Desarrollo
