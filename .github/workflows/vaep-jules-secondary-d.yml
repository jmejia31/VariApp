name: VAEP Jules D Trusted Secondary Worker

on:
  push:
    branches:
      - Desarrollo
    paths:
      - "vaep/jules-d/dispatch/*.json"

permissions:
  contents: read
  issues: write

concurrency:
  group: vaep-jules-d-secondary
  cancel-in-progress: false

jobs:
  dispatch-jules-d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      EXPECTED_OWNER: jmejia31
      EXPECTED_REPO: VariApp
      EXPECTED_BRANCH: Desarrollo
      DISPATCH_PATH: vaep/jules-d/dispatch
      SESSION_TITLE_PREFIX: "VAEP-D "
      ARTIFACT_PREFIX: vaep-jules-d
      ISSUE_PREFIX: "[VAEP-JULES-D]"
      WORKER_LABEL: Jules D
      WORKER_ID: JULES_D
      VAEP_JULES_LANE_BUDGET_SECONDS: 1080
      JULES_API_KEY: ${{ secrets.JULES_D_API_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Execute VAEP Jules v3.26 throughput guard over v3.25 worker
        shell: bash
        run: bash .github/scripts/vaep-jules-throughput-guard-v326.sh

      - name: Upload Jules D result artifact
        if: always() && env.RESULT_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: error
          retention-days: 14
