name: VAEP - Reparacion temporal snapshot EF

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/vaep-ef-snapshot-repair.yml'

permissions:
  contents: write

jobs:
  publicar-migracion-canonica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Instalar EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.8
      - name: Generar migracion y snapshot canonicos
        shell: bash
        run: |
          set -euo pipefail
          rm -f backend/src/Infrastructure/Persistence/Migrations/20260812111800_ERP_N05_BancoNormalizado.cs
          rm -f backend/src/Infrastructure/Migrations/*ERP_N05_BancoNormalizadoCanonical*.cs
          cd backend
          dotnet restore InventoryApp.sln
          dotnet ef migrations add ERP_N05_BancoNormalizadoCanonical \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext \
            --output-dir Migrations
          dotnet ef migrations has-pending-model-changes \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext
          cd ..
      - name: Registrar changeset en CHANGELOG_AI
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'N0.5.07B2 - snapshot EF canonico de Banco' CHANGELOG_AI.md; then
            printf '\n%s\n\n%s\n\n%s\n\n%s\n' \
              '## 2026-08-12 - N0.5.07B2 - snapshot EF canonico de Banco - VALIDANDO' \
              '**Responsable:** ChatGPT / VAEP v2 Runner.' \
              '**Correccion:** los CI 31622173253 y 31622173357 demostraron que la logica Banco/fail-closed y las pruebas pasaban, pero dotnet ef migrations has-pending-model-changes detecto drift porque la migracion inicial de Banco no actualizo el snapshot EF canonico. Se reemplaza esa migracion manual por una migracion generada con EF Core 8.0.8, su Designer y AppDbContextModelSnapshot, sin relajar ninguna validacion ni alterar el diseno normalizado.' \
              '**Control:** B2 permanece VALIDANDO hasta que los CI reales sobre el changeset canonico terminen en verde. No se toca main, Produccion, PR #2, auto-merge ni ramas nuevas.' \
              >> CHANGELOG_AI.md
          fi
      - name: Verificar HEAD y publicar fast-forward
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin Desarrollo
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/Desarrollo)" || { echo 'Desarrollo avanzo durante la generacion; abortando sin push.'; exit 75; }
          git config user.name 'jmejia31'
          git config user.email '93171442+jmejia31@users.noreply.github.com'
          git add -A -- \
            backend/src/Infrastructure/Migrations \
            backend/src/Infrastructure/Persistence/Migrations/20260812111800_ERP_N05_BancoNormalizado.cs \
            CHANGELOG_AI.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'No hay cambios canonicos que publicar.'; exit 0; }
          git commit -m 'fix(erp-n0): alinear Banco con snapshot EF canonico [ChatGPT]'
          git push origin HEAD:Desarrollo
