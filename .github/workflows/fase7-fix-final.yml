# Activación controlada después de registrar el workflow en Desarrollo.
name: Fase 7 - corrección final de prueba

on:
  push:
    branches: [Desarrollo]
    paths:
      - .github/workflows/fase7-fix-final.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - name: Corregir aserción del reporte CSV
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/e2e/fase7-validacion-integral.spec.ts')
          text = path.read_text(encoding='utf-8')
          old = """    expect(reporteTexto).toContain('PRODUCTO_NO_EXISTE');
    expect(reporteTexto).toContain('ENTERO_INVALIDO');
    expect(reporteTexto).toContain('F7-NEG');"""
          new = """    expect(reporteTexto).toContain('PRODUCTO_NO_EXISTE');
    expect(reporteTexto).toContain('ENTERO_INVALIDO');
    expect(reporteTexto).toContain('STOCK_CON_HISTORIAL');
    expect(reporteTexto).toContain('\\"-3\\"');"""
          if new in text:
              raise SystemExit(0)
          if text.count(old) != 1:
              raise SystemExit('No se encontró la aserción esperada de forma única.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/fase7-validacion-integral.spec.ts
          git diff --cached --check
          git commit -m "test: validar valores reales del reporte masivo"
          git push origin HEAD:Desarrollo
