name: Fase 4 - restaurar rutas y agregar variantes

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/checkpoints/fase4-restaurar-rutas

permissions:
  contents: write

jobs:
  restore:
    if: github.event.pull_request.head.ref == 'Desarrollo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - name: Restaurar archivo e insertar ruta
        run: |
          git show 03c6e202f48339e190c3088bb2ac21e4ae6fef1d:frontend/src/app/app.routes.ts > frontend/src/app/app.routes.ts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/app/app.routes.ts')
          text = p.read_text(encoding='utf-8')
          marker = "  {\n    path: 'productos/:id',"
          route = """  {
            path: 'productos/:id/variantes',
            canActivate: [authGuard, permisoGuard],
            data: { modulo: 'Productos', accion: 'Editar' },
            loadComponent: () => import('./features/productos/producto-variantes.component').then(m => m.ProductoVariantesComponent)
          },
          """
          if marker not in text:
              raise SystemExit('No se encontró el inicio de la ruta de detalle de producto')
          p.write_text(text.replace(marker, route + marker, 1), encoding='utf-8')
          PY
          grep -q "path: 'productos/:id/variantes'" frontend/src/app/app.routes.ts
          grep -q "path: 'inventario/movimientos'" frontend/src/app/app.routes.ts
          grep -q "path: '\*\*'" frontend/src/app/app.routes.ts
      - name: Publicar corrección
        run: |
          git config user.name 'VariApp Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/src/app/app.routes.ts
          git commit -m 'fix: restaurar rutas y agregar mantenimiento de variantes'
          git push origin HEAD:Desarrollo
