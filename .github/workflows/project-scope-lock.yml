name: SOLQARYN Project Scope Lock

on:
  push:
    branches:
      - Desarrollo
      - main
  pull_request:
    branches:
      - Desarrollo
      - main

jobs:
  verify-solqaryn-project-scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify SOLQARYN project scope
        run: node scripts/verify-project-scope.mjs
