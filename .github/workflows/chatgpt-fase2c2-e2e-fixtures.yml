name: Temporal ChatGPT Fase 2C.2 Fixtures E2E

on:
  push:
    branches: [Desarrollo]
    paths:
      - .github/workflows/chatgpt-fase2c2-e2e-fixtures.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Aplicar parche verificable
        run: python3 scripts/chatgpt_fase2c2_patch.py

      - name: Validar tipado y lint
        working-directory: frontend
        run: |
          npm ci
          npm run lint

      - name: Publicar fixtures corregidos
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'jmejia31'
          git config user.email '93171442+jmejia31@users.noreply.github.com'
          git add \
            frontend/e2e/fase6-facturacion-impresion.spec.ts \
            frontend/e2e/fase7-validacion-integral.spec.ts \
            frontend/e2e/phase7-user-isolation.spec.ts \
            frontend/e2e/phase7.spec.ts
          git commit -m 'test(e2e): alinear productos simples con variante técnica 2C.2 [ChatGPT]'
          git push origin HEAD:Desarrollo
