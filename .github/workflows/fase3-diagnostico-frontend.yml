name: Fase 3 - diagnóstico frontend

on:
  push:
    branches: [Desarrollo]
    paths:
      - .github/checkpoints/fase3-diagnostico-frontend

permissions:
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Capturar tipado
        working-directory: frontend
        run: |
          npm ci
          set +e
          npx tsc --noEmit -p tsconfig.app.json > ../docs/FASE3_FRONTEND_DIAGNOSTICO.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> ../docs/FASE3_FRONTEND_DIAGNOSTICO.txt
          exit 0
      - name: Publicar diagnóstico
        run: |
          git config user.name 'VariApp Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/FASE3_FRONTEND_DIAGNOSTICO.txt
          git commit -m 'chore: registrar diagnóstico frontend fase 3'
          git push origin HEAD:Desarrollo
