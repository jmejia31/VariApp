name: M11 - Backup operativo de Desarrollo

on:
  push:
    branches:
      - Desarrollo
    paths:
      - .github/workflows/m11-backup-desarrollo-operativo.yml
      - scripts/m11_backup_desarrollo.sh
      - scripts/m11_restore_desarrollo.sh
      - .github/checkpoints/m11-backup-request
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/m11-backup-desarrollo-operativo.yml
      - scripts/m11_backup_desarrollo.sh
      - scripts/m11_restore_desarrollo.sh
  workflow_dispatch:
  schedule:
    - cron: '30 07 * * *'

permissions:
  contents: read

env:
  RETENTION_DAYS: '14'

jobs:
  validar-definicion:
    name: Validar definición y protecciones M11
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar sintaxis de scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/m11_backup_desarrollo.sh
          bash -n scripts/m11_restore_desarrollo.sh

      - name: Validar invariantes de seguridad
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Producción' scripts/m11_backup_desarrollo.sh
          grep -q 'ALLOW_DESTRUCTIVE_RESTORE=YES_M11' scripts/m11_restore_desarrollo.sh
          grep -q 'DB_SSL_MODE' scripts/m11_backup_desarrollo.sh
          grep -q 'TARGET_DB_SSL_MODE' scripts/m11_restore_desarrollo.sh
          grep -q 'productionInScope' scripts/m11_backup_desarrollo.sh
          grep -q 'productionTouched' scripts/m11_restore_desarrollo.sh

  certificar-proveedor:
    name: Certificar motor y proveedor de Desarrollo sin secretos
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'schedule' && vars.SOLQARYN_DESARROLLO_BACKUP_SCHEDULE_ENABLED == 'true') ||
        (github.event_name == 'push' && (contains(github.event.head_commit.message, '[M11-PROVIDER-PROBE]') || contains(github.event.head_commit.message, '[M11-BACKUP-REAL]')))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Desarrollo

    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo

      - name: Verificar configuración externa requerida
        shell: bash
        env:
          DB_HOST: ${{ secrets.SOLQARYN_DESARROLLO_DB_HOST || vars.SOLQARYN_DESARROLLO_DB_HOST }}
          DB_PORT: ${{ secrets.SOLQARYN_DESARROLLO_DB_PORT || vars.SOLQARYN_DESARROLLO_DB_PORT }}
          DB_NAME: ${{ secrets.SOLQARYN_DESARROLLO_DB_NAME || vars.SOLQARYN_DESARROLLO_DB_NAME }}
          DB_USER: ${{ secrets.SOLQARYN_DESARROLLO_DB_USER || vars.SOLQARYN_DESARROLLO_DB_USER }}
          DB_PASSWORD: ${{ secrets.SOLQARYN_DESARROLLO_DB_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.SOLQARYN_DESARROLLO_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          declare -A source_names=(
            [DB_HOST]='SOLQARYN_DESARROLLO_DB_HOST (secret o variable)'
            [DB_PORT]='SOLQARYN_DESARROLLO_DB_PORT (secret o variable)'
            [DB_NAME]='SOLQARYN_DESARROLLO_DB_NAME (secret o variable)'
            [DB_USER]='SOLQARYN_DESARROLLO_DB_USER (secret o variable)'
            [DB_PASSWORD]='SOLQARYN_DESARROLLO_DB_PASSWORD (secret)'
            [BACKUP_PASSPHRASE]='SOLQARYN_DESARROLLO_BACKUP_PASSPHRASE (secret)'
          )
          for name in DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD BACKUP_PASSPHRASE; do
            if [ -z "${!name:-}" ]; then
              echo "Falta configuración externa requerida: ${source_names[$name]}." >&2
              exit 1
            fi
          done

      - name: Consultar motor y proveedor sin secretos
        shell: bash
        env:
          DB_HOST: ${{ secrets.SOLQARYN_DESARROLLO_DB_HOST || vars.SOLQARYN_DESARROLLO_DB_HOST }}
          DB_PORT: ${{ secrets.SOLQARYN_DESARROLLO_DB_PORT || vars.SOLQARYN_DESARROLLO_DB_PORT }}
          DB_NAME: ${{ secrets.SOLQARYN_DESARROLLO_DB_NAME || vars.SOLQARYN_DESARROLLO_DB_NAME }}
          DB_USER: ${{ secrets.SOLQARYN_DESARROLLO_DB_USER || vars.SOLQARYN_DESARROLLO_DB_USER }}
          DB_PASSWORD: ${{ secrets.SOLQARYN_DESARROLLO_DB_PASSWORD }}
        run: |
          set -euo pipefail
          export MYSQL_PWD="$DB_PASSWORD"
          M11_DB_VERSION="$(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --default-character-set=utf8mb4 --ssl-mode=REQUIRED "$DB_NAME" --batch --skip-column-names -e 'SELECT VERSION();' | head -n 1)"
          unset MYSQL_PWD
          test -n "$M11_DB_VERSION"
          M11_HOST_SUFFIX="$(python3 - <<'PY'
          import os
          labels = [part for part in os.environ['DB_HOST'].strip().lower().split('.') if part]
          print('*.' + '.'.join(labels[-2:]) if len(labels) >= 2 else 'NON_DNS_HOST')
          PY
          )"
          case "$M11_HOST_SUFFIX" in
            '*.aivencloud.com') M11_PROVIDER='AIVEN' ;;
            *) M11_PROVIDER='UNCLASSIFIED_MANAGED_MYSQL' ;;
          esac
          export M11_DB_VERSION M11_HOST_SUFFIX M11_PROVIDER
          certificate="$RUNNER_TEMP/m11-provider-certificate.json"
          python3 - "$certificate" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          report = {
              'databaseEngine': 'MySQL',
              'databaseVersion': os.environ['M11_DB_VERSION'],
              'provider': os.environ['M11_PROVIDER'],
              'hostSuffix': os.environ['M11_HOST_SUFFIX'],
              'connectionTls': 'REQUIRED',
              'plan': 'NOT_AVAILABLE_FROM_DATABASE_CONNECTION',
              'automaticBackup': 'NOT_PROBED',
              'pitr': 'NOT_PROBED',
              'restoreCapability': 'LOGICAL_SAME_ARTIFACT_DRILL',
              'createdAtUtc': datetime.now(timezone.utc).isoformat(),
              'secretsExposed': 0,
              'productionTouched': False,
          }
          with open(sys.argv[1], 'w', encoding='utf-8') as out:
              json.dump(report, out, ensure_ascii=False, indent=2)
              out.write('\n')
          PY
          unset DB_PASSWORD
          cat "$certificate"
          echo "Certificado seguro guardado para este run."

      - name: Publicar certificado seguro de proveedor
        uses: actions/upload-artifact@v4
        with:
          name: m11-provider-certificate-${{ github.run_id }}
          path: ${{ runner.temp }}/m11-provider-certificate.json
          if-no-files-found: error
          retention-days: 14

  backup-desarrollo:
    name: Backup cifrado de Desarrollo real + restore/drill same-artifact
    needs: certificar-proveedor
    if: >-
      ${{
        needs.certificar-proveedor.result == 'success' &&
        (
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'schedule' && vars.SOLQARYN_DESARROLLO_BACKUP_SCHEDULE_ENABLED == 'true') ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[M11-BACKUP-REAL]'))
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Desarrollo

    services:
      mysql-m11-restore:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: m11-ci-root-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pm11-ci-root-only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo

      - name: Crear backup cifrado de Desarrollo
        id: backup
        shell: bash
        env:
          SOLQARYN_ENVIRONMENT: desarrollo
          DB_HOST: ${{ secrets.SOLQARYN_DESARROLLO_DB_HOST || vars.SOLQARYN_DESARROLLO_DB_HOST }}
          DB_PORT: ${{ secrets.SOLQARYN_DESARROLLO_DB_PORT || vars.SOLQARYN_DESARROLLO_DB_PORT }}
          DB_NAME: ${{ secrets.SOLQARYN_DESARROLLO_DB_NAME || vars.SOLQARYN_DESARROLLO_DB_NAME }}
          DB_USER: ${{ secrets.SOLQARYN_DESARROLLO_DB_USER || vars.SOLQARYN_DESARROLLO_DB_USER }}
          DB_PASSWORD: ${{ secrets.SOLQARYN_DESARROLLO_DB_PASSWORD }}
          DB_SSL_MODE: REQUIRED
          BACKUP_PASSPHRASE: ${{ secrets.SOLQARYN_DESARROLLO_BACKUP_PASSPHRASE }}
          OUTPUT_DIR: ${{ runner.temp }}/m11-backups
          RETENTION_DAYS: ${{ env.RETENTION_DAYS }}
          BACKUP_LABEL: desarrollo
        run: |
          set -euo pipefail
          chmod +x scripts/m11_backup_desarrollo.sh
          scripts/m11_backup_desarrollo.sh | tee "$RUNNER_TEMP/m11-backup-operativo.log"
          backup_file="$(grep '^M11_BACKUP_FILE=' "$RUNNER_TEMP/m11-backup-operativo.log" | cut -d= -f2-)"
          checksum_file="$(grep '^M11_BACKUP_SHA256=' "$RUNNER_TEMP/m11-backup-operativo.log" | cut -d= -f2-)"
          metadata_file="$(grep '^M11_BACKUP_METADATA=' "$RUNNER_TEMP/m11-backup-operativo.log" | cut -d= -f2-)"
          test -s "$backup_file"
          test -s "$checksum_file"
          test -s "$metadata_file"
          grep -q '"environment": "desarrollo"' "$metadata_file"
          grep -q '"encrypted": true' "$metadata_file"
          grep -q '"productionInScope": false' "$metadata_file"
          echo "backup_file=$backup_file" >> "$GITHUB_OUTPUT"
          echo "checksum_file=$checksum_file" >> "$GITHUB_OUTPUT"
          echo "metadata_file=$metadata_file" >> "$GITHUB_OUTPUT"

      - name: Restore drill del mismo artifact en MySQL descartable
        id: restore
        shell: bash
        env:
          RESTORE_ENVIRONMENT: ci
          TARGET_DB_HOST: 127.0.0.1
          TARGET_DB_PORT: '3306'
          TARGET_DB_NAME: solqaryn_m11_restore_drill
          TARGET_DB_USER: root
          TARGET_DB_PASSWORD: m11-ci-root-only
          TARGET_DB_SSL_MODE: DISABLED
          BACKUP_PASSPHRASE: ${{ secrets.SOLQARYN_DESARROLLO_BACKUP_PASSPHRASE }}
          BACKUP_FILE: ${{ steps.backup.outputs.backup_file }}
          BACKUP_CHECKSUM_FILE: ${{ steps.backup.outputs.checksum_file }}
          ALLOW_DESTRUCTIVE_RESTORE: YES_M11
          RESTORE_FILES_DIR: ${{ runner.temp }}/m11-restored-files
          RESTORE_REPORT_PATH: ${{ runner.temp }}/m11-restore-report.json
        run: |
          set -euo pipefail
          test -s "$BACKUP_FILE"
          test -s "$BACKUP_CHECKSUM_FILE"
          chmod +x scripts/m11_restore_desarrollo.sh
          scripts/m11_restore_desarrollo.sh | tee "$RUNNER_TEMP/m11-restore-operativo.log"
          report_file="$(grep '^M11_RESTORE_REPORT=' "$RUNNER_TEMP/m11-restore-operativo.log" | cut -d= -f2-)"
          test -s "$report_file"
          grep -q '"checksumsVerified": true' "$report_file"
          grep -q '"allTableRowCountsVerified": true' "$report_file"
          grep -q '"productionTouched": false' "$report_file"
          grep -q '"status": "SUCCESS"' "$report_file"
          echo "restore_report=$report_file" >> "$GITHUB_OUTPUT"

      - name: Publicar evidencia M11 cifrada y same-artifact drill
        uses: actions/upload-artifact@v4
        with:
          name: m11-backup-desarrollo-${{ github.run_id }}
          path: |
            ${{ steps.backup.outputs.backup_file }}
            ${{ steps.backup.outputs.checksum_file }}
            ${{ steps.backup.outputs.metadata_file }}
            ${{ steps.restore.outputs.restore_report }}
          if-no-files-found: error
          retention-days: 14
