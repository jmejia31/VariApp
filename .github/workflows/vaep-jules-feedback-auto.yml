name: VAEP Jules Auto Feedback Legacy Guard

on:
  issues:
    types:
      - opened

permissions:
  contents: read

jobs:
  legacy-guard:
    if: startsWith(github.event.issue.title, '[VAEP-JULES')
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Jules protocol v3.19 authority
        shell: bash
        run: |
          set -euo pipefail
          echo "Issue-triggered legacy auto-feedback is disabled under Jules integration protocol v3.19."
          echo "Routine waiting states are handled in-worker by .github/scripts/vaep-jules-worker-v319.sh."
          echo "Semantic/manual feedback remains available through .github/workflows/vaep-jules-feedback.yml."
          echo "Do not emit historical v3.7/v3.13 follow-up prompts."
