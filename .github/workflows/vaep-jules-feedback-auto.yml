name: VAEP Jules Auto Feedback

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

concurrency:
  group: vaep-jules-auto-feedback
  cancel-in-progress: false

jobs:
  auto-feedback:
    if: startsWith(github.event.issue.title, '[VAEP-JULES] ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      EXPECTED_BRANCH: Desarrollo
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}

    steps:
      - name: Parse trusted VAEP result issue
        id: parse
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${JULES_API_KEY:-}" ]]; then
            echo "JULES_API_KEY is not configured." >&2
            exit 20
          fi

          dispatch_id="$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^- Dispatch: `\([^`]*\)`.*/\1/p')"
          task_id="$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^- Task: `\([^`]*\)`.*/\1/p')"
          session_name="$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^- Jules session: `\([^`]*\)`.*/\1/p')"
          state="$(printf '%s\n' "$ISSUE_BODY" | sed -n 's/^- Terminal state: `\([^`]*\)`.*/\1/p')"

          [[ "$dispatch_id" =~ ^[A-Za-z0-9_.-]+$ ]] || exit 21
          [[ "$task_id" =~ ^[A-Za-z0-9_.-]+$ ]] || exit 22
          [[ "$session_name" =~ ^sessions/[0-9]+$ ]] || exit 23
          [[ "$state" =~ ^(AWAITING_USER_FEEDBACK|AWAITING_PLAN_APPROVAL)$ ]] || {
            echo "No auto-feedback required for state: $state"
            printf 'action=NOOP\n' >> "$GITHUB_OUTPUT"
            exit 0
          }

          {
            printf 'dispatch_id=%s\n' "$dispatch_id"
            printf 'task_id=%s\n' "$task_id"
            printf 'session_name=%s\n' "$session_name"
            printf 'before_state=%s\n' "$state"
          } >> "$GITHUB_OUTPUT"

          if [[ "$state" == "AWAITING_USER_FEEDBACK" ]]; then
            printf 'action=SEND_MESSAGE\n' >> "$GITHUB_OUTPUT"
          else
            printf 'action=APPROVE_PLAN\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate session identity
        if: steps.parse.outputs.action != 'NOOP'
        shell: bash
        env:
          DISPATCH_ID: ${{ steps.parse.outputs.dispatch_id }}
          SESSION_NAME: ${{ steps.parse.outputs.session_name }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/vaep-auto-feedback"
          curl --fail-with-body --silent --show-error \
            -H "x-goog-api-key: $JULES_API_KEY" \
            "$JULES_API_BASE/$SESSION_NAME" \
            > "$RUNNER_TEMP/vaep-auto-feedback/session.json"

          expected_title="VAEP ${DISPATCH_ID}"
          jq -e \
            --arg title "$expected_title" \
            --arg branch "$EXPECTED_BRANCH" \
            '
              .title == $title and
              .sourceContext.githubRepoContext.startingBranch == $branch
            ' "$RUNNER_TEMP/vaep-auto-feedback/session.json" >/dev/null || {
              echo "Session identity/branch mismatch; refusing automatic feedback." >&2
              exit 30
            }

      - name: Auto-approve preauthorized plan
        if: steps.parse.outputs.action == 'APPROVE_PLAN'
        shell: bash
        env:
          SESSION_NAME: ${{ steps.parse.outputs.session_name }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: $JULES_API_KEY" \
            "$JULES_API_BASE/$SESSION_NAME:approvePlan" \
            >/dev/null

      - name: Send routine VAEP follow-up
        if: steps.parse.outputs.action == 'SEND_MESSAGE'
        shell: bash
        env:
          SESSION_NAME: ${{ steps.parse.outputs.session_name }}
        run: |
          set -euo pipefail

          prompt='VAEP automated follow-up under v3.7. Do not wait for routine human confirmation. Resolve the next action from your assigned scope, AGENTS.md, docs/VAEP_JULES.md, Plan/acceptance criteria already provided, and the current code. If implementation and assigned validations are complete, perform final self-review now, report every observation, limitation, risk, recommendation and any test that did not run, preserve the existing ChangeSet/gitPatch with baseCommitId, and finalize the session as COMPLETED. Do not expand scope and do not create branch, PR, push, merge or deployment. If and only if a genuine business/authorization decision remains that cannot be resolved from authoritative project sources, state the exact blocking question and remain waiting.'

          jq -n --arg prompt "$prompt" '{prompt:$prompt}' \
            > "$RUNNER_TEMP/vaep-auto-feedback/message.json"

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: $JULES_API_KEY" \
            --data-binary @"$RUNNER_TEMP/vaep-auto-feedback/message.json" \
            "$JULES_API_BASE/$SESSION_NAME:sendMessage" \
            >/dev/null

      - name: Verify state leaves waiting
        id: verify
        if: steps.parse.outputs.action != 'NOOP'
        shell: bash
        env:
          SESSION_NAME: ${{ steps.parse.outputs.session_name }}
          BEFORE_STATE: ${{ steps.parse.outputs.before_state }}
        run: |
          set -euo pipefail

          after_state="$BEFORE_STATE"
          deadline=$((SECONDS + 300))

          while (( SECONDS < deadline )); do
            curl --fail-with-body --silent --show-error \
              -H "x-goog-api-key: $JULES_API_KEY" \
              "$JULES_API_BASE/$SESSION_NAME" \
              > "$RUNNER_TEMP/vaep-auto-feedback/session-after.json"

            after_state="$(jq -r '.state // "UNKNOWN"' "$RUNNER_TEMP/vaep-auto-feedback/session-after.json")"
            echo "Auto-feedback state: $after_state"

            case "$after_state" in
              QUEUED|PLANNING|IN_PROGRESS|COMPLETED|FAILED|PAUSED)
                break
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          printf 'after_state=%s\n' "$after_state" >> "$GITHUB_OUTPUT"

          if [[ "$after_state" == "AWAITING_USER_FEEDBACK" || "$after_state" == "AWAITING_PLAN_APPROVAL" ]]; then
            echo "Session still awaits input after routine auto-feedback; semantic VAEP follow-up required." >&2
            exit 40
          fi

      - name: Register automatic feedback
        if: always() && steps.parse.outputs.action != 'NOOP'
        shell: bash
        env:
          DISPATCH_ID: ${{ steps.parse.outputs.dispatch_id }}
          TASK_ID: ${{ steps.parse.outputs.task_id }}
          SESSION_NAME: ${{ steps.parse.outputs.session_name }}
          BEFORE_STATE: ${{ steps.parse.outputs.before_state }}
          ACTION: ${{ steps.parse.outputs.action }}
          AFTER_STATE: ${{ steps.verify.outputs.after_state }}
        run: |
          set -euo pipefail

          dispatch_id="${DISPATCH_ID:-UNKNOWN}"
          task_id="${TASK_ID:-UNKNOWN}"
          session_name="${SESSION_NAME:-UNKNOWN}"
          before_state="${BEFORE_STATE:-UNKNOWN}"
          action="${ACTION:-UNKNOWN}"
          after_state="${AFTER_STATE:-UNKNOWN}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          printf -v body '%s\n\n%s\n%s\n%s\n%s\n%s\n' \
            'VAEP Jules immediate automatic feedback.' \
            "- Dispatch: \`$dispatch_id\`" \
            "- Task: \`$task_id\`" \
            "- Session: \`$session_name\`" \
            "- Before: \`$before_state\`; action: \`$action\`; after: \`$after_state\`" \
            "- Workflow run: $run_url"

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "[VAEP-JULES-AUTO-FEEDBACK] $dispatch_id" \
            --body "$body" >/dev/null
