name: M12 - Integrar UI configuración

on:
  push:
    branches: [Desarrollo]
    paths: [.github/workflows/m12-integrar-config-ui.yml]

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - name: Integrar componente M12
        shell: bash
        run: |
          set -euo pipefail
          ts='frontend/src/app/features/configuracion/configuracion.component.ts'
          html='frontend/src/app/features/configuracion/configuracion.component.html'
          sed -i "/import { AppAlertService/a import { AutomatizacionConfiguracionCardComponent } from './automatizacion-configuracion-card.component';" "$ts"
          sed -i 's/MatButtonModule, MatIconModule, MatProgressSpinnerModule/MatButtonModule, MatIconModule, MatProgressSpinnerModule, AutomatizacionConfiguracionCardComponent/' "$ts"
          sed -i '/  <div class="card tema-card">/i\  <app-automatizacion-configuracion-card></app-automatizacion-configuracion-card>\n' "$html"
          rm .github/workflows/m12-integrar-config-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ts" "$html" .github/workflows/m12-integrar-config-ui.yml
          git diff --cached --check
          git commit -m 'feat(m12): integrar defaults administrables en configuración [ChatGPT]'
          git push origin HEAD:Desarrollo
