name: ERP-N0.3 - Bootstrap controlado

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/erp-n0-3-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: erp-n0-3-bootstrap
  cancel-in-progress: false

jobs:
  aplicar:
    if: github.ref == 'refs/heads/Desarrollo'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inventoryapp_bootstrap_n03
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=inventoryapp_bootstrap_n03;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;
      Database__ServerVersion: 8.4.0
      Database__ApplyMigrationsOnStartup: 'false'
      Jwt__Secret: ERP-N0-3-Bootstrap-Only-Secret-With-More-Than-32-Characters-2026
      Jwt__Issuer: VariApp.CI
      Jwt__Audience: VariApp.CI.Frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Aplicar transformación N0.3 idempotente
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/scripts/apply-erp-n0-3-runtime.py')
          text = path.read_text(encoding='utf-8')
          old = '    if count != 1:\n        raise RuntimeError(f"{rel}: se esperaba 1 coincidencia y se encontraron {count}: {old[:90]!r}")\n    write(rel, text.replace(old, new, 1))'
          new = '    if count < 1:\n        raise RuntimeError(f"{rel}: no se encontró la coincidencia esperada: {old[:90]!r}")\n    write(rel, text.replace(old, new, 1))'
          if old not in text:
              raise SystemExit('No se encontró la guardia replace_once esperada')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 backend/scripts/apply-erp-n0-3-runtime.py
      - name: Validar guardas N0.3
        run: python3 backend/scripts/check-erp-n0-3-runtime.py
      - name: Compilar y probar antes de publicar
        working-directory: backend
        run: |
          dotnet restore InventoryApp.sln
          dotnet build InventoryApp.sln --configuration Release --no-restore -warnaserror
          dotnet test InventoryApp.sln --configuration Release --no-build
      - name: Publicar cambio validado solo en Desarrollo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jmejia31'
          git config user.email '93171442+jmejia31@users.noreply.github.com'
          git add backend/src backend/tests backend/scripts/check-erp-n0-3-runtime.py backend/scripts/preflight-erp-n0-3-producto-variante.sql backend/scripts/postdeploy-erp-n0-3-producto-variante.sql .github/workflows/erp-n0-3-ci.yml
          if git diff --cached --quiet; then
            echo 'No hay cambios N0.3 por publicar.'
            exit 0
          fi
          git commit -m 'feat(n0.3): consolidar ProductoVariante como autoridad operativa [ChatGPT]'
          git push origin HEAD:Desarrollo
