name: VAEP N3.5.H Target Blob Materializer

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/vaep-n35h-target-blob-materializer.yml'

permissions:
  contents: write
  actions: read
  issues: write

concurrency:
  group: vaep-n35h-target-blob-materializer
  cancel-in-progress: false

jobs:
  materialize-certified-target-blob:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_BLOB: 62be8abc7d48e2258144d9a5f5dfb545d235e65d
      TARGET_BLOB: 9e0f74a66e0064543aa1a92d9ffc02c15a6d3862
      TARGET_SHA256: a60c413be17aac5293df65c79f652e3589fe1c4c6ee58b1049e612d2fb7a1d82
      TARGET_BYTES: '73720'
      TARGET_LINES: '549'
      ORACLE_ARTIFACT_ID: '9568057491'
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify source and materialize certified target as orphan blob only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object CHANGELOG_AI.md)" = "$SOURCE_BLOB"

          mkdir -p "$RUNNER_TEMP/n35h-oracle"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ORACLE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/n35h-oracle/oracle.zip"
          unzip -q "$RUNNER_TEMP/n35h-oracle/oracle.zip" -d "$RUNNER_TEMP/n35h-oracle/extracted"

          python3 - "$RUNNER_TEMP/n35h-oracle/extracted/changes.patch" "$RUNNER_TEMP/n35h-oracle/CHANGELOG_AI.target.md" <<'PY'
          import base64
          import hashlib
          import os
          import re
          import sys
          from pathlib import Path

          patch = Path(sys.argv[1]).read_text(encoding='utf-8')
          match = re.search(r'^\+\*\*TARGET_FULL_CONTENT_BASE64:\*\*\n\+([A-Za-z0-9+/=]+)\n', patch, re.M)
          if not match:
              raise SystemExit('certified TARGET_FULL_CONTENT_BASE64 not found')
          data = base64.b64decode(match.group(1), validate=True)
          expected_bytes = int(os.environ['TARGET_BYTES'])
          expected_lines = int(os.environ['TARGET_LINES'])
          expected_sha256 = os.environ['TARGET_SHA256']
          expected_blob = os.environ['TARGET_BLOB']
          actual_sha256 = hashlib.sha256(data).hexdigest()
          actual_blob = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          if len(data) != expected_bytes:
              raise SystemExit(f'byte mismatch: {len(data)} != {expected_bytes}')
          if data.count(b'\n') != expected_lines:
              raise SystemExit(f'line mismatch: {data.count(chr(10).encode())} != {expected_lines}')
          if actual_sha256 != expected_sha256:
              raise SystemExit(f'sha256 mismatch: {actual_sha256}')
          if actual_blob != expected_blob:
              raise SystemExit(f'git blob mismatch: {actual_blob}')
          Path(sys.argv[2]).write_bytes(data)
          print(f'CERTIFIED_TARGET_OK bytes={len(data)} lines={data.count(chr(10).encode())} sha256={actual_sha256} blob={actual_blob}')
          PY

          payload="$(base64 -w0 "$RUNNER_TEMP/n35h-oracle/CHANGELOG_AI.target.md")"
          created_blob="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" -f content="$payload" -f encoding=base64 --jq '.sha')"
          test "$created_blob" = "$TARGET_BLOB"

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(cat <<EOF
          N3.5.H certified target blob materialized successfully.

          - Source blob verified: \`$SOURCE_BLOB\`
          - Target blob created: \`$created_blob\`
          - SHA-256: \`$TARGET_SHA256\`
          - Bytes/lines: \`$TARGET_BYTES / $TARGET_LINES\`
          - Oracle artifact: \`$ORACLE_ARTIFACT_ID\`
          - Run: $run_url
          - Branch mutation by this workflow: **NONE**

          Controller must re-check fresh Desarrollo HEAD/source and perform the final tree/commit/ref fast-forward via the authorized GitHub connector. No false LISTO before that verification.
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --title '[VAEP][N3.5.H] CERTIFIED_TARGET_BLOB_MATERIALIZED' --body "$body" >/dev/null
