name: VAEP N7.6.H byte append recovery

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/vaep-n76h-byte-append-recovery.yml'

permissions:
  contents: write

concurrency:
  group: vaep-n76h-byte-append-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Recover N7.6.H append-only docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Verify exact blobs and append bytes
        shell: bash
        env:
          TASKS_B64: 
          CHANGELOG_B64: 
        run: |
          set -euo pipefail
          test "$(git hash-object TASKS.md)" = "64290e48cc340b0295622a8f01ac34da0f7c5ffd"
          test "$(git hash-object CHANGELOG_AI.md)" = "67799625f5eb673f68b6a99d3a356be8e21cc265"
          cp TASKS.md /tmp/TASKS.before
          cp CHANGELOG_AI.md /tmp/CHANGELOG.before
          tasks_last="$(tail -c 1 /tmp/TASKS.before | od -An -t x1 | tr -d ' \n')"
          changelog_last="$(tail -c 1 /tmp/CHANGELOG.before | od -An -t x1 | tr -d ' \n')"
          printf 'TASKS_LAST_BYTE=%s\n' "$tasks_last"
          printf 'CHANGELOG_LAST_BYTE=%s\n' "$changelog_last"
          printf '%s' "$TASKS_B64" | base64 -d >> TASKS.md
          printf '%s' "$CHANGELOG_B64" | base64 -d >> CHANGELOG_AI.md
          tasks_before_size="$(wc -c < /tmp/TASKS.before)"
          changelog_before_size="$(wc -c < /tmp/CHANGELOG.before)"
          cmp -n "$tasks_before_size" /tmp/TASKS.before TASKS.md
          cmp -n "$changelog_before_size" /tmp/CHANGELOG.before CHANGELOG_AI.md
          test "$(wc -c < TASKS.md)" -gt "$tasks_before_size"
          test "$(wc -c < CHANGELOG_AI.md)" -gt "$changelog_before_size"
          changed="$(git diff --name-only)"
          printf 'CHANGED_FILES=%s\n' "$changed"
          test "$changed" = $'CHANGELOG_AI.md\nTASKS.md' || test "$changed" = $'TASKS.md\nCHANGELOG_AI.md'
          for f in TASKS.md CHANGELOG_AI.md; do
            stats="$(git diff --numstat -- "$f")"
            printf 'NUMSTAT %s %s\n' "$f" "$stats"
            adds="$(printf '%s\n' "$stats" | awk '{print $1}')"
            dels="$(printf '%s\n' "$stats" | awk '{print $2}')"
            test -n "$adds" && test "$adds" -gt 0
            if [ "$dels" -ne 0 ]; then
              if [ "$f" = "TASKS.md" ]; then old_last="$tasks_last"; else old_last="$changelog_last"; fi
              test "$old_last" != "0a"
              test "$dels" -le 1
            fi
          done
          git diff --check

      - name: Commit rollups and retire recovery workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VAEP Recovery"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/vaep-n76h-byte-append-recovery.yml
          git add TASKS.md CHANGELOG_AI.md
          git diff --cached --check
          git commit -m "docs(n7.6.h): append byte-safe closure rollups"
          git push origin HEAD:Desarrollo
