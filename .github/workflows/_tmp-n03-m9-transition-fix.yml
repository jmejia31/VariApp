name: TEMP N0.3 M9 transition fix

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/_tmp-n03-m9-transition-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - name: Aplicar corrección transaccional
        run: python backend/scripts/_tmp_n03_m9_transition_fix.py
      - name: Publicar corrección
        shell: bash
        run: |
          git config user.name "jmejia31"
          git config user.email "93171442+jmejia31@users.noreply.github.com"
          git add backend/src/Infrastructure/Services/CargaMasivaService.cs \
                  backend/scripts/check-erp-n0-3-runtime.py \
                  backend/tests/InventoryApp.Tests/N03AutoridadOperativaRegressionTests.cs
          git diff --cached --check
          git commit -m "fix(erp-n0.3): convertir variante técnica al importar comerciales [ChatGPT]"
          git push origin HEAD:Desarrollo
