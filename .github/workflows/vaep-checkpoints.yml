name: VAEP scheduled checkpoints

on:
  schedule:
    - cron: '0 * * * *'
    - cron: '12 * * * *'
    - cron: '24 * * * *'
    - cron: '36 * * * *'
    - cron: '48 * * * *'
  # A causal CI gate can finish between hourly checkpoints. Reconcile the
  # same controller immediately after a successful Desarrollo gate so a
  # released freeze does not add another avoidable idle interval.
  workflow_run:
    workflows:
      - 'VAEP engine lightweight checks'
      - 'Desarrollo - Compilación y pruebas'
      - 'Desarrollo - aceptación funcional integral'
      - 'Desarrollo - recuperación de migración MySQL parcial'
    types: [completed]
  workflow_dispatch:
    inputs:
      checkpoint:
        description: 'Canonical checkpoint to execute'
        required: true
        type: choice
        options: [':00', ':12', ':24', ':36', ':48']

permissions:
  actions: write
  contents: write
  issues: read

concurrency:
  group: vaep-checkpoint-controller
  cancel-in-progress: false

jobs:
  checkpoint:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'Desarrollo')
    name: ${{ matrix.worker }} ${{ inputs.checkpoint || github.event.schedule || ':00' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        worker: [JULES_A, JULES_B, JULES_C, JULES_D]
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VAEP_CHECKPOINT: ${{ inputs.checkpoint || github.event.schedule || ':00' }}
      WORKER_ID: ${{ matrix.worker }}
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 2

      - name: Execute canonical VAEP checkpoint
        shell: bash
        run: bash .github/scripts/vaep-checkpoint.sh --checkpoint "$VAEP_CHECKPOINT" --worker "$WORKER_ID"
