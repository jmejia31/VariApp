name: VAEP scheduled checkpoint guards

on:
  push:
    branches: [Desarrollo]
    paths:
      - 'vaep/control/dispatch-admission.json'
      - 'docs/VAEP_AUTHORITY.md'
      - '.github/scripts/vaep-checkpoint.sh'
      - '.github/scripts/vaep-policy-parser.sh'
      - '.github/workflows/vaep-checkpoints.yml'
  schedule:
    - cron: '0 * * * *'
    - cron: '12 * * * *'
    - cron: '24 * * * *'
    - cron: '36 * * * *'
    - cron: '48 * * * *'
  workflow_dispatch:
    inputs:
      checkpoint:
        description: 'Canonical checkpoint guard to execute'
        required: true
        type: choice
        options: [':00', ':12', ':24', ':36', ':48']

permissions:
  contents: read

concurrency:
  group: vaep-checkpoint-guard
  cancel-in-progress: false

jobs:
  guard:
    name: TASKS_ONLY ${{ inputs.checkpoint || github.event.schedule || ':00' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 1

      - name: Validate Tasks-only authority and checkpoint guard
        shell: bash
        env:
          VAEP_CHECKPOINT: ${{ inputs.checkpoint || github.event.schedule || ':00' }}
        run: bash .github/scripts/vaep-checkpoint.sh --checkpoint "$VAEP_CHECKPOINT"
