name: VAEP scheduled checkpoints

on:
  push:
    branches: [Desarrollo]
    paths:
      - 'vaep/control/dispatch-admission.json'
      - 'docs/VAEP_AUTHORITY.md'
      - '.github/workflows/vaep-checkpoints.yml'
  schedule:
    - cron: '0 * * * *'
    - cron: '12 * * * *'
    - cron: '24 * * * *'
    - cron: '36 * * * *'
    - cron: '48 * * * *'
  workflow_dispatch:
    inputs:
      checkpoint:
        description: 'Canonical checkpoint to execute'
        required: true
        type: choice
        options: [':00', ':12', ':24', ':36', ':48']

permissions:
  actions: write
  contents: write
  issues: read

# Canonical worker set. The checkpoint processes all lanes in one controller;
# this marker is consumed by runtime-certification guards without reintroducing
# a parallel matrix in the checkpoint itself.
# worker: [J1, J2, J3, J4, J5, J6]
# Worker/CI completions deliberately do NOT trigger this workflow. The five
# canonical schedules plus explicit dispatch/config changes are sufficient;
# workflow_run fan-out previously created redundant queued/skipped controllers
# and could recursively amplify CI without increasing material throughput.
concurrency:
  group: vaep-checkpoint-controller
  cancel-in-progress: false

jobs:
  enforce-open-admission:
    name: Verify OPEN_ONLY authority and admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: Desarrollo
      ADMISSION_PATH: vaep/control/dispatch-admission.json
      MASTER_PATH: docs/VAEP_AUTHORITY.md
    steps:
      - name: Verify canonical OPEN_ONLY authority
        shell: bash
        run: |
          set -euo pipefail
          master="$(gh api "repos/$REPO/contents/$MASTER_PATH?ref=$BRANCH" --jq '.content' | tr -d '\n' | base64 -d)"
          grep -q '^GLOBAL_DISPATCH_ADMISSION=OPEN_ONLY$' <<<"$master"
          grep -q '^GLOBAL_FROZEN_PROHIBITED=TRUE$' <<<"$master"
          grep -q '^CAUSAL_HOLD_SCOPE=TASK_OR_LANE_ONLY$' <<<"$master"
          grep -q 'El contrato global es \*\*OPEN_ONLY\*\*' <<<"$master"
          ! grep -q 'Solo se permiten dos estados' <<<"$master"
          echo 'VAEP_MASTER_OPEN_ONLY=PASS'

      - name: Repair any non-OPEN global admission before checkpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            payload="$(gh api "repos/$REPO/contents/$ADMISSION_PATH?ref=$BRANCH")"
            sha="$(jq -r '.sha' <<<"$payload")"
            decoded="$(jq -r '.content' <<<"$payload" | tr -d '\n' | base64 -d)"
            if jq -e '
              type=="object" and
              ((keys|sort)==["allowExistingActiveSessions","newDispatchAdmission","reason","updatedAtUtc"]) and
              .newDispatchAdmission=="OPEN" and
              .allowExistingActiveSessions==true and
              (.reason|type=="string" and length>0) and
              (.updatedAtUtc|type=="string" and length>0)
            ' <<<"$decoded" >/dev/null 2>&1; then
              echo 'VAEP_CHECKPOINT_ADMISSION=OPEN'
              exit 0
            fi

            now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            fixed="$(jq -n --arg now "$now" '{newDispatchAdmission:"OPEN",allowExistingActiveSessions:true,reason:"OPEN_ONLY_CHECKPOINT_REPAIR__TASK_LANE_GATES_ONLY",updatedAtUtc:$now}')"
            encoded="$(printf '%s\n' "$fixed" | base64 -w0)"
            if jq -n \
              --arg message "fix(vaep): repair non-open admission before checkpoint" \
              --arg content "$encoded" \
              --arg sha "$sha" \
              --arg branch "$BRANCH" \
              '{message:$message,content:$content,sha:$sha,branch:$branch}' \
              | gh api "repos/$REPO/contents/$ADMISSION_PATH" --method PUT --input - >/dev/null 2>&1; then
              echo 'VAEP_CHECKPOINT_ADMISSION=REPAIRED_TO_OPEN'
              exit 0
            fi
            sleep "$attempt"
          done

          admission="$(gh api "repos/$REPO/contents/$ADMISSION_PATH?ref=$BRANCH" --jq '.content' | tr -d '\n' | base64 -d)"
          jq -e '.newDispatchAdmission=="OPEN" and .allowExistingActiveSessions==true' <<<"$admission" >/dev/null
          echo 'VAEP_CHECKPOINT_ADMISSION=OPEN_AFTER_RACE'

  checkpoint:
    needs: enforce-open-admission
    if: needs.enforce-open-admission.result == 'success'
    name: ALL ${{ inputs.checkpoint || github.event.schedule || ':00' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VAEP_CHECKPOINT: ${{ inputs.checkpoint || github.event.schedule || ':00' }}
      VAEP_OPEN_ONLY_PREFLIGHT_VERIFIED: 'true'
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      J1_API_KEY: ${{ secrets.JULES_J1_API_KEY }}
      J2_API_KEY: ${{ secrets.JULES_J2_API_KEY }}
      J3_API_KEY: ${{ secrets.JULES_J3_API_KEY }}
      J4_API_KEY: ${{ secrets.JULES_J4_API_KEY }}
      J5_API_KEY: ${{ secrets.JULES_J5_API_KEY }}
      J6_API_KEY: ${{ secrets.JULES_J6_API_KEY }}
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Execute canonical VAEP checkpoint for J1-J6
        shell: bash
        run: bash .github/scripts/vaep-checkpoint.sh --checkpoint "$VAEP_CHECKPOINT"

      - name: Reconcile terminal review and exhausted attempts
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/terminal-handoff"
          rc=0
          for worker in J1 J2 J3 J4 J5 J6; do
            if ! python3 scripts/vaep/terminal_handoff.py --audit "$worker" --output "$RUNNER_TEMP/terminal-handoff/$worker.json"; then
              rc=1
            fi
          done
          exit "$rc"

      - name: Preserve terminal handoff evidence
        if: always()
        id: terminal_handoff_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: terminal-handoff-all-${{ github.run_id }}
          path: ${{ runner.temp }}/terminal-handoff/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Retry terminal handoff evidence upload after transient artifact failure
        if: always() && steps.terminal_handoff_artifact.outcome == 'failure'
        id: terminal_handoff_artifact_retry
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: terminal-handoff-all-retry-${{ github.run_id }}
          path: ${{ runner.temp }}/terminal-handoff/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify terminal handoff evidence was preserved
        if: always()
        shell: bash
        env:
          FIRST_UPLOAD: ${{ steps.terminal_handoff_artifact.outcome }}
          RETRY_UPLOAD: ${{ steps.terminal_handoff_artifact_retry.outcome }}
        run: |
          set -euo pipefail
          if [[ "$FIRST_UPLOAD" != "success" && "$RETRY_UPLOAD" != "success" ]]; then
            echo 'Neither terminal handoff artifact upload succeeded.' >&2
            exit 1
          fi
