name: M2 corregir selectores E2E

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/m2-apply-e2e-selectors.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Aplicar parche fail-closed
        run: python3 frontend/scripts/m2_fix_e2e_selectors.py
      - name: Validar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build:prod
      - name: Publicar y limpiar temporales
        run: |
          rm -f .github/workflows/m2-apply-e2e-selectors.yml frontend/scripts/m2_fix_e2e_selectors.py docs/M2_PLAYWRIGHT_DIAGNOSTICO_TEMPORAL.md
          git config user.name 'VariApp Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/e2e/catalogos-mantenimientos.spec.ts
          git add frontend/e2e/fase4-variantes.spec.ts
          git add -u .github/workflows/m2-apply-e2e-selectors.yml frontend/scripts/m2_fix_e2e_selectors.py docs/M2_PLAYWRIGHT_DIAGNOSTICO_TEMPORAL.md
          git commit -m 'test(m2): actualizar aceptación a variantes multidimensionales [ChatGPT]'
          git push origin HEAD:Desarrollo
