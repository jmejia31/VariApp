name: TEMP N0.3 authority fix

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/_tmp-n0-3-authority-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - name: Aplicar correcciones N0.3 acotadas
        run: python backend/scripts/_tmp_n03_authority_fix.py
      - name: Publicar cambios en Desarrollo
        shell: bash
        run: |
          git config user.name "jmejia31"
          git config user.email "93171442+jmejia31@users.noreply.github.com"
          git add backend/src/Application/Services/VentaService.cs \
                  backend/src/Application/Services/CompraService.cs \
                  backend/src/Infrastructure/Services/CargaMasivaService.cs \
                  backend/scripts/check-erp-n0-3-runtime.py \
                  backend/tests/InventoryApp.Tests/N03AutoridadOperativaRegressionTests.cs
          git diff --cached --check
          git commit -m "fix(erp-n0.3): cerrar fugas de autoridad ProductoVariante [ChatGPT]"
          git push origin HEAD:Desarrollo
