name: VAEP Jules Session Health

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaep-jules-session-health
  cancel-in-progress: true

jobs:
  health:
    name: ${{ matrix.worker }} canonical read-only health
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        worker: [J1, J2, J3, J4, J5, J6]
    env:
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      J1_KEY: ${{ secrets.JULES_J1_API_KEY }}
      J2_KEY: ${{ secrets.JULES_J2_API_KEY }}
      J3_KEY: ${{ secrets.JULES_J3_API_KEY }}
      J4_KEY: ${{ secrets.JULES_J4_API_KEY }}
      J5_KEY: ${{ secrets.JULES_J5_API_KEY }}
      J6_KEY: ${{ secrets.JULES_J6_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 1

      - name: Validate active canonical registry
        run: python3 scripts/vaep/j1_j6_registry_check.py

      - name: Read-only canonical Jules health
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.worker }}" in
            J1) key="$J1_KEY" ;;
            J2) key="$J2_KEY" ;;
            J3) key="$J3_KEY" ;;
            J4) key="$J4_KEY" ;;
            J5) key="$J5_KEY" ;;
            J6) key="$J6_KEY" ;;
            *) exit 2 ;;
          esac
          test -n "$key"
          response="$(mktemp)"
          curl --connect-timeout 10 --max-time 45 --fail-with-body --silent --show-error \
            -H "x-goog-api-key: $key" \
            "$JULES_API_BASE/sources?pageSize=100" > "$response"
          jq -e '[.sources[]? | select(.githubRepo.owner=="jmejia31" and .githubRepo.repo=="VariApp")] | first as $s | ($s != null) and (($s.githubRepo.branches // []) | any(.displayName=="Desarrollo"))' "$response" >/dev/null
          echo "${{ matrix.worker }}_HEALTH_OK"
