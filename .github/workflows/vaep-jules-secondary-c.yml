name: VAEP Jules C Trusted Secondary Worker

on:
  push:
    branches:
      - Desarrollo
    paths:
      - 'vaep/jules-c/dispatch/*.json'
  workflow_dispatch:
    inputs:
      manifest_commit:
        description: 'Exact immutable manifest commit created by VAEP autorefill'
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: vaep-jules-c-lane
  cancel-in-progress: false

jobs:
  dispatch-jules-c:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      EXPECTED_OWNER: jmejia31
      EXPECTED_REPO: VariApp
      EXPECTED_BRANCH: Desarrollo
      DISPATCH_PATH: vaep/jules-c/dispatch
      SESSION_TITLE_PREFIX: "VAEP-C "
      ARTIFACT_PREFIX: vaep-jules-c
      ISSUE_PREFIX: "[VAEP-JULES-C]"
      WORKER_LABEL: Jules C
      WORKER_ID: JULES_C
      JULES_API_KEY: ${{ secrets.JULES_C_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      VAEP_DISPATCH_SHA: ${{ inputs.manifest_commit || github.sha }}
      VAEP_LANE_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.manifest_commit || github.sha }}
          fetch-depth: 2
      - name: Validate immutable dispatch transport
        shell: bash
        run: bash .github/scripts/vaep-jules-master.sh --transport-preflight
      - name: Reserve NEXT Jules C lane
        shell: bash
        continue-on-error: true
        run: |
          set +e
          bash .github/scripts/vaep-jules-autorefill.sh
          rc=$?
          set -e
          case "$rc" in
            0|78|79|80|81|82) exit 0 ;;
            *) exit "$rc" ;;
          esac
      - name: Execute VAEP/Jules MASTER
        shell: bash
        run: bash .github/scripts/vaep-jules-master.sh
      - name: Upload Jules C result artifact
        if: always() && env.RESULT_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: error
          retention-days: 14
      - name: Auto-refill Jules C lane
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set +e
          bash .github/scripts/vaep-jules-autorefill.sh --post-terminal
          rc=$?
          set -e
          case "$rc" in
            0|78|79|80|81|82) exit 0 ;;
            *) exit "$rc" ;;
          esac
