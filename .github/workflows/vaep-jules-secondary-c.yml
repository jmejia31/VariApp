name: VAEP Jules C Trusted Secondary Worker

on:
  push:
    branches:
      - Desarrollo
    paths:
      - "vaep/jules-c/dispatch/*.json"

permissions:
  contents: read
  issues: write

concurrency:
  group: vaep-jules-c-secondary
  cancel-in-progress: false

jobs:
  dispatch-jules-c:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      EXPECTED_OWNER: jmejia31
      EXPECTED_REPO: VariApp
      EXPECTED_BRANCH: Desarrollo
      DISPATCH_PATH: vaep/jules-c/dispatch
      SESSION_TITLE_PREFIX: "VAEP-C "
      ARTIFACT_PREFIX: vaep-jules-c
      ISSUE_PREFIX: "[VAEP-JULES-C]"
      WORKER_LABEL: Jules C
      WORKER_ID: JULES_C
      JULES_API_KEY: ${{ secrets.JULES_C_API_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Execute VAEP Jules integration v3.20 worker
        shell: bash
        run: bash .github/scripts/vaep-jules-worker-v320.sh

      - name: Upload Jules C result artifact
        if: always() && env.RESULT_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: error
          retention-days: 14
