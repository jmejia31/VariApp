name: N8.11.H - Reconciliar historial documental

on:
  push:
    branches:
      - Desarrollo
    paths:
      - .github/workflows/n8-11-h-doc-sync.yml

permissions:
  contents: write

concurrency:
  group: n8-11-h-doc-sync-Desarrollo
  cancel-in-progress: false

jobs:
  reconcile:
    name: Append history-preserving N8.11 documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Fast-forward and append canonical history
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin Desarrollo

          if ! grep -Fq 'ERP-N8.11 — Seguridad — ROLLUP DOCUMENTAL 2026-09-15' TASKS.md; then
            cat >> TASKS.md <<'EOF'

          ## ERP-N8.11 — Seguridad — ROLLUP DOCUMENTAL 2026-09-15

          Este bloque es aditivo e histórico. El estado operativo vigente se determina únicamente por CONFIG/COLA y receipts VAEP bajo `docs/VAEP_AUTHORITY.md`.

          - [x] N8.11.A-C cerraron `LISTO_REAL`; B (DOMAIN) y C (DB_MIG) quedaron materialmente N/A donde no existía delta causal que justificara inventar dominio o migración.
          - [x] N8.11.D cerró `LISTO_REAL` con contratos de regresión de seguridad del backend para autenticación, límites de uploads, rate limiting de superficie pública y anonimato acotado del webhook.
          - [x] N8.11.E cerró `LISTO_REAL` sin delta UI material requerido por el punto.
          - [x] N8.11.F cerró `LISTO_REAL` con P0=0/P1=0/P2=0 y gates terminales PASS para hardening de configuración, auditoría npm high/critical y auditoría de vulnerabilidades .NET.
          - [x] N8.11.G cerró `LISTO_REAL` con backend non-integration, frontend unit, frontend lint/build y security audit causales en PASS sobre `91a7051bdb75c858af08d0e28368d827c4c0f6b8`.
          - [x] Certificación canónica H materializada en `docs/CERTIFICACION_N8_11_SEGURIDAD.md`.

          N8.11.H sólo pasa a `LISTO_REAL` mediante REVIEW_FIRST documental, receipt verificable y reconciliación de control-plane; este rollup no sustituye el receipt.
          EOF
          fi

          if ! grep -Fq 'ERP-N8.11 Seguridad — reconciliación documental H' CHANGELOG_AI.md; then
            cat >> CHANGELOG_AI.md <<'EOF'

          ## 2026-09-15 — ERP-N8.11 Seguridad — reconciliación documental H

          **Responsable:** Tarea Supervisión :48 bajo `docs/VAEP_AUTHORITY.md`.

          Se certificó la cadena N8.11.A-G. El delta material de backend quedó cubierto por contratos de seguridad dirigidos; la auditoría SEC_AUDIT cerró con P0=0/P1=0/P2=0 y gates de hardening, npm high/critical y vulnerabilidades .NET en PASS. TEST_CI confirmó backend, frontend y security gates causales sobre el functional candidate `91a7051bdb75c858af08d0e28368d827c4c0f6b8`.

          La certificación final se materializó en `docs/CERTIFICACION_N8_11_SEGURIDAD.md`. N8.11.H es documental y no introduce delta de runtime, esquema, datos, secretos, Producción ni deploy. Fallos/cancelaciones de workflows no causales no se utilizaron para fabricar PASS.

          Este registro es histórico y no falsea H: N8.11.H sólo es `LISTO_REAL` cuando exista su REVIEW_FIRST documental, receipt final y readback/reconciliación del control-plane.
          EOF
          fi

          if git diff --quiet -- TASKS.md CHANGELOG_AI.md; then
            echo 'No documentary delta required.'
            exit 0
          fi

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TASKS.md CHANGELOG_AI.md
          git commit -m 'docs(n8.11.h): reconcile TASKS and CHANGELOG history'
          git push origin HEAD:Desarrollo
