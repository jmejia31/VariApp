name: TMP N0.5 - Generar migracion MetodoPago

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/_tmp-n0-5-generate-metodo-pago-migration.yml'
      - 'backend/src/Domain/Entities/Catalogos/MetodoPago.cs'
      - 'backend/src/Domain/Entities/Venta.cs'
      - 'backend/src/Domain/Entities/FacturaPago.cs'
      - 'backend/src/Domain/Entities/MovimientoFinanciero.cs'
      - 'backend/src/Infrastructure/Persistence/Configurations/MetodoPagoConfiguration.cs'
      - 'backend/src/Infrastructure/Persistence/Configurations/VentaConfiguration.cs'
      - 'backend/src/Infrastructure/Persistence/Configurations/FacturaPagoConfiguration.cs'
      - 'backend/src/Infrastructure/Persistence/Configurations/MovimientoFinancieroConfiguration.cs'

permissions:
  contents: write

jobs:
  generar-migracion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar backend
        working-directory: backend
        run: dotnet restore InventoryApp.sln

      - name: Instalar EF
        run: dotnet tool install --global dotnet-ef --version 8.0.8

      - name: Generar migracion y snapshot N0.5
        working-directory: backend
        run: |
          dotnet ef migrations add N0_5_MetodoPagoRelacionalBase \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext \
            --output-dir Migrations

      - name: Verificar alcance generado
        working-directory: backend
        run: |
          git status --short src/Infrastructure/Migrations
          NUEVA=$(find src/Infrastructure/Migrations -maxdepth 1 -name '*_N0_5_MetodoPagoRelacionalBase.cs' ! -name '*.Designer.cs' -print -quit)
          test -n "$NUEVA"
          grep -q 'CreateTable' "$NUEVA"
          grep -q 'MetodosPago' "$NUEVA"
          grep -q 'MetodoPagoId' "$NUEVA"
          if grep -Eq 'DropColumn\(.*MetodoPago|DropTable\(.*Ventas|DropTable\(.*FacturaPagos|DropTable\(.*MovimientosFinancieros' "$NUEVA"; then
            echo 'La migración contiene una operación destructiva legacy inesperada.' >&2
            exit 1
          fi

      - name: Publicar migracion generada en Desarrollo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/Infrastructure/Migrations
          git commit -m 'chore(erp-n0): generar migracion EF MetodoPago'
          git push origin HEAD:Desarrollo
