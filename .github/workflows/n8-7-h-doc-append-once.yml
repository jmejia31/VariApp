name: N8.7.H one-shot collaborative append

on:
  push:
    branches: [Desarrollo]
    paths:
      - .github/workflows/n8-7-h-doc-append-once.yml

permissions:
  contents: write

jobs:
  append-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - name: Append N8.7 current-standard rollups
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq '## ERP-N8.7 — Performance — REVALIDACIÓN CURRENT-STANDARD 2026-09-17' TASKS.md; then
            echo 'TASKS rollup already present; refusing duplicate.' >&2
            exit 1
          fi
          if grep -Fq '## 2026-09-17 — ERP-N8.7 Performance — certificación current-standard append-only' CHANGELOG_AI.md; then
            echo 'CHANGELOG rollup already present; refusing duplicate.' >&2
            exit 1
          fi
          cat >> TASKS.md <<'EOF'

## ERP-N8.7 — Performance — REVALIDACIÓN CURRENT-STANDARD 2026-09-17

Este bloque es estrictamente aditivo/history-preserving. El estado operativo vigente continúa exclusivamente en `CONFIG/COLA` bajo `docs/VAEP_AUTHORITY.md`; esta bitácora no sustituye receipt ni readback.

- [x] N8.7.A-F revalidados current-standard con preflight/guardas; P0=0/P1=0.
- [x] N8.7.G `LISTO` con functional head `45f069e9997e0cb9de4682844ff64dc9addc8674`; workflow `N8.7.G - Performance proof` run `35219847763=SUCCESS`; pruebas dirigidas 18/18; perfiles load/stress/endurance/volume con 18,594 requests y 0 fallos.
- [x] Contrato de seguridad: Production traffic/data=0, auth bypass=false, rate limit disabled=false y datos únicamente sintéticos; artifact `10496399028`, digest `sha256:68f2912c06d84feb0c2c25d148748c6daf02aa61f14b132151aef810f2ecbd9c`.
- [x] Certificación H canónica materializada en `docs/evidencias/performance/N8.7_CURRENT_STANDARD_MATERIAL_PERFORMANCE_CERTIFICATION_20260917.md`.
- [ ] N8.7.H sólo pasa a `LISTO` después de REVIEW_FIRST final P0=0/P1=0, hard verify de este append, receipt H y Sheet write/readback; este rollup no sustituye el cierre.
EOF
          cat >> CHANGELOG_AI.md <<'EOF'

## 2026-09-17 — ERP-N8.7 Performance — certificación current-standard append-only

**Responsable:** `CHATGPT_CONTROLLER` bajo `docs/VAEP_AUTHORITY.md`.

**Objetivo/alcance:** reconciliar documentalmente N8.7.H sin reabrir producto ni convertir una corrida Development en SLA/SLO de Producción. Esta entrada preserva byte-for-byte toda la historia previa y agrega únicamente la evidencia current-standard de N8.7.

**Evidencia:** functional head `45f069e9997e0cb9de4682844ff64dc9addc8674`; workflow `N8.7.G - Performance proof` run `35219847763=SUCCESS`; REVIEW_FIRST G `12cb5b02bad4a5d1dc22581d276738525fff9d3f`; receipt G `cb4ed1ce54ff2767a0c8c0080d55395173cac74c`; artifact `10496399028` con digest `sha256:68f2912c06d84feb0c2c25d148748c6daf02aa61f14b132151aef810f2ecbd9c`; pruebas dirigidas 18/18; 18,594 requests materiales y 0 fallos; contrato de seguridad PASS con Production traffic/data=0, sin auth bypass ni rate-limit disable y datos únicamente sintéticos.

**Documentación:** `docs/evidencias/performance/N8.7_CURRENT_STANDARD_MATERIAL_PERFORMANCE_CERTIFICATION_20260917.md`, junto con los preflight/guards A/F ya existentes. No aplica nuevo OpenAPI, ADR ni ERD porque el cierre no introduce contrato HTTP, decisión arquitectónica ni cambio de dominio/esquema.

**Control:** esta entrada resuelve el changelog append-only requerido por DOC_CERT, pero no declara por sí sola `N8.7.H=LISTO`; el cierre depende todavía de REVIEW_FIRST final P0=0/P1=0, receipt y write/readback. No se tocó `main`, Producción, PR #2, secretos, DNS ni certificados.
EOF
          git diff --check
          git diff --numstat -- TASKS.md CHANGELOG_AI.md | awk '{ if ($2 != 0) { print "Deletion detected in append-only reconciliation: "$0 > "/dev/stderr"; exit 1 } }'
          git diff --exit-code -- . ':(exclude)TASKS.md' ':(exclude)CHANGELOG_AI.md'
      - name: Commit append-only collaborative reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VariApp VAEP'
          git config user.email 'actions@users.noreply.github.com'
          git add TASKS.md CHANGELOG_AI.md
          git commit -m '[N8.7.H] append current-standard collaborative certification'
          git push origin HEAD:Desarrollo
