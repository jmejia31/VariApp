name: SOLQARYN one-shot GitHub post-transfer finalizer

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    if: >-
      github.repository == 'solqaryn/Solqaryn' &&
      github.actor == 'jmejia31' &&
      github.event.issue.title == '[ADMIN] SOLQARYN GitHub finalizer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TRIGGER_ISSUE: ${{ github.event.issue.number }}
    steps:
      - name: Checkout canonical Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Verify clean GitHub state and self-remove finalizer
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t branches < <(gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | sort)
          expected=("Desarrollo" "main")
          if [[ "${branches[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected branches: %s\n' "${branches[*]}" >&2
            exit 1
          fi

          open_prs="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq 'length')"
          if [[ "$open_prs" != "0" ]]; then
            echo "Open pull requests remain: $open_prs" >&2
            exit 1
          fi

          mapfile -t open_issues < <(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq '.[] | select(.pull_request == null) | .number')
          unexpected=()
          for issue in "${open_issues[@]}"; do
            if [[ "$issue" != "$TRIGGER_ISSUE" ]]; then
              unexpected+=("$issue")
            fi
          done
          if (( ${#unexpected[@]} > 0 )); then
            printf 'Unexpected open issues: %s\n' "${unexpected[*]}" >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          handoff = Path("docs/VAEP_HANDOFF_CURRENT.md")
          text = handoff.read_text(encoding="utf-8")
          old = "Work only on `Desarrollo`. Preserve `main`, Production, secrets and PR #2 OPEN+DRAFT."
          new = "Work only on `Desarrollo`. Preserve `main`, `Produccion` and secrets. PR #2 is historical evidence in `CLOSED + MERGED` state from the already-authorized ERP-N9 release and must not be reopened; any future `main`/production change requires fresh owner authorization."
          if old not in text:
              raise SystemExit("Expected stale VAEP_HANDOFF_CURRENT sentence not found")
          handoff.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          cat >> CHANGELOG_AI.md <<'EOF'

## 2026-09-24 — Cierre de control GitHub post-transfer a SOLQARYN

- Repositorio canónico confirmado bajo la organización `solqaryn/Solqaryn`; rama de trabajo `Desarrollo` y baseline productivo `main`.
- La limpieza one-shot eliminó 40 ramas históricas y drenó los issues históricos abiertos; tras la revalidación funcional de #3410, no queda deuda abierta de Issues/PRs derivada del traslado.
- `docs/VAEP_HANDOFF_CURRENT.md` se reconcilió con la autoridad vigente: PR #2 es evidencia histórica `CLOSED + MERGED` del release ERP-N9 autorizado y no debe reabrirse.
- Se retira el workflow temporal `github-post-transfer-cleanup.yml` después de cumplir su única función, evitando dejar una superficie administrativa residual.
- Este cierre no modifica producto, `main`, Produccion, secretos, datos productivos, dominios ni certificados.
EOF

          git rm .github/workflows/github-post-transfer-cleanup.yml
          git diff --check

          remote_head="$(git ls-remote origin refs/heads/Desarrollo | cut -f1)"
          local_head="$(git rev-parse HEAD)"
          if [[ "$remote_head" != "$local_head" ]]; then
            echo "Desarrollo changed concurrently; aborting finalizer safely." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/VAEP_HANDOFF_CURRENT.md CHANGELOG_AI.md .github/workflows/github-post-transfer-cleanup.yml
          git commit -m "chore(github): close post-transfer control debt"
          git push origin HEAD:Desarrollo

          gh issue close "$TRIGGER_ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed --comment "Finalizador GitHub post-transfer ejecutado y auto-retirado."
