name: M2 corrección final de aceptación

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/m2-final-gate-fix.yml'
      - '.github/scripts/m2-final-gate-fix.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Aplicar parche fail-closed
        run: python3 .github/scripts/m2-final-gate-fix.py

      - name: Compilar backend Release
        working-directory: backend
        run: |
          dotnet restore InventoryApp.sln
          dotnet build InventoryApp.sln --configuration Release --no-restore

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build:prod

      - name: Publicar corrección y retirar automatización temporal
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m2-final-gate-fix.yml .github/scripts/m2-final-gate-fix.py
          git add backend/src/Application/Services/VentaService.cs \
                  frontend/e2e/fase4-variantes.spec.ts \
                  frontend/e2e/fase5-cargas-masivas.spec.ts \
                  frontend/e2e/fase7-validacion-integral.spec.ts \
                  frontend/e2e/phase7-user-isolation.spec.ts \
                  frontend/e2e/productos-filtros.spec.ts
          git diff --cached --check
          git diff --cached --quiet && { echo 'No hubo cambios para publicar.'; exit 1; }
          git commit -m "fix(m2): alinear preview y aceptación con variante exacta [ChatGPT]"
          git push origin HEAD:Desarrollo
