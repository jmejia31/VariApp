name: LEGACY DEV - Backup y restore verificado

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/legacy-dev-migration-backup.yml
      - scripts/backup_dev.sh
      - scripts/restore_dev.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-dev-migration-backup
  cancel-in-progress: false

jobs:
  backup-restore-legacy-dev:
    name: Backup cifrado y restore descartable de varistorehn_desarrollo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: LEGACY_DEV_MIGRATION

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_legacy_restore_drill
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18

    env:
      SOLQARYN_ENVIRONMENT: dev
      DB_HOST: variapp-mysql-variapp.c.aivencloud.com
      DB_PORT: "26107"
      DB_NAME: varistorehn_desarrollo
      DB_USER: avnadmin
      DB_PASSWORD: ${{ secrets.LEGACY_DEV_DB_PASSWORD }}
      DB_SSL_MODE: REQUIRED
      BACKUP_PASSPHRASE: ${{ secrets.LEGACY_DEV_BACKUP_PASSPHRASE }}
      BACKUP_LABEL: legacy-varistorehn-desarrollo
      RETENTION_DAYS: "14"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Instalar cliente MySQL y utilidades
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mysql-client gnupg

      - name: Validar presencia de secretos sin exponerlos
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DB_PASSWORD"
          test -n "$BACKUP_PASSPHRASE"
          test "${#DB_PASSWORD}" -ge 1
          test "${#BACKUP_PASSPHRASE}" -ge 32
          echo "Secretos requeridos: PRESENTES"

      - name: Crear backup cifrado de DEV legacy
        shell: bash
        env:
          OUTPUT_DIR: ${{ runner.temp }}/legacy-backup
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          chmod 700 "$OUTPUT_DIR"
          bash scripts/backup_dev.sh
          encrypted="$(find "$OUTPUT_DIR" -maxdepth 1 -type f -name '*.tar.gz.gpg' -print -quit)"
          test -n "$encrypted"
          echo "BACKUP_FILE=$encrypted" >> "$GITHUB_ENV"
          echo "BACKUP_CHECKSUM_FILE=$encrypted.sha256" >> "$GITHUB_ENV"
          echo "BACKUP_META_FILE=${encrypted%.tar.gz.gpg}.meta.json" >> "$GITHUB_ENV"

      - name: Restaurar en MySQL descartable y verificar integridad
        shell: bash
        env:
          RESTORE_ENVIRONMENT: dev-disposable
          TARGET_DB_HOST: 127.0.0.1
          TARGET_DB_PORT: "3306"
          TARGET_DB_NAME: solqaryn_legacy_restore_drill
          TARGET_DB_USER: root
          TARGET_DB_PASSWORD: root
          TARGET_DB_SSL_MODE: DISABLED
          ALLOW_DESTRUCTIVE_RESTORE: YES_SOLQARYN_DISPOSABLE_RESTORE
          RESTORE_REPORT_PATH: ${{ runner.temp }}/legacy-restore-report.json
          RESTORE_FILES_DIR: ${{ runner.temp }}/legacy-restored-files
        run: |
          set -euo pipefail
          bash scripts/restore_dev.sh
          test -s "$RESTORE_REPORT_PATH"
          python3 - "$RESTORE_REPORT_PATH" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as fh:
              data = json.load(fh)
          assert data["status"] == "SUCCESS", data
          assert data["checksumsVerified"] is True, data
          assert data["allTableRowCountsVerified"] is True, data
          assert data["productionTouched"] is False, data
          print("RESTORE_VERIFICATION=SUCCESS")
          print("TABLES=" + str(data["baseTableCount"]))
          print("EF_MIGRATIONS=" + str(data["efMigrationCount"]))
          PY

      - name: Publicar backup cifrado y evidencia de restore
        uses: actions/upload-artifact@v4
        with:
          name: legacy-dev-varistorehn-desarrollo-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.BACKUP_FILE }}
            ${{ env.BACKUP_CHECKSUM_FILE }}
            ${{ env.BACKUP_META_FILE }}
            ${{ runner.temp }}/legacy-restore-report.json
