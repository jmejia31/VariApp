name: VariStoreHn Fase 4 - regresion detalle

on:
  push:
    branches:
      - Desarrollo
      - chatgpt/varistorehn-fase4-detalle
    paths:
      - 'frontend/src/app/features/varistorehn/**'
      - 'frontend/src/app/app.routes.ts'
      - 'frontend/e2e/varistorehn-fase1.spec.ts'
      - 'frontend/e2e/varistorehn-fase2.spec.ts'
      - 'frontend/e2e/varistorehn-fase3.spec.ts'
      - 'frontend/e2e/varistorehn-fase4.spec.ts'
      - 'frontend/scripts/validate-varistorehn-fase1.mjs'
      - 'frontend/scripts/validate-varistorehn-fase2.mjs'
      - 'frontend/scripts/validate-varistorehn-fase3.mjs'
      - 'frontend/scripts/validate-varistorehn-fase4.mjs'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'backend/src/API/Controllers/TiendaController.cs'
      - '.github/workflows/varistorehn-fase4-regression.yml'
  pull_request:
    branches:
      - Desarrollo
    paths:
      - 'frontend/src/app/features/varistorehn/**'
      - 'frontend/src/app/app.routes.ts'
      - 'frontend/e2e/varistorehn-fase1.spec.ts'
      - 'frontend/e2e/varistorehn-fase2.spec.ts'
      - 'frontend/e2e/varistorehn-fase3.spec.ts'
      - 'frontend/e2e/varistorehn-fase4.spec.ts'
      - 'frontend/scripts/validate-varistorehn-fase1.mjs'
      - 'frontend/scripts/validate-varistorehn-fase2.mjs'
      - 'frontend/scripts/validate-varistorehn-fase3.mjs'
      - 'frontend/scripts/validate-varistorehn-fase4.mjs'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'backend/src/API/Controllers/TiendaController.cs'
      - '.github/workflows/varistorehn-fase4-regression.yml'

permissions:
  contents: read

concurrency:
  group: varistorehn-fase4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Fase 4 - detalle publico
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint TypeScript y guardas Fases 1-4
        run: npm run lint

      - name: Build de produccion
        run: npm run build:prod

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Iniciar Angular
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > varistorehn-fase4-regression.log 2>&1 &

      - name: Esperar Angular
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4200/varistorehn/producto/demo-producto-1 > /dev/null; then
              echo 'Angular listo para la regresion publica de Fase 4.'
              exit 0
            fi
            sleep 2
          done
          echo 'Angular no respondio dentro del tiempo esperado.' >&2
          cat varistorehn-fase4-regression.log >&2 || true
          exit 1

      - name: Regresion Fase 1
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
        run: npm run test:e2e:varistorehn-fase1

      - name: Regresion Fase 2
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
        run: npm run test:e2e:varistorehn-fase2

      - name: Regresion Fase 3
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
        run: npm run test:e2e:varistorehn-fase3

      - name: Playwright Fase 4
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
        run: npm run test:e2e:varistorehn-fase4

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: varistorehn-fase4-regression
          path: |
            frontend/varistorehn-fase4-regression.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7
