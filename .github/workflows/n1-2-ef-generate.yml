name: ERP-N1.2 - Exportar snapshot EF base

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/n1-2-ef-generate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exportar-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar snapshot condensado actual
        run: |
          set -euo pipefail
          mkdir -p /tmp/n12-base
          cp backend/src/Infrastructure/Migrations/AppDbContextModelSnapshot.cs /tmp/n12-base/AppDbContextModelSnapshot.cs
      - name: Publicar snapshot base
        uses: actions/upload-artifact@v4
        with:
          name: n1-2-snapshot-base
          path: /tmp/n12-base/AppDbContextModelSnapshot.cs
          if-no-files-found: error
          retention-days: 1
