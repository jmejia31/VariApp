name: VAEP Jules A Trusted Secondary Worker

on:
  push:
    branches:
      - Desarrollo
    paths:
      - 'vaep/jules/dispatch/*.json'
      - 'vaep/jules-a/dispatch/*.json'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vaep-jules-a-lane
  cancel-in-progress: false

jobs:
  dispatch-jules:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      EXPECTED_OWNER: jmejia31
      EXPECTED_REPO: VariApp
      EXPECTED_BRANCH: Desarrollo
      SESSION_TITLE_PREFIX: "VAEP "
      ARTIFACT_PREFIX: vaep-jules
      ISSUE_PREFIX: "[VAEP-JULES]"
      WORKER_LABEL: Jules A
      WORKER_ID: JULES_A
      VAEP_JULES_LANE_BUDGET_SECONDS: 5400
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Resolve Jules A dispatch path
        shell: bash
        run: |
          set -euo pipefail
          canonical_count="$(git diff-tree --no-commit-id --name-only --diff-filter=A -r "$GITHUB_SHA" -- 'vaep/jules/dispatch/*.json' | sed '/^$/d' | wc -l | tr -d ' ')"
          compatibility_count="$(git diff-tree --no-commit-id --name-only --diff-filter=A -r "$GITHUB_SHA" -- 'vaep/jules-a/dispatch/*.json' | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$canonical_count" == "1" && "$compatibility_count" == "0" ]]; then
            echo 'DISPATCH_PATH=vaep/jules/dispatch' >> "$GITHUB_ENV"
          elif [[ "$canonical_count" == "0" && "$compatibility_count" == "1" ]]; then
            echo '::warning::Jules A manifest arrived through compatibility path vaep/jules-a/dispatch; canonical path is vaep/jules/dispatch.'
            echo 'DISPATCH_PATH=vaep/jules-a/dispatch' >> "$GITHUB_ENV"
          else
            echo "Jules A transport invariant failed: canonical=$canonical_count compatibility=$compatibility_count; expected exactly one manifest in one supported A path." >&2
            exit 20
          fi
      - name: Execute VAEP Jules v3.27 deterministic clarification guard
        shell: bash
        run: bash .github/scripts/vaep-jules-no-clarification-v327.sh
      - name: Upload Jules A result artifact
        if: always() && env.RESULT_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: error
          retention-days: 14
