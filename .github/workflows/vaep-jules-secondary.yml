name: VAEP Jules Secondary Worker

on:
  push:
    branches:
      - Desarrollo
    paths:
      - 'vaep/jules/dispatch/*.json'

permissions:
  contents: read
  issues: write

concurrency:
  group: vaep-jules-secondary
  cancel-in-progress: false

jobs:
  dispatch-jules:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      EXPECTED_OWNER: jmejia31
      EXPECTED_REPO: VariApp
      EXPECTED_BRANCH: Desarrollo
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Resolve and validate dispatch manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${JULES_API_KEY:-}" ]]; then
            echo 'JULES_API_KEY is not configured.' >&2
            exit 20
          fi

          mapfile -t manifests < <(git diff-tree --no-commit-id --name-only --diff-filter=A -r "$GITHUB_SHA" -- 'vaep/jules/dispatch/*.json')
          if [[ ${#manifests[@]} -ne 1 ]]; then
            echo "Expected exactly one newly added Jules dispatch manifest; found ${#manifests[@]}." >&2
            exit 21
          fi

          manifest="${manifests[0]}"
          jq -e '
            type == "object" and
            (.dispatchId | type == "string" and length > 0) and
            (.taskId | type == "string" and length > 0) and
            (.expectedBranch == "Desarrollo") and
            (.primaryBaseHead | type == "string" and test("^[0-9a-fA-F]{40}$")) and
            (.prompt | type == "string" and length > 0) and
            (.fileScopeHint | type == "string")
          ' "$manifest" >/dev/null

          dispatch_id=$(jq -r '.dispatchId' "$manifest")
          task_id=$(jq -r '.taskId' "$manifest")
          branch=$(jq -r '.expectedBranch' "$manifest")
          primary_base=$(jq -r '.primaryBaseHead' "$manifest")

          if [[ "$branch" != "$EXPECTED_BRANCH" ]]; then
            echo "Refusing unexpected branch: $branch" >&2
            exit 22
          fi

          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "dispatch_id=$dispatch_id" >> "$GITHUB_OUTPUT"
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"
          echo "primary_base=$primary_base" >> "$GITHUB_OUTPUT"

      - name: Resolve Jules source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vaep-jules"

          curl --fail-with-body --silent --show-error \
            -H "x-goog-api-key: $JULES_API_KEY" \
            "$JULES_API_BASE/sources?pageSize=100" \
            > "$RUNNER_TEMP/vaep-jules/sources.json"

          source_name=$(jq -r \
            --arg owner "$EXPECTED_OWNER" \
            --arg repo "$EXPECTED_REPO" \
            '.sources[]? | select(.githubRepo.owner == $owner and .githubRepo.repo == $repo) | .name' \
            "$RUNNER_TEMP/vaep-jules/sources.json" | head -n 1)

          if [[ -z "$source_name" || "$source_name" == "null" ]]; then
            echo "VariApp is not connected to Jules for this API key." >&2
            exit 30
          fi

          jq -e \
            --arg name "$source_name" \
            --arg branch "$EXPECTED_BRANCH" \
            '.sources[] | select(.name == $name) | (.githubRepo.branches // []) | any(.displayName == $branch)' \
            "$RUNNER_TEMP/vaep-jules/sources.json" >/dev/null || {
              echo "Branch Desarrollo is not visible in the connected Jules source." >&2
              exit 31
            }

          echo "source_name=$source_name" >> "$GITHUB_OUTPUT"

      - name: Reuse or create Jules session
        id: session
        shell: bash
        run: |
          set -euo pipefail
          manifest='${{ steps.manifest.outputs.manifest }}'
          dispatch_id='${{ steps.manifest.outputs.dispatch_id }}'
          task_id='${{ steps.manifest.outputs.task_id }}'
          primary_base='${{ steps.manifest.outputs.primary_base }}'
          source_name='${{ steps.source.outputs.source_name }}'
          title="VAEP ${dispatch_id}"

          # Idempotency for manual workflow re-runs: reuse a recent session with the exact dispatch title.
          curl --fail-with-body --silent --show-error \
            -H "x-goog-api-key: $JULES_API_KEY" \
            "$JULES_API_BASE/sessions?pageSize=100" \
            > "$RUNNER_TEMP/vaep-jules/sessions.json"

          session_name=$(jq -r --arg title "$title" '.sessions[]? | select(.title == $title) | .name' "$RUNNER_TEMP/vaep-jules/sessions.json" | head -n 1)

          if [[ -z "$session_name" || "$session_name" == "null" ]]; then
            user_prompt=$(jq -r '.prompt' "$manifest")
            file_scope=$(jq -r '.fileScopeHint' "$manifest")

            cat > "$RUNNER_TEMP/vaep-jules/prompt.txt" <<EOF
You are Jules, the secondary developer of the VariApp VAEP automation.

MANDATORY IDENTITY
PROJECT_ID=VARIAPP
REPOSITORY=jmejia31/VariApp
BRANCH=Desarrollo
PRIMARY_BASE_HEAD=$primary_base
VAEP_TASK_ID=$task_id
FILE_SCOPE_HINT=$file_scope

Before changing anything, read AGENTS.md and the Jules integration rules under docs/VAEP_JULES.md. Confirm the repository and branch. Work only inside your cloud workspace. Do not create a branch, pull request, merge, deployment, production change, secret, or GitHub push. Never touch main or Production. Do not expose credentials.

You are working in parallel with ChatGPT. Inspect only the assigned scope and its direct dependencies. If files/contracts in FILE_SCOPE_HINT have materially diverged from PRIMARY_BASE_HEAD in a way that makes this assignment unsafe, make no code changes and report the conflict clearly. Otherwise implement the assigned task completely, run proportional real tests, and leave a reviewable ChangeSet/gitPatch. Preserve unrelated work.

ASSIGNED VAEP MICROTASK
$user_prompt
EOF

            jq -n \
              --arg prompt "$(cat "$RUNNER_TEMP/vaep-jules/prompt.txt")" \
              --arg title "$title" \
              --arg source "$source_name" \
              --arg branch "$EXPECTED_BRANCH" \
              '{
                prompt: $prompt,
                title: $title,
                sourceContext: {
                  source: $source,
                  githubRepoContext: { startingBranch: $branch }
                },
                requirePlanApproval: false
              }' > "$RUNNER_TEMP/vaep-jules/create-session.json"

            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: $JULES_API_KEY" \
              --data-binary @"$RUNNER_TEMP/vaep-jules/create-session.json" \
              "$JULES_API_BASE/sessions" \
              > "$RUNNER_TEMP/vaep-jules/session-created.json"

            session_name=$(jq -r '.name' "$RUNNER_TEMP/vaep-jules/session-created.json")
          fi

          if [[ -z "$session_name" || "$session_name" == "null" ]]; then
            echo 'Jules did not return a session resource name.' >&2
            exit 40
          fi

          session_id="${session_name#sessions/}"
          echo "session_name=$session_name" >> "$GITHUB_OUTPUT"
          echo "session_id=$session_id" >> "$GITHUB_OUTPUT"

      - name: Poll Jules until terminal state
        id: poll
        shell: bash
        run: |
          set -euo pipefail
          session_name='${{ steps.session.outputs.session_name }}'
          session_id='${{ steps.session.outputs.session_id }}'
          terminal_state=''

          for _ in $(seq 1 220); do
            curl --fail-with-body --silent --show-error \
              -H "x-goog-api-key: $JULES_API_KEY" \
              "$JULES_API_BASE/$session_name" \
              > "$RUNNER_TEMP/vaep-jules/session-latest.json"

            state=$(jq -r '.state // "UNKNOWN"' "$RUNNER_TEMP/vaep-jules/session-latest.json")
            echo "Jules session $session_id state: $state"

            case "$state" in
              COMPLETED|FAILED|AWAITING_USER_FEEDBACK|PAUSED)
                terminal_state="$state"
                break
                ;;
            esac
            sleep 30
          done

          if [[ -z "$terminal_state" ]]; then
            terminal_state='WORKFLOW_TIMEOUT'
          fi

          echo "terminal_state=$terminal_state" >> "$GITHUB_OUTPUT"

      - name: Collect Jules evidence and patch
        id: collect
        if: always() && steps.session.outputs.session_name != ''
        shell: bash
        run: |
          set -euo pipefail
          session_name='${{ steps.session.outputs.session_name }}'
          dispatch_id='${{ steps.manifest.outputs.dispatch_id }}'
          task_id='${{ steps.manifest.outputs.task_id }}'
          requested_base='${{ steps.manifest.outputs.primary_base }}'
          terminal_state='${{ steps.poll.outputs.terminal_state }}'

          mkdir -p "$RUNNER_TEMP/vaep-jules/result"

          curl --fail-with-body --silent --show-error \
            -H "x-goog-api-key: $JULES_API_KEY" \
            "$JULES_API_BASE/$session_name/activities?pageSize=100" \
            > "$RUNNER_TEMP/vaep-jules/result/activities.json"

          cp "$RUNNER_TEMP/vaep-jules/session-latest.json" "$RUNNER_TEMP/vaep-jules/result/session.json" 2>/dev/null || true
          cp '${{ steps.manifest.outputs.manifest }}' "$RUNNER_TEMP/vaep-jules/result/dispatch.json"

          jq '[.activities[]? | .artifacts[]? | .changeSet?.gitPatch? | select(. != null)] | last // null' \
            "$RUNNER_TEMP/vaep-jules/result/activities.json" \
            > "$RUNNER_TEMP/vaep-jules/result/gitpatch.json"

          patch_present=$(jq -r 'type == "object"' "$RUNNER_TEMP/vaep-jules/result/gitpatch.json")
          actual_base=''
          suggested=''
          if [[ "$patch_present" == 'true' ]]; then
            actual_base=$(jq -r '.baseCommitId // ""' "$RUNNER_TEMP/vaep-jules/result/gitpatch.json")
            suggested=$(jq -r '.suggestedCommitMessage // ""' "$RUNNER_TEMP/vaep-jules/result/gitpatch.json")
            jq -r '.unidiffPatch // ""' "$RUNNER_TEMP/vaep-jules/result/gitpatch.json" > "$RUNNER_TEMP/vaep-jules/result/changes.patch"
          else
            : > "$RUNNER_TEMP/vaep-jules/result/changes.patch"
          fi

          jq -n \
            --arg dispatchId "$dispatch_id" \
            --arg taskId "$task_id" \
            --arg session "$session_name" \
            --arg state "$terminal_state" \
            --arg requestedBase "$requested_base" \
            --arg actualBase "$actual_base" \
            --arg suggestedCommitMessage "$suggested" \
            --argjson patchPresent "$patch_present" \
            '{dispatchId:$dispatchId,taskId:$taskId,session:$session,state:$state,requestedBase:$requestedBase,actualPatchBase:$actualBase,patchPresent:$patchPresent,suggestedCommitMessage:$suggestedCommitMessage}' \
            > "$RUNNER_TEMP/vaep-jules/result/result.json"

          echo "patch_present=$patch_present" >> "$GITHUB_OUTPUT"
          echo "actual_base=$actual_base" >> "$GITHUB_OUTPUT"

      - name: Upload Jules result artifact
        if: always() && steps.session.outputs.session_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: vaep-jules-${{ steps.manifest.outputs.dispatch_id }}
          path: ${{ runner.temp }}/vaep-jules/result
          if-no-files-found: error
          retention-days: 14

      - name: Register result as GitHub issue
        if: always() && steps.session.outputs.session_name != ''
        shell: bash
        run: |
          set -euo pipefail
          dispatch_id='${{ steps.manifest.outputs.dispatch_id }}'
          task_id='${{ steps.manifest.outputs.task_id }}'
          session_name='${{ steps.session.outputs.session_name }}'
          state='${{ steps.poll.outputs.terminal_state }}'
          patch_present='${{ steps.collect.outputs.patch_present }}'
          actual_base='${{ steps.collect.outputs.actual_base }}'

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(cat <<EOF
VAEP Jules secondary-worker result.

- Dispatch: \`$dispatch_id\`
- Task: \`$task_id\`
- Jules session: \`$session_name\`
- Terminal state: \`$state\`
- Patch present: \`$patch_present\`
- Patch base: \`$actual_base\`
- Workflow run: $run_url

The patch is an artifact only. It has NOT been pushed, merged, or applied to \`Desarrollo\`. ChatGPT/VAEP must reconcile the artifact against current HEAD before publication.
EOF
          )

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "[VAEP-JULES] $dispatch_id result" \
            --body "$body" >/dev/null

      - name: Enforce successful worker result
        if: always() && steps.session.outputs.session_name != ''
        shell: bash
        run: |
          set -euo pipefail
          state='${{ steps.poll.outputs.terminal_state }}'
          patch_present='${{ steps.collect.outputs.patch_present }}'

          if [[ "$state" != 'COMPLETED' ]]; then
            echo "Jules did not complete successfully: $state" >&2
            exit 50
          fi
          if [[ "$patch_present" != 'true' ]]; then
            echo 'Jules completed without a ChangeSet/gitPatch; VAEP must inspect the session before certifying the task.' >&2
            exit 51
          fi
