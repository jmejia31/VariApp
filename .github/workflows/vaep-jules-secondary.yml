name: VAEP Jules A Trusted Secondary Worker

on:
  push:
    branches:
      - Desarrollo
    paths:
      - 'vaep/jules/dispatch/*.json'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: vaep-jules-a-lane
  cancel-in-progress: false

jobs:
  dispatch-jules:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      EXPECTED_OWNER: jmejia31
      EXPECTED_REPO: VariApp
      EXPECTED_BRANCH: Desarrollo
      SESSION_TITLE_PREFIX: "VAEP "
      ARTIFACT_PREFIX: vaep-jules
      ISSUE_PREFIX: "[VAEP-JULES]"
      WORKER_LABEL: Jules A
      WORKER_ID: JULES_A
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Bind Jules A canonical dispatch path
        shell: bash
        run: echo 'DISPATCH_PATH=vaep/jules/dispatch' >> "$GITHUB_ENV"
      - name: Execute VAEP/Jules MASTER
        shell: bash
        run: bash .github/scripts/vaep-jules-master.sh
      - name: Upload Jules A result artifact
        if: always() && env.RESULT_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: error
          retention-days: 14
      - name: Auto-refill Jules A lane
        if: always()
        shell: bash
        run: bash .github/scripts/vaep-jules-autorefill.sh
