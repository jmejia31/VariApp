name: VAEP Jules A Trusted Secondary Worker

on:
  push:
    branches:
      - Desarrollo
    paths:
      - "vaep/jules/dispatch/*.json"

permissions:
  contents: read
  issues: write

concurrency:
  group: vaep-jules-secondary
  cancel-in-progress: false

jobs:
  dispatch-jules:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      EXPECTED_OWNER: jmejia31
      EXPECTED_REPO: VariApp
      EXPECTED_BRANCH: Desarrollo
      DISPATCH_PATH: vaep/jules/dispatch
      SESSION_TITLE_PREFIX: "VAEP "
      ARTIFACT_PREFIX: vaep-jules
      ISSUE_PREFIX: "[VAEP-JULES]"
      WORKER_LABEL: Jules A
      WORKER_ID: JULES_A
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Execute VAEP Jules integration v3.19 worker
        shell: bash
        run: bash .github/scripts/vaep-jules-worker-v319.sh

      - name: Upload Jules A result artifact
        if: always() && env.RESULT_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: error
          retention-days: 14
