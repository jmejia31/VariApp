name: M7 - generar migracion EF

on:
  push:
    branches: [Desarrollo]
    paths:
      - 'backend/src/Domain/Entities/CostoEnvio.cs'
      - 'backend/src/Infrastructure/Persistence/Configurations/CostoEnvioConfiguration.cs'
      - '.github/workflows/m7-generate-migration.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore backend/InventoryApp.sln
      - run: dotnet tool install --global dotnet-ef --version 8.0.8
      - name: Generar migración M7
        run: |
          dotnet ef migrations add M7CostosEnvioProfesionales \
            --project backend/src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project backend/src/API/InventoryApp.API.csproj \
            --output-dir Persistence/Migrations
      - name: Publicar migración y snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/Infrastructure/Persistence/Migrations
          git diff --cached --quiet && exit 0
          git commit -m "feat(m7): generar migración profesional de costos de envío [ChatGPT]"
          git push origin HEAD:Desarrollo
