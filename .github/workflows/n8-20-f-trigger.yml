name: N8.20.F - Trigger Aiven DEV Proof

# Recovery iteration 4: dispatch after exact current project-id resolution fix.
on:
  push:
    branches:
      - Desarrollo
    paths:
      - '.github/workflows/n8-20-f-trigger.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-proof:
    name: Dispatch exact DEV-scoped Aiven proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch N8.20.F proof on Desarrollo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run n8-20-f-aiven-capabilities-proof.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref Desarrollo \
            -f aiven_project=variapp \
            -f aiven_service=variapp-mysql \
            -f persist_evidence=true
          echo 'N8.20.F proof dispatch requested; no secret values were read or printed.'
