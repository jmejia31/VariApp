name: VAEP Jules A Recovery Worker

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vaep-jules-a-lane
  cancel-in-progress: false

jobs:
  dispatch-jules-a-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      EXPECTED_OWNER: jmejia31
      EXPECTED_REPO: VariApp
      EXPECTED_BRANCH: Desarrollo
      DISPATCH_PATH: vaep/jules/dispatch
      SESSION_TITLE_PREFIX: "VAEP "
      ARTIFACT_PREFIX: vaep-jules-a-recovery
      ISSUE_PREFIX: "[VAEP-JULES-A-RECOVERY]"
      WORKER_LABEL: Jules A
      WORKER_ID: JULES_A
      VAEP_JULES_LANE_BUDGET_SECONDS: 5400
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout recovery commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Execute VAEP/Jules MASTER
        shell: bash
        run: bash .github/scripts/vaep-jules-master.sh

      - name: Upload Jules A recovery result artifact
        if: always() && env.RESULT_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: error
          retention-days: 14
