name: LEGACY PROD - Backup verificado antes de main

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/legacy-prod-backup-before-main.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-prod-backup-before-main
  cancel-in-progress: false

jobs:
  backup-legacy-prod:
    name: Backup cifrado y restore verificado de defaultdb
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: LEGACY_DEV_MIGRATION

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_legacy_prod_restore_drill
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18

    env:
      DB_HOST: variapp-mysql-variapp.c.aivencloud.com
      DB_PORT: "26107"
      DB_NAME: defaultdb
      DB_USER: avnadmin
      DB_PASSWORD: ${{ secrets.LEGACY_DEV_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.LEGACY_DEV_BACKUP_PASSPHRASE }}
      DB_SSL_MODE: REQUIRED

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Instalar cliente MySQL y utilidades
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mysql-client gnupg jq

      - name: Guardas de fuente y secretos
        shell: bash
        run: |
          set -euo pipefail
          test "$DB_HOST" = "variapp-mysql-variapp.c.aivencloud.com"
          test "$DB_PORT" = "26107"
          test "$DB_NAME" = "defaultdb"
          test "$DB_USER" = "avnadmin"
          test -n "$DB_PASSWORD"
          test -n "$BACKUP_PASSPHRASE"
          test "${#BACKUP_PASSPHRASE}" -ge 32
          echo "LEGACY_PROD_SOURCE_GUARD=PASS"
          echo "SECRETS_PRESENT=PASS"

      - name: Preflight read-only de defaultdb
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD="$DB_PASSWORD"
          mysql_cmd=(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED --default-character-set=utf8mb4 "$DB_NAME" --batch --skip-column-names)
          test "$("${mysql_cmd[@]}" -e 'SELECT DATABASE();')" = "defaultdb"
          "${mysql_cmd[@]}" -e 'SELECT 1;' | grep -qx '1'
          tables="$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE';")"
          migrations="$("${mysql_cmd[@]}" -e "SELECT IF(EXISTS(SELECT 1 FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='__EFMigrationsHistory'),(SELECT COUNT(*) FROM __EFMigrationsHistory),0);")"
          test "$tables" -gt 0
          echo "SOURCE_DATABASE=defaultdb"
          echo "SOURCE_BASE_TABLES=$tables"
          echo "SOURCE_EF_MIGRATIONS=$migrations"
          echo "LEGACY_PROD_READ_ONLY_PREFLIGHT=PASS"

      - name: Crear dump transaccional y manifiesto de integridad
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export MYSQL_PWD="$DB_PASSWORD"
          work="$RUNNER_TEMP/legacy-prod-backup"
          payload="$work/payload"
          mkdir -p "$payload"
          chmod 700 "$work" "$payload"

          mysql_cmd=(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED --default-character-set=utf8mb4 "$DB_NAME" --batch --skip-column-names)

          mysqldump \
            --protocol=TCP \
            -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" \
            --ssl-mode=REQUIRED \
            --single-transaction --skip-lock-tables --quick \
            --hex-blob --default-character-set=utf8mb4 \
            --no-tablespaces --set-gtid-purged=OFF \
            --routines --triggers --events \
            "$DB_NAME" > "$payload/defaultdb.sql"
          test -s "$payload/defaultdb.sql"

          : > "$payload/row-counts.tsv"
          while IFS= read -r table_name; do
            test -n "$table_name"
            [[ "$table_name" =~ ^[A-Za-z0-9_]+$ ]]
            count="$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM \`$table_name\`;")"
            printf '%s\t%s\n' "$table_name" "$count" >> "$payload/row-counts.tsv"
          done < <("${mysql_cmd[@]}" -e "SELECT TABLE_NAME FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE' ORDER BY TABLE_NAME;")

          base_tables="$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE';")"
          views="$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.VIEWS WHERE TABLE_SCHEMA=DATABASE();")"
          triggers="$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TRIGGERS WHERE TRIGGER_SCHEMA=DATABASE();")"
          routines="$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.ROUTINES WHERE ROUTINE_SCHEMA=DATABASE();")"
          events="$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.EVENTS WHERE EVENT_SCHEMA=DATABASE();")"
          migrations="$("${mysql_cmd[@]}" -e "SELECT IF(EXISTS(SELECT 1 FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='__EFMigrationsHistory'),(SELECT COUNT(*) FROM __EFMigrationsHistory),0);")"
          server_version="$("${mysql_cmd[@]}" -e 'SELECT VERSION();')"

          jq -n \
            --arg createdAtUtc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg sourceDatabase "defaultdb" \
            --arg sourceHostHash "$(printf '%s' "$DB_HOST" | sha256sum | awk '{print $1}')" \
            --arg serverVersion "$server_version" \
            --arg gitCommit "$GITHUB_SHA" \
            --argjson baseTableCount "$base_tables" \
            --argjson viewCount "$views" \
            --argjson triggerCount "$triggers" \
            --argjson routineCount "$routines" \
            --argjson eventCount "$events" \
            --argjson efMigrationCount "$migrations" \
            '{
              formatVersion:"SOLQARYN_LEGACY_PROD_BACKUP_V1",
              createdAtUtc:$createdAtUtc,
              sourceDatabase:$sourceDatabase,
              sourceHostSha256:$sourceHostHash,
              databaseServerVersion:$serverVersion,
              gitCommit:$gitCommit,
              baseTableCount:$baseTableCount,
              viewCount:$viewCount,
              triggerCount:$triggerCount,
              routineCount:$routineCount,
              eventCount:$eventCount,
              efMigrationCount:$efMigrationCount,
              transactionConsistency:"single-transaction",
              encrypted:true,
              productionSourceReadOnly:true,
              sourceWritesPerformed:false
            }' > "$payload/metadata.json"

          (
            cd "$payload"
            sha256sum defaultdb.sql row-counts.tsv metadata.json > MANIFEST.sha256
          )

          archive="$work/solqaryn-legacy-prod-defaultdb-$(date -u +'%Y%m%dT%H%M%SZ').tar.gz"
          tar -C "$payload" -czf "$archive" defaultdb.sql row-counts.tsv metadata.json MANIFEST.sha256
          encrypted="$archive.gpg"

          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --no-tty --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --digest-algo SHA256 \
            --output "$encrypted" "$archive"
          test -s "$encrypted"
          sha256sum "$encrypted" > "$encrypted.sha256"

          cp "$payload/metadata.json" "$work/backup-metadata.json"
          echo "BACKUP_FILE=$encrypted" >> "$GITHUB_ENV"
          echo "BACKUP_SHA=$encrypted.sha256" >> "$GITHUB_ENV"
          echo "BACKUP_METADATA=$work/backup-metadata.json" >> "$GITHUB_ENV"
          echo "BACKUP_WORK=$work" >> "$GITHUB_ENV"
          echo "LEGACY_PROD_ENCRYPTED_BACKUP=PASS"

      - name: Restore descartable y verificación exacta
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          restore="$RUNNER_TEMP/legacy-prod-restore"
          mkdir -p "$restore"
          chmod 700 "$restore"

          (
            cd "$(dirname "$BACKUP_FILE")"
            sha256sum -c "$(basename "$BACKUP_SHA")"
          )

          archive="$restore/backup.tar.gz"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --no-tty --pinentry-mode loopback --passphrase-fd 0 \
            --decrypt --output "$archive" "$BACKUP_FILE"
          tar -C "$restore" -xzf "$archive"

          (
            cd "$restore"
            sha256sum -c MANIFEST.sha256
          )

          export MYSQL_PWD=root
          mysql_local=(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root --ssl-mode=DISABLED --default-character-set=utf8mb4)
          "${mysql_local[@]}" -e 'DROP DATABASE IF EXISTS solqaryn_legacy_prod_restore_drill; CREATE DATABASE solqaryn_legacy_prod_restore_drill CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          "${mysql_local[@]}" solqaryn_legacy_prod_restore_drill < "$restore/defaultdb.sql"
          mysql_restore=("${mysql_local[@]}" solqaryn_legacy_prod_restore_drill --batch --skip-column-names)

          expected_tables="$(jq -r '.baseTableCount' "$restore/metadata.json")"
          actual_tables="$("${mysql_restore[@]}" -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE';")"
          test "$actual_tables" = "$expected_tables"

          while IFS=$'\t' read -r table_name expected_count; do
            test -n "$table_name"
            actual_count="$("${mysql_restore[@]}" -e "SELECT COUNT(*) FROM \`$table_name\`;")"
            test "$actual_count" = "$expected_count"
          done < "$restore/row-counts.tsv"

          expected_migrations="$(jq -r '.efMigrationCount' "$restore/metadata.json")"
          actual_migrations="$("${mysql_restore[@]}" -e "SELECT IF(EXISTS(SELECT 1 FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='__EFMigrationsHistory'),(SELECT COUNT(*) FROM __EFMigrationsHistory),0);")"
          test "$actual_migrations" = "$expected_migrations"

          jq -n \
            --arg verifiedAtUtc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --argjson baseTableCount "$actual_tables" \
            --argjson efMigrationCount "$actual_migrations" \
            '{
              status:"SUCCESS",
              verifiedAtUtc:$verifiedAtUtc,
              sourceDatabase:"defaultdb",
              restoreTarget:"local-disposable-mysql-8.4",
              encryptedArtifactChecksumVerified:true,
              internalManifestVerified:true,
              allTableRowCountsVerified:true,
              baseTableCount:$baseTableCount,
              efMigrationCount:$efMigrationCount,
              sourceWritesPerformed:false,
              mainTouched:false
            }' > "$BACKUP_WORK/restore-verification.json"

          echo "LEGACY_PROD_RESTORE_VERIFICATION=PASS"

      - name: Publicar backup cifrado y evidencia
        uses: actions/upload-artifact@v4
        with:
          name: solqaryn-legacy-prod-defaultdb-backup-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ env.BACKUP_FILE }}
            ${{ env.BACKUP_SHA }}
            ${{ env.BACKUP_METADATA }}
            ${{ env.BACKUP_WORK }}/restore-verification.json

      - name: Resumen
        shell: bash
        run: |
          echo "LEGACY_PROD_BACKUP_FINAL=PASS"
          echo "SOURCE_DATABASE=defaultdb"
          echo "SOURCE_WRITES=0"
          echo "MAIN_TOUCHED=FALSE"
