name: M13 - Sanear E2E históricos

on:
  push:
    branches: [Desarrollo]
    paths:
      - .github/workflows/m13-fix-stale-e2e.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
      - name: Alinear pruebas históricas con contratos vigentes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Fase 4: desde 2C.5 la selección operacional es autocomplete remoto por variante exacta.
          p = Path('frontend/e2e/fase4-variantes.spec.ts')
          text = p.read_text()
          old = '''    await page.goto('/ventas/nueva');
              const productoVenta = page.locator('mat-select[formcontrolname="productoId"]').first();
              await productoVenta.click();
              await page.getByRole('option', { name: new RegExp(nombres.producto) }).click();
              const varianteVenta = page.locator('mat-select[formcontrolname="productoVarianteId"]').first();
              await expect(varianteVenta).toBeVisible();
              await varianteVenta.click();
              await expect(page.getByRole('option', { name: new RegExp(nombres.sku.toUpperCase()) })).toBeVisible();
              await page.keyboard.press('Escape');

              await page.goto('/compras/nueva');
              const productoCompra = page.locator('mat-select[formcontrolname="productoId"]').first();
              await productoCompra.click();
              await page.getByRole('option', { name: new RegExp(nombres.producto) }).click();
              const varianteCompra = page.locator('mat-select[formcontrolname="productoVarianteId"]').first();
              await expect(varianteCompra).toBeVisible();
              await varianteCompra.click();
              await expect(page.getByRole('option', { name: new RegExp(nombres.sku.toUpperCase()) })).toBeVisible();
          '''
          new = '''    await page.goto('/ventas/nueva');
              const ventaInput = page.getByTestId('venta-producto-autocomplete');
              await ventaInput.fill(nombres.sku);
              await page.getByRole('option', { name: new RegExp(nombres.producto) }).click();
              const varianteVenta = page.locator('mat-select[formcontrolname="productoVarianteId"]').first();
              await expect(varianteVenta).toBeVisible();
              await expect(varianteVenta).toContainText(nombres.sku.toUpperCase());

              await page.goto('/compras/nueva');
              const compraInput = page.getByTestId('compra-producto-autocomplete');
              await compraInput.fill(nombres.sku);
              await page.getByRole('option', { name: new RegExp(nombres.producto) }).click();
              const varianteCompra = page.locator('mat-select[formcontrolname="productoVarianteId"]').first();
              await expect(varianteCompra).toBeVisible();
              await expect(varianteCompra).toContainText(nombres.sku.toUpperCase());
          '''
          if old not in text:
              raise SystemExit('Bloque histórico Fase 4 no encontrado')
          p.write_text(text.replace(old, new, 1))

          # Fase 5: agregar fixtures de los endpoints remotos y usar el autocomplete vigente.
          p = Path('frontend/e2e/fase5-imagenes.spec.ts')
          text = p.read_text()
          marker = '''const productWithoutImage = {
            ...product,
            id: 502,
            nombre: 'Producto visual sin imagen',
            imagenPrincipalUrl: null,
            totalImagenes: 0,
            imagenes: []
          };
          '''
          addition = marker + '''
          const productOperationSale = {
            productoId: product.id,
            productoVarianteId: 503,
            productoNombre: product.nombre,
            marca: product.marca,
            modelo: product.modelo,
            esVarianteTecnica: true,
            colorId: null,
            colorNombre: 'Predeterminada',
            sku: 'SKU-F5-VISUAL',
            codigoBarras: '000000000503',
            cantidadDisponible: product.cantidad,
            precio: product.precio,
            imagenMiniaturaUrl: okImage
          };

          const productOperationPurchase = {
            ...productOperationSale,
            costo: product.costo
          };
          '''
          if marker not in text:
              raise SystemExit('Punto de inserción Fase 5 no encontrado')
          text = text.replace(marker, addition, 1)

          fixture_marker = '''  await page.route(/^https?:\\/\\/(?:localhost|127\\.0\\.0\\.1):5005\\/(?:api\\/)?productos\\/501$/, (route) => json(route, product));
          '''
          fixture_addition = fixture_marker + '''
            await page.route(/^https?:\\/\\/(?:localhost|127\\.0\\.0\\.1):5005\\/(?:api\\/)?compras\\/productos\\/buscar(?:\\?.*)?$/, (route) => json(route, [productOperationPurchase]));
            await page.route(/^https?:\\/\\/(?:localhost|127\\.0\\.0\\.1):5005\\/(?:api\\/)?ventas\\/productos\\/buscar(?:\\?.*)?$/, (route) => json(route, [productOperationSale]));
          '''
          if fixture_marker not in text:
              raise SystemExit('Fixtures Fase 5 no encontrados')
          text = text.replace(fixture_marker, fixture_addition, 1)

          text = text.replace(
          '''    await page.goto('/compras/nueva');
              await page.locator('.col-producto mat-select').first().click();
              await page.getByRole('option', { name: /Producto visual Fase 5/ }).click();
              await expect(page.locator('.col-imagen app-producto-imagen img')).toBeVisible();
          ''',
          '''    await page.goto('/compras/nueva');
              await page.getByTestId('compra-producto-autocomplete').fill(productOperationPurchase.sku);
              await page.getByRole('option', { name: /Producto visual Fase 5/ }).click();
              await expect(page.locator('.col-imagen app-producto-imagen img')).toBeVisible();
          ''', 1)
          text = text.replace(
          '''    await page.goto('/ventas/nueva');
              await page.locator('.col-producto mat-select').first().click();
              await page.getByRole('option', { name: /Producto visual Fase 5/ }).click();
              await expect(page.locator('.col-imagen app-producto-imagen img')).toBeVisible();
          ''',
          '''    await page.goto('/ventas/nueva');
              await page.getByTestId('venta-producto-autocomplete').fill(productOperationSale.sku);
              await page.getByRole('option', { name: /Producto visual Fase 5/ }).click();
              await expect(page.locator('.col-imagen app-producto-imagen img')).toBeVisible();
          ''', 1)
          p.write_text(text)

          # Fase 8: homologar la prueba del skip-link con la certificación M10 vigente.
          p = Path('frontend/e2e/fase8-validacion-completa.spec.ts')
          text = p.read_text()
          old = '''    await page.goto('/dashboard');
              await page.evaluate(() => (document.activeElement as HTMLElement | null)?.blur());
              await page.keyboard.press('Tab');
              await expect(page.locator('.skip-link')).toBeFocused();
              await page.keyboard.press('Enter');
              await expect(page.locator('main#main-content')).toBeFocused();
          '''
          new = '''    await page.goto('/dashboard');
              const skip = page.getByRole('link', { name: 'Saltar al contenido principal' });
              await page.keyboard.press('Tab');
              await expect(skip).toBeFocused();
              await page.keyboard.press('Enter');
              await expect(page.locator('main#main-content')).toBeFocused();
          '''
          if old not in text:
              raise SystemExit('Bloque skip-link Fase 8 no encontrado')
          p.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          grep -q "venta-producto-autocomplete" frontend/e2e/fase4-variantes.spec.ts
          grep -q "productOperationPurchase" frontend/e2e/fase5-imagenes.spec.ts
          ! grep -A8 "el enlace para saltar" frontend/e2e/fase8-validacion-completa.spec.ts | grep -q "activeElement"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/e2e/fase4-variantes.spec.ts frontend/e2e/fase5-imagenes.spec.ts frontend/e2e/fase8-validacion-completa.spec.ts
          git commit -m 'test(m13): alinear regresiones históricas con contratos vigentes [ChatGPT]'
          git push origin HEAD:Desarrollo
