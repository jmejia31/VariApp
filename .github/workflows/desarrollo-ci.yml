name: Desarrollo - Compilación y pruebas

on:
  push:
    branches:
      - Desarrollo
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desarrollo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-phase4-hardening:
    name: Aplicar endurecimiento pendiente de variantes
    if: github.event_name == 'push' && github.ref == 'refs/heads/Desarrollo'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Aplicar reglas idempotentes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_if_present(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              if new in text:
                  return False
              if old not in text:
                  raise SystemExit(f'No se encontró el patrón esperado en {path}: {old[:140]}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')
              return True

          replace_if_present(
              'backend/src/Application/Services/ProductoVarianteService.cs',
              '''        var variantes = await _repository.GetByProductoIdAsync(producto.Id, incluirInactivas: false);
        var total = variantes.Sum(v => v.Cantidad);
        producto.Cantidad = total;
        if (variantes.Count > 0)
        {
            producto.Costo = total > 0
                ? Math.Round(variantes.Sum(v => (v.Costo ?? 0m) * v.Cantidad) / total, 2, MidpointRounding.AwayFromZero)
                : variantes.Average(v => v.Costo ?? 0m);
            producto.Precio = variantes.Min(v => v.Precio ?? producto.Precio);
            producto.ColorId = variantes.Count == 1 ? variantes[0].ColorId : null;
        }''',
              '''        var variantes = await _repository.GetByProductoIdAsync(producto.Id, incluirInactivas: true);
        var activas = variantes.Where(v => v.Activo).ToList();
        var total = variantes.Sum(v => v.Cantidad);
        producto.Cantidad = total;
        if (variantes.Count > 0)
        {
            producto.Costo = total > 0
                ? Math.Round(variantes.Sum(v => (v.Costo ?? 0m) * v.Cantidad) / total, 2, MidpointRounding.AwayFromZero)
                : variantes.Average(v => v.Costo ?? 0m);
            var variantesPrecio = activas.Count > 0 ? activas : variantes;
            producto.Precio = variantesPrecio.Min(v => v.Precio ?? producto.Precio);
            producto.ColorId = variantes.Count == 1 ? variantes[0].ColorId : null;
        }''')

          for path in [
              'backend/src/Application/Services/CompraService.cs',
              'backend/src/Application/Services/VentaService.cs'
          ]:
              replace_if_present(
                  path,
                  'else if (producto.Variantes.Any(v => v.Activo && !v.Eliminado))',
                  'else if (producto.Variantes.Any(v => !v.Eliminado))')

          replace_if_present(
              'backend/tests/InventoryApp.Tests/ProductoVarianteServiceTests.cs',
              '        Assert.Equal(2, _producto.Cantidad);\n        Assert.Equal(230, _producto.Precio);',
              '        Assert.Equal(5, _producto.Cantidad);\n        Assert.Equal(98, _producto.Costo);\n        Assert.Equal(230, _producto.Precio);')

          for path in [
              'frontend/src/app/features/ventas/venta-form.component.ts',
              'frontend/src/app/features/compras/compra-form.component.ts'
          ]:
              replace_if_present(
                  path,
                  '''  variantesDisponibles(group: AbstractControl): ProductoVariante[] {
    return (this.productoSeleccionado(group)?.variantes ?? []).filter((v) => v.activo);
  }''',
                  '''  tieneVariantesActivas(producto: Producto): boolean {
    return (producto.variantes ?? []).some((variante) => variante.activo);
  }

  variantesDisponibles(group: AbstractControl): ProductoVariante[] {
    return (this.productoSeleccionado(group)?.variantes ?? []).filter((v) => v.activo);
  }''')

          replace_if_present(
              'frontend/src/app/features/ventas/venta-form.component.html',
              '[disabled]="p.estaAgotado || p.cantidad === 0"',
              '[disabled]="p.estaAgotado || p.cantidad === 0 || (p.usaVariantes && !tieneVariantesActivas(p))"')

          replace_if_present(
              'frontend/src/app/features/compras/compra-form.component.html',
              '<mat-option [value]="p.id">{{ p.nombre }} — {{ p.marca }} {{ p.modelo }} · stock {{ p.cantidad }}</mat-option>',
              '<mat-option [value]="p.id" [disabled]="p.usaVariantes && !tieneVariantesActivas(p)">{{ p.nombre }} — {{ p.marca }} {{ p.modelo }} · stock {{ p.cantidad }}</mat-option>')
          PY

      - name: Publicar solo si hubo cambios
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/src backend/tests frontend/src; then
            echo 'El endurecimiento ya estaba aplicado.'
            exit 0
          fi
          git config user.name 'VariApp Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/src backend/tests frontend/src
          git commit -m 'fix: preservar stock físico y exigir variantes activas'
          git push origin HEAD:Desarrollo

  hygiene:
    name: Higiene del repositorio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bloquear temporales versionados
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '(^|/)(node_modules|bin|obj|dist|\.angular|TestResults|playwright-report|test-results|coverage|tmp|temp)(/|$)|\.(log|tmp|temp|bak|swp|swo)$' || true)"
          if [ -n "$forbidden" ]; then
            echo "Se detectaron archivos o carpetas temporales versionados:" >&2
            echo "$forbidden" >&2
            exit 1
          fi
          echo "No hay temporales conocidos versionados."

      - name: Validar espacios y conflictos pendientes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD~1 HEAD || git diff --check
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.md'; then
            echo "Se detectaron marcadores de conflicto sin resolver." >&2
            exit 1
          fi

  backend:
    name: Backend Release y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Restaurar
        run: dotnet restore InventoryApp.sln

      - name: Compilar Release
        run: dotnet build InventoryApp.sln --configuration Release --no-restore

      - name: Ejecutar pruebas
        run: dotnet test InventoryApp.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desarrollo-backend-tests
          path: backend/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7

  migrations:
    name: Migraciones EF, variantes y datos legados en MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inventoryapp_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=inventoryapp_ci;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;
      Database__ServerVersion: 8.4.0
      Database__ApplyMigrationsOnStartup: "false"
      Jwt__Secret: Migration-CI-Only-Secret-With-More-Than-32-Characters-2026
      Jwt__Issuer: VariApp.CI
      Jwt__Audience: VariApp.CI.Frontend
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar
        run: dotnet restore InventoryApp.sln

      - name: Instalar EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.8

      - name: Aplicar historial base
        run: |
          dotnet ef database update 20260722142118_Fase6SeguridadFacturacionPerfil \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext

      - name: Insertar producto legado de prueba
        working-directory: .
        run: |
          set -euo pipefail
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot inventoryapp_ci -e "
            INSERT INTO Productos
              (Nombre, Marca, Modelo, Cantidad, Costo, Precio, UmbralStockBajo,
               Activo, Eliminado, FechaCreacion, FechaActualizacion)
            VALUES
              ('Teléfono legado CI', 'Samsung', 'S24', 3, 100.00, 150.00, 1,
               1, 0, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6));"

      - name: Aplicar hasta Fase 3
        run: |
          dotnet ef database update 20260728152434_Fase3CostoEnvioEnVentas \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext

      - name: Preparar color legado y verificar catálogos
        working-directory: .
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          docker exec "$mysql_container" mysql -uroot -proot inventoryapp_ci -e "
            INSERT INTO CatalogosProducto
              (Tipo, Nombre, Descripcion, CodigoVisual, Orden, Activo, Eliminado,
               FechaCreacion, FechaActualizacion)
            VALUES
              ('Color', 'Negro legado CI', 'Color para conversión de variante CI', '#111827', 1, 1, 0,
               UTC_TIMESTAMP(6), UTC_TIMESTAMP(6));
            SET @color_id = LAST_INSERT_ID();
            UPDATE Productos SET ColorId = @color_id WHERE Nombre = 'Teléfono legado CI';"
          marcas="$(docker exec "$mysql_container" mysql -uroot -proot inventoryapp_ci -Nse "SELECT COUNT(*) FROM CatalogosProducto WHERE Tipo='Marca' AND Nombre='Samsung';")"
          modelos="$(docker exec "$mysql_container" mysql -uroot -proot inventoryapp_ci -Nse "SELECT COUNT(*) FROM CatalogosProducto WHERE Tipo='Modelo' AND Nombre='S24';")"
          relacion="$(docker exec "$mysql_container" mysql -uroot -proot inventoryapp_ci -Nse "SELECT CONCAT(IFNULL(MarcaId,0), ':', IFNULL(ModeloId,0), ':', IFNULL(ColorId,0)) FROM Productos WHERE Nombre='Teléfono legado CI';")"
          test "$marcas" = "1"
          test "$modelos" = "1"
          test "${relacion%%:*}" -gt 0
          resto="${relacion#*:}"
          test "${resto%%:*}" -gt 0
          test "${resto##*:}" -gt 0

      - name: Aplicar migración de variantes
        run: |
          dotnet ef database update \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext

      - name: Verificar conversión de inventario legado
        working-directory: .
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          resultado="$(docker exec "$mysql_container" mysql -uroot -proot inventoryapp_ci -Nse "
            SELECT CONCAT(pv.Sku, ':', pv.Cantidad, ':', FORMAT(pv.Costo, 2), ':', FORMAT(pv.Precio, 2), ':', pv.ColorId, ':', p.ColorId)
            FROM ProductoVariantes pv
            INNER JOIN Productos p ON p.Id = pv.ProductoId
            WHERE p.Nombre='Teléfono legado CI' AND pv.Eliminado=0;")"
          producto_id="$(docker exec "$mysql_container" mysql -uroot -proot inventoryapp_ci -Nse "SELECT Id FROM Productos WHERE Nombre='Teléfono legado CI';")"
          sku_esperado="LEGACY-$(printf '%08d' "$producto_id")"
          test "${resultado%%:*}" = "$sku_esperado"
          resto="${resultado#*:}"
          test "${resto%%:*}" = "3"
          resto="${resto#*:}"
          test "${resto%%:*}" = "100.00"
          resto="${resto#*:}"
          test "${resto%%:*}" = "150.00"
          resto="${resto#*:}"
          test "${resto%%:*}" = "${resto##*:}"
          docker exec "$mysql_container" mysql -uroot -proot inventoryapp_ci -e "SELECT MigrationId FROM __EFMigrationsHistory ORDER BY MigrationId;"

      - name: Verificar modelo y snapshot alineados
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext

      - name: Generar SQL forward revisable de Fase 4
        run: |
          set -euo pipefail
          dotnet ef migrations script \
            20260728152434_Fase3CostoEnvioEnVentas \
            20260728165321_Fase4VariantesInventario \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext \
            --output fase4-variantes-forward.sql
          test -s fase4-variantes-forward.sql
          if grep -Ein '(^|[[:space:];])(DROP[[:space:]]+TABLE|TRUNCATE)[[:space:]]|DELETE[[:space:]]+FROM' fase4-variantes-forward.sql; then
            echo 'El SQL forward contiene una operación destructiva de datos.' >&2
            exit 1
          fi
          grep -q 'ProductoVarianteId' fase4-variantes-forward.sql
          grep -q 'LEGACY-' fase4-variantes-forward.sql

      - name: Publicar SQL de evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desarrollo-fase4-variantes-migration-sql
          path: backend/fase4-variantes-forward.sql
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend producción
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Validar tipado y calidad estática
        run: npm run lint

      - name: Compilar producción
        run: npm run build:prod

  deployment-config:
    name: Docker y aislamiento de entornos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar archivos de configuración
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.safe_load(File.read('render.yaml'), permitted_classes: [], aliases: true)"
          node -e "JSON.parse(require('fs').readFileSync('frontend/vercel.json', 'utf8'))"
          grep -q 'branch: Desarrollo' render.yaml
          grep -q 'name: variapp-api-desarrollo' render.yaml
          grep -A1 'Database__ApplyMigrationsOnStartup' render.yaml | grep -q '"false"'
          grep -A1 'Cloudinary__EnvironmentPrefix' render.yaml | grep -q 'varistorehn_desarrollo'
          grep -q 'https://variapp-desarrollo.vercel.app' render.yaml
          grep -q 'variapp-api.onrender.com' frontend/vercel.json
          grep -q 'variapp-api-desarrollo.onrender.com' frontend/vercel.json
          if grep -RIn -E 'Cloudinary__EnvironmentPrefix=desarrollo|value:[[:space:]]*desarrollo$' render.yaml docs backend/tests; then
            echo 'Se encontró el identificador genérico antiguo de Desarrollo.' >&2
            exit 1
          fi

      - name: Construir imagen Docker de la API
        run: docker build --file backend/Dockerfile --tag variapp-api:desarrollo-ci .
