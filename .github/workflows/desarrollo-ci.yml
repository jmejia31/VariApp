name: Desarrollo - Compilación y pruebas

on:
  push:
    branches:
      - Desarrollo
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desarrollo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Higiene del repositorio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bloquear temporales versionados
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '(^|/)(node_modules|bin|obj|dist|\.angular|TestResults|playwright-report|test-results|coverage|tmp|temp)(/|$)|\.(log|tmp|temp|bak|swp|swo)$' || true)"
          if [ -n "$forbidden" ]; then
            echo "Se detectaron archivos o carpetas temporales versionados:" >&2
            echo "$forbidden" >&2
            exit 1
          fi
          echo "No hay temporales conocidos versionados."

      - name: Validar espacios y conflictos pendientes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD~1 HEAD || git diff --check
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.md'; then
            echo "Se detectaron marcadores de conflicto sin resolver." >&2
            exit 1
          fi

  backend:
    name: Backend Release y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout rama de trabajo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Restaurar
        run: dotnet restore InventoryApp.sln

      - name: Generar migración y snapshot de catálogos
        if: github.event_name == 'push' && github.ref_name == 'Desarrollo'
        env:
          ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=inventoryapp_design;User=root;Password=design-only;
          Database__ServerVersion: 8.4.3
          Jwt__Secret: Design-Time-Only-Secret-With-More-Than-32-Characters
        run: |
          set -euo pipefail
          if find src/Infrastructure/Migrations -maxdepth 1 -name '*_CatalogosProductoYCategoriaSoftDelete.cs' ! -name '*.Designer.cs' | grep -q .; then
            echo 'La migración y el snapshot ya existen.'
          else
            dotnet tool install --global dotnet-ef --version 8.0.2
            dotnet ef migrations add CatalogosProductoYCategoriaSoftDelete \
              --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
              --startup-project src/API/InventoryApp.API.csproj \
              --context AppDbContext \
              --output-dir Migrations
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/Infrastructure/Migrations
            git commit -m 'feat(database): generar migración de catálogos y snapshot [GitHub Actions]'
            git pull --rebase origin Desarrollo
            git push origin HEAD:Desarrollo
          fi

      - name: Compilar Release
        run: dotnet build InventoryApp.sln --configuration Release --no-restore

      - name: Ejecutar pruebas
        run: dotnet test InventoryApp.sln --configuration Release --no-build --logger "trx;LogFileName=tests.trx"

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desarrollo-backend-tests
          path: backend/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend producción
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Compilar producción
        run: npm run build:prod

  deployment-config:
    name: Docker y aislamiento de entornos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar archivos de configuración
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.safe_load(File.read('render.yaml'), permitted_classes: [], aliases: true)"
          node -e "JSON.parse(require('fs').readFileSync('frontend/vercel.json', 'utf8'))"
          grep -q 'branch: Desarrollo' render.yaml
          grep -q 'name: variapp-api-desarrollo' render.yaml
          grep -A1 'Database__ApplyMigrationsOnStartup' render.yaml | grep -q '"false"'
          grep -q 'variapp-api.onrender.com' frontend/vercel.json
          grep -q 'variapp-api-desarrollo.onrender.com' frontend/vercel.json

      - name: Construir imagen Docker de la API
        run: docker build --file backend/Dockerfile --tag variapp-api:desarrollo-ci .
