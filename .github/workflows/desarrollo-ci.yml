name: Desarrollo - Compilación y pruebas

on:
  push:
    branches: [Desarrollo]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desarrollo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Higiene del repositorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bloquear temporales y conflictos
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '(^|/)(node_modules|bin|obj|dist|\.angular|TestResults|playwright-report|test-results|coverage|tmp|temp)(/|$)|\.(log|tmp|temp|bak|swp|swo)$' || true)"
          test -z "$forbidden" || { echo "$forbidden" >&2; exit 1; }
          git diff --check HEAD~1 HEAD || git diff --check
          ! git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.md'

  backend:
    name: Backend Release y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: backend/**/*.csproj
      - run: dotnet restore InventoryApp.sln
      - run: dotnet build InventoryApp.sln --configuration Release --no-restore
      - run: dotnet test InventoryApp.sln --configuration Release --no-build --filter "Category!=Integration" --logger "trx;LogFileName=tests.trx"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desarrollo-backend-tests
          path: backend/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend producción
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build:prod

  migrations:
    name: Migraciones EF, variantes y cargas masivas en MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inventoryapp_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=inventoryapp_ci;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;
      Database__ServerVersion: 8.4.0
      Database__ApplyMigrationsOnStartup: 'false'
      Jwt__Secret: Migration-CI-Only-Secret-With-More-Than-32-Characters-2026
      Jwt__Issuer: VariApp.CI
      Jwt__Audience: VariApp.CI.Frontend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore InventoryApp.sln
      - run: dotnet tool install --global dotnet-ef --version 8.0.8
      - name: Aplicar historial base
        run: |
          dotnet ef database update 20260722142118_Fase6SeguridadFacturacionPerfil \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext
      - name: Insertar producto legado
        working-directory: .
        run: |
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot inventoryapp_ci -e "
            INSERT INTO Productos
              (Nombre, Marca, Modelo, Cantidad, Costo, Precio, UmbralStockBajo, Activo, Eliminado, FechaCreacion, FechaActualizacion)
            VALUES
              ('Teléfono legado CI', 'Samsung', 'S24', 3, 100.00, 150.00, 1, 1, 0, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6));"
      - name: Aplicar hasta Fase 3
        run: |
          dotnet ef database update 20260728152434_Fase3CostoEnvioEnVentas \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext
      - name: Preparar color legado
        working-directory: .
        run: |
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot inventoryapp_ci -e "
            INSERT INTO CatalogosProducto
              (Tipo, Nombre, Descripcion, CodigoVisual, Orden, Activo, Eliminado, FechaCreacion, FechaActualizacion)
            VALUES
              ('Color', 'Negro legado CI', 'Conversión CI', '#111827', 1, 1, 0, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6));
            SET @color_id = LAST_INSERT_ID();
            UPDATE Productos SET ColorId = @color_id WHERE Nombre = 'Teléfono legado CI';"
      - name: Aplicar hasta AddTipoCliente
        run: |
          dotnet ef database update 20260803121112_AddTipoCliente \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext
      - name: Validar Preflight fail-closed y escenarios (0, 1 y 2 predeterminados)
        working-directory: .
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"

          ejecutar_preflight() {
            local cantidad
            cantidad="$(
              docker exec -i "$mysql_container" \
                mysql -uroot -proot inventoryapp_ci \
                --batch --skip-column-names \
                < backend/scripts/preflight-tipo-cliente-predeterminado.sql
            )"

            if ! [[ "$cantidad" =~ ^[0-9]+$ ]]; then
              echo "El preflight no devolvió un número válido." >&2
              return 1
            fi

            if [ "$cantidad" -gt 1 ]; then
              echo "Existen $cantidad tipos predeterminados activos." >&2
              return 1
            fi
            echo "Preflight OK: $cantidad predeterminados activos."
            return 0
          }

          trap 'docker exec "$mysql_container" mysql -uroot -proot inventoryapp_ci -e "DELETE FROM TipoClientes WHERE Codigo = '\''TEST_DUP'\'';"' EXIT

          # Escenario 0 predeterminados
          docker exec "$mysql_container" mysql -uroot -proot inventoryapp_ci -e "
            UPDATE TipoClientes SET EsPredeterminado = 0 WHERE EsPredeterminado = 1;"
          ejecutar_preflight

          # Escenario 1 predeterminado
          docker exec "$mysql_container" mysql -uroot -proot inventoryapp_ci -e "
            UPDATE TipoClientes SET EsPredeterminado = 1 WHERE Codigo = 'SIN_CLASIFICAR';"
          ejecutar_preflight

          # Escenario 2 predeterminados (debe fallar la ejecución del preflight)
          docker exec "$mysql_container" mysql -uroot -proot inventoryapp_ci -e "
            INSERT INTO TipoClientes (Codigo, Nombre, NombreNormalizado, EsSistema, EsPredeterminado, Activo, Eliminado, ColorHex, Orden, FechaCreacion, FechaActualizacion)
            VALUES ('TEST_DUP', 'Test Duplicado', 'TEST DUPLICADO', 0, 1, 1, 0, '#FF0000', 99, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6));"

          if ejecutar_preflight; then
            echo "El escenario duplicado debió ser rechazado por el preflight real." >&2
            exit 1
          else
            echo "Escenario 2 predeterminados: Rechazo verificado correctamente mediante el preflight real."
          fi

          # Limpieza explícita del duplicado antes del despegue de la migración
          docker exec "$mysql_container" mysql -uroot -proot inventoryapp_ci -e "
            DELETE FROM TipoClientes WHERE Codigo = 'TEST_DUP';"
          
          # Confirmación final de preflight antes de migración única
          ejecutar_preflight
      - name: Aplicar migraciones actuales
        run: |
          dotnet ef database update \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext
      - name: Ejecutar pruebas de integración MySQL
        run: |
          dotnet test InventoryApp.sln --configuration Release --filter "Category=Integration"
      - name: Verificar variante legado, cargas y snapshot
        working-directory: .
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          count="$(docker exec "$mysql_container" mysql -uroot -proot inventoryapp_ci -Nse "
            SELECT COUNT(*) FROM ProductoVariantes pv
            JOIN Productos p ON p.Id=pv.ProductoId
            WHERE p.Nombre='Teléfono legado CI' AND pv.Cantidad=3 AND pv.Costo=100 AND pv.Precio=150;")"
          test "$count" = '1'
          tables="$(docker exec "$mysql_container" mysql -uroot -proot inventoryapp_ci -Nse "
            SELECT COUNT(*) FROM information_schema.tables
            WHERE table_schema='inventoryapp_ci' AND table_name IN ('CargasMasivas','CargaMasivaErrores');")"
          test "$tables" = '2'
          unique_index="$(docker exec "$mysql_container" mysql -uroot -proot inventoryapp_ci -Nse "
            SELECT COUNT(*) FROM information_schema.statistics
            WHERE table_schema='inventoryapp_ci'
              AND table_name='CargasMasivas'
              AND index_name='IX_CargasMasivas_Tipo_HashArchivo'
              AND non_unique=0;")"
          test "$unique_index" = '2'
          cd backend
          dotnet ef migrations has-pending-model-changes \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext
      - name: Generar SQL forward de Fase 5
        run: |
          dotnet ef migrations script 20260728165321_Fase4VariantesInventario 20260729040900_Fase5CargasMasivas \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext \
            --output fase5-cargas-masivas-forward.sql
          test -s fase5-cargas-masivas-forward.sql
          ! grep -Ein '(^|[[:space:];])(DROP[[:space:]]+TABLE|TRUNCATE)[[:space:]]|DELETE[[:space:]]+FROM' fase5-cargas-masivas-forward.sql
          grep -q 'CargasMasivas' fase5-cargas-masivas-forward.sql
          grep -q 'CargaMasivaErrores' fase5-cargas-masivas-forward.sql
          grep -q 'IX_CargasMasivas_Tipo_HashArchivo' fase5-cargas-masivas-forward.sql
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desarrollo-fase5-cargas-masivas-migration-sql
          path: backend/fase5-cargas-masivas-forward.sql
          if-no-files-found: warn
          retention-days: 14

  deployment-config:
    name: Docker y aislamiento de entornos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuración
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.safe_load(File.read('render.yaml'), permitted_classes: [], aliases: true)"
          node -e "JSON.parse(require('fs').readFileSync('frontend/vercel.json', 'utf8'))"
          grep -q 'branch: Desarrollo' render.yaml
          grep -q 'name: variapp-api-desarrollo' render.yaml
          grep -q 'healthCheckPath: /health/ready' render.yaml
          grep -A1 'Database__ApplyMigrationsOnStartup' render.yaml | grep -q '"true"'
          grep -A1 'Cloudinary__EnvironmentPrefix' render.yaml | grep -q 'varistorehn_desarrollo'
      - run: docker build --file backend/Dockerfile --tag variapp-api:desarrollo-ci .
