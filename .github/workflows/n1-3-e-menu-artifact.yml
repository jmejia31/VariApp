name: ERP-N1.3 - Preparar menú Ubicaciones

on:
  push:
    branches:
      - Desarrollo
    paths:
      - '.github/workflows/n1-3-e-menu-artifact.yml'

permissions:
  contents: read

jobs:
  preparar-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar app.component.ts con menú RBAC
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('frontend/src/app/app.component.ts')
          text = source.read_text(encoding='utf-8-sig')
          block = '''            @if (permisosRuntime.puede('UbicacionesAlmacen', 'Ver')) {
              <a routerLink="/ubicaciones-almacen" routerLinkActive="active" ariaCurrentWhenActive="page"><mat-icon>account_tree</mat-icon> Ubicaciones</a>
            }
'''
          if block not in text:
              anchor = '''            @if (permisosRuntime.puede('Almacenes', 'Ver')) {
              <a routerLink="/almacenes" routerLinkActive="active" ariaCurrentWhenActive="page"><mat-icon>warehouse</mat-icon> Almacenes</a>
            }
'''
              if anchor not in text:
                  raise SystemExit('No se encontró bloque de menú Almacenes')
              text = text.replace(anchor, anchor + block, 1)
          out = Path('/tmp/n13-menu')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'app.component.ts').write_text(text, encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: n1-3-e-menu-rbac
          path: /tmp/n13-menu/app.component.ts
          if-no-files-found: error
          retention-days: 1
