name: N8.20.F - Aiven DEV Capabilities Read-only Proof

on:
  workflow_dispatch:
    inputs:
      aiven_project:
        description: Exact Aiven project containing the DEV MySQL service
        required: true
        type: string
      aiven_service:
        description: Exact Aiven DEV MySQL service name
        required: true
        type: string
      persist_evidence:
        description: Persist sanitized evidence back to Desarrollo
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  EVIDENCE_ROOT: docs/evidencias/database-provider/n8-20-f/github-actions

jobs:
  prove-aiven-dev-capabilities:
    name: Prove Aiven DEV plan/backups/PITR/restore without secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Desarrollo head
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 1

      - name: Guard inputs and secrets
        shell: bash
        env:
          SOLQARYN_AIVEN_TOKEN: ${{ secrets.SOLQARYN_AIVEN_TOKEN }}
          DEV_DB: ${{ secrets.SOLQARYN_DESARROLLO_DB_CONNECTION }}
          PROJECT: ${{ inputs.aiven_project }}
          SERVICE: ${{ inputs.aiven_service }}
        run: |
          set -euo pipefail
          test -n "$SOLQARYN_AIVEN_TOKEN" || { echo 'SOLQARYN_AIVEN_TOKEN secret is missing'; exit 20; }
          test -n "$DEV_DB" || { echo 'SOLQARYN_DESARROLLO_DB_CONNECTION secret is missing'; exit 21; }
          test -n "$PROJECT" || { echo 'aiven_project input is missing'; exit 22; }
          test -n "$SERVICE" || { echo 'aiven_service input is missing'; exit 23; }
          echo 'Required values are present; secret values are not printed.'

      - name: Install official Aiven CLI
        shell: bash
        run: python3 -m pip install --quiet aiven-client

      - name: Capture and certify actual Aiven DEV control-plane metadata
        shell: bash
        env:
          SOLQARYN_AIVEN_TOKEN: ${{ secrets.SOLQARYN_AIVEN_TOKEN }}
          DEV_DB: ${{ secrets.SOLQARYN_DESARROLLO_DB_CONNECTION }}
          PROJECT: ${{ inputs.aiven_project }}
          SERVICE: ${{ inputs.aiven_service }}
        run: |
          set -euo pipefail
          RUN_DIR="$EVIDENCE_ROOT/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$RUN_DIR"
          export RUN_DIR

          avn --auth-token "$SOLQARYN_AIVEN_TOKEN" user info --json > /tmp/aiven-user.json

          python3 - <<'PY'
          import hashlib, json, os, re, urllib.request, urllib.error
          from urllib.parse import quote
          from datetime import datetime, timezone

          token=os.environ['SOLQARYN_AIVEN_TOKEN']
          conn=os.environ['DEV_DB']
          project=os.environ['PROJECT']
          service=os.environ['SERVICE']
          root='https://api.aiven.io/v1'

          def parse_conn(s):
              out={}
              for part in s.split(';'):
                  if '=' in part:
                      k,v=part.split('=',1); out[k.strip().lower()]=v.strip()
              return out

          def get(path):
              req=urllib.request.Request(root+path, headers={
                  'Authorization': f'aivenv1 {token}',
                  'Accept':'application/json',
                  'User-Agent':'Solqaryn-N8.20.F-proof/5.0'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  raise SystemExit(f'Aiven API HTTP {e.code} for {path}')

          cs=parse_conn(conn)
          dev_host=cs.get('server') or cs.get('host') or cs.get('data source')
          if not dev_host:
              raise SystemExit('Could not parse DEV DB host from SOLQARYN_DESARROLLO_DB_CONNECTION')
          dev_host_hash=hashlib.sha256(dev_host.lower().encode()).hexdigest()

          svc_payload=get(f'/project/{quote(project, safe="")}/service/{quote(service, safe="")}')
          svc=svc_payload.get('service', svc_payload)
          if svc.get('service_type') != 'mysql':
              raise SystemExit('Selected Aiven service is not MySQL')

          candidates=[]
          def walk_hosts(v):
              if isinstance(v, dict):
                  for x in v.values(): walk_hosts(x)
              elif isinstance(v, list):
                  for x in v: walk_hosts(x)
              elif isinstance(v, str):
                  for h in re.findall(r'([A-Za-z0-9._-]+\.aivencloud\.com)', v):
                      candidates.append(h.lower())
          walk_hosts(svc)
          if not any(hashlib.sha256(h.encode()).hexdigest()==dev_host_hash for h in candidates):
              raise SystemExit('Selected Aiven service does not match the DEV DB endpoint hash; refusing to inspect another service')

          plan=svc.get('plan') or svc.get('service_plan')
          stype=svc.get('service_type')
          cloud=svc.get('cloud_name')
          state=svc.get('state')
          if not plan:
              raise SystemExit('Aiven API did not return the actual service plan')

          plan_payload=get(f'/project/{quote(project, safe="")}/service-types/{quote(stype, safe="")}/plans/{quote(plan, safe="")}')
          plan_obj=plan_payload.get('service_plan') if isinstance(plan_payload.get('service_plan'), dict) else plan_payload
          backup_config=plan_obj.get('backup_config') or {}
          price_usd=plan_obj.get('base_price_usd') or plan_payload.get('base_price_usd')

          backups_payload=get(f'/project/{quote(project, safe="")}/service/{quote(service, safe="")}/backups')
          backup_endpoint_proven=True
          backup_list=backups_payload.get('backups', [])

          with open('/tmp/aiven-user.json') as f:
              ui=json.load(f)
          if isinstance(ui, list) and ui:
              ui=ui[0]
          current_user_id=(ui.get('user_id') or ui.get('id') or ui.get('user')) if isinstance(ui, dict) else None
          if not current_user_id:
              raise SystemExit('Could not resolve current Aiven token user id')

          orgs_payload=get('/organizations')
          orgs=orgs_payload.get('organizations', [])
          matches=[]
          for org in orgs:
              oid=org.get('organization_id')
              if not oid:
                  continue
              projects_payload=get(f'/organization/{quote(oid, safe="")}/projects')
              for p in projects_payload.get('projects', []):
                  if str(p.get('project_id')) == str(project):
                      matches.append((oid, p.get('project_id')))
          if len(matches) != 1:
              raise SystemExit(f'Expected one exact Aiven organization project match, found {len(matches)}')
          org_id,project_id=matches[0]

          # Read current direct assignments on the exact project.
          perm_payload=get(f'/organization/{quote(org_id, safe="")}/permissions/project/{quote(project_id, safe="")}')
          assignments=perm_payload.get('permissions', []) if isinstance(perm_payload, dict) else perm_payload
          if not isinstance(assignments, list):
              assignments=[]
          direct_permissions=[]
          matching_principal_records=0
          for item in assignments:
              if not isinstance(item, dict):
                  continue
              principal_id=item.get('principal_id') or item.get('user_id') or item.get('member_user_id')
              if str(principal_id) != str(current_user_id):
                  continue
              matching_principal_records += 1
              vals=item.get('permissions') or item.get('permission') or item.get('roles') or item.get('role') or []
              if isinstance(vals, str):
                  vals=[vals]
              if isinstance(vals, list):
                  direct_permissions.extend(str(x) for x in vals)

          # Aiven documents roles/permissions as cumulative and the legacy GET /project
          # endpoint remains available until 2027-01-31. Its project_memberships map is
          # caller-specific and therefore provides an effective project-level readback even
          # when access is inherited through an organization/unit/group rather than assigned
          # directly to the user on the project permission resource.
          legacy_projects=get('/project')
          project_memberships=[]
          pm=legacy_projects.get('project_memberships', {}) if isinstance(legacy_projects, dict) else {}
          if isinstance(pm, dict):
              vals=pm.get(project) or []
              if isinstance(vals, str): vals=[vals]
              if isinstance(vals, list): project_memberships.extend(str(x) for x in vals)
          pms=legacy_projects.get('project_membership', {}) if isinstance(legacy_projects, dict) else {}
          if isinstance(pms, dict):
              val=pms.get(project)
              if isinstance(val, str): project_memberships.append(val)

          effective=sorted(set(direct_permissions + project_memberships))
          # Official Aiven roles documentation states that developer and recover roles can
          # create a service fork; admin/operator/manager or project service write also imply
          # sufficient service-control authority. No write action is attempted here.
          restore_roles={
              'admin','operator','developer','role:project:admin','role:project:manager',
              'role:services:recover','project:services:write'
          }
          restore_authorized=any(x in restore_roles for x in effective)

          user_config=svc.get('user_config') or {}
          recovery_mode=backup_config.get('recovery_mode')
          retention_fields={k:backup_config.get(k) for k in (
              'frequent_interval_minutes','frequent_oldest_age_minutes',
              'infrequent_interval_minutes','infrequent_oldest_age_minutes',
              'interval','max_count') if k in backup_config}
          retention_proven=bool(retention_fields)

          latest=max(backup_list, key=lambda b:b.get('backup_time','')) if backup_list else None
          pitr_available = recovery_mode not in (None, '', 'basic')
          restore_path_proven = bool(recovery_mode) and backup_endpoint_proven
          cost_constraint_proven = bool(plan)

          pass_ok=all([
              bool(plan), bool(backup_config), backup_endpoint_proven,
              recovery_mode is not None, retention_proven,
              restore_path_proven, restore_authorized, cost_constraint_proven
          ])

          evidence={
            'schema':'solqaryn.aiven-capabilities-proof.v5',
            'authority':'docs/VAEP_AUTHORITY.md',
            'task':'N8.20.F',
            'status':'PASS_AIVEN_CAPABILITIES_IDENTIFIED' if pass_ok else 'NOT_CERTIFIED',
            'capturedAtUtc':datetime.now(timezone.utc).isoformat(),
            'branch':'Desarrollo',
            'functionalHead':os.environ.get('GITHUB_SHA'),
            'githubActions':{'runId':os.environ.get('GITHUB_RUN_ID'),'attempt':os.environ.get('GITHUB_RUN_ATTEMPT')},
            'service':{
              'provider':'AIVEN','serviceType':stype,'servicePlan':plan,
              'cloudName':cloud,'state':state,
              'projectName':project,'serviceName':service,
              'devDbHostSha256':dev_host_hash
            },
            'backupPolicy':{
              'recoveryMode':recovery_mode,
              'pointInTimeRecoveryAvailable':pitr_available,
              'retention':retention_fields,
              'backupHour':user_config.get('backup_hour'),
              'backupMinute':user_config.get('backup_minute')
            },
            'actualBackups':{
              'endpointReadbackProven':backup_endpoint_proven,
              'countObserved':len(backup_list),
              'latestBackupTime':latest.get('backup_time') if latest else None,
              'latestBackupStorageLocation':latest.get('storage_location') if latest else None,
              'latestBackupSizeBytes':latest.get('data_size') if latest else None
            },
            'restoreCapability':{
              'providerManagedBackupEndpointProven':backup_endpoint_proven,
              'recoveryMode':recovery_mode,
              'restorePath':'AIVEN_FORK_AND_RESTORE_CONTROL_PLANE',
              'permissionReadbackProven':True,
              'matchingDirectPrincipalRecords':matching_principal_records,
              'directPermissionNames':sorted(set(direct_permissions)),
              'effectiveProjectMembershipNames':sorted(set(project_memberships)),
              'effectiveRestoreAuthorityNames':effective,
              'restoreAuthorizationProven':restore_authorized,
              'restorePermissionReference':'https://aiven.io/docs/platform/concepts/permissions',
              'restoreExecutionPerformed':False
            },
            'cost':{
              'actualPlanTierProven':True,
              'currentPlanIsFreeTier':str(plan).startswith('free-'),
              'basePriceUsdObserved':price_usd,
              'potentialImpact':'A restore/fork creates or changes provider-managed service capacity and can have provider pricing impact; no fork/restore/plan change was executed in this proof.',
              'paidActionExecuted':False,
              'planChanged':False,
              'restoreExecuted':False,
              'constraint':'READ_ONLY_PROOF_ONLY__NO_PURCHASE__NO_UPGRADE__NO_RESTORE_EXECUTION'
            },
            'guardrails':{
              'readOnlyApiCallsOnly':True,
              'connectionStringPersisted':False,
              'aivenTokenPersisted':False,
              'databasePasswordPersisted':False,
              'fullDbHostPersisted':False,
              'productionTouched':False,
              'mainTouched':False,
              'secretsExposed':0
            },
            'acceptance':{
              'actualPlanTierProven':bool(plan),
              'actualBackupStateProven':backup_endpoint_proven,
              'actualPitrStateProven':recovery_mode is not None,
              'actualRetentionPolicyProven':retention_proven,
              'actualRestoreCapabilityProven':restore_path_proven,
              'actualRestoreAuthorizationProven':restore_authorized,
              'costImpactConstraintProven':cost_constraint_proven,
              'p0':0 if pass_ok else 1,
              'p1':0
            }
          }

          out=os.path.join(os.environ['RUN_DIR'],'N8.20.F_AIVEN_CAPABILITIES_EVIDENCE.json')
          with open(out,'w') as f: json.dump(evidence,f,indent=2)
          md=f'''# N8.20.F — Aiven DEV capabilities proof\n\n- Estado: `{evidence['status']}`\n- Provider: `AIVEN`\n- Service type: `{stype}`\n- Plan/tier actual: `{plan}`\n- Cloud: `{cloud}`\n- State: `{state}`\n- Backups endpoint readback: `{backup_endpoint_proven}`\n- Backups observados: `{len(backup_list)}`\n- Último backup UTC: `{evidence['actualBackups']['latestBackupTime']}`\n- Recovery mode: `{recovery_mode}`\n- PITR disponible según recovery mode: `{pitr_available}`\n- Retention policy readback: `{retention_proven}`\n- Direct principal records: `{matching_principal_records}`\n- Effective project memberships: `{sorted(set(project_memberships))}`\n- Restore authorization proven: `{restore_authorized}`\n- Base price USD observed: `{price_usd}`\n- Restore ejecutado: `false`\n- Plan cambiado/comprado: `false`\n- Production touched: `false`\n- Secrets exposed: `0`\n\n## Dictamen\n\n`{'N8.20.F tiene evidencia técnica suficiente para REVIEW_FIRST y cierre LISTO_REAL.' if pass_ok else 'N8.20.F NO puede cerrarse todavía; revisar los campos acceptance=false del JSON.'}`\n'''
          with open(os.path.join(os.environ['RUN_DIR'],'README.md'),'w') as f: f.write(md)
          print(json.dumps({'task':'N8.20.F','pass':pass_ok,'plan':plan,'backupCount':len(backup_list),'recoveryMode':recovery_mode,'restoreAuthorized':restore_authorized,'effectiveMemberships':sorted(set(project_memberships)),'principalRecords':matching_principal_records,'evidenceDir':os.environ['RUN_DIR']}))
          if not pass_ok:
              raise SystemExit(30)
          PY

      - name: Publish sanitized job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="$EVIDENCE_ROOT/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -f "$RUN_DIR/README.md" ]; then cat "$RUN_DIR/README.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload sanitized evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n8-20-f-aiven-capabilities-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn

      - name: Persist sanitized evidence to Desarrollo
        if: ${{ success() && inputs.persist_evidence }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EVIDENCE_ROOT/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git diff --cached --check
          git commit -m 'evidence(n8.20.f): certify Aiven DEV capabilities read-only' || exit 0
          git push origin HEAD:Desarrollo
