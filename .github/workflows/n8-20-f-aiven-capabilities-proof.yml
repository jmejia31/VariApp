name: N8.20.F - Aiven DEV Capabilities Read-only Proof

on:
  workflow_dispatch:
    inputs:
      aiven_project:
        description: Exact Aiven project containing the DEV MySQL service
        required: true
        type: string
      aiven_service:
        description: Exact Aiven DEV MySQL service name
        required: true
        type: string
      persist_evidence:
        description: Persist sanitized evidence back to Desarrollo
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  EVIDENCE_ROOT: docs/evidencias/database-provider/n8-20-f/github-actions

jobs:
  prove-aiven-dev-capabilities:
    name: Prove Aiven DEV plan/backups/PITR/restore without secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Desarrollo head
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 1

      - name: Guard inputs and secrets
        shell: bash
        env:
          AIVEN_TOKEN: ${{ secrets.AIVEN_TOKEN }}
          DEV_DB: ${{ secrets.VARIAPP_DEV_DB_CONNECTION }}
          PROJECT: ${{ inputs.aiven_project }}
          SERVICE: ${{ inputs.aiven_service }}
        run: |
          set -euo pipefail
          test -n "$AIVEN_TOKEN" || { echo 'AIVEN_TOKEN secret is missing'; exit 20; }
          test -n "$DEV_DB" || { echo 'VARIAPP_DEV_DB_CONNECTION secret is missing'; exit 21; }
          test -n "$PROJECT" || { echo 'aiven_project input is missing'; exit 22; }
          test -n "$SERVICE" || { echo 'aiven_service input is missing'; exit 23; }
          echo 'Required values are present; secret values are not printed.'

      - name: Install official Aiven CLI
        shell: bash
        run: python3 -m pip install --quiet aiven-client

      - name: Capture and certify actual Aiven DEV control-plane metadata
        shell: bash
        env:
          AIVEN_TOKEN: ${{ secrets.AIVEN_TOKEN }}
          DEV_DB: ${{ secrets.VARIAPP_DEV_DB_CONNECTION }}
          PROJECT: ${{ inputs.aiven_project }}
          SERVICE: ${{ inputs.aiven_service }}
        run: |
          set -euo pipefail
          RUN_DIR="$EVIDENCE_ROOT/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$RUN_DIR"
          export RUN_DIR

          # Current-token identity, used only to prove effective project permissions.
          avn --auth-token "$AIVEN_TOKEN" user info --json > /tmp/aiven-user.json

          python3 - <<'PY'
          import hashlib, json, os, re, urllib.request, urllib.error
          from urllib.parse import quote
          from datetime import datetime, timezone

          token=os.environ['AIVEN_TOKEN']
          conn=os.environ['DEV_DB']
          project=os.environ['PROJECT']
          service=os.environ['SERVICE']
          root='https://api.aiven.io/v1'

          def parse_conn(s):
              out={}
              for part in s.split(';'):
                  if '=' in part:
                      k,v=part.split('=',1); out[k.strip().lower()]=v.strip()
              return out

          def get(path):
              req=urllib.request.Request(root+path, headers={
                  'Authorization': f'aivenv1 {token}',
                  'Accept':'application/json',
                  'User-Agent':'VariApp-N8.20.F-proof/2.0'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  body=e.read().decode('utf-8','replace')[:1000]
                  raise SystemExit(f'Aiven API HTTP {e.code} for {path}: {body}')

          cs=parse_conn(conn)
          dev_host=cs.get('server') or cs.get('host') or cs.get('data source')
          if not dev_host:
              raise SystemExit('Could not parse DEV DB host from VARIAPP_DEV_DB_CONNECTION')
          dev_host_hash=hashlib.sha256(dev_host.lower().encode()).hexdigest()

          svc_payload=get(f'/project/{quote(project, safe="")}/service/{quote(service, safe="")}')
          svc=svc_payload.get('service', svc_payload)
          if svc.get('service_type') != 'mysql':
              raise SystemExit('Selected Aiven service is not MySQL')

          # Verify that the explicitly selected Aiven service is the same endpoint used by DEV.
          candidates=[]
          def walk(v):
              if isinstance(v, dict):
                  for x in v.values(): walk(x)
              elif isinstance(v, list):
                  for x in v: walk(x)
              elif isinstance(v, str):
                  for h in re.findall(r'([A-Za-z0-9._-]+\.aivencloud\.com)', v):
                      candidates.append(h.lower())
          walk(svc)
          if not any(hashlib.sha256(h.encode()).hexdigest()==dev_host_hash for h in candidates):
              raise SystemExit('Selected Aiven service does not match the DEV DB endpoint hash; refusing to inspect another service')

          plan=svc.get('service_plan')
          stype=svc.get('service_type')
          cloud=svc.get('cloud_name')
          state=svc.get('state')
          if not plan:
              raise SystemExit('Aiven API did not return the actual service plan')

          plan_payload=get(f'/project/{quote(project, safe="")}/service-types/{quote(stype, safe="")}/plans/{quote(plan, safe="")}')
          plan_obj=plan_payload.get('service_plan') if isinstance(plan_payload.get('service_plan'), dict) else plan_payload
          backup_config=plan_obj.get('backup_config') or {}
          price_usd=plan_obj.get('base_price_usd') or plan_payload.get('base_price_usd')

          backups_payload=get(f'/project/{quote(project, safe="")}/service/{quote(service, safe="")}/backups')
          backup_endpoint_proven=True
          backup_list=backups_payload.get('backups', [])

          project_payload=get(f'/project/{quote(project, safe="")}')
          project_obj=project_payload.get('project') if isinstance(project_payload.get('project'), dict) else project_payload
          org_id=project_obj.get('organization_id')
          project_id=project_obj.get('project_id')
          if not org_id or not project_id:
              raise SystemExit('Could not resolve Aiven organization_id/project_id for permission readback')

          with open('/tmp/aiven-user.json') as f:
              ui=json.load(f)
          if isinstance(ui, list) and ui:
              ui=ui[0]
          current_user_id=(ui.get('user_id') or ui.get('id') or ui.get('user')) if isinstance(ui, dict) else None

          perm_payload=get(f'/organization/{quote(org_id, safe="")}/permissions/project/{quote(project_id, safe="")}')
          assignments=perm_payload.get('permissions', [])
          effective=[]
          if current_user_id:
              for item in assignments:
                  if str(item.get('principal_id')) == str(current_user_id):
                      effective.extend(item.get('permissions') or [])
          effective=sorted(set(str(x) for x in effective))
          restore_roles={'admin','developer','role:project:admin','role:services:recover'}
          restore_authorized=any(x in restore_roles for x in effective)

          user_config=svc.get('user_config') or {}
          recovery_mode=backup_config.get('recovery_mode')
          retention_fields={k:backup_config.get(k) for k in (
              'frequent_interval_minutes','frequent_oldest_age_minutes',
              'infrequent_interval_minutes','infrequent_oldest_age_minutes',
              'interval','max_count') if k in backup_config}
          retention_proven=bool(retention_fields)

          latest=max(backup_list, key=lambda b:b.get('backup_time','')) if backup_list else None
          pitr_available = recovery_mode not in (None, '', 'basic')
          restore_path_proven = bool(recovery_mode) and backup_endpoint_proven
          cost_constraint_proven = bool(plan)  # actual tier known; workflow performs no paid action

          pass_ok=all([
              bool(plan), bool(backup_config), backup_endpoint_proven,
              recovery_mode is not None, retention_proven,
              restore_path_proven, restore_authorized, cost_constraint_proven
          ])

          evidence={
            'schema':'variapp.aiven-capabilities-proof.v2',
            'authority':'docs/VAEP_AUTHORITY.md',
            'task':'N8.20.F',
            'status':'PASS_AIVEN_CAPABILITIES_IDENTIFIED' if pass_ok else 'NOT_CERTIFIED',
            'capturedAtUtc':datetime.now(timezone.utc).isoformat(),
            'branch':'Desarrollo',
            'functionalHead':os.environ.get('GITHUB_SHA'),
            'githubActions':{'runId':os.environ.get('GITHUB_RUN_ID'),'attempt':os.environ.get('GITHUB_RUN_ATTEMPT')},
            'service':{
              'provider':'AIVEN','serviceType':stype,'servicePlan':plan,
              'cloudName':cloud,'state':state,
              'projectName':project,'serviceName':service,
              'devDbHostSha256':dev_host_hash
            },
            'backupPolicy':{
              'recoveryMode':recovery_mode,
              'pointInTimeRecoveryAvailable':pitr_available,
              'retention':retention_fields,
              'backupHour':user_config.get('backup_hour'),
              'backupMinute':user_config.get('backup_minute')
            },
            'actualBackups':{
              'endpointReadbackProven':backup_endpoint_proven,
              'countObserved':len(backup_list),
              'latestBackupTime':latest.get('backup_time') if latest else None,
              'latestBackupStorageLocation':latest.get('storage_location') if latest else None,
              'latestBackupSizeBytes':latest.get('data_size') if latest else None
            },
            'restoreCapability':{
              'providerManagedBackupEndpointProven':backup_endpoint_proven,
              'recoveryMode':recovery_mode,
              'restorePath':'AIVEN_FORK_AND_RESTORE_CONTROL_PLANE',
              'restoreAuthorizationProven':restore_authorized,
              'effectivePermissionNames':effective,
              'restoreExecutionPerformed':False
            },
            'cost':{
              'actualPlanTierProven':True,
              'basePriceUsdObserved':price_usd,
              'paidActionExecuted':False,
              'planChanged':False,
              'restoreExecuted':False,
              'constraint':'READ_ONLY_PROOF_ONLY__NO_PURCHASE__NO_UPGRADE__NO_RESTORE_EXECUTION'
            },
            'guardrails':{
              'readOnlyApiCallsOnly':True,
              'connectionStringPersisted':False,
              'aivenTokenPersisted':False,
              'databasePasswordPersisted':False,
              'fullDbHostPersisted':False,
              'productionTouched':False,
              'mainTouched':False,
              'secretsExposed':0
            },
            'acceptance':{
              'actualPlanTierProven':bool(plan),
              'actualBackupStateProven':backup_endpoint_proven,
              'actualPitrStateProven':recovery_mode is not None,
              'actualRetentionPolicyProven':retention_proven,
              'actualRestoreCapabilityProven':restore_path_proven,
              'actualRestoreAuthorizationProven':restore_authorized,
              'costImpactConstraintProven':cost_constraint_proven,
              'p0':0 if pass_ok else 1,
              'p1':0
            }
          }

          out=os.path.join(os.environ['RUN_DIR'],'N8.20.F_AIVEN_CAPABILITIES_EVIDENCE.json')
          with open(out,'w') as f: json.dump(evidence,f,indent=2)
          md=f'''# N8.20.F — Aiven DEV capabilities proof\n\n- Estado: `{evidence['status']}`\n- Provider: `AIVEN`\n- Service type: `{stype}`\n- Plan/tier actual: `{plan}`\n- Cloud: `{cloud}`\n- State: `{state}`\n- Backups endpoint readback: `{backup_endpoint_proven}`\n- Backups observados: `{len(backup_list)}`\n- Último backup UTC: `{evidence['actualBackups']['latestBackupTime']}`\n- Recovery mode: `{recovery_mode}`\n- PITR disponible según recovery mode: `{pitr_available}`\n- Retention policy readback: `{retention_proven}`\n- Restore authorization proven: `{restore_authorized}`\n- Base price USD observed: `{price_usd}`\n- Restore ejecutado: `false`\n- Plan cambiado/comprado: `false`\n- Production touched: `false`\n- Secrets exposed: `0`\n\n## Dictamen\n\n`{'N8.20.F tiene evidencia técnica suficiente para REVIEW_FIRST y cierre LISTO_REAL.' if pass_ok else 'N8.20.F NO puede cerrarse todavía; revisar los campos acceptance=false del JSON.'}`\n'''
          with open(os.path.join(os.environ['RUN_DIR'],'README.md'),'w') as f: f.write(md)
          print(json.dumps({'task':'N8.20.F','pass':pass_ok,'plan':plan,'backupCount':len(backup_list),'recoveryMode':recovery_mode,'restoreAuthorized':restore_authorized,'evidenceDir':os.environ['RUN_DIR']}))
          if not pass_ok:
              raise SystemExit(30)
          PY

      - name: Publish sanitized job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="$EVIDENCE_ROOT/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -f "$RUN_DIR/README.md" ]; then cat "$RUN_DIR/README.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload sanitized evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n8-20-f-aiven-capabilities-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_ROOT }}/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

      - name: Persist sanitized evidence to Desarrollo
        if: ${{ success() && inputs.persist_evidence }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EVIDENCE_ROOT/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git diff --cached --check
          git commit -m 'evidence(n8.20.f): certify Aiven DEV capabilities read-only' || exit 0
          git push origin HEAD:Desarrollo
