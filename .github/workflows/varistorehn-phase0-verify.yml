name: VariStoreHn Fase 0 - verificacion temporal

on:
  push:
    branches: [chatgpt/varistorehn-plan-fase0-base]

permissions:
  contents: read

concurrency:
  group: varistorehn-phase0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend publico y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: backend/**/*.csproj
      - run: dotnet restore InventoryApp.sln
      - run: dotnet build InventoryApp.sln --configuration Release --no-restore
      - run: dotnet test InventoryApp.sln --configuration Release --no-build --filter "Category!=Integration"

  frontend:
    name: Frontend lint y produccion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build:prod
