name: VAEP N6.1.C Exact Head Gate

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/vaep-n61c-ef-generate.yml'
      - 'backend/src/Domain/Entities/Empresa.cs'
      - 'backend/src/Infrastructure/Persistence/Configurations/EmpresaConfiguration.cs'
      - 'backend/src/Infrastructure/Migrations/*N6_1_C_TenantEmpresaPersistence*.cs'
      - 'backend/src/Infrastructure/Migrations/AppDbContextModelSnapshot.cs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore backend
        run: dotnet restore InventoryApp.sln
      - name: Build backend Release
        run: dotnet build InventoryApp.sln --configuration Release --no-restore
      - name: Test backend
        run: dotnet test tests/InventoryApp.Tests/InventoryApp.Tests.csproj --configuration Release --no-restore --verbosity normal
      - name: Validate canonical N6.1.C migration and snapshot
        run: |
          set -euo pipefail
          generated="$(find src/Infrastructure/Migrations -maxdepth 1 -type f -name '*_N6_1_C_TenantEmpresaPersistence.cs' ! -name '*.Designer.cs' -print -quit)"
          designer="$(find src/Infrastructure/Migrations -maxdepth 1 -type f -name '*_N6_1_C_TenantEmpresaPersistence.Designer.cs' -print -quit)"
          test -n "$generated"
          test -n "$designer"
          grep -q 'CreateTable' "$generated"
          grep -q 'Empresas' "$generated"
          grep -q 'CK_Empresas_Nombre_NoVacio' "$generated"
          grep -q 'IX_Empresas_Activa_Nombre' "$generated"
          grep -q 'InventoryApp.Domain.Entities.Empresa' src/Infrastructure/Migrations/AppDbContextModelSnapshot.cs
          grep -q 'Empresas' src/Infrastructure/Migrations/AppDbContextModelSnapshot.cs
          grep -q 'DropTable' "$generated"
          printf 'N6.1.C persistence markers validated on %s\n' "$(git rev-parse HEAD)"

# Controller QA gate only: validation/read-only; no migration generation, deploy, force push, or branch mutation.
