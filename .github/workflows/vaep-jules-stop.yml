name: VAEP Jules Stop Superseded Session

on:
  push:
    branches:
      - Desarrollo
    paths:
      - "vaep/jules/stop/*.json"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vaep-jules-stop
  cancel-in-progress: false

jobs:
  stop-superseded:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      EXPECTED_BRANCH: Desarrollo
      J1_API_KEY: ${{ secrets.JULES_J1_API_KEY }}
      J2_API_KEY: ${{ secrets.JULES_J2_API_KEY }}
      J3_API_KEY: ${{ secrets.JULES_J3_API_KEY }}
      J4_API_KEY: ${{ secrets.JULES_J4_API_KEY }}
      J5_API_KEY: ${{ secrets.JULES_J5_API_KEY }}
      J6_API_KEY: ${{ secrets.JULES_J6_API_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout stop manifest
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Bind VAEP MASTER authority
        shell: bash
        run: |
          set -euo pipefail
          MASTER_FILE='docs/VAEP_AUTHORITY.md'
          PARSER='.github/scripts/vaep-policy-parser.sh'
          test -f "$MASTER_FILE"
          test -f "$PARSER"
          bash "$PARSER" --validate "$MASTER_FILE" >/dev/null
          echo "MASTER_COMMIT_SHA=$(bash "$PARSER" --commit-sha "$MASTER_FILE")" >> "$GITHUB_ENV"
          echo "AUTOMATION_POLICY_HASH=$(bash "$PARSER" --hash "$MASTER_FILE")" >> "$GITHUB_ENV"

      - name: Validate stop manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(git diff-tree --no-commit-id --name-only --diff-filter=A -r "$GITHUB_SHA" -- "vaep/jules/stop/*.json")
          mapfile -t changed_files < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          [[ ${#manifests[@]} -eq 1 ]] || { echo "Expected exactly one new Jules stop manifest." >&2; exit 21; }
          manifest="${manifests[0]}"
          [[ ${#changed_files[@]} -eq 1 && "${changed_files[0]}" == "$manifest" ]] || { echo "Stop commit must change exactly the single stop manifest." >&2; exit 22; }
          jq -e '
            type == "object" and
            (.stopId | type == "string" and test("^[A-Za-z0-9_.-]+$")) and
            (.dispatchId | type == "string" and test("^[A-Za-z0-9_.-]+$")) and
            (.taskId | type == "string" and test("^[A-Za-z0-9_.-]+$")) and
            (.sessionName | type == "string" and test("^sessions/[0-9]+$")) and
            (.workerId | type == "string" and test("^J[1-6]$")) and
            (.expectedBranch == "Desarrollo") and
            (.reason | type == "string" and length > 0 and length <= 1000)
          ' "$manifest" >/dev/null
          {
            printf 'manifest=%s\n' "$manifest"
            printf 'stop_id=%s\n' "$(jq -r '.stopId' "$manifest")"
            printf 'dispatch_id=%s\n' "$(jq -r '.dispatchId' "$manifest")"
            printf 'task_id=%s\n' "$(jq -r '.taskId' "$manifest")"
            printf 'session_name=%s\n' "$(jq -r '.sessionName' "$manifest")"
            printf 'worker_id=%s\n' "$(jq -r '.workerId' "$manifest")"
          } >> "$GITHUB_OUTPUT"

      - name: Inspect and stop superseded Jules session
        id: stop
        shell: bash
        env:
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest }}
          DISPATCH_ID: ${{ steps.manifest.outputs.dispatch_id }}
          SESSION_NAME: ${{ steps.manifest.outputs.session_name }}
          WORKER_ID: ${{ steps.manifest.outputs.worker_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vaep-jules-stop"
          case "$WORKER_ID" in
            J1) selected_key="$J1_API_KEY"; title_prefix="VAEP-J1 " ;;
            J2) selected_key="$J2_API_KEY"; title_prefix="VAEP-J2 " ;;
            J3) selected_key="$J3_API_KEY"; title_prefix="VAEP-J3 " ;;
            J4) selected_key="$J4_API_KEY"; title_prefix="VAEP-J4 " ;;
            J5) selected_key="$J5_API_KEY"; title_prefix="VAEP-J5 " ;;
            J6) selected_key="$J6_API_KEY"; title_prefix="VAEP-J6 " ;;
            *) echo "Unsupported workerId: $WORKER_ID" >&2; exit 20 ;;
          esac
          [[ -n "$selected_key" ]] || { echo "$WORKER_ID API key is not configured." >&2; exit 20; }
          curl --connect-timeout 10 --max-time 45 --fail-with-body --silent --show-error \
            -H "x-goog-api-key: $selected_key" "$JULES_API_BASE/$SESSION_NAME" \
            > "$RUNNER_TEMP/vaep-jules-stop/session-before.json"
          expected_title="${title_prefix}${DISPATCH_ID}"
          jq -e --arg title "$expected_title" --arg branch "$EXPECTED_BRANCH" \
            '.title == $title and .sourceContext.githubRepoContext.startingBranch == $branch' \
            "$RUNNER_TEMP/vaep-jules-stop/session-before.json" >/dev/null
          before_state="$(jq -r '.state // "UNKNOWN"' "$RUNNER_TEMP/vaep-jules-stop/session-before.json")"
          curl --connect-timeout 10 --max-time 45 --fail-with-body --silent --show-error --get \
            -H "x-goog-api-key: $selected_key" --data-urlencode 'pageSize=100' \
            "$JULES_API_BASE/$SESSION_NAME/activities" > "$RUNNER_TEMP/vaep-jules-stop/activities-before.json"
          last_useful_event="$(jq -c '(.activities // []) | sort_by(.createTime // "") | last // {}' "$RUNNER_TEMP/vaep-jules-stop/activities-before.json")"
          action="NOOP"
          stop_attempt_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          case "$before_state" in
            QUEUED|PLANNING|IN_PROGRESS|AWAITING_USER_FEEDBACK|AWAITING_PLAN_APPROVAL)
              action="SEND_STOP_MESSAGE"
              reason="$(jq -r '.reason' "$MANIFEST_PATH")"
              prompt="VAEP CONTROL PLANE: esta sesión está SUPERSEDED y ya no es autoritativa. DETÉN cualquier trabajo nuevo inmediatamente. No modifiques más archivos, no generes nuevos cambios y no amplíes scope. No crees rama, PR, push, merge ni deploy. Conserva solamente observaciones ya producidas como evidencia histórica y, si Jules permite concluir la sesión, finalízala sin cambios adicionales. Motivo: $reason"
              jq -n --arg prompt "$prompt" '{prompt:$prompt}' > "$RUNNER_TEMP/vaep-jules-stop/message.json"
              curl --connect-timeout 10 --max-time 45 --fail-with-body --silent --show-error \
                -X POST -H "Content-Type: application/json" -H "x-goog-api-key: $selected_key" \
                --data-binary @"$RUNNER_TEMP/vaep-jules-stop/message.json" \
                "$JULES_API_BASE/$SESSION_NAME:sendMessage" >/dev/null
              ;;
            PAUSED|COMPLETED|FAILED) action="NOOP_ALREADY_NONACTIVE" ;;
            *) action="NOOP_UNKNOWN_STATE" ;;
          esac
          printf 'before_state=%s\n' "$before_state" >> "$GITHUB_OUTPUT"
          printf 'action=%s\n' "$action" >> "$GITHUB_OUTPUT"
          sleep 5
          curl --connect-timeout 10 --max-time 45 --fail-with-body --silent --show-error \
            -H "x-goog-api-key: $selected_key" "$JULES_API_BASE/$SESSION_NAME" \
            > "$RUNNER_TEMP/vaep-jules-stop/session-after.json"
          after_state="$(jq -r '.state // "UNKNOWN"' "$RUNNER_TEMP/vaep-jules-stop/session-after.json")"
          case "$after_state" in
            QUEUED|PLANNING|IN_PROGRESS|AWAITING_USER_FEEDBACK|AWAITING_PLAN_APPROVAL) recovery_decision="QUARANTINED_REMOTE_ACTIVE_NO_DUPLICATE" ;;
            PAUSED|COMPLETED|FAILED) recovery_decision="REMOTE_TERMINAL_RCA_REQUIRED_BEFORE_RECOVERY" ;;
            *) recovery_decision="FAIL_CLOSED_NO_RECOVERY_UNKNOWN_REMOTE_STATE" ;;
          esac
          {
            printf 'after_state=%s\n' "$after_state"
            printf 'last_useful_event=%s\n' "$last_useful_event"
            printf 'stop_attempt_at=%s\n' "$stop_attempt_at"
            printf 'recovery_decision=%s\n' "$recovery_decision"
          } >> "$GITHUB_OUTPUT"

      - name: Register stop evidence
        if: always()
        shell: bash
        env:
          STOP_ID: ${{ steps.manifest.outputs.stop_id }}
          DISPATCH_ID: ${{ steps.manifest.outputs.dispatch_id }}
          TASK_ID: ${{ steps.manifest.outputs.task_id }}
          SESSION_NAME: ${{ steps.manifest.outputs.session_name }}
          BEFORE_STATE: ${{ steps.stop.outputs.before_state }}
          ACTION: ${{ steps.stop.outputs.action }}
          AFTER_STATE: ${{ steps.stop.outputs.after_state }}
          LAST_USEFUL_EVENT: ${{ steps.stop.outputs.last_useful_event }}
          STOP_ATTEMPT_AT: ${{ steps.stop.outputs.stop_attempt_at }}
          RECOVERY_DECISION: ${{ steps.stop.outputs.recovery_decision }}
        run: |
          set -euo pipefail
          stop_id="${STOP_ID:-UNKNOWN}"; dispatch_id="${DISPATCH_ID:-UNKNOWN}"; task_id="${TASK_ID:-UNKNOWN}"; session_name="${SESSION_NAME:-UNKNOWN}"
          before_state="${BEFORE_STATE:-UNKNOWN}"; action="${ACTION:-UNKNOWN}"; after_state="${AFTER_STATE:-UNKNOWN}"
          last_useful_event="${LAST_USEFUL_EVENT:-{}}"; stop_attempt_at="${STOP_ATTEMPT_AT:-UNKNOWN}"; recovery_decision="${RECOVERY_DECISION:-FAIL_CLOSED_NO_RECOVERY}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf -v body '%s\n\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            'VAEP Jules superseded-session stop evidence.' \
            "- Stop: \`$stop_id\`" "- Dispatch: \`$dispatch_id\`" "- Task: \`$task_id\`" "- Session: \`$session_name\`" \
            "- Before: \`$before_state\`; action: \`$action\`; after: \`$after_state\`" \
            "- Last useful event: \`$last_useful_event\`" "- Stop attempt: \`$stop_attempt_at\`; stop result: \`$after_state\`" \
            "- Recovery decision: \`$recovery_decision\`" "- Workflow run: $run_url"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "[VAEP-JULES-STOP] $stop_id" --body "$body" >/dev/null
