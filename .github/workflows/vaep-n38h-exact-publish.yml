# Recovery trigger: append-only publisher; never rewrites pre-existing TASKS/CHANGELOG bytes.
name: VAEP N3.8.H Exact Closure Publisher

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/vaep-n38h-exact-publish.yml'

permissions:
  contents: write

concurrency:
  group: vaep-n38h-exact-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Publish N3.8 conditional N/A closure with history preservation
        shell: bash
        env:
          EXPECTED_TASKS_SOURCE_BLOB: 09264b4b76eb9adf15abae038bafb2bb179333ba
          EXPECTED_CHANGELOG_SOURCE_BLOB: 4ae1376702e4ba9f2ed64930dd4dcfb150a765f9
        run: |
          set -euo pipefail
          git fetch origin Desarrollo --depth=1
          test "$(git rev-parse origin/Desarrollo)" = "$GITHUB_SHA"
          test "$(git hash-object TASKS.md)" = "$EXPECTED_TASKS_SOURCE_BLOB"
          test "$(git hash-object CHANGELOG_AI.md)" = "$EXPECTED_CHANGELOG_SOURCE_BLOB"
          cp TASKS.md /tmp/TASKS.source
          cp CHANGELOG_AI.md /tmp/CHANGELOG.source

          cat > docs/CERTIFICACION_N3_8_NOTA_DEBITO_CLIENTE.md <<'EOF'
          # Certificación N3.8 — Nota de débito de cliente

          ## Dictamen
          N3.8.A-H queda cerrado para el alcance autoritativo actual como **N/A CON EVIDENCIA / REQUISITO CONDICIONAL NO ACTIVADO**. No se afirma que `NotaDebitoCliente` haya sido implementada.

          ## Evidencia
          - N3.8.A preflight: `034ec3305422016d6c571d0ffcf1332e3bbbe6b6`.
          - N3.8.B dominio/contratos N/A: `affb58f2b9e7d8ab25c051fed5b9f4ee5f317584`.
          - N3.8.C-G rollup N/A: `3a89725e4a76c4d85c0c4adc04f0affa4a61e79a`.
          - Búsqueda dirigida: no existe actualmente entidad, servicio, controller, DTO, ruta o migración `NotaDebitoCliente` ni requisito legal/operativo autoritativo suficiente para fijar lifecycle, fiscalidad, contabilidad, cardinalidad o idempotencia.

          ## DoD y seguridad
          Delta funcional N3.8 = 0. No se modifican dominio, persistencia, API, frontend, RBAC, datos ni Producción. Por `CI_CAUSALITY_BUDGET` no se fabrica CI pesada para código inexistente. P0/P1 atribuibles conocidos bajo el requisito actual = 0.

          ## Regla de reapertura
          Si legislación u operación exige NotaDebitoCliente en el futuro, N3.8 debe reabrirse desde dominio/contratos con requisito explícito antes de crear persistencia, API o UI.
          EOF

          cat >> TASKS.md <<'EOF'

          ## ERP-N3.8 — Nota de débito de cliente — CIERRE CONDICIONAL/N/A

          - [x] N3.8.A preflight certificado en `034ec3305422016d6c571d0ffcf1332e3bbbe6b6`.
          - [x] N3.8.B dominio/contratos cerrado N/A con evidencia en `affb58f2b9e7d8ab25c051fed5b9f4ee5f317584`.
          - [x] N3.8.C-G cerrados N/A con evidencia en `3a89725e4a76c4d85c0c4adc04f0affa4a61e79a`.
          - [x] N3.8.H certificación canónica: `docs/CERTIFICACION_N3_8_NOTA_DEBITO_CLIENTE.md`.

          **ERP-N3.8 queda formalmente cerrado como N/A condicionado al requisito legal/operativo. No se implementó `NotaDebitoCliente`. Siguiente MICROTAREA dependency-valid: `N3.9.A — Cuentas por cobrar / Auditoría y preflight`.**
          EOF

          cat >> CHANGELOG_AI.md <<'EOF'

          ## 2026-08-26 — ERP-N3.8 Nota de débito de cliente — CIERRE CONDICIONAL/N/A

          **Responsable:** ChatGPT/VAEP v3.25.1 Closure Governor.

          **Dictamen:** N3.8.A-H se cierra para el alcance actual como N/A con evidencia porque el roadmap condiciona la Nota de débito a una necesidad legal/operativa y no existe todavía requisito autoritativo suficiente para fijar su contrato. No se afirma que `NotaDebitoCliente` haya sido implementada.

          **Evidencia:** A=`034ec3305422016d6c571d0ffcf1332e3bbbe6b6`; B=`affb58f2b9e7d8ab25c051fed5b9f4ee5f317584`; C-G=`3a89725e4a76c4d85c0c4adc04f0affa4a61e79a`; certificación=`docs/CERTIFICACION_N3_8_NOTA_DEBITO_CLIENTE.md`. Delta funcional=0 y P0/P1 atribuibles conocidos=0.

          **Reapertura:** si legislación/operación exige esta capacidad, reabrir desde N3.8.B con contrato explícito antes de dominio/persistencia/API/UI. El selector puede promover `N3.9.A`.
          EOF

          cmp -n "$(stat -c%s /tmp/TASKS.source)" /tmp/TASKS.source TASKS.md
          cmp -n "$(stat -c%s /tmp/CHANGELOG.source)" /tmp/CHANGELOG.source CHANGELOG_AI.md
          git add -N docs/CERTIFICACION_N3_8_NOTA_DEBITO_CLIENTE.md
          test "$(git diff --name-only | sort)" = $'CHANGELOG_AI.md\nTASKS.md\ndocs/CERTIFICACION_N3_8_NOTA_DEBITO_CLIENTE.md'
          test "$(git diff --numstat -- TASKS.md | cut -f2)" = "0"
          test "$(git diff --numstat -- CHANGELOG_AI.md | cut -f2)" = "0"
          test "$(git diff --numstat -- docs/CERTIFICACION_N3_8_NOTA_DEBITO_CLIENTE.md | cut -f2)" = "0"
          git diff --check

          git config user.name 'VAEP Controller'
          git config user.email 'actions@users.noreply.github.com'
          git add TASKS.md CHANGELOG_AI.md docs/CERTIFICACION_N3_8_NOTA_DEBITO_CLIENTE.md
          git commit -m 'docs(N3.8.H): cerrar NotaDebitoCliente como N/A condicional [VAEP v3.25.1] [skip ci]'

          git fetch origin Desarrollo --depth=1
          test "$(git rev-parse origin/Desarrollo)" = "$GITHUB_SHA"
          git push origin HEAD:Desarrollo
