name: VAEP - Generar artefacto EF N0.5.07C1

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/vaep-ef-artifact-n05-c1.yml'
      - 'backend/src/Domain/Entities/FacturaPago.cs'
      - 'backend/src/Infrastructure/Persistence/Configurations/FacturaPagoConfiguration.cs'

permissions:
  contents: write

jobs:
  generar-migracion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Instalar EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.8
      - name: Generar migracion y snapshot canonicos sin publicar rama
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          dotnet restore InventoryApp.sln
          dotnet ef migrations add ERP_N05_PermiteCambioAuditable \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext \
            --output-dir Migrations
          dotnet ef migrations has-pending-model-changes \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext
          cd ..
      - name: Incorporar backfill historico auditable
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          migrations = [
              p for p in Path('backend/src/Infrastructure/Migrations').glob('*ERP_N05_PermiteCambioAuditable.cs')
              if not p.name.endswith('.Designer.cs')
          ]
          if len(migrations) != 1:
              raise SystemExit(f'Se esperaba una migracion C1 y se encontraron {len(migrations)}')

          p = migrations[0]
          text = p.read_text(encoding='utf-8-sig')
          needle = '''            migrationBuilder.AddColumn<decimal>(\n                name: "MontoRecibido",\n                table: "FacturaPagos",\n                type: "decimal(18,2)",\n                precision: 18,\n                scale: 2,\n                nullable: false,\n                defaultValue: 0m);\n'''
          replacement = needle + '''\n            // Preserva la semantica historica: antes de introducir cambio auditable,\n            // todo Monto persistido representaba tambien el importe efectivamente recibido.\n            migrationBuilder.Sql(\n                "UPDATE FacturaPagos SET MontoRecibido = Monto, Cambio = 0 WHERE MontoRecibido = 0;");\n'''
          if needle not in text:
              raise SystemExit('No se encontro el punto de insercion de MontoRecibido.')
          p.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
      - name: Crear blobs Git no referenciados para publicacion por el Runner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          root = Path('backend/src/Infrastructure/Migrations')
          migrations = [p for p in root.glob('*ERP_N05_PermiteCambioAuditable.cs') if not p.name.endswith('.Designer.cs')]
          designers = list(root.glob('*ERP_N05_PermiteCambioAuditable.Designer.cs'))
          snapshot = root / 'AppDbContextModelSnapshot.cs'
          if len(migrations) != 1 or len(designers) != 1 or not snapshot.exists():
              raise SystemExit('Conjunto EF canonico incompleto.')

          files = [migrations[0], designers[0], snapshot]
          token = os.environ['GH_TOKEN']
          repo = os.environ['GH_REPOSITORY']
          manifest = []
          for path in files:
              body = json.dumps({
                  'content': base64.b64encode(path.read_bytes()).decode('ascii'),
                  'encoding': 'base64',
              }).encode('utf-8')
              req = Request(
                  f'https://api.github.com/repos/{repo}/git/blobs',
                  data=body,
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urlopen(req) as response:
                  payload = json.load(response)
              manifest.append({
                  'path': f'backend/src/Infrastructure/Migrations/{path.name}',
                  'sha': payload['sha'],
              })

          Path('vaep-n05-c1-blob-manifest.json').write_text(
              json.dumps(manifest, indent=2), encoding='utf-8'
          )
          PY
      - name: Publicar artefactos y manifiesto de blobs
        uses: actions/upload-artifact@v4
        with:
          name: vaep-n05-c1-ef-canonical
          if-no-files-found: error
          retention-days: 2
          path: |
            backend/src/Infrastructure/Migrations/*ERP_N05_PermiteCambioAuditable*.cs
            backend/src/Infrastructure/Migrations/AppDbContextModelSnapshot.cs
            vaep-n05-c1-blob-manifest.json
