name: Retirar rama histórica absorbida

on:
  push:
    branches:
      - Desarrollo
    paths:
      - .github/workflows/retirar-rama-historica.yml

permissions:
  contents: write

jobs:
  retirar-rama:
    name: Verificar absorción y eliminar rama histórica
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar y retirar agent/mejoras-variapp
        shell: bash
        run: |
          set -euo pipefail
          rama_historica='agent/mejoras-variapp'
          rama_destino='Desarrollo'

          git fetch origin "+refs/heads/*:refs/remotes/origin/*"

          if ! git show-ref --verify --quiet "refs/remotes/origin/${rama_historica}"; then
            echo "La rama histórica ya no existe. No hay nada que eliminar."
            exit 0
          fi

          if ! git merge-base --is-ancestor "origin/${rama_historica}" "origin/${rama_destino}"; then
            echo "Bloqueado: la rama histórica contiene commits no absorbidos por Desarrollo." >&2
            exit 1
          fi

          git push origin --delete "${rama_historica}"
          echo "Rama histórica eliminada después de confirmar su absorción completa."
