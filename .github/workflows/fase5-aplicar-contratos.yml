name: Fase 5 - aplicar contratos de imágenes

on:
  push:
    branches:
      - Desarrollo
    paths:
      - scripts/fase5_aplicar_contratos.py
      - .github/workflows/fase5-aplicar-contratos.yml

permissions:
  contents: write

concurrency:
  group: fase5-aplicar-contratos
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Aplicar cambios deterministas
        run: python scripts/fase5_aplicar_contratos.py

      - name: Retirar utilidades temporales
        run: |
          rm scripts/fase5_aplicar_contratos.py
          rm .github/workflows/fase5-aplicar-contratos.yml

      - name: Publicar directamente en Desarrollo
        run: |
          git config user.name "VariApp Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(fase5): exponer imagen principal en operaciones e historial"
          git push origin HEAD:Desarrollo
