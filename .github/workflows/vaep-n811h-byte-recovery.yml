name: VAEP N8.11.H Byte Recovery

on:
  push:
    branches:
      - Desarrollo
    paths:
      - .github/workflows/vaep-n811h-byte-recovery.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Restore safe prefixes and append N8.11 current-standard blocks
        shell: bash
        run: |
          set -euo pipefail
          SAFE='625de9e060f6bf7b7f0d31e4f59ab661e59826fd'
          SAFE_TASKS='5f79ff4159f5cb5c04950d714edc20ca2f6edc34'
          SAFE_CHANGELOG='df6fd1dff89af2790e2e955c8363df1b81e7e359'

          git merge-base --is-ancestor "$SAFE" HEAD
          test "$(git rev-parse "$SAFE:TASKS.md")" = "$SAFE_TASKS"
          test "$(git rev-parse "$SAFE:CHANGELOG_AI.md")" = "$SAFE_CHANGELOG"
          test "$(git hash-object CHANGELOG_AI.md)" = "$SAFE_CHANGELOG"

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          safe = '625de9e060f6bf7b7f0d31e4f59ab661e59826fd'
          tasks = subprocess.check_output(['git', 'show', f'{safe}:TASKS.md'])
          changelog = subprocess.check_output(['git', 'show', f'{safe}:CHANGELOG_AI.md'])

          tasks_append = (
              "\n\n## ERP-N8.11 — Seguridad — REVALIDACIÓN CURRENT-STANDARD 2026-09-17\n\n"
              "Este bloque es estrictamente aditivo/history-preserving. El estado operativo vigente continúa exclusivamente en `CONFIG/COLA` bajo `docs/VAEP_AUTHORITY.md`; esta bitácora no sustituye receipt ni readback.\n\n"
              "- [x] N8.11.A-G fueron revalidados secuencialmente contra el estándar vigente; el histórico fue evidencia de apoyo, nunca auto-cierre.\n"
              "- [x] N8.11.F `LISTO` con REVIEW_FIRST P0=0/P1=0 y security gate `35258962286=SUCCESS`.\n"
              "- [x] N8.11.G `LISTO` con REVIEW_FIRST P0=0/P1=0 y quality/regression gate `35258969104=SUCCESS`; equivalencia de dependencias respaldada por `35233179389=SUCCESS`.\n"
              "- [x] Functional head `6fd3e28cbf28164d110d6b83756b9094cec654a6`; certificación current-standard `docs/CERTIFICACION_N8_11_SEGURIDAD_CURRENT_STANDARD.md`.\n"
              "- [x] `main`, Producción, PR #2, secretos, DNS/certificados y datos productivos permanecen intactos.\n"
              "- [ ] N8.11.H sólo pasa a `LISTO` después de hard verify de este append y `CHANGELOG_AI.md`, REVIEW_FIRST final P0=0/P1=0, receipt H y write/readback del control-plane.\n\n"
              "**CURRENT_PARENT=N8.11.H. NEXT_PARENT_PREARMED=N8.12.A. No se promueve N8.12.A antes del cierre real de H. FALSE_PASS=NO. FALSE_LISTO=NO.**\n"
          ).encode('utf-8')

          changelog_append = (
              "\n\n## 2026-09-17 — ERP-N8.11 Seguridad — reconciliación current-standard append-only\n\n"
              "**Responsable:** CHATGPT_VAEP / recovery N8.11.H bajo `docs/VAEP_AUTHORITY.md`.\n\n"
              "N8.11.A-G fueron revalidados secuencialmente contra el estándar vigente. El functional head probado es `6fd3e28cbf28164d110d6b83756b9094cec654a6`; los gates causales `35258962286` (security) y `35258969104` (quality/regression) terminaron `SUCCESS`, y la auditoría de dependencias `35233179389=SUCCESS` conserva equivalencia para los blobs vigentes. La certificación current-standard es `docs/CERTIFICACION_N8_11_SEGURIDAD_CURRENT_STANDARD.md`. P0=0/P1=0 en el alcance técnico A-G; el riesgo P2 no bloqueante de token frontend en `localStorage` queda fuera del cierre acotado.\n\n"
              "Este append resuelve únicamente la reconciliación documental de `CHANGELOG_AI.md`; no declara por sí solo `N8.11.H=LISTO`. El cierre requiere hard verify de prefijo exacto de `TASKS.md` y este archivo, REVIEW_FIRST final P0=0/P1=0, receipt H y write/readback antes de promover `N8.12.A`. Sin cambios a `main`, Producción, PR #2, secretos, DNS/certificados ni datos productivos.\n"
          ).encode('utf-8')

          Path('TASKS.md').write_bytes(tasks + tasks_append)
          Path('CHANGELOG_AI.md').write_bytes(changelog + changelog_append)

          final_tasks = Path('TASKS.md').read_bytes()
          final_changelog = Path('CHANGELOG_AI.md').read_bytes()
          assert final_tasks.startswith(tasks) and len(final_tasks) > len(tasks)
          assert final_changelog.startswith(changelog) and len(final_changelog) > len(changelog)
          PY

          changed="$(git diff --name-only)"
          test "$changed" = $'CHANGELOG_AI.md\nTASKS.md'

          seen=0
          while read -r additions deletions path; do
            case "$path" in
              CHANGELOG_AI.md|TASKS.md) ;;
              *) echo "Unexpected path versus safe baseline: $path" >&2; exit 1 ;;
            esac
            test "$additions" -gt 0
            test "$deletions" -eq 0
            seen=$((seen+1))
          done < <(git diff --numstat "$SAFE" -- CHANGELOG_AI.md TASKS.md)
          test "$seen" -eq 2

          git diff --check -- CHANGELOG_AI.md TASKS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG_AI.md TASKS.md
          git commit -m '[N8.11.H] recover exact prefixes and append current-standard rollup'
          git push origin HEAD:Desarrollo
