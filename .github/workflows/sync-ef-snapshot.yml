name: Sincronización efímera de EF Snapshot

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/sync-ef-snapshot.yml'

permissions:
  contents: write

jobs:
  sync-snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generar snapshot con EF oficial
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore InventoryApp.sln
          dotnet tool install --global dotnet-ef --version 8.0.8
          dotnet ef migrations add __SyncSnapshot \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext \
            --output-dir Migrations
          rm -f src/Infrastructure/Migrations/*__SyncSnapshot.cs
          rm -f src/Infrastructure/Migrations/*__SyncSnapshot.Designer.cs

      - name: Publicar únicamente snapshot y autoeliminar workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/sync-ef-snapshot.yml
          git config user.name 'VariApp Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/src/Infrastructure/Migrations/AppDbContextModelSnapshot.cs
          git add -u .github/workflows/sync-ef-snapshot.yml
          if git diff --cached --quiet; then
            echo 'No hay cambios de snapshot que publicar.'
            exit 0
          fi
          git commit -m 'chore(ef): sincronizar model snapshot [ChatGPT]'
          git push origin HEAD:Desarrollo
