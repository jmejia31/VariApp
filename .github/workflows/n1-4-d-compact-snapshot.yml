name: N1.4.D - Validar snapshot compacto

on:
  push:
    branches: [Desarrollo]

permissions:
  contents: read

jobs:
  compact-snapshot:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=variapp_n14d_snapshot;User=root;Password=design-only;"
      Database__ServerVersion: "8.4.3"
      Jwt__Secret: "n14d-design-time-secret-only-1234567890"
      Jwt__Issuer: "VariApp.N14D"
      Jwt__Audience: "VariApp.N14D"
      Cors__AllowedOrigins__0: "http://localhost:4200"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore backend/InventoryApp.sln
      - run: dotnet tool install --global dotnet-ef --version 8.0.8
      - name: Insertar delta N1.4.D en snapshot compacto
        run: python backend/scripts/n1_4_d_patch_compact_snapshot.py
      - name: Validar snapshot contra modelo actual
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project backend/src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project backend/src/API/InventoryApp.API.csproj \
            --context AppDbContext
      - name: Compilar backend con snapshot compacto
        run: dotnet build backend/InventoryApp.sln --configuration Release --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: n1-4-d-compact-snapshot
          path: backend/src/Infrastructure/Migrations/AppDbContextModelSnapshot.cs
          if-no-files-found: error
