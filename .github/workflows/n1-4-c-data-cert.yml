# Temporal, read-only respecto al repositorio. Se elimina al cerrar N1.4.C.
name: ERP-N1.4.C - Certificacion datos ExistenciaVariante

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/n1-4-c-data-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n1-4-c-data-cert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Preflight, backfill y postcheck MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inventoryapp_n14c
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=inventoryapp_n14c;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;
      Database__ServerVersion: 8.4.0
      Database__ApplyMigrationsOnStartup: 'false'
      Jwt__Secret: N14C-CI-Only-Secret-With-More-Than-32-Characters-2026
      Jwt__Issuer: VariApp.N14C.CI
      Jwt__Audience: VariApp.N14C.CI.Frontend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Preparar EF
        run: |
          set -euo pipefail
          dotnet restore InventoryApp.sln
          dotnet tool install --global dotnet-ef --version 8.0.8

      - name: Crear fixture legacy real
        run: |
          set -euo pipefail
          dotnet ef database update 20260722142118_Fase6SeguridadFacturacionPerfil \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot inventoryapp_n14c -e "
            INSERT INTO Productos
              (Nombre, Marca, Modelo, Cantidad, Costo, Precio, UmbralStockBajo, Activo, Eliminado, FechaCreacion, FechaActualizacion)
            VALUES
              ('Fixture N1.4.C', 'VAEP', 'LEGACY', 7, 10.00, 20.00, 2, 1, 0, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6));"
          dotnet ef database update 20260728152434_Fase3CostoEnvioEnVentas \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot inventoryapp_n14c -e "
            INSERT INTO CatalogosProducto
              (Tipo, Nombre, Descripcion, CodigoVisual, Orden, Activo, Eliminado, FechaCreacion, FechaActualizacion)
            VALUES
              ('Color', 'Negro N1.4.C', 'Fixture de certificación', '#111827', 1, 1, 0, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6));
            SET @color_id = LAST_INSERT_ID();
            UPDATE Productos SET ColorId = @color_id WHERE Nombre = 'Fixture N1.4.C';"
          dotnet ef database update \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot inventoryapp_n14c -e "
            INSERT INTO Sucursales
              (EmpresaId,Codigo,Nombre,Direccion,Telefono,Correo,ZonaHoraria,Activa,FechaCreacion,FechaActualizacion,CreadoPorNombreUsuario,Eliminado)
            VALUES
              (NULL,'SUC-N14C','Sucursal fixture N1.4.C',NULL,NULL,NULL,'America/Tegucigalpa',1,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6),'VAEP N1.4.C cert',0);
            SET @sucursal_id = LAST_INSERT_ID();
            INSERT INTO Almacenes
              (SucursalId,Codigo,Nombre,Tipo,Activo,Eliminado,FechaCreacion,FechaActualizacion,CreadoPorNombreUsuario)
            VALUES
              (@sucursal_id,'ALM-N14C','Almacen fixture N1.4.C',1,1,0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6),'VAEP N1.4.C cert');"
          printf '%s\n' 'Fixture legacy=OK' 'Sucursal=1' 'AlmacenActivo=1' > /tmp/n1-4-c-fixture.txt

      - name: Verificar precondiciones deterministas
        working-directory: .
        run: |
          set -euo pipefail
          c="${{ job.services.mysql.id }}"
          almacenes="$(docker exec "$c" mysql -uroot -proot inventoryapp_n14c -Nse "SELECT COUNT(*) FROM Almacenes WHERE Activo=1 AND Eliminado=0;")"
          variantes="$(docker exec "$c" mysql -uroot -proot inventoryapp_n14c -Nse "SELECT COUNT(*) FROM ProductoVariantes WHERE Eliminado=0;")"
          stock="$(docker exec "$c" mysql -uroot -proot inventoryapp_n14c -Nse "SELECT COALESCE(SUM(Cantidad),0) FROM ProductoVariantes WHERE Eliminado=0;")"
          echo "Almacenes activos=$almacenes Variantes=$variantes StockLegacy=$stock"
          test "$almacenes" = '1'
          test "$variantes" -gt 0
          test "$stock" -ge 7

      - name: Ejecutar preflight real N1.4.C
        working-directory: .
        run: |
          set -euo pipefail
          c="${{ job.services.mysql.id }}"
          docker exec -i "$c" mysql -uroot -proot inventoryapp_n14c --batch \
            < backend/scripts/preflight-n1-4-c-existencia-variante.sql | tee /tmp/n1-4-c-preflight.txt
          grep -q 'OK_LEGACY_PRESERVADO' /tmp/n1-4-c-preflight.txt

      - name: Ejecutar backfill real y reconciliar
        working-directory: .
        run: |
          set -euo pipefail
          c="${{ job.services.mysql.id }}"
          docker exec -i "$c" mysql -uroot -proot inventoryapp_n14c --batch \
            < backend/scripts/backfill-n1-4-c-existencia-variante.sql | tee /tmp/n1-4-c-backfill.txt
          grep -q 'OK_BACKFILL_RECONCILIADO' /tmp/n1-4-c-backfill.txt
          docker exec -i "$c" mysql -uroot -proot inventoryapp_n14c --batch \
            < backend/scripts/postcheck-n1-4-c-existencia-variante.sql | tee /tmp/n1-4-c-postcheck.txt
          grep -q 'OK_RECONCILIADO' /tmp/n1-4-c-postcheck.txt
          mismatch="$(docker exec "$c" mysql -uroot -proot inventoryapp_n14c -Nse "
            SELECT COUNT(*) FROM (
              SELECT pv.Id
              FROM ProductoVariantes pv
              LEFT JOIN ExistenciasVariante ev ON ev.ProductoVarianteId=pv.Id
              WHERE pv.Eliminado=0
              GROUP BY pv.Id,pv.Cantidad
              HAVING COALESCE(SUM(ev.StockFisico),0)<>pv.Cantidad
            ) x;")"
          test "$mismatch" = '0'

      - name: Probar aborto fail-closed con dos almacenes
        working-directory: .
        run: |
          set -euo pipefail
          c="${{ job.services.mysql.id }}"
          docker exec "$c" mysql -uroot -proot inventoryapp_n14c -e "DELETE FROM ExistenciasVariante;"
          docker exec "$c" mysql -uroot -proot inventoryapp_n14c -e "
            INSERT INTO Almacenes
              (SucursalId,Codigo,Nombre,Tipo,Activo,Eliminado,FechaCreacion,FechaActualizacion)
            SELECT SucursalId, CONCAT(Codigo,'-AMB'), CONCAT(Nombre,' Ambiguo'), Tipo, 1, 0, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6)
            FROM Almacenes
            WHERE Activo=1 AND Eliminado=0
            ORDER BY Id
            LIMIT 1;"
          activos="$(docker exec "$c" mysql -uroot -proot inventoryapp_n14c -Nse "SELECT COUNT(*) FROM Almacenes WHERE Activo=1 AND Eliminado=0;")"
          test "$activos" = '2'
          set +e
          docker exec -i "$c" mysql -uroot -proot inventoryapp_n14c --batch \
            < backend/scripts/backfill-n1-4-c-existencia-variante.sql > /tmp/n1-4-c-ambiguous.txt 2>&1
          rc=$?
          set -e
          cat /tmp/n1-4-c-ambiguous.txt
          test "$rc" -ne 0
          grep -q 'se requiere mapeo explicito antes del backfill' /tmp/n1-4-c-ambiguous.txt
          filas="$(docker exec "$c" mysql -uroot -proot inventoryapp_n14c -Nse "SELECT COUNT(*) FROM ExistenciasVariante;")"
          test "$filas" = '0'
          echo 'OK_FAIL_CLOSED_AMBIGUO' | tee -a /tmp/n1-4-c-ambiguous.txt

      - name: Evidencia final
        working-directory: .
        run: |
          printf '%s\n' \
            'N1.4.C DATA CERTIFICATION' \
            'MySQL=8.4' \
            'DeterministicBackfill=OK' \
            'Postcheck=OK_RECONCILIADO' \
            'AmbiguousWarehouse=FAIL_CLOSED_OK' \
            'Production=NOT_TOUCHED' \
            > /tmp/n1-4-c-data-cert.txt
          cat /tmp/n1-4-c-data-cert.txt

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-4-c-data-cert
          path: /tmp/n1-4-c-*.txt
          if-no-files-found: error
          retention-days: 7
