name: VAEP J1-J6 Cutover Apply
on:
  push:
    branches: [Desarrollo]
    paths: ['.github/workflows/vaep-j1-j6-cutover-apply.yml']
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: vaep-j1-j6-cutover-apply, cancel-in-progress: false}
jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      J1_KEY: ${{ secrets.JULES_J1_API_KEY }}
      J2_KEY: ${{ secrets.JULES_J2_API_KEY }}
      J3_KEY: ${{ secrets.JULES_J3_API_KEY }}
      J4_KEY: ${{ secrets.JULES_J4_API_KEY }}
      J5_KEY: ${{ secrets.JULES_J5_API_KEY }}
      J6_KEY: ${{ secrets.JULES_J6_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: Desarrollo, fetch-depth: 0}
      - name: Canonical readiness J1-J6
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            var="J${i}_KEY"; key="${!var:-}"; test -n "$key"
            f="$(mktemp)"
            curl --connect-timeout 10 --max-time 45 --fail-with-body --silent --show-error -H "x-goog-api-key: $key" "$JULES_API_BASE/sources?pageSize=100" > "$f"
            jq -e '[.sources[]? | select(.githubRepo.owner=="jmejia31" and .githubRepo.repo=="VariApp")] | first as $s | ($s != null) and (($s.githubRepo.branches // []) | any(.displayName=="Desarrollo"))' "$f" >/dev/null
            echo "J${i}_CANONICAL_READINESS_OK"
          done
      - name: Transform and publish canonical non-workflow control plane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin Desarrollo
          git reset --hard origin/Desarrollo
          base="$(git rev-parse HEAD)"
          if jq -e '.cutoverEnabled==true and .activeWorkers==["J1","J2","J3","J4","J5","J6"]' vaep/control/jules-workers.json >/dev/null 2>&1; then
            echo J1_J6_CUTOVER_ALREADY_ACTIVE=TRUE; exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/vaep/j1_j6_cutover.py'); t=p.read_text()
          for old,new in [
            ("t = must_replace(t, 'JULES_TASKS_TARGET_ROLLING_24H_TOTAL=400', 'JULES_TASKS_TARGET_ROLLING_24H_TOTAL=600', count=1)","t = must_replace(t, 'JULES_TASKS_TARGET_ROLLING_24H_TOTAL=400', 'JULES_TASKS_TARGET_ROLLING_24H_TOTAL=600', count=2)"),
            ("t = must_replace(t, 'LANE_REFILL_DEADLINE_SECONDS=90', 'LANE_REFILL_DEADLINE_SECONDS=30', count=1)","t = must_replace(t, 'LANE_REFILL_DEADLINE_SECONDS=90', 'LANE_REFILL_DEADLINE_SECONDS=30', count=2)")]:
              assert t.count(old)==1,(old,t.count(old)); t=t.replace(old,new)
          # Workflow entry points were already switched/paused through the GitHub
          # workflow-authorized path. The transformer must therefore mutate only
          # non-workflow control-plane files in this run.
          for call in [
            'transform_primary_workflows()',
            'transform_checkpoint_workflow()',
            'transform_stop_workflow()',
            'transform_engine_ci()',
            'final_assertions()',
          ]:
              marker=f'    {call}\n'
              assert t.count(marker)==1,(call,t.count(marker))
              t=t.replace(marker,'')
          p.write_text(t)
          PY
          python3 scripts/vaep/j1_j6_cutover.py
          # Workflow entry points are published separately with workflow permission.
          git checkout HEAD -- .github/workflows
          # New active helpers cannot retain legacy runtime credential selection.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('.github/scripts/vaep-checkpoint.sh'); t=p.read_text(); t='\n'.join(x for x in t.splitlines() if not re.match(r'^\s+JULES_[ABCD]\) printf ',x))+'\n'; p.write_text(t)
          p=Path('scripts/vaep/terminal_handoff.py'); t=p.read_text().replace('choices=["J1", "J2", "J3", "J4", "J5", "J6", "JULES_A", "JULES_B", "JULES_C", "JULES_D"]','choices=["J1", "J2", "J3", "J4", "J5", "J6"]'); p.write_text(t)
          Path('scripts/vaep/j1_j6_cutover.py').write_text('''#!/usr/bin/env python3\nimport json\nfrom pathlib import Path\nd=json.loads(Path("vaep/control/jules-workers.json").read_text())\nassert d["cutoverEnabled"] is True\nassert d["activeWorkers"] == ["J1","J2","J3","J4","J5","J6"]\nassert d["activeLegacyWorkers"] == []\nprint("J1_J6_CUTOVER_ACTIVE_OK")\n''')
          PY
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} + || true
          python3 scripts/vaep/j1_j6_registry_check.py
          python3 scripts/vaep/j1_j6_cutover.py
          bash -n .github/scripts/vaep-policy-parser.sh .github/scripts/vaep-jules-master.sh .github/scripts/vaep-jules-worker.sh .github/scripts/vaep-jules-autorefill.sh .github/scripts/vaep-jules-autorefill-core.sh .github/scripts/vaep-jules-catalog-floor.sh .github/scripts/vaep-parent-close.sh .github/scripts/vaep-checkpoint.sh
          node --check scripts/vaep/dispatch-preflight.mjs
          bash .github/scripts/vaep-policy-parser.sh --validate docs/VAEP_AUTHORITY.md
          bash .github/scripts/vaep-jules-master.sh --static-self-test
          jq -e '.cutoverEnabled==true and .activeLegacyWorkers==[] and .activeWorkers==["J1","J2","J3","J4","J5","J6"]' vaep/control/jules-workers.json >/dev/null
          jq -e '.policy.programmedBacklogTargetTotal==72 and .policy.activeWorkerCount==6 and (.lanes|keys|sort)==["J1","J2","J3","J4","J5","J6"]' vaep/control/jules-autorefill-catalog.json >/dev/null
          grep -Fq 'JULES_TASKS_TARGET_ROLLING_24H_TOTAL=600' docs/VAEP_AUTHORITY.md
          grep -Fq 'JULES_PROGRAMMED_BACKLOG_TARGET_TOTAL=72' docs/VAEP_AUTHORITY.md
          grep -Fq 'LANE_REFILL_DEADLINE_SECONDS=30' docs/VAEP_AUTHORITY.md
          git diff --check
          git fetch origin Desarrollo
          test "$(git rev-parse origin/Desarrollo)" = "$base" || { echo CUTOVER_ABORT_CONCURRENT_HEAD >&2; exit 75; }
          git add -A
          # Never ask GITHUB_TOKEN to modify workflow files.
          git reset HEAD -- .github/workflows >/dev/null
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat(vaep): activate canonical J1-J6 control plane'
          sha="$(git rev-parse HEAD)"
          git push origin HEAD:Desarrollo
          test "$(git ls-remote origin refs/heads/Desarrollo | cut -f1)" = "$sha"
          echo "CUTOVER_SHA=$sha"
          echo J1_J6_NONWORKFLOW_CUTOVER_PUBLISHED=PASS
