name: VAEP N6.6.C Persistence Build Once

on:
  push:
    branches:
      - Desarrollo
    paths:
      - '.github/workflows/vaep-n66c-persistence-build-once.yml'

permissions:
  contents: write

jobs:
  build-persistence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend
        run: dotnet restore backend/InventoryApp.sln

      - name: Materialize N6.6.C EF model and focused test
        shell: bash
        run: |
          set -euo pipefail

          cat > backend/src/Infrastructure/Persistence/Configurations/SecuenciaDocumentoConfiguration.cs <<'CS'
          using InventoryApp.Domain.Entities;
          using Microsoft.EntityFrameworkCore;
          using Microsoft.EntityFrameworkCore.Metadata.Builders;

          namespace InventoryApp.Infrastructure.Persistence.Configurations;

          /// <summary>
          /// N6.6.C — persistencia tenant-aware de numeraciones documentales.
          /// La identidad física del contador es Empresa + Sucursal opcional + TipoDocumento.
          /// SucursalScopeKey normaliza NULL a 0 para que MySQL no permita múltiples secuencias
          /// a nivel empresa por la semántica de NULL en índices UNIQUE.
          /// </summary>
          public sealed class SecuenciaDocumentoConfiguration : IEntityTypeConfiguration<SecuenciaDocumento>
          {
              public void Configure(EntityTypeBuilder<SecuenciaDocumento> builder)
              {
                  builder.ToTable("SecuenciasDocumento");

                  builder.HasKey(x => x.Id);

                  builder.Property(x => x.EmpresaId).IsRequired();
                  builder.Property(x => x.SucursalId);
                  builder.Property(x => x.TipoDocumento)
                      .HasMaxLength(80)
                      .IsRequired();
                  builder.Property(x => x.UltimoValor)
                      .IsRequired()
                      .HasDefaultValue(0L);
                  builder.Property(x => x.Prefijo)
                      .HasMaxLength(40)
                      .IsRequired();
                  builder.Property(x => x.LongitudNumero)
                      .IsRequired()
                      .HasDefaultValue(6);
                  builder.Property(x => x.Activa)
                      .IsRequired()
                      .HasDefaultValue(true);

                  builder.Property(x => x.CreadoPorNombreUsuario).HasMaxLength(150);
                  builder.Property(x => x.ActualizadoPorNombreUsuario).HasMaxLength(150);

                  builder.Property<int>("SucursalScopeKey")
                      .HasComputedColumnSql("IFNULL(`SucursalId`, 0)", stored: true);

                  builder.HasIndex("EmpresaId", "SucursalScopeKey", "TipoDocumento")
                      .IsUnique()
                      .HasDatabaseName("UX_SecuenciasDocumento_Empresa_Sucursal_Tipo");

                  builder.HasIndex(x => new { x.EmpresaId, x.Activa })
                      .HasDatabaseName("IX_SecuenciasDocumento_Empresa_Activa");

                  builder.HasIndex(x => x.SucursalId)
                      .HasDatabaseName("IX_SecuenciasDocumento_SucursalId");

                  builder.HasOne<Empresa>()
                      .WithMany()
                      .HasForeignKey(x => x.EmpresaId)
                      .OnDelete(DeleteBehavior.Restrict);

                  builder.HasOne<Sucursal>()
                      .WithMany()
                      .HasForeignKey(x => x.SucursalId)
                      .OnDelete(DeleteBehavior.Restrict)
                      .IsRequired(false);
              }
          }
          CS

          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/src/Infrastructure/Persistence/AppDbContext.cs')
          text = path.read_text(encoding='utf-8-sig')
          marker = '    public DbSet<UsuarioEmpresa> UsuarioEmpresas => Set<UsuarioEmpresa>();\n'
          addition = marker + '    public DbSet<SecuenciaDocumento> SecuenciasDocumento => Set<SecuenciaDocumento>();\n'
          if 'DbSet<SecuenciaDocumento> SecuenciasDocumento' not in text:
              if marker not in text:
                  raise SystemExit('AppDbContext insertion marker not found')
              text = text.replace(marker, addition, 1)
              path.write_text(text, encoding='utf-8')
          PY

          cat > backend/tests/InventoryApp.Tests/NumeracionDocumentoPersistenceTests.cs <<'CS'
          using InventoryApp.Domain.Entities;
          using InventoryApp.Infrastructure.Persistence;
          using Microsoft.EntityFrameworkCore;
          using Xunit;

          namespace InventoryApp.Tests;

          public class NumeracionDocumentoPersistenceTests
          {
              [Fact]
              public void ModeloEf_PersisteScopeTenantConUnicidadFisicaParaSucursalOpcional()
              {
                  var options = new DbContextOptionsBuilder<AppDbContext>()
                      .UseInMemoryDatabase($"numeracion-{Guid.NewGuid():N}")
                      .Options;

                  using var db = new AppDbContext(options);
                  var entity = db.Model.FindEntityType(typeof(SecuenciaDocumento));

                  Assert.NotNull(entity);
                  Assert.Equal("SecuenciasDocumento", entity!.GetTableName());
                  Assert.NotNull(entity.FindProperty("SucursalScopeKey"));
                  Assert.Equal("IFNULL(`SucursalId`, 0)", entity.FindProperty("SucursalScopeKey")!.GetComputedColumnSql());

                  var scopeIndex = Assert.Single(entity.GetIndexes(), index =>
                      index.IsUnique && index.GetDatabaseName() == "UX_SecuenciasDocumento_Empresa_Sucursal_Tipo");
                  Assert.Equal(
                      new[] { "EmpresaId", "SucursalScopeKey", "TipoDocumento" },
                      scopeIndex.Properties.Select(property => property.Name).ToArray());

                  Assert.Contains(entity.GetForeignKeys(), fk =>
                      fk.PrincipalEntityType.ClrType == typeof(Empresa) &&
                      fk.Properties.Select(property => property.Name).SequenceEqual(new[] { "EmpresaId" }));
                  Assert.Contains(entity.GetForeignKeys(), fk =>
                      fk.PrincipalEntityType.ClrType == typeof(Sucursal) &&
                      fk.Properties.Select(property => property.Name).SequenceEqual(new[] { "SucursalId" }));
              }
          }
          CS

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 8.0.2

      - name: Generate migration and snapshot from the current model
        shell: bash
        run: |
          set -euo pipefail
          dotnet ef migrations add N66CNumeracionPersistence \
            --project backend/src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project backend/src/API/InventoryApp.API.csproj \
            --output-dir Migrations

          grep -q 'InventoryApp.Domain.Entities.SecuenciaDocumento' backend/src/Infrastructure/Migrations/AppDbContextModelSnapshot.cs
          grep -R -q 'UX_SecuenciasDocumento_Empresa_Sucursal_Tipo' backend/src/Infrastructure/Migrations/*N66CNumeracionPersistence*.cs
          grep -R -q 'SucursalScopeKey' backend/src/Infrastructure/Migrations/*N66CNumeracionPersistence*.cs

      - name: Build and run focused persistence tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet build backend/InventoryApp.sln --no-restore
          dotnet test backend/tests/InventoryApp.Tests/InventoryApp.Tests.csproj \
            --no-build --no-restore \
            --filter FullyQualifiedName~NumeracionDocumentoPersistenceTests

      - name: Commit material persistence and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/vaep-n66c-persistence-build-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/Infrastructure/Persistence/AppDbContext.cs \
                  backend/src/Infrastructure/Persistence/Configurations/SecuenciaDocumentoConfiguration.cs \
                  backend/src/Infrastructure/Migrations \
                  backend/tests/InventoryApp.Tests/NumeracionDocumentoPersistenceTests.cs
          git diff --cached --stat
          git commit -m 'feat(n6.6.c): persist tenant document sequences'
          git push origin HEAD:Desarrollo
