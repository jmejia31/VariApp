name: Fase 3 - aplicar integración financiera

on:
  push:
    branches: [Desarrollo]
    paths:
      - .github/checkpoints/fase3-integracion-financiera

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Integrar envío en venta, factura y DI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              if old not in text:
                  raise SystemExit(f'Patrón no encontrado en {path}: {old[:100]}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          program = 'backend/src/API/Program.cs'
          replace(program,
              'builder.Services.AddScoped<IImpuestoService, ImpuestoService>();\nbuilder.Services.AddScoped<ICalculoService, CalculoService>();',
              'builder.Services.AddScoped<IImpuestoService, ImpuestoService>();\nbuilder.Services.AddScoped<ICostoEnvioRepository, CostoEnvioRepository>();\nbuilder.Services.AddScoped<ICostoEnvioService, CostoEnvioService>();\nbuilder.Services.AddScoped<ICalculoService, CalculoService>();')

          venta = 'backend/src/Application/Services/VentaService.cs'
          replace(venta,
              'await CalcularTotalesAsync(venta, dto.CodigoPromocional);',
              'await CalcularTotalesAsync(venta, dto.CodigoPromocional, dto.CostoEnvioId, dto.EnvioExonerado, dto.MotivoExoneracionEnvio);')
          replace(venta,
              'return await _calculoService.CalcularVentaAsync(entradas, request.ClienteId, _currentUser.RolId, request.CodigoPromocional);',
              'return await _calculoService.CalcularVentaAsync(entradas, request.ClienteId, _currentUser.RolId, request.CodigoPromocional, request.CostoEnvioId, request.EnvioExonerado, request.MotivoExoneracionEnvio);')
          replace(venta,
              'private async Task CalcularTotalesAsync(Venta venta, string? codigoPromocional)',
              'private async Task CalcularTotalesAsync(Venta venta, string? codigoPromocional, int? costoEnvioId, bool envioExonerado, string? motivoExoneracionEnvio)')
          replace(venta,
              'entradas, venta.ClienteId, _currentUser.RolId, codigoPromocional);',
              'entradas, venta.ClienteId, _currentUser.RolId, codigoPromocional, costoEnvioId, envioExonerado, motivoExoneracionEnvio);')
          replace(venta,
              'venta.Subtotal = resultado.Subtotal;\n        venta.Descuento = resultado.TotalDescuento;',
              'venta.ImporteBruto = resultado.ImporteBruto;\n        venta.ImporteProductos = resultado.ImporteProductos;\n        venta.Subtotal = resultado.Subtotal;\n        venta.Descuento = resultado.TotalDescuento;')
          replace(venta,
              'venta.Impuesto = resultado.TotalImpuesto;\n        venta.Total = resultado.Total;',
              'venta.Impuesto = resultado.TotalImpuesto;\n        venta.CostoEnvioId = resultado.CostoEnvioId;\n        venta.CostoEnvioNombreSnapshot = resultado.CostoEnvioNombre;\n        venta.CostoEnvioMontoSnapshot = resultado.CostoEnvio;\n        venta.CostoEnvio = resultado.CostoEnvio;\n        venta.EnvioExonerado = resultado.EnvioExonerado;\n        venta.MotivoExoneracionEnvio = resultado.MotivoExoneracionEnvio;\n        venta.Total = resultado.Total;')
          replace(venta,
              'Subtotal = venta.Subtotal,\n                Descuento = venta.Descuento,\n                Impuesto = venta.Impuesto,\n                Total = venta.Total,',
              'ImporteBruto = venta.ImporteBruto,\n                Subtotal = venta.Subtotal,\n                Descuento = venta.Descuento,\n                Impuesto = venta.Impuesto,\n                CostoEnvioId = venta.CostoEnvioId,\n                CostoEnvioNombreSnapshot = venta.CostoEnvioNombreSnapshot,\n                CostoEnvioMontoSnapshot = venta.CostoEnvioMontoSnapshot,\n                CostoEnvio = venta.CostoEnvio,\n                EnvioExonerado = venta.EnvioExonerado,\n                MotivoExoneracionEnvio = venta.MotivoExoneracionEnvio,\n                Total = venta.Total,\n                SaldoPendiente = venta.Total,')
          replace(venta,
              'MetodoPago = v.MetodoPago.ToString(),\n        Subtotal = v.Subtotal,',
              'MetodoPago = v.MetodoPago.ToString(),\n        ImporteBruto = v.ImporteBruto,\n        ImporteProductos = v.ImporteProductos,\n        Subtotal = v.Subtotal,')
          replace(venta,
              'Impuesto = v.Impuesto,\n        Total = v.Total,',
              'Impuesto = v.Impuesto,\n        CostoEnvio = v.CostoEnvio,\n        CostoEnvioId = v.CostoEnvioId,\n        CostoEnvioNombre = v.CostoEnvioNombreSnapshot,\n        EnvioExonerado = v.EnvioExonerado,\n        MotivoExoneracionEnvio = v.MotivoExoneracionEnvio,\n        Total = v.Total,')

          migration = Path('backend/src/Infrastructure/Migrations/20260728133412_Fase8FacturacionPagosCostosEnvioVariantes.cs')
          if not migration.exists():
              candidates = list(Path('backend/src/Infrastructure/Migrations').glob('*Fase8FacturacionPagosCostosEnvioVariantes.cs'))
              if len(candidates) != 1:
                  raise SystemExit('No se encontró una única migración de facturación')
              migration = candidates[0]
          text = migration.read_text(encoding='utf-8-sig')
          marker = '            migrationBuilder.CreateIndex(\n                name: "IX_CostosEnvio_Activo_EsPredeterminado",'
          seed = '''            migrationBuilder.InsertData(\n                table: "CostosEnvio",\n                columns: new[] { "Id", "Nombre", "Descripcion", "Monto", "Prioridad", "EsPredeterminado", "Activo", "Eliminado", "FechaCreacion", "FechaActualizacion" },\n                values: new object[] { 1, "Envío estándar", "Costo de envío predeterminado de VariStorehn", 80.00m, 1, true, true, false, new DateTime(2026, 7, 28, 0, 0, 0, DateTimeKind.Utc), new DateTime(2026, 7, 28, 0, 0, 0, DateTimeKind.Utc) });\n\n'''
          if 'Costo de envío predeterminado de VariStorehn' not in text:
              if marker not in text:
                  raise SystemExit('No se encontró punto para seed de envío')
              text = text.replace(marker, seed + marker)
              migration.write_text(text, encoding='utf-8')
          PY

      - name: Publicar integración
        run: |
          git config user.name 'VariApp Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/src/API/Program.cs backend/src/Application/Services/VentaService.cs backend/src/Infrastructure/Migrations
          git commit -m 'feat: integrar costo de envío en ventas y facturas'
          git push origin HEAD:Desarrollo
