name: VAEP Jules Feedback Relay

on:
  push:
    branches:
      - Desarrollo
    paths:
      - "vaep/jules/feedback/*.json"

permissions:
  contents: read
  issues: write

concurrency:
  group: vaep-jules-feedback
  cancel-in-progress: false

jobs:
  relay-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      EXPECTED_BRANCH: Desarrollo
      J1_KEY: ${{ secrets.JULES_J1_API_KEY }}
      J2_KEY: ${{ secrets.JULES_J2_API_KEY }}
      J3_KEY: ${{ secrets.JULES_J3_API_KEY }}
      J4_KEY: ${{ secrets.JULES_J4_API_KEY }}
      J5_KEY: ${{ secrets.JULES_J5_API_KEY }}
      J6_KEY: ${{ secrets.JULES_J6_API_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout feedback commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Bind VAEP MASTER authority
        shell: bash
        run: |
          set -euo pipefail
          MASTER_FILE='docs/VAEP_AUTHORITY.md'
          PARSER='.github/scripts/vaep-policy-parser.sh'
          test -f "$MASTER_FILE"
          test -f "$PARSER"
          bash "$PARSER" --validate "$MASTER_FILE" >/dev/null
          echo "MASTER_COMMIT_SHA=$(bash "$PARSER" --commit-sha "$MASTER_FILE")" >> "$GITHUB_ENV"
          echo "AUTOMATION_POLICY_HASH=$(bash "$PARSER" --hash "$MASTER_FILE")" >> "$GITHUB_ENV"

      - name: Validate canonical feedback manifest
        id: manifest
        shell: bash
        run: |
          set +e

          mapfile -t added_manifests < <(
            git diff-tree --no-commit-id --name-only --diff-filter=A -r "$GITHUB_SHA" -- "vaep/jules/feedback/*.json"
          )

          manifest_candidate=""
          feedback_id=""
          dispatch_id=""
          task_id=""
          session_name=""
          worker_id=""

          if [[ ${#added_manifests[@]} -eq 1 ]]; then
            manifest_candidate="${added_manifests[0]}"
            feedback_id="$(jq -r '.feedbackId // empty' "$manifest_candidate" 2>/dev/null)"
            dispatch_id="$(jq -r '.dispatchId // empty' "$manifest_candidate" 2>/dev/null)"
            task_id="$(jq -r '.taskId // empty' "$manifest_candidate" 2>/dev/null)"
            session_name="$(jq -r '.sessionName // empty' "$manifest_candidate" 2>/dev/null)"
            worker_id="$(jq -r '.workerId // empty' "$manifest_candidate" 2>/dev/null)"
          fi

          {
            printf 'manifest=%s\n' "$manifest_candidate"
            printf 'feedback_id=%s\n' "$feedback_id"
            printf 'dispatch_id=%s\n' "$dispatch_id"
            printf 'task_id=%s\n' "$task_id"
            printf 'session_name=%s\n' "$session_name"
            printf 'worker_id=%s\n' "$worker_id"
          } >> "$GITHUB_OUTPUT"

          set -euo pipefail

          if [[ ${#added_manifests[@]} -ne 1 ]]; then
            echo "Expected exactly one newly added Jules feedback manifest; found ${#added_manifests[@]}." >&2
            exit 21
          fi

          manifest="${added_manifests[0]}"
          mapfile -t changed_files < <(
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA"
          )
          if [[ ${#changed_files[@]} -ne 1 || "${changed_files[0]}" != "$manifest" ]]; then
            echo "Feedback commit must change exactly the single new feedback manifest." >&2
            printf 'Changed files:\n' >&2
            printf ' - %s\n' "${changed_files[@]}" >&2
            exit 22
          fi

          jq -e '
            type == "object" and
            (.feedbackId | type == "string" and test("^[A-Za-z0-9_.-]+$")) and
            (.dispatchId | type == "string" and test("^[A-Za-z0-9_.-]+$")) and
            (.taskId | type == "string" and test("^[A-Za-z0-9_.-]+$")) and
            (.workerId | type == "string" and test("^J[1-6]$")) and
            (.sessionName | type == "string" and test("^sessions/[0-9]+$")) and
            (.expectedBranch == "Desarrollo") and
            (.prompt | type == "string" and length > 0 and length <= 8000)
          ' "$manifest" >/dev/null

          worker_id="$(jq -r '.workerId' "$manifest")"
          case "$worker_id" in
            J1) test -n "${J1_KEY:-}" ;;
            J2) test -n "${J2_KEY:-}" ;;
            J3) test -n "${J3_KEY:-}" ;;
            J4) test -n "${J4_KEY:-}" ;;
            J5) test -n "${J5_KEY:-}" ;;
            J6) test -n "${J6_KEY:-}" ;;
            *) exit 23 ;;
          esac

          printf 'manifest=%s\n' "$manifest" >> "$GITHUB_OUTPUT"

      - name: Inspect Jules session
        id: session
        shell: bash
        env:
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest }}
          DISPATCH_ID: ${{ steps.manifest.outputs.dispatch_id }}
          SESSION_NAME: ${{ steps.manifest.outputs.session_name }}
          WORKER_ID: ${{ steps.manifest.outputs.worker_id }}
        run: |
          set -euo pipefail
          case "$WORKER_ID" in
            J1) key="$J1_KEY" ;;
            J2) key="$J2_KEY" ;;
            J3) key="$J3_KEY" ;;
            J4) key="$J4_KEY" ;;
            J5) key="$J5_KEY" ;;
            J6) key="$J6_KEY" ;;
            *) exit 29 ;;
          esac

          mkdir -p "$RUNNER_TEMP/vaep-jules-feedback"

          curl --fail-with-body --silent --show-error \
            -H "x-goog-api-key: $key" \
            "$JULES_API_BASE/$SESSION_NAME" \
            > "$RUNNER_TEMP/vaep-jules-feedback/session-before.json"

          expected_title="VAEP-${WORKER_ID} ${DISPATCH_ID}"
          jq -e \
            --arg title "$expected_title" \
            --arg branch "$EXPECTED_BRANCH" \
            '
              .title == $title and
              .sourceContext.githubRepoContext.startingBranch == $branch
            ' \
            "$RUNNER_TEMP/vaep-jules-feedback/session-before.json" >/dev/null || {
              echo "Session identity/branch does not match the requested canonical VariApp dispatch." >&2
              exit 30
            }

          state="$(jq -r '.state // "UNKNOWN"' "$RUNNER_TEMP/vaep-jules-feedback/session-before.json")"
          printf 'before_state=%s\n' "$state" >> "$GITHUB_OUTPUT"

          case "$state" in
            COMPLETED)
              printf 'action=NOOP_COMPLETED\n' >> "$GITHUB_OUTPUT"
              ;;
            AWAITING_PLAN_APPROVAL)
              printf 'action=APPROVE_PLAN\n' >> "$GITHUB_OUTPUT"
              ;;
            AWAITING_USER_FEEDBACK)
              printf 'action=SEND_MESSAGE\n' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Feedback relay refuses unexpected session state: $state" >&2
              exit 31
              ;;
          esac

      - name: Approve Jules plan when already authorized by VAEP
        if: steps.session.outputs.action == 'APPROVE_PLAN'
        shell: bash
        env:
          SESSION_NAME: ${{ steps.manifest.outputs.session_name }}
          WORKER_ID: ${{ steps.manifest.outputs.worker_id }}
        run: |
          set -euo pipefail
          case "$WORKER_ID" in
            J1) key="$J1_KEY" ;;
            J2) key="$J2_KEY" ;;
            J3) key="$J3_KEY" ;;
            J4) key="$J4_KEY" ;;
            J5) key="$J5_KEY" ;;
            J6) key="$J6_KEY" ;;
            *) exit 32 ;;
          esac

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: $key" \
            "$JULES_API_BASE/$SESSION_NAME:approvePlan" \
            >/dev/null

      - name: Send VAEP feedback to Jules
        if: steps.session.outputs.action == 'SEND_MESSAGE'
        shell: bash
        env:
          MANIFEST_PATH: ${{ steps.manifest.outputs.manifest }}
          SESSION_NAME: ${{ steps.manifest.outputs.session_name }}
          WORKER_ID: ${{ steps.manifest.outputs.worker_id }}
        run: |
          set -euo pipefail
          case "$WORKER_ID" in
            J1) key="$J1_KEY" ;;
            J2) key="$J2_KEY" ;;
            J3) key="$J3_KEY" ;;
            J4) key="$J4_KEY" ;;
            J5) key="$J5_KEY" ;;
            J6) key="$J6_KEY" ;;
            *) exit 33 ;;
          esac

          prompt="$(jq -r '.prompt' "$MANIFEST_PATH")"
          jq -n --arg prompt "$prompt" '{prompt:$prompt}' \
            > "$RUNNER_TEMP/vaep-jules-feedback/send-message.json"

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: $key" \
            --data-binary @"$RUNNER_TEMP/vaep-jules-feedback/send-message.json" \
            "$JULES_API_BASE/$SESSION_NAME:sendMessage" \
            >/dev/null

      - name: Confirm feedback was consumed
        id: confirm
        if: steps.session.outputs.action != 'NOOP_COMPLETED'
        shell: bash
        env:
          SESSION_NAME: ${{ steps.manifest.outputs.session_name }}
          BEFORE_STATE: ${{ steps.session.outputs.before_state }}
          WORKER_ID: ${{ steps.manifest.outputs.worker_id }}
        run: |
          set -euo pipefail
          case "$WORKER_ID" in
            J1) key="$J1_KEY" ;;
            J2) key="$J2_KEY" ;;
            J3) key="$J3_KEY" ;;
            J4) key="$J4_KEY" ;;
            J5) key="$J5_KEY" ;;
            J6) key="$J6_KEY" ;;
            *) exit 34 ;;
          esac

          deadline=$((SECONDS + 300))
          after_state="$BEFORE_STATE"

          while (( SECONDS < deadline )); do
            curl --fail-with-body --silent --show-error \
              -H "x-goog-api-key: $key" \
              "$JULES_API_BASE/$SESSION_NAME" \
              > "$RUNNER_TEMP/vaep-jules-feedback/session-after.json"

            after_state="$(jq -r '.state // "UNKNOWN"' "$RUNNER_TEMP/vaep-jules-feedback/session-after.json")"
            echo "Jules feedback state: $after_state"

            case "$after_state" in
              QUEUED|PLANNING|IN_PROGRESS|COMPLETED)
                break
                ;;
              FAILED|PAUSED)
                break
                ;;
              AWAITING_USER_FEEDBACK|AWAITING_PLAN_APPROVAL)
                sleep 10
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          printf 'after_state=%s\n' "$after_state" >> "$GITHUB_OUTPUT"

          if [[ "$after_state" == "AWAITING_USER_FEEDBACK" || "$after_state" == "AWAITING_PLAN_APPROVAL" ]]; then
            echo "Jules remained waiting after VAEP feedback." >&2
            exit 40
          fi
          if [[ "$after_state" == "FAILED" || "$after_state" == "PAUSED" ]]; then
            echo "Jules entered non-success state after VAEP feedback: $after_state" >&2
            exit 41
          fi

      - name: Register feedback evidence
        if: always()
        shell: bash
        env:
          FEEDBACK_ID: ${{ steps.manifest.outputs.feedback_id }}
          DISPATCH_ID: ${{ steps.manifest.outputs.dispatch_id }}
          TASK_ID: ${{ steps.manifest.outputs.task_id }}
          SESSION_NAME: ${{ steps.manifest.outputs.session_name }}
          WORKER_ID: ${{ steps.manifest.outputs.worker_id }}
          BEFORE_STATE: ${{ steps.session.outputs.before_state }}
          ACTION: ${{ steps.session.outputs.action }}
          AFTER_STATE: ${{ steps.confirm.outputs.after_state }}
        run: |
          set -euo pipefail

          feedback_id="${FEEDBACK_ID:-UNKNOWN}"
          dispatch_id="${DISPATCH_ID:-UNKNOWN}"
          task_id="${TASK_ID:-UNKNOWN}"
          session_name="${SESSION_NAME:-UNKNOWN}"
          worker_id="${WORKER_ID:-UNKNOWN}"
          before_state="${BEFORE_STATE:-UNKNOWN}"
          action="${ACTION:-UNKNOWN}"
          after_state="${AFTER_STATE:-NOT_POLLED}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          printf -v body '%s\n\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            'VAEP Jules automated feedback relay.' \
            "- Worker: \`$worker_id\`" \
            "- Feedback: \`$feedback_id\`" \
            "- Dispatch: \`$dispatch_id\`" \
            "- Task: \`$task_id\`" \
            "- Session: \`$session_name\`" \
            "- Before: \`$before_state\`; action: \`$action\`; after: \`$after_state\`" \
            "- Workflow run: $run_url"

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "[VAEP-JULES-FEEDBACK] $feedback_id" \
            --body "$body" >/dev/null
