name: VAEP Jules C Recovery Worker

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vaep-jules-c-recovery
  cancel-in-progress: false

jobs:
  dispatch-jules-c-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      EXPECTED_OWNER: jmejia31
      EXPECTED_REPO: VariApp
      EXPECTED_BRANCH: Desarrollo
      DISPATCH_PATH: vaep/jules-c/dispatch
      SESSION_TITLE_PREFIX: "VAEP-C "
      ARTIFACT_PREFIX: vaep-jules-c-recovery
      ISSUE_PREFIX: "[VAEP-JULES-C-RECOVERY]"
      WORKER_LABEL: Jules C
      WORKER_ID: JULES_C
      VAEP_JULES_LANE_BUDGET_SECONDS: 1200
      JULES_API_KEY: ${{ secrets.JULES_C_API_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout recovery commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Execute VAEP Jules v3.27 deterministic clarification guard
        shell: bash
        run: bash .github/scripts/vaep-jules-no-clarification-v327.sh

      - name: Upload Jules C recovery result artifact
        if: always() && env.RESULT_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: error
          retention-days: 14
