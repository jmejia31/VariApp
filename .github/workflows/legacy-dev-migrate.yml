name: LEGACY DEV - Migración definitiva a SOLQARYN DEV

on:
  push:
    branches:
      - dev
    paths:
      - .github/checkpoints/legacy-dev-migrate-request

permissions:
  contents: read
  actions: read

concurrency:
  group: legacy-dev-definitive-migration
  cancel-in-progress: false

jobs:
  target-key:
    name: Preparar transporte cifrado hacia DEV
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: DEV
    env:
      TARGET_BACKUP_PASSPHRASE: ${{ secrets.SOLQARYN_DEV_BACKUP_PASSPHRASE }}
    steps:
      - name: Generar clave efímera y proteger clave privada
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_BACKUP_PASSPHRASE"
          export GNUPGHOME="$RUNNER_TEMP/gnupg-keygen"
          mkdir -p "$GNUPGHOME" transport-key
          chmod 700 "$GNUPGHOME"
          cat > "$RUNNER_TEMP/keyparams" <<'EOF'
          Key-Type: RSA
          Key-Length: 3072
          Key-Usage: encrypt
          Name-Real: SOLQARYN DEV Migration Ephemeral
          Name-Email: migration@solqaryn.invalid
          Expire-Date: 1d
          %no-protection
          %commit
          EOF
          gpg --batch --generate-key "$RUNNER_TEMP/keyparams"
          fpr="$(gpg --batch --with-colons --list-keys migration@solqaryn.invalid | awk -F: '$1=="fpr"{print $10; exit}')"
          test -n "$fpr"
          gpg --batch --armor --export "$fpr" > transport-key/public.asc
          gpg --batch --armor --export-secret-keys "$fpr" > "$RUNNER_TEMP/private.asc"
          printf '%s' "$TARGET_BACKUP_PASSPHRASE" |
            gpg --batch --yes --no-tty --pinentry-mode loopback --passphrase-fd 0               --symmetric --cipher-algo AES256 --digest-algo SHA256               --output transport-key/private.asc.gpg "$RUNNER_TEMP/private.asc"
          test -s transport-key/public.asc
          test -s transport-key/private.asc.gpg
          rm -f "$RUNNER_TEMP/private.asc"
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-dev-transport-key
          retention-days: 1
          path: transport-key/

  source-export:
    name: Convertir backup legacy verificado a payload cifrado
    needs: target-key
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: LEGACY_DEV_MIGRATION
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_legacy_source_snapshot
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    env:
      LEGACY_BACKUP_PASSPHRASE: ${{ secrets.LEGACY_DEV_BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mysql-client gnupg
      - uses: actions/download-artifact@v4
        with:
          name: legacy-dev-transport-key
          path: transport-key
      - name: Descargar backup legacy DEV previamente verificado
        uses: actions/download-artifact@v4
        with:
          name: legacy-dev-varistorehn-desarrollo-36165239643
          path: verified-backup
          github-token: ${{ github.token }}
          repository: solqaryn/Solqaryn
          run-id: 36165239643
      - name: Restaurar snapshot verificado localmente
        shell: bash
        run: |
          set -euo pipefail
          backup="$(find verified-backup -type f -name '*.tar.gz.gpg' -print -quit)"
          test -n "$backup"
          test -f "$backup.sha256"
          export BACKUP_FILE="$backup"
          export BACKUP_CHECKSUM_FILE="$backup.sha256"
          export BACKUP_PASSPHRASE="$LEGACY_BACKUP_PASSPHRASE"
          export RESTORE_ENVIRONMENT=dev-disposable
          export TARGET_DB_HOST=127.0.0.1
          export TARGET_DB_PORT=3306
          export TARGET_DB_NAME=solqaryn_legacy_source_snapshot
          export TARGET_DB_USER=root
          export TARGET_DB_PASSWORD=root
          export TARGET_DB_SSL_MODE=REQUIRED
          export ALLOW_DESTRUCTIVE_RESTORE=YES_SOLQARYN_DISPOSABLE_RESTORE
          export RESTORE_REPORT_PATH="$RUNNER_TEMP/source-restore-report.json"
          export RESTORE_FILES_DIR="$RUNNER_TEMP/source-restored-files"
          bash scripts/restore_dev.sh
      - name: Crear dump completo desde el snapshot restaurado
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD=root
          mkdir -p source-payload
          DB=solqaryn_legacy_source_snapshot
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root --ssl-mode=REQUIRED "$DB" --batch --skip-column-names -e "
            SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES
            WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE';" | grep -qx '137'
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root --ssl-mode=REQUIRED "$DB" --batch --skip-column-names -e "SELECT COUNT(*) FROM __EFMigrationsHistory;" | grep -qx '107'
          mysqldump --protocol=TCP -h 127.0.0.1 -P 3306 -u root --ssl-mode=REQUIRED             --single-transaction --skip-lock-tables --quick --hex-blob             --default-character-set=utf8mb4 --no-tablespaces --triggers             --set-gtid-purged=OFF --skip-add-locks --skip-disable-keys             "$DB" > source-payload/source-full.sql
          test -s source-payload/source-full.sql
          : > source-payload/source-counts.tsv
          while IFS= read -r table_name; do
            test -n "$table_name" || continue
            count="$(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root --ssl-mode=REQUIRED "$DB" --batch --skip-column-names -e "SELECT COUNT(*) FROM \`$table_name\`;")"
            printf '%s\t%s\n' "$table_name" "$count" >> source-payload/source-counts.tsv
          done < <(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root --ssl-mode=REQUIRED "$DB" --batch --skip-column-names -e "
            SELECT TABLE_NAME FROM INFORMATION_SCHEMA.TABLES
            WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE'
            ORDER BY TABLE_NAME;")
          cp "$RUNNER_TEMP/source-restore-report.json" source-payload/source-restore-report.json
          tar -czf "$RUNNER_TEMP/source-payload.tar.gz" -C source-payload .
      - name: Cifrar payload para DEV
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg-source"
          mkdir -p "$GNUPGHOME" encrypted
          chmod 700 "$GNUPGHOME"
          gpg --batch --import transport-key/public.asc
          fpr="$(gpg --batch --with-colons --list-keys migration@solqaryn.invalid | awk -F: '$1=="fpr"{print $10; exit}')"
          test -n "$fpr"
          gpg --batch --yes --trust-model always --recipient "$fpr"             --output encrypted/source-payload.tar.gz.gpg             --encrypt "$RUNNER_TEMP/source-payload.tar.gz"
          test -s encrypted/source-payload.tar.gz.gpg
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-dev-encrypted-source-payload
          retention-days: 1
          path: encrypted/source-payload.tar.gz.gpg

  migrate-target:
    name: Backup, guardas y migración atómica de solqaryn_dev
    needs: source-export
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: DEV
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_target_backup_restore
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    env:
      DB_HOST: ${{ vars.SOLQARYN_DEV_DB_HOST }}
      DB_PORT: ${{ vars.SOLQARYN_DEV_DB_PORT }}
      DB_NAME: ${{ vars.SOLQARYN_DEV_DB_NAME }}
      DB_USER: ${{ vars.SOLQARYN_DEV_DB_USER }}
      DB_PASSWORD: ${{ secrets.SOLQARYN_DEV_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.SOLQARYN_DEV_BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mysql-client gnupg jq
      - uses: actions/download-artifact@v4
        with:
          name: legacy-dev-transport-key
          path: transport-key
      - uses: actions/download-artifact@v4
        with:
          name: legacy-dev-encrypted-source-payload
          path: encrypted-source
      - name: Descifrar payload únicamente dentro del runner DEV
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BACKUP_PASSPHRASE"
          export GNUPGHOME="$RUNNER_TEMP/gnupg-target"
          mkdir -p "$GNUPGHOME" "$RUNNER_TEMP/source"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$BACKUP_PASSPHRASE" |
            gpg --batch --yes --no-tty --pinentry-mode loopback --passphrase-fd 0               --decrypt --output "$RUNNER_TEMP/private.asc" transport-key/private.asc.gpg
          gpg --batch --import "$RUNNER_TEMP/private.asc"
          gpg --batch --yes --decrypt             --output "$RUNNER_TEMP/source-payload.tar.gz"             encrypted-source/source-payload.tar.gz.gpg
          tar -xzf "$RUNNER_TEMP/source-payload.tar.gz" -C "$RUNNER_TEMP/source"
          test -s "$RUNNER_TEMP/source/source-full.sql"
          test -s "$RUNNER_TEMP/source/source-counts.tsv"
          rm -f "$RUNNER_TEMP/private.asc"
      - name: Backup cifrado de solqaryn_dev antes de modificar datos
        shell: bash
        env:
          SOLQARYN_ENVIRONMENT: dev
          DB_SSL_MODE: REQUIRED
          BACKUP_LABEL: pre-legacy-migration
          RETENTION_DAYS: "14"
          OUTPUT_DIR: ${{ runner.temp }}/target-backup
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          bash scripts/backup_dev.sh
          backup="$(find "$OUTPUT_DIR" -type f -name '*.tar.gz.gpg' -print -quit)"
          test -n "$backup"
          echo "TARGET_BACKUP_FILE=$backup" >> "$GITHUB_ENV"
          echo "TARGET_BACKUP_CHECKSUM=$backup.sha256" >> "$GITHUB_ENV"
          echo "TARGET_BACKUP_META=${backup%.tar.gz.gpg}.meta.json" >> "$GITHUB_ENV"
      - name: Verificar que el backup del destino restaura antes del corte
        shell: bash
        run: |
          set -euo pipefail
          export BACKUP_FILE="$TARGET_BACKUP_FILE"
          export BACKUP_CHECKSUM_FILE="$TARGET_BACKUP_CHECKSUM"
          export RESTORE_ENVIRONMENT=dev-disposable
          export TARGET_DB_HOST=127.0.0.1
          export TARGET_DB_PORT=3306
          export TARGET_DB_NAME=solqaryn_target_backup_restore
          export TARGET_DB_USER=root
          export TARGET_DB_PASSWORD=root
          export TARGET_DB_SSL_MODE=REQUIRED
          export ALLOW_DESTRUCTIVE_RESTORE=YES_SOLQARYN_DISPOSABLE_RESTORE
          export RESTORE_REPORT_PATH="$RUNNER_TEMP/target-restore-report.json"
          export RESTORE_FILES_DIR="$RUNNER_TEMP/target-restored-files"
          bash scripts/restore_dev.sh
          jq -e '.status=="SUCCESS" and .checksumsVerified==true and .allTableRowCountsVerified==true'             "$RUNNER_TEMP/target-restore-report.json" >/dev/null
      - name: Guardas destructivas de destino
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD="$DB_PASSWORD"
          MYSQL=(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED "$DB_NAME" --batch --skip-column-names)
          "${MYSQL[@]}" -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE';" | grep -qx '137'
          "${MYSQL[@]}" -e "SELECT COUNT(*) FROM __EFMigrationsHistory;" | grep -qx '107'
          non_innodb="$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE' AND ENGINE <> 'InnoDB';")"
          test "$non_innodb" = "0"
          business="$("${MYSQL[@]}" -e "
            SELECT
              (SELECT COUNT(*) FROM Productos) +
              (SELECT COUNT(*) FROM Categorias) +
              (SELECT COUNT(*) FROM Clientes) +
              (SELECT COUNT(*) FROM Proveedores) +
              (SELECT COUNT(*) FROM Compras) +
              (SELECT COUNT(*) FROM Ventas) +
              (SELECT COUNT(*) FROM Facturas) +
              (SELECT COUNT(*) FROM OrdenesCompra) +
              (SELECT COUNT(*) FROM MovimientosInventario);")"
          test "$business" = "0" || { echo "ABORT: solqaryn_dev ya contiene datos de negocio ($business filas protegidas)."; exit 41; }
          "${MYSQL[@]}" -e "
            CREATE TABLE __solqaryn_migration_probe (Id INT NOT NULL PRIMARY KEY) ENGINE=InnoDB;
            CREATE TRIGGER __solqaryn_migration_probe_bi BEFORE INSERT ON __solqaryn_migration_probe
              FOR EACH ROW SET NEW.Id = NEW.Id;
            DROP TRIGGER __solqaryn_migration_probe_bi;
            DROP TABLE __solqaryn_migration_probe;"
          echo "GUARDAS_DESTINO=PASS"
      - name: Preparar rollback completo y ejecutar migración
        shell: bash
        run: |
          set -Eeuo pipefail
          export MYSQL_PWD="$DB_PASSWORD"
          MYSQL_BASE=(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED "$DB_NAME")
          MYSQL_BATCH=(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED "$DB_NAME" --batch --skip-column-names)

          mysqldump --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED             --single-transaction --skip-lock-tables --quick --hex-blob             --default-character-set=utf8mb4 --no-tablespaces --triggers             --set-gtid-purged=OFF --skip-add-locks --skip-disable-keys             "$DB_NAME" > "$RUNNER_TEMP/rollback-full.sql"

          cp "$RUNNER_TEMP/source/source-full.sql" "$RUNNER_TEMP/source-ready.sql"
          cp "$RUNNER_TEMP/rollback-full.sql" "$RUNNER_TEMP/rollback-ready.sql"

          perl -0pi -e 's/DEFINER=`[^`]+`@`[^`]+`/DEFINER=CURRENT_USER/g' "$RUNNER_TEMP/source-ready.sql" "$RUNNER_TEMP/rollback-ready.sql"

          for sql in "$RUNNER_TEMP/source-ready.sql" "$RUNNER_TEMP/rollback-ready.sql"; do
            if grep -Eiq '^[[:space:]]*(CREATE|DROP)[[:space:]]+DATABASE|^[[:space:]]*USE[[:space:]]+' "$sql"; then
              echo "ABORT: dump contiene operación a nivel database: $sql"
              exit 42
            fi
          done

          rollback() {
            rc=$?
            trap - ERR
            echo "MIGRATION_FAILURE rc=$rc; restaurando snapshot completo previo..."
            "${MYSQL_BASE[@]}" < "$RUNNER_TEMP/rollback-ready.sql"
            echo "ROLLBACK_COMPLETO=SUCCESS"
            exit "$rc"
          }
          trap rollback ERR

          "${MYSQL_BASE[@]}" < "$RUNNER_TEMP/source-ready.sql"

          while IFS=$'\t' read -r table_name expected; do
            test -n "$table_name" || continue
            actual="$("${MYSQL_BATCH[@]}" -e "SELECT COUNT(*) FROM \`$table_name\`;")"
            test "$actual" = "$expected" || {
              echo "COUNT_MISMATCH table=$table_name expected=$expected actual=$actual"
              false
            }
          done < "$RUNNER_TEMP/source/source-counts.tsv"

          tables="$("${MYSQL_BATCH[@]}" -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE';")"
          migrations="$("${MYSQL_BATCH[@]}" -e "SELECT COUNT(*) FROM __EFMigrationsHistory;")"
          products="$("${MYSQL_BATCH[@]}" -e "SELECT COUNT(*) FROM Productos;")"
          categories="$("${MYSQL_BATCH[@]}" -e "SELECT COUNT(*) FROM Categorias;")"
          users="$("${MYSQL_BATCH[@]}" -e "SELECT COUNT(*) FROM Usuarios;")"
          test "$tables" = "137"
          test "$migrations" = "107"
          test "$products" -gt 0
          test "$categories" -gt 0
          test "$users" -ge 4

          trap - ERR
          python3 - "$RUNNER_TEMP/migration-report.json" "$products" "$categories" "$users" <<'PY'
          import json, sys
          report={
              "status":"SUCCESS",
              "source":"legacy_dev_verified_backup",
              "target":"solqaryn_dev",
              "schemaTables":137,
              "efMigrations":107,
              "allSourceTableCountsVerified":True,
              "targetBackupVerifiedBeforeMigration":True,
              "productionTouched":False,
              "products":int(sys.argv[2]),
              "categories":int(sys.argv[3]),
              "users":int(sys.argv[4])
          }
          with open(sys.argv[1],"w",encoding="utf-8") as f:
              json.dump(report,f,indent=2); f.write("\n")
          print(json.dumps(report))
          PY
      - name: Publicar evidencia y backup previo cifrado
        uses: actions/upload-artifact@v4
        with:
          name: solqaryn-dev-pre-migration-backup-and-report-${{ github.run_id }}
          retention-days: 14
          path: |
            ${{ env.TARGET_BACKUP_FILE }}
            ${{ env.TARGET_BACKUP_CHECKSUM }}
            ${{ env.TARGET_BACKUP_META }}
            ${{ runner.temp }}/target-restore-report.json
            ${{ runner.temp }}/migration-report.json

  smoke:
    name: Smoke de storefront y API después de migración
    needs: migrate-target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Esperar readiness y validar datos públicos
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --max-time 90             https://solqaryn-api-dev-fxx8.onrender.com/health/ready >/tmp/ready.json
          products="$(curl --fail --silent --show-error --retry 6 --retry-delay 10 --max-time 90             'https://solqaryn-dev.vercel.app/api/tienda/productos?pagina=1&tamano=1')"
          categories="$(curl --fail --silent --show-error --retry 6 --retry-delay 10 --max-time 90             'https://solqaryn-dev.vercel.app/api/tienda/categorias')"
          config="$(curl --fail --silent --show-error --retry 6 --retry-delay 10 --max-time 90             'https://solqaryn-dev.vercel.app/api/empresa-configuracion/publica')"
          python3 - "$products" "$categories" "$config" <<'PY'
          import json, sys
          p=json.loads(sys.argv[1]); c=json.loads(sys.argv[2]); cfg=json.loads(sys.argv[3])
          assert int(p.get("totalCount",0)) > 0, p
          assert isinstance(c,list) and len(c) > 0, c
          data=cfg.get("data",cfg)
          assert (data.get("nombreComercial") or "").strip(), data
          print("SMOKE_DEV=SUCCESS")
          print("PRODUCTOS=",p.get("totalCount"))
          print("CATEGORIAS=",len(c))
          print("EMPRESA=",data.get("nombreComercial"))
          PY
