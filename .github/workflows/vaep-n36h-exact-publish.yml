# VAEP exact publisher armed after initial skip-ci introduction
name: VAEP N3.6.H Exact Oracle Publisher

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/vaep-n36h-exact-publish.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: vaep-n36h-exact-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Materialize certified CHANGELOG oracle and fast-forward Desarrollo
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_BLOB: 9e0f74a66e0064543aa1a92d9ffc02c15a6d3862
          EXPECTED_TARGET_BLOB: d53c56416ac7ac01beef761adab5172cf5297487
          EXPECTED_SHA256: 80cf88610b7efc1e7ea1a2d88fcd3b1eeb3d7dbf21543689d68ffa8ae11a49f1
          ORACLE_ARTIFACT_ID: '9591391809'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin Desarrollo --depth=1
          test "$(git rev-parse origin/Desarrollo)" = "$GITHUB_SHA"
          test "$(git hash-object CHANGELOG_AI.md)" = "$EXPECTED_SOURCE_BLOB"

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ORACLE_ARTIFACT_ID}/zip" \
            -o /tmp/oracle.zip
          rm -rf /tmp/oracle && mkdir -p /tmp/oracle
          unzip -q /tmp/oracle.zip -d /tmp/oracle

          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re, subprocess
          patch = Path('/tmp/oracle/changes.patch').read_text(encoding='utf-8')
          m = re.search(r'TARGET_FULL_CONTENT_BASE64:\s*\n\+([A-Za-z0-9+/=]+)', patch)
          if not m:
              raise SystemExit('oracle target base64 not found')
          target = base64.b64decode(m.group(1), validate=True)
          if len(target) != 74369 or target.count(b'\n') != 565:
              raise SystemExit(f'unexpected target shape: bytes={len(target)} lines={target.count(bytes([10]))}')
          sha256 = hashlib.sha256(target).hexdigest()
          if sha256 != '80cf88610b7efc1e7ea1a2d88fcd3b1eeb3d7dbf21543689d68ffa8ae11a49f1':
              raise SystemExit(f'sha256 mismatch: {sha256}')
          Path('CHANGELOG_AI.md').write_bytes(target)
          blob = subprocess.check_output(['git','hash-object','CHANGELOG_AI.md'], text=True).strip()
          if blob != 'd53c56416ac7ac01beef761adab5172cf5297487':
              raise SystemExit(f'git blob mismatch: {blob}')
          PY

          test "$(git hash-object CHANGELOG_AI.md)" = "$EXPECTED_TARGET_BLOB"
          test "$(sha256sum CHANGELOG_AI.md | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(git diff --name-only -- CHANGELOG_AI.md)" = "CHANGELOG_AI.md"
          test "$(git diff --numstat -- CHANGELOG_AI.md)" = $'16\t0\tCHANGELOG_AI.md'
          test "$(git diff --name-only)" = "CHANGELOG_AI.md"
          git diff --check

          git config user.name 'VAEP Controller'
          git config user.email 'actions@users.noreply.github.com'
          git add CHANGELOG_AI.md
          git commit -m 'docs(N3.6.H): cerrar DevolucionCliente en changelog [VAEP MASTER]'

          git fetch origin Desarrollo --depth=1
          test "$(git rev-parse origin/Desarrollo)" = "$GITHUB_SHA"
          git push origin HEAD:Desarrollo
