name: Temporal ChatGPT Certificación Fase 2C.1

on:
  push:
    branches:
      - Desarrollo
    paths:
      - .github/workflows/chatgpt-fase2c1-generate.yml

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inventoryapp_2c1
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=inventoryapp_2c1;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;
      Database__ServerVersion: 8.4.0
      Database__ApplyMigrationsOnStartup: 'false'
      Jwt__Secret: Fase-2C1-CI-Only-Secret-With-More-Than-32-Characters
      Jwt__Issuer: VariApp.Fase2C1.CI
      Jwt__Audience: VariApp.Fase2C1.CI.Frontend
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar e instalar EF
        working-directory: backend
        run: |
          dotnet restore InventoryApp.sln
          dotnet tool install --global dotnet-ef --version 8.0.8

      - name: Aplicar historial previo
        working-directory: backend
        run: |
          dotnet ef database update 20260806015852_AddTipoClientePredeterminadoUnico \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext

      - name: Sembrar productos simples y comercial
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          docker exec "$mysql_container" mysql -uroot -proot inventoryapp_2c1 -e "
            INSERT INTO Productos
              (Nombre, Marca, Modelo, Cantidad, Costo, Precio, UmbralStockBajo,
               Activo, Eliminado, FechaCreacion, FechaActualizacion)
            VALUES
              ('Simple activo 2C1','VariApp','SIMPLE-A',7,12.34,20.50,2,1,0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6)),
              ('Simple inactivo 2C1','VariApp','SIMPLE-I',0,8.00,15.00,1,0,0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6)),
              ('Comercial 2C1','VariApp','COMERCIAL',4,30.00,45.00,1,1,0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6));

            INSERT INTO CatalogosProducto
              (Tipo, Nombre, Descripcion, CodigoVisual, Orden, Activo, Eliminado,
               FechaCreacion, FechaActualizacion)
            VALUES
              ('Color','Azul 2C1','Validación comercial','#2563EB',901,1,0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6));

            SET @producto_comercial=(SELECT Id FROM Productos WHERE Nombre='Comercial 2C1');
            SET @color_comercial=LAST_INSERT_ID();
            INSERT INTO ProductoVariantes
              (ProductoId, ColorId, Sku, CodigoBarras, Cantidad, UmbralStockBajo,
               Costo, Precio, Activo, Eliminado, FechaCreacion, FechaActualizacion)
            VALUES
              (@producto_comercial,@color_comercial,'COMERCIAL-2C1','000000002C1',4,1,
               30.00,45.00,1,0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6));"

      - name: Validar preflight fail-closed
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"

          preflight() {
            local value
            value="$(docker exec -i "$mysql_container" mysql -uroot -proot inventoryapp_2c1 \
              --batch --skip-column-names < backend/scripts/preflight-variante-tecnica.sql)"
            value="$(printf '%s' "$value" | tr -d '[:space:]')"
            [[ "$value" =~ ^[0-9]+$ ]] || { echo "Resultado no numérico: $value" >&2; exit 1; }
            printf '%s' "$value"
          }

          test "$(preflight)" = '0'

          docker exec "$mysql_container" mysql -uroot -proot inventoryapp_2c1 -e \
            "UPDATE Productos SET Cantidad=-1 WHERE Nombre='Simple activo 2C1';"
          test "$(preflight)" -gt 0
          docker exec "$mysql_container" mysql -uroot -proot inventoryapp_2c1 -e \
            "UPDATE Productos SET Cantidad=7 WHERE Nombre='Simple activo 2C1';"

          docker exec "$mysql_container" mysql -uroot -proot inventoryapp_2c1 -e \
            "UPDATE Productos SET Cantidad=5 WHERE Nombre='Comercial 2C1';"
          test "$(preflight)" -gt 0
          docker exec "$mysql_container" mysql -uroot -proot inventoryapp_2c1 -e \
            "UPDATE Productos SET Cantidad=4 WHERE Nombre='Comercial 2C1';"

          test "$(preflight)" = '0'

      - name: Aplicar migración 2C.1
        working-directory: backend
        run: |
          dotnet ef database update \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext

      - name: Verificar backfill, copia e índice único
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"

          test "$(docker exec "$mysql_container" mysql -uroot -proot inventoryapp_2c1 -Nse "
            SELECT COUNT(*)
            FROM ProductoVariantes pv
            JOIN Productos p ON p.Id=pv.ProductoId
            WHERE pv.EsTecnica=1 AND pv.Eliminado=0
              AND p.Nombre IN ('Simple activo 2C1','Simple inactivo 2C1');")" = '2'

          test "$(docker exec "$mysql_container" mysql -uroot -proot inventoryapp_2c1 -Nse "
            SELECT COUNT(*)
            FROM ProductoVariantes pv
            JOIN Productos p ON p.Id=pv.ProductoId
            WHERE p.Nombre='Simple activo 2C1'
              AND pv.EsTecnica=1
              AND pv.ColorId IS NULL
              AND pv.Sku=CONCAT('TEC-',LPAD(p.Id,10,'0'))
              AND pv.Cantidad=7
              AND pv.Costo=12.34
              AND pv.Precio=20.50
              AND pv.UmbralStockBajo=2
              AND pv.Activo=1
              AND pv.ProductoTecnicoUnico=p.Id;")" = '1'

          test "$(docker exec "$mysql_container" mysql -uroot -proot inventoryapp_2c1 -Nse "
            SELECT COUNT(*)
            FROM ProductoVariantes pv
            JOIN Productos p ON p.Id=pv.ProductoId
            WHERE p.Nombre='Comercial 2C1' AND pv.EsTecnica=1;")" = '0'

          test "$(docker exec "$mysql_container" mysql -uroot -proot inventoryapp_2c1 -Nse "
            SELECT COUNT(*) FROM information_schema.statistics
            WHERE table_schema='inventoryapp_2c1'
              AND table_name='ProductoVariantes'
              AND index_name='IX_ProductoVariantes_ProductoTecnicoUnico'
              AND non_unique=0;")" = '1'

          if docker exec "$mysql_container" mysql -uroot -proot inventoryapp_2c1 -e "
            SET @producto=(SELECT Id FROM Productos WHERE Nombre='Simple activo 2C1');
            INSERT INTO ProductoVariantes
              (ProductoId,Sku,Cantidad,UmbralStockBajo,Costo,Precio,Activo,Eliminado,
               FechaCreacion,FechaActualizacion,EsTecnica)
            VALUES
              (@producto,'TEC-DUP-2C1',0,1,0,0,1,0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6),1);"; then
            echo 'La base permitió una segunda variante técnica.' >&2
            exit 1
          fi

      - name: Compilar y ejecutar pruebas
        working-directory: backend
        run: |
          dotnet build InventoryApp.sln --configuration Release --no-restore
          dotnet test InventoryApp.sln --configuration Release --no-build --filter "Category!=Integration"
          dotnet test InventoryApp.sln --configuration Release --filter "Category=Integration"

      - name: Verificar snapshot y SQL forward
        working-directory: backend
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext
          dotnet ef migrations script \
            20260806015852_AddTipoClientePredeterminadoUnico \
            20260806163904_AddVarianteTecnicaProductoSimple \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext \
            --output fase2c1-variante-tecnica-forward.sql
          test -s fase2c1-variante-tecnica-forward.sql
          grep -q 'EsTecnica' fase2c1-variante-tecnica-forward.sql
          grep -q 'ProductoTecnicoUnico' fase2c1-variante-tecnica-forward.sql
          grep -q 'IX_ProductoVariantes_ProductoTecnicoUnico' fase2c1-variante-tecnica-forward.sql
          grep -q 'INSERT INTO ProductoVariantes' fase2c1-variante-tecnica-forward.sql

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase2c1-variante-tecnica-forward-sql
          path: backend/fase2c1-variante-tecnica-forward.sql
          if-no-files-found: warn
          retention-days: 14
