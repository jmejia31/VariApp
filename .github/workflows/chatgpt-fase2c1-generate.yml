name: Temporal ChatGPT Fase 2C.1

on:
  push:
    branches: [Desarrollo]
    paths:
      - .github/workflows/chatgpt-fase2c1-generate.yml
      - backend/src/Domain/Entities/ProductoVariante.cs
      - backend/src/Infrastructure/Persistence/Configurations/ProductoVarianteConfiguration.cs

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restaurar solución
        working-directory: backend
        run: dotnet restore InventoryApp.sln
      - name: Instalar dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 8.0.8
      - name: Generar migración
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet ef migrations add AddVarianteTecnicaProductoSimple \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext
          dotnet build InventoryApp.sln --configuration Release
          dotnet test InventoryApp.sln --configuration Release --no-build --filter "Category!=Integration"
          dotnet ef migrations has-pending-model-changes \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext
      - name: Publicar migración
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'jmejia31'
          git config user.email '93171442+jmejia31@users.noreply.github.com'
          git add backend/src/Infrastructure/Migrations
          git commit -m 'feat(inventario): generar migración de variante técnica 2C.1 [ChatGPT]'
          git push origin HEAD:Desarrollo
