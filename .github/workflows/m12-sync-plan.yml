name: M12 - Sincronizar cierre documental

on:
  push:
    branches: [Desarrollo]
    paths: [.github/workflows/m12-sync-plan.yml]

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - name: Marcar M12 como certificada
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('docs/PLAN_MAESTRO_MEJORAS_EMPRESARIALES_2026.md'); s=p.read_text(encoding='utf-8'); marker='# FASE M12 — Automatización transversal\\n\\n'; insert=marker+'Estado: **COMPLETADA / CERTIFICADA AUTOMÁTICAMENTE (2026-08-10)**.\\n\\nEntregable: `docs/FASE_M12_AUTOMATIZACION_TRANSVERSAL.md`.\\n\\n'; assert marker in s, 'No se encontró M12'; p.write_text(s.replace(marker, insert, 1), encoding='utf-8')"
          rm .github/workflows/m12-sync-plan.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PLAN_MAESTRO_MEJORAS_EMPRESARIALES_2026.md .github/workflows/m12-sync-plan.yml
          git diff --cached --check
          git commit -m 'docs(m12): certificar fase en plan maestro [ChatGPT]'
          git push origin HEAD:Desarrollo
