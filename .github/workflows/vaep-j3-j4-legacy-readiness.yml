name: VAEP J3-J4 Legacy Credential Probe

on:
  push:
    branches:
      - Desarrollo
    paths:
      - '.github/workflows/vaep-j3-j4-legacy-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        worker: [J3, J4]
    env:
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      EXPECTED_OWNER: jmejia31
      EXPECTED_REPO: VariApp
      EXPECTED_BRANCH: Desarrollo
      J3_LEGACY_KEY: ${{ secrets.JULES_C_API_KEY }}
      J4_LEGACY_KEY: ${{ secrets.JULES_D_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 1
      - name: Validate legacy credential read-only access
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.worker }}" in
            J3) key="$J3_LEGACY_KEY" ;;
            J4) key="$J4_LEGACY_KEY" ;;
            *) exit 2 ;;
          esac
          test -n "$key"
          response="$(mktemp)"
          curl --connect-timeout 10 --max-time 45 --fail-with-body --silent --show-error \
            -H "x-goog-api-key: $key" \
            "$JULES_API_BASE/sources?pageSize=100" > "$response"
          jq -e \
            --arg owner "$EXPECTED_OWNER" \
            --arg repo "$EXPECTED_REPO" \
            --arg branch "$EXPECTED_BRANCH" \
            '[.sources[]? | select(.githubRepo.owner == $owner and .githubRepo.repo == $repo)] | first as $s | ($s != null) and (($s.githubRepo.branches // []) | any(.displayName == $branch))' \
            "$response" >/dev/null
          echo "${{ matrix.worker }}_LEGACY_READINESS_OK"
