name: VAEP J1-J6 Readiness Gate

on:
  push:
    branches:
      - Desarrollo
    paths:
      - '.github/workflows/vaep-j1-j6-readiness-gate.yml'
      - '.github/workflows/vaep-jules-j1.yml'
      - '.github/workflows/vaep-jules-j2.yml'
      - '.github/workflows/vaep-jules-j3.yml'
      - '.github/workflows/vaep-jules-j4.yml'
      - '.github/workflows/vaep-jules-j5.yml'
      - '.github/workflows/vaep-jules-j6.yml'
      - 'vaep/control/jules-workers.json'
      - 'scripts/vaep/j1_j6_registry_check.py'
      - 'scripts/vaep/j1_j6_cutover.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaep-j1-j6-readiness-gate
  cancel-in-progress: false

jobs:
  validate-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 1
      - name: Validate canonical J1-J6 registry
        run: python3 scripts/vaep/j1_j6_registry_check.py
      - name: Enforce canonical credential references only
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .github/workflows/vaep-j1-j6-readiness-gate.yml
            .github/workflows/vaep-jules-j1.yml
            .github/workflows/vaep-jules-j2.yml
            .github/workflows/vaep-jules-j3.yml
            .github/workflows/vaep-jules-j4.yml
            .github/workflows/vaep-jules-j5.yml
            .github/workflows/vaep-jules-j6.yml
          )
          for i in 1 2 3 4 5 6; do
            grep -Fq 'secrets.JULES_J'"$i"'_API_KEY' ".github/workflows/vaep-jules-j${i}.yml"
          done
          if grep -En 'secrets\.JULES_(API_KEY|B_API_KEY|C_API_KEY|D_API_KEY)' "${files[@]}"; then
            echo 'LEGACY_CREDENTIAL_REFERENCE_FORBIDDEN_IN_CANONICAL_J1_J6' >&2
            exit 1
          fi
          echo 'J1_J6_CANONICAL_CREDENTIAL_CONTRACT_OK'

  readiness:
    needs: validate-registry
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        worker: [J1, J2, J3, J4, J5, J6]
    env:
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      EXPECTED_OWNER: jmejia31
      EXPECTED_REPO: VariApp
      EXPECTED_BRANCH: Desarrollo
      J1_KEY: ${{ secrets.JULES_J1_API_KEY }}
      J2_KEY: ${{ secrets.JULES_J2_API_KEY }}
      J3_KEY: ${{ secrets.JULES_J3_API_KEY }}
      J4_KEY: ${{ secrets.JULES_J4_API_KEY }}
      J5_KEY: ${{ secrets.JULES_J5_API_KEY }}
      J6_KEY: ${{ secrets.JULES_J6_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 1
      - name: Validate read-only Jules access using final worker secret only
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.worker }}" in
            J1) key="$J1_KEY" ;;
            J2) key="$J2_KEY" ;;
            J3) key="$J3_KEY" ;;
            J4) key="$J4_KEY" ;;
            J5) key="$J5_KEY" ;;
            J6) key="$J6_KEY" ;;
            *) exit 2 ;;
          esac
          test -n "$key"
          response="$(mktemp)"
          curl --connect-timeout 10 --max-time 45 --fail-with-body --silent --show-error \
            -H "x-goog-api-key: $key" \
            "$JULES_API_BASE/sources?pageSize=100" > "$response"
          jq -e \
            --arg owner "$EXPECTED_OWNER" \
            --arg repo "$EXPECTED_REPO" \
            --arg branch "$EXPECTED_BRANCH" \
            '[.sources[]? | select(.githubRepo.owner == $owner and .githubRepo.repo == $repo)] | first as $s | ($s != null) and (($s.githubRepo.branches // []) | any(.displayName == $branch))' \
            "$response" >/dev/null
          echo "${{ matrix.worker }}_READINESS_OK"
