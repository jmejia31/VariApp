name: VAEP J4 Trusted Worker
on:
  push:
    branches: [Desarrollo]
    paths: ['vaep/jules-d/dispatch/*.json']
  workflow_dispatch:
    inputs:
      manifest_commit: {description: 'Exact immutable manifest commit created by VAEP controller after JULES_OFFLOAD_APPROVED', required: false, type: string}
permissions: {actions: write, contents: write, issues: write}
concurrency: {group: vaep-j4-lane, cancel-in-progress: false}
jobs:
  dispatch-jules:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXECUTION_MODEL: TASKS_FIRST_JULES_ON_DEMAND
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      EXPECTED_OWNER: jmejia31
      EXPECTED_REPO: VariApp
      EXPECTED_BRANCH: Desarrollo
      DISPATCH_PATH: vaep/jules-d/dispatch
      SESSION_TITLE_PREFIX: "VAEP-J4 "
      ARTIFACT_PREFIX: vaep-j4
      ISSUE_PREFIX: "[VAEP-J4]"
      WORKER_LABEL: J4
      WORKER_ID: J4
      JULES_API_KEY: ${{ secrets.JULES_J4_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      VAEP_DISPATCH_SHA: ${{ inputs.manifest_commit || github.sha }}
      VAEP_LANE_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.manifest_commit || github.sha }}', fetch-depth: 2}
      - name: Validate explicit offload transport
        run: bash .github/scripts/vaep-jules-master.sh --transport-preflight
      - name: Execute approved VAEP/Jules offload
        run: bash .github/scripts/vaep-jules-master.sh
      - name: Upload J4 result artifact
        if: always() && env.RESULT_DIR != ''
        uses: actions/upload-artifact@v4
        with: {name: '${{ env.ARTIFACT_NAME }}', path: '${{ env.RESULT_DIR }}', if-no-files-found: error, retention-days: 14}
