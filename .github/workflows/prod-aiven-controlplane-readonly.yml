name: PROD - Aiven control-plane read-only

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prod-aiven-controlplane-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: PROD
    env:
      AIVEN_TOKEN: ${{ secrets.SOLQARYN_AIVEN_TOKEN }}
    steps:
      - name: Consultar estado y bases sin secretos
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AIVEN_TOKEN"
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          from urllib.parse import quote

          root = "https://api.aiven.io/v1"
          token = os.environ["AIVEN_TOKEN"].strip()
          project = "solqaryn"
          service = "solqaryn-mysql"

          def get(path):
              req = urllib.request.Request(
                  root + path,
                  headers={
                      "Authorization": f"aivenv1 {token}",
                      "Accept": "application/json",
                      "User-Agent": "SOLQARYN-PROD-ControlPlane-ReadOnly/1.0",
                  },
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, json.load(resp)
              except urllib.error.HTTPError as exc:
                  return exc.code, None

          code, payload = get(f"/project/{quote(project)}/service/{quote(service)}")
          if code != 200 or not isinstance(payload, dict):
              raise SystemExit(f"AIVEN_SERVICE_READ_HTTP={code}")

          svc = payload.get("service", payload)
          components = []
          for comp in svc.get("components") or []:
              if comp.get("component") in ("mysql", "mysqlx"):
                  components.append({
                      "component": comp.get("component"),
                      "host": comp.get("host"),
                      "port": comp.get("port"),
                      "route": comp.get("route"),
                      "usage": comp.get("usage"),
                  })

          db_code = None
          databases = None
          for candidate in (
              f"/project/{quote(project)}/service/{quote(service)}/db",
              f"/project/{quote(project)}/service/{quote(service)}/database",
          ):
              code2, payload2 = get(candidate)
              if code2 == 200 and isinstance(payload2, dict):
                  raw = payload2.get("databases") or payload2.get("database") or payload2.get("dbs")
                  if isinstance(raw, list):
                      names = []
                      for item in raw:
                          if isinstance(item, dict):
                              name = item.get("database_name") or item.get("database") or item.get("name")
                          else:
                              name = str(item)
                          if name:
                              names.append(name)
                      databases = sorted(set(names))
                      db_code = 200
                      break
              db_code = code2

          result = {
              "status": "PASS",
              "project": project,
              "serviceName": svc.get("service_name"),
              "serviceType": svc.get("service_type"),
              "state": svc.get("state"),
              "powered": svc.get("powered"),
              "plan": svc.get("plan"),
              "cloudName": svc.get("cloud_name"),
              "components": components,
              "databaseInventoryHttp": db_code,
              "databases": databases,
              "writeOperations": False,
              "secretValuesPrinted": False,
          }
          print(json.dumps(result, separators=(",", ":")))
          if svc.get("service_name") != service or svc.get("service_type") != "mysql":
              raise SystemExit("AIVEN_SERVICE_MISMATCH")
          PY
