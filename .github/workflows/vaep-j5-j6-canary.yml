name: VAEP J5-J6 Safe Canary

on:
  push:
    branches:
      - Desarrollo
    paths:
      - '.github/workflows/vaep-j5-j6-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        worker: [J5, J6]
    env:
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      EXPECTED_OWNER: jmejia31
      EXPECTED_REPO: VariApp
      EXPECTED_BRANCH: Desarrollo
      J5_KEY: ${{ secrets.JULES_J5_API_KEY }}
      J6_KEY: ${{ secrets.JULES_J6_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 1
      - name: Create and verify read-only canary session
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.worker }}" in
            J5) key="$J5_KEY" ;;
            J6) key="$J6_KEY" ;;
            *) exit 2 ;;
          esac
          test -n "$key"
          sources="$(mktemp)"
          curl --connect-timeout 10 --max-time 45 --fail-with-body --silent --show-error \
            -H "x-goog-api-key: $key" \
            "$JULES_API_BASE/sources?pageSize=100" > "$sources"
          source_name="$(jq -r --arg owner "$EXPECTED_OWNER" --arg repo "$EXPECTED_REPO" '[.sources[]? | select(.githubRepo.owner == $owner and .githubRepo.repo == $repo)] | first | .name // empty' "$sources")"
          test -n "$source_name"
          title="VAEP-CUTOVER-CANARY-${{ matrix.worker }}-${GITHUB_RUN_ID}"
          body="$(mktemp)"
          jq -n \
            --arg prompt "READ-ONLY CUTOVER CANARY. PROJECT_ID=VARIAPP. WORKER_ID=${{ matrix.worker }}. Repository jmejia31/VariApp, branch Desarrollo. Read docs/VAEP_AUTHORITY.md and AGENTS.md. DO NOT modify files, DO NOT create a patch, branch, PR, push, merge, deployment, or secret change. Return a concise confirmation that the repository and branch are readable and that you understand the current VAEP authority. This is connectivity validation only." \
            --arg title "$title" \
            --arg source "$source_name" \
            --arg branch "$EXPECTED_BRANCH" \
            '{prompt:$prompt,title:$title,sourceContext:{source:$source,githubRepoContext:{startingBranch:$branch}},requirePlanApproval:false}' > "$body"
          created="$(mktemp)"
          curl --connect-timeout 10 --max-time 45 --fail-with-body --silent --show-error -X POST \
            -H 'Content-Type: application/json' -H "x-goog-api-key: $key" \
            --data-binary @"$body" "$JULES_API_BASE/sessions" > "$created"
          session="$(jq -r '.name // empty' "$created")"
          test -n "$session"
          echo "CANARY_SESSION=$session"
          deadline=$((SECONDS+480))
          while (( SECONDS < deadline )); do
            snapshot="$(mktemp)"
            curl --connect-timeout 10 --max-time 45 --fail-with-body --silent --show-error \
              -H "x-goog-api-key: $key" "$JULES_API_BASE/$session" > "$snapshot"
            state="$(jq -r '.state // "UNKNOWN"' "$snapshot")"
            echo "${{ matrix.worker }} state=$state"
            case "$state" in
              COMPLETED) echo "${{ matrix.worker }}_CANARY_OK"; exit 0 ;;
              FAILED|PAUSED) echo "${{ matrix.worker }}_CANARY_TERMINAL_FAILURE state=$state" >&2; exit 3 ;;
              *) sleep 10 ;;
            esac
          done
          echo "${{ matrix.worker }}_CANARY_TIMEOUT" >&2
          exit 4
