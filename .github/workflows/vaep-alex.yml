name: VAEP ALEX Material Planner

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/vaep-alex.yml'
      - 'scripts/vaep/alex_backlog_planner.py'
      - 'vaep/control/alex-owner-authorization.json'
      - 'vaep/control/alex-capabilities.json'
      - 'vaep/control/jules-autorefill-catalog.json'
      - 'vaep/control/dispatch-admission.json'
      - 'vaep/evidence/fragments/**'
  workflow_run:
    workflows:
      - 'VAEP J1 Trusted Worker'
      - 'VAEP J2 Trusted Worker'
      - 'VAEP J3 Trusted Worker'
      - 'VAEP J4 Trusted Worker'
      - 'VAEP J5 Trusted Worker'
      - 'VAEP J6 Trusted Worker'
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: write
  contents: write
  issues: read

concurrency:
  group: vaep-alex-material-planner
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 2
      - name: Verify ALEX owner authorization and MASTER
        shell: bash
        run: |
          grep -q '^AUTOMATION_AUTHORITY=MASTER$' docs/VAEP_AUTHORITY.md
          grep -q '^MASTER_FILE=docs/VAEP_AUTHORITY.md$' docs/VAEP_AUTHORITY.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          auth=json.loads(Path('vaep/control/alex-owner-authorization.json').read_text())
          caps=json.loads(Path('vaep/control/alex-capabilities.json').read_text())
          assert auth['component']=='ALEX'
          assert auth['authorization']=='AUTHORIZED_NOW'
          assert auth['status']=='ACTIVE_AUTHORIZATION'
          assert caps['authority']=='docs/VAEP_AUTHORITY.md'
          assert caps['ownerAuthorization']=='vaep/control/alex-owner-authorization.json'
          assert caps['operational'] is True
          assert caps['isJulesLane'] is False
          assert [x['id'] for x in caps['capabilities']]==[f'A{i}' for i in range(16,26)]
          print('ALEX_AUTHORIZATION=PASS')
          PY
      - name: Build ALEX material-backlog snapshot
        run: python3 scripts/vaep/alex_backlog_planner.py --output "$RUNNER_TEMP/alex-runtime.json"
      - name: Upload ALEX runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: alex-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/alex-runtime.json
          if-no-files-found: error
          retention-days: 7

  refill-watchdog:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - worker: J1
            api_secret: JULES_J1_API_KEY
          - worker: J2
            api_secret: JULES_J2_API_KEY
          - worker: J3
            api_secret: JULES_J3_API_KEY
          - worker: J4
            api_secret: JULES_J4_API_KEY
          - worker: J5
            api_secret: JULES_J5_API_KEY
          - worker: J6
            api_secret: JULES_J6_API_KEY
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      WORKER_ID: ${{ matrix.worker }}
      JULES_API_BASE: https://jules.googleapis.com/v1alpha
      JULES_API_KEY: ${{ secrets[matrix.api_secret] }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 2
      - name: Verify ALEX authorization remains active
        shell: bash
        run: |
          test "$(jq -r '.authorization' vaep/control/alex-owner-authorization.json)" = "AUTHORIZED_NOW"
          test "$(jq -r '.status' vaep/control/alex-owner-authorization.json)" = "ACTIVE_AUTHORIZATION"
      - name: ALEX safe refill watchdog ${{ matrix.worker }}
        shell: bash
        run: |
          set +e
          bash .github/scripts/vaep-jules-autorefill.sh
          rc=$?
          set -e
          case "$rc" in
            0|78|79|80|81|82) exit 0 ;;
            *) exit "$rc" ;;
          esac
