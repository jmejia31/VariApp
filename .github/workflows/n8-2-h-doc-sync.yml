name: N8.2.H - Reconciliar historial documental

on:
  push:
    branches:
      - Desarrollo
    paths:
      - .github/workflows/n8-2-h-doc-sync.yml

permissions:
  contents: write

concurrency:
  group: n8-2-h-doc-sync-Desarrollo
  cancel-in-progress: false

jobs:
  reconcile:
    name: Append history-preserving N8.2 documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Fast-forward and append canonical history
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin Desarrollo

          if ! grep -Fq 'ERP-N8.2 — Compatibilidad de dispositivos — ROLLUP DOCUMENTAL 2026-09-15' TASKS.md; then
            cat >> TASKS.md <<'EOF'

          ## ERP-N8.2 — Compatibilidad de dispositivos — ROLLUP DOCUMENTAL 2026-09-15

          Este bloque es aditivo e histórico. El estado operativo vigente se determina únicamente por CONFIG/COLA y receipts VAEP bajo `docs/VAEP_AUTHORITY.md`.

          - [x] N8.2.D cerró `LISTO_REAL` antes del frontend/UX.
          - [x] N8.2.E resolvió same-run el P1 `MISSING_N8_2_EXPLICIT_DEVICE_PROFILE_COVERAGE` con perfiles explícitos escritorio 1440x900, laptop 1366x768, tablet 820x1180, Android 412x915 e iPhone 390x844.
          - [x] Gate causal `N8.2 - Compatibilidad de dispositivos` run `34941980085`, job `104292533908`, sobre `1f7008f464f195aab3020a5d0102a85428c8919a`: lint, build y Playwright dirigido PASS.
          - [x] N8.2.E `LISTO_REAL`: `vaep/evidence/receipts/N8.2.E_LISTO_REAL_20260915T073218Z_SUP48.json`.
          - [x] N8.2.F `LISTO_REAL`: `vaep/evidence/receipts/N8.2.F_LISTO_REAL_20260915T073344Z_SUP48.json`; sin delta runtime de RBAC/auditoría/seguridad.
          - [x] N8.2.G `LISTO_REAL`: `vaep/evidence/receipts/N8.2.G_LISTO_REAL_20260915T073447Z_SUP48.json`; P0=0/P1=0/P2=0.
          - [x] Paquete canónico H materializado en `docs/CERTIFICACION_N8_2_DISPOSITIVOS.md` y reconciliación history-preserving de TASKS/CHANGELOG ejecutada.

          N8.2.H sólo pasa a `LISTO_REAL` mediante su receipt final después de REVIEW_FIRST documental; este rollup no sustituye el receipt ni el control-plane fresco.
          EOF
          fi

          if ! grep -Fq 'ERP-N8.2 Compatibilidad de dispositivos — reconciliación documental H' CHANGELOG_AI.md; then
            cat >> CHANGELOG_AI.md <<'EOF'

          ## 2026-09-15 — ERP-N8.2 Compatibilidad de dispositivos — reconciliación documental H

          **Responsable:** Tarea Supervisión :48 bajo `docs/VAEP_AUTHORITY.md`.

          Se cerró la cobertura causal de N8.2 para escritorio, laptop, tablet, Android e iPhone. El P1 inicial por falta de perfiles explícitos se resolvió same-run con `frontend/e2e/n82-device-compatibility.spec.ts` y el gate dedicado `.github/workflows/n8-2-device-compatibility.yml`. El workflow `N8.2 - Compatibilidad de dispositivos` run `34941980085`, job `104292533908`, terminó `success` sobre `1f7008f464f195aab3020a5d0102a85428c8919a`; lint, build de producción y Playwright dirigido quedaron PASS.

          N8.2.E, N8.2.F y N8.2.G quedaron `LISTO_REAL` mediante receipts VAEP con REVIEW_FIRST P0=0/P1=0/P2=0. No hubo delta de runtime backend, persistencia, migraciones, RBAC, límites tenant, deploy, Producción, secretos ni PR #2. La certificación canónica se materializó en `docs/CERTIFICACION_N8_2_DISPOSITIVOS.md`.

          Este registro es histórico y no falsea H: N8.2.H sólo es `LISTO_REAL` cuando exista su receipt final tras REVIEW_FIRST documental y readback/reconciliación de control-plane.
          EOF
          fi

          if git diff --quiet -- TASKS.md CHANGELOG_AI.md; then
            echo 'No documentary delta required.'
            exit 0
          fi

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TASKS.md CHANGELOG_AI.md
          git commit -m 'docs(n8.2.h): reconcile TASKS and CHANGELOG history'
          git push origin HEAD:Desarrollo
