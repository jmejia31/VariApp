            backend/src/Application/Interfaces/IProductoVarianteService.cs \
            backend/src/Application/Services/ProductoVarianteService.cs \
            backend/src/API/Controllers/ProductosController.cs \
            backend/tests/InventoryApp.Tests/ProductoVarianteTecnicaLifecycleTests.cs
