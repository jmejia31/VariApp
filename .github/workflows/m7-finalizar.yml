name: M7 - finalizar costos de envio profesionales

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/m7-finalizar.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Aplicar cierre M7 fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p=Path(path); t=p.read_text()
              actual=t.count(old)
              if actual < count:
                  raise SystemExit(f'Firma no encontrada {path} ({actual}<{count}): {old[:140]!r}')
              p.write_text(t.replace(old,new,count))

          # Estado de vigencia expuesto al frontend.
          rep('backend/src/Application/DTOs/CostoEnvioDto.cs',
              '    public bool Activo { get; set; }\n    public DateTime FechaCreacion',
              '    public bool Activo { get; set; }\n    public bool EstaVigente { get; set; }\n    public DateTime FechaCreacion')
          rep('backend/src/API/Controllers/CostosEnvioController.cs',
              '        Activo = x.Activo,\n        FechaCreacion = x.FechaCreacion,',
              '        Activo = x.Activo,\n        EstaVigente = x.EstaVigente(DateTime.UtcNow),\n        FechaCreacion = x.FechaCreacion,')

          # Historial auditable y before/after.
          rep('backend/src/API/Controllers/CostosEnvioController.cs',
              '    [HttpGet("{id:int}")]\n    [RequierePermiso(ModuloSistema.Facturacion, AccionPermiso.Ver)]',
              '''    [HttpGet("{id:int}/historial")]\n    [RequierePermiso(ModuloSistema.Facturacion, AccionPermiso.Ver)]\n    public async Task<IActionResult> Historial(int id, [FromQuery] int page = 1, [FromQuery] int pageSize = 50)\n    {\n        if (!await _db.CostosEnvio.IgnoreQueryFilters().AnyAsync(x => x.Id == id))\n            return NotFound(ApiResponse<object>.Fail("Costo de envío no encontrado."));\n\n        var resultado = await _auditoria.GetFilteredAsync(new AuditoriaFiltroDto\n        {\n            Entidad = "CostoEnvio",\n            ReferenciaId = id,\n            Page = Math.Max(1, page),\n            PageSize = Math.Clamp(pageSize, 1, 100)\n        });\n        return Ok(ApiResponse<PagedResult<RegistroAuditoriaDto>>.Ok(resultado));\n    }\n\n    [HttpGet("{id:int}")]\n    [RequierePermiso(ModuloSistema.Facturacion, AccionPermiso.Ver)]''')
          rep('backend/src/API/Controllers/CostosEnvioController.cs',
              '        if (item is null) return NotFound(ApiResponse<object>.Fail("Costo de envío no encontrado."));\n        if (item.EsPredeterminado && item.Activo && (!dto.EsPredeterminado || !dto.Activo))',
              '        if (item is null) return NotFound(ApiResponse<object>.Fail("Costo de envío no encontrado."));\n        var anterior = ToDto(item);\n        if (item.EsPredeterminado && item.Activo && (!dto.EsPredeterminado || !dto.Activo))')
          rep('backend/src/API/Controllers/CostosEnvioController.cs',
              '$"Costo de envío actualizado: {item.Nombre}.", item.Id, entidad: "CostoEnvio", valoresNuevos: salida);',
              '$"Costo de envío actualizado: {item.Nombre}.", item.Id, entidad: "CostoEnvio", valoresAnteriores: anterior, valoresNuevos: salida);')
          rep('backend/src/API/Controllers/CostosEnvioController.cs',
              '        if (item is null) return NotFound(ApiResponse<object>.Fail("Costo de envío no encontrado."));\n        if (!dto.Activo && item.EsPredeterminado && item.Activo)',
              '        if (item is null) return NotFound(ApiResponse<object>.Fail("Costo de envío no encontrado."));\n        var anterior = ToDto(item);\n        if (!dto.Activo && item.EsPredeterminado && item.Activo)')
          rep('backend/src/API/Controllers/CostosEnvioController.cs',
              '$"Costo de envío {(dto.Activo ? "activado" : "desactivado")}.", id, entidad: "CostoEnvio");',
              '$"Costo de envío {(dto.Activo ? "activado" : "desactivado")}.", id, entidad: "CostoEnvio", valoresAnteriores: anterior, valoresNuevos: ToDto(item));')
          rep('backend/src/API/Controllers/CostosEnvioController.cs',
              '        if (item is null) return NotFound(ApiResponse<object>.Fail("Costo de envío no encontrado."));\n        if (item.EsPredeterminado && item.Activo)',
              '        if (item is null) return NotFound(ApiResponse<object>.Fail("Costo de envío no encontrado."));\n        var anterior = ToDto(item);\n        if (item.EsPredeterminado && item.Activo)',1)
          rep('backend/src/API/Controllers/CostosEnvioController.cs',
              '            "Costo de envío eliminado lógicamente.", id, entidad: "CostoEnvio");',
              '            "Costo de envío eliminado lógicamente.", id, entidad: "CostoEnvio", valoresAnteriores: anterior, valoresNuevos: ToDto(item));')

          # Snapshots profesionales Venta / Factura.
          for path in ['backend/src/Domain/Entities/Venta.cs','backend/src/Domain/Entities/Factura.cs']:
              rep(path,
                  '    public string? CostoEnvioNombreSnapshot { get; set; }\n    public decimal? CostoEnvioMontoSnapshot { get; set; }',
                  '    public string? CostoEnvioNombreSnapshot { get; set; }\n    public string? CostoEnvioDepartamentoSnapshot { get; set; }\n    public string? CostoEnvioCiudadSnapshot { get; set; }\n    public string? CostoEnvioZonaSnapshot { get; set; }\n    public string? CostoEnvioModalidadSnapshot { get; set; }\n    public decimal? CostoEnvioMontoSnapshot { get; set; }')

          rep('backend/src/Infrastructure/Persistence/Configurations/VentaConfiguration.cs',
              '        builder.Property(v => v.CostoEnvioNombreSnapshot).HasMaxLength(150);',
              '        builder.Property(v => v.CostoEnvioNombreSnapshot).HasMaxLength(150);\n        builder.Property(v => v.CostoEnvioDepartamentoSnapshot).HasMaxLength(120);\n        builder.Property(v => v.CostoEnvioCiudadSnapshot).HasMaxLength(120);\n        builder.Property(v => v.CostoEnvioZonaSnapshot).HasMaxLength(150);\n        builder.Property(v => v.CostoEnvioModalidadSnapshot).HasMaxLength(80);')
          rep('backend/src/Infrastructure/Persistence/Configurations/FacturaConfiguration.cs',
              '        builder.Property(f => f.CostoEnvioNombreSnapshot).HasMaxLength(150);',
              '        builder.Property(f => f.CostoEnvioNombreSnapshot).HasMaxLength(150);\n        builder.Property(f => f.CostoEnvioDepartamentoSnapshot).HasMaxLength(120);\n        builder.Property(f => f.CostoEnvioCiudadSnapshot).HasMaxLength(120);\n        builder.Property(f => f.CostoEnvioZonaSnapshot).HasMaxLength(150);\n        builder.Property(f => f.CostoEnvioModalidadSnapshot).HasMaxLength(80);')

          # Resultado de cálculo y resolución conserva la cobertura exacta aplicada.
          rep('backend/src/Application/DTOs/CalculoDto.cs',
              '    public string? CostoEnvioNombre { get; set; }\n    public decimal CostoEnvio { get; set; }',
              '    public string? CostoEnvioNombre { get; set; }\n    public string? CostoEnvioDepartamento { get; set; }\n    public string? CostoEnvioCiudad { get; set; }\n    public string? CostoEnvioZona { get; set; }\n    public string? CostoEnvioModalidad { get; set; }\n    public decimal CostoEnvio { get; set; }')
          rep('backend/src/Application/Services/CalculoService.cs',
              '            Id = costo.Id,\n            Nombre = costo.Nombre,\n            Monto = RedondearMoneda(costo.Monto)',
              '            Id = costo.Id,\n            Nombre = costo.Nombre,\n            Departamento = costo.Departamento,\n            Ciudad = costo.Ciudad,\n            Zona = costo.Zona,\n            Modalidad = costo.Modalidad,\n            Monto = RedondearMoneda(costo.Monto)')
          rep('backend/src/Application/Services/CalculoService.cs',
              '            CostoEnvioNombre = envio.Nombre,\n            CostoEnvio = RedondearMoneda(envio.Monto),',
              '            CostoEnvioNombre = envio.Nombre,\n            CostoEnvioDepartamento = envio.Departamento,\n            CostoEnvioCiudad = envio.Ciudad,\n            CostoEnvioZona = envio.Zona,\n            CostoEnvioModalidad = envio.Modalidad,\n            CostoEnvio = RedondearMoneda(envio.Monto),')
          rep('backend/src/Application/Services/CalculoService.cs',
              '        public string? Nombre { get; init; }\n        public decimal Monto { get; init; }',
              '        public string? Nombre { get; init; }\n        public string? Departamento { get; init; }\n        public string? Ciudad { get; init; }\n        public string? Zona { get; init; }\n        public string? Modalidad { get; init; }\n        public decimal Monto { get; init; }')

          # DTOs de salida de Venta/Factura.
          rep('backend/src/Application/DTOs/VentaDto.cs',
              '    public string? CostoEnvioNombre { get; set; }\n    public bool EnvioExonerado',
              '    public string? CostoEnvioNombre { get; set; }\n    public string? CostoEnvioDepartamento { get; set; }\n    public string? CostoEnvioCiudad { get; set; }\n    public string? CostoEnvioZona { get; set; }\n    public string? CostoEnvioModalidad { get; set; }\n    public bool EnvioExonerado')
          rep('backend/src/Application/DTOs/FacturaDto.cs',
              '    public string? CostoEnvioNombre { get; set; }\n    public bool EnvioExonerado',
              '    public string? CostoEnvioNombre { get; set; }\n    public string? CostoEnvioDepartamento { get; set; }\n    public string? CostoEnvioCiudad { get; set; }\n    public string? CostoEnvioZona { get; set; }\n    public string? CostoEnvioModalidad { get; set; }\n    public bool EnvioExonerado')

          # Venta persiste snapshots y los transfiere a factura.
          rep('backend/src/Application/Services/VentaService.cs',
              '        venta.CostoEnvioNombreSnapshot = resultado.CostoEnvioNombre;\n        venta.CostoEnvioMontoSnapshot = resultado.CostoEnvio;',
              '        venta.CostoEnvioNombreSnapshot = resultado.CostoEnvioNombre;\n        venta.CostoEnvioDepartamentoSnapshot = resultado.CostoEnvioDepartamento;\n        venta.CostoEnvioCiudadSnapshot = resultado.CostoEnvioCiudad;\n        venta.CostoEnvioZonaSnapshot = resultado.CostoEnvioZona;\n        venta.CostoEnvioModalidadSnapshot = resultado.CostoEnvioModalidad;\n        venta.CostoEnvioMontoSnapshot = resultado.CostoEnvio;')
          rep('backend/src/Application/Services/VentaService.cs',
              '                CostoEnvioNombreSnapshot = venta.CostoEnvioNombreSnapshot,\n                CostoEnvioMontoSnapshot = venta.CostoEnvioMontoSnapshot,',
              '                CostoEnvioNombreSnapshot = venta.CostoEnvioNombreSnapshot,\n                CostoEnvioDepartamentoSnapshot = venta.CostoEnvioDepartamentoSnapshot,\n                CostoEnvioCiudadSnapshot = venta.CostoEnvioCiudadSnapshot,\n                CostoEnvioZonaSnapshot = venta.CostoEnvioZonaSnapshot,\n                CostoEnvioModalidadSnapshot = venta.CostoEnvioModalidadSnapshot,\n                CostoEnvioMontoSnapshot = venta.CostoEnvioMontoSnapshot,')
          rep('backend/src/Application/Services/VentaService.cs',
              '        CostoEnvioNombre = v.CostoEnvioNombreSnapshot,\n        EnvioExonerado = v.EnvioExonerado,',
              '        CostoEnvioNombre = v.CostoEnvioNombreSnapshot,\n        CostoEnvioDepartamento = v.CostoEnvioDepartamentoSnapshot,\n        CostoEnvioCiudad = v.CostoEnvioCiudadSnapshot,\n        CostoEnvioZona = v.CostoEnvioZonaSnapshot,\n        CostoEnvioModalidad = v.CostoEnvioModalidadSnapshot,\n        EnvioExonerado = v.EnvioExonerado,')
          rep('backend/src/Application/Services/FacturaService.cs',
              '            CostoEnvioNombre = f.CostoEnvioNombreSnapshot,\n            EnvioExonerado = f.EnvioExonerado,',
              '            CostoEnvioNombre = f.CostoEnvioNombreSnapshot,\n            CostoEnvioDepartamento = f.CostoEnvioDepartamentoSnapshot,\n            CostoEnvioCiudad = f.CostoEnvioCiudadSnapshot,\n            CostoEnvioZona = f.CostoEnvioZonaSnapshot,\n            CostoEnvioModalidad = f.CostoEnvioModalidadSnapshot,\n            EnvioExonerado = f.EnvioExonerado,')

          # Frontend: modelos y mantenimiento profesional.
          rep('frontend/src/app/core/models/costo-envio.model.ts',
              '  activo: boolean;\n  fechaCreacion:',
              '  activo: boolean;\n  estaVigente: boolean;\n  fechaCreacion:')
          rep('frontend/src/app/features/costos-envio/costos-envio.component.ts',
              "  readonly columnas = ['nombre', 'monto', 'vigencia', 'estado', 'predeterminado', 'acciones'];",
              "  readonly columnas = ['nombre', 'cobertura', 'monto', 'vigencia', 'estado', 'predeterminado', 'acciones'];")
          rep('frontend/src/app/features/costos-envio/costos-envio.component.ts',
              "    descripcion: ['', Validators.maxLength(500)],\n    monto:",
              "    descripcion: ['', Validators.maxLength(500)],\n    departamento: ['', Validators.maxLength(120)],\n    ciudad: ['', Validators.maxLength(120)],\n    zona: ['', Validators.maxLength(150)],\n    modalidad: ['', Validators.maxLength(80)],\n    monto:")
          rep('frontend/src/app/features/costos-envio/costos-envio.component.ts',
              "      descripcion: item.descripcion ?? '',\n      monto: item.monto,",
              "      descripcion: item.descripcion ?? '',\n      departamento: item.departamento ?? '',\n      ciudad: item.ciudad ?? '',\n      zona: item.zona ?? '',\n      modalidad: item.modalidad ?? '',\n      monto: item.monto,")
          rep('frontend/src/app/features/costos-envio/costos-envio.component.ts',
              "      nombre: '', descripcion: '', monto: 80, vigenteDesde: '', vigenteHasta: '',",
              "      nombre: '', descripcion: '', departamento: '', ciudad: '', zona: '', modalidad: '', monto: 80, vigenteDesde: '', vigenteHasta: '',")
          rep('frontend/src/app/features/costos-envio/costos-envio.component.ts',
              "      descripcion: raw.descripcion?.trim() || undefined,\n      monto:",
              "      descripcion: raw.descripcion?.trim() || undefined,\n      departamento: raw.departamento?.trim() || undefined,\n      ciudad: raw.ciudad?.trim() || undefined,\n      zona: raw.zona?.trim() || undefined,\n      modalidad: raw.modalidad?.trim() || undefined,\n      monto:")
          rep('frontend/src/app/features/costos-envio/costos-envio.component.ts',
              '  private fechaInput(fecha?: string): string {',
              '''  cobertura(item: CostoEnvio): string {\n    const ubicacion = [item.departamento, item.ciudad, item.zona].filter(Boolean).join(' · ') || 'Cobertura general';\n    return item.modalidad ? `${ubicacion} · ${item.modalidad}` : ubicacion;\n  }\n\n  private fechaInput(fecha?: string): string {''')
          rep('frontend/src/app/features/costos-envio/costos-envio.component.html',
              '    <p>Administra el importe que VariApp separa una sola vez por factura. El valor predeterminado inicial es L. 80.00.</p>',
              '    <p>Administra tarifas por departamento, ciudad, zona y modalidad, con prioridad y vigencia.</p>')
          rep('frontend/src/app/features/costos-envio/costos-envio.component.html',
              '      <mat-form-field appearance="outline">\n        <mat-label>Monto</mat-label>',
              '''      <mat-form-field appearance="outline"><mat-label>Departamento</mat-label><input matInput formControlName="departamento" maxlength="120"></mat-form-field>\n      <mat-form-field appearance="outline"><mat-label>Ciudad</mat-label><input matInput formControlName="ciudad" maxlength="120"></mat-form-field>\n      <mat-form-field appearance="outline"><mat-label>Zona</mat-label><input matInput formControlName="zona" maxlength="150"></mat-form-field>\n      <mat-form-field appearance="outline"><mat-label>Modalidad</mat-label><input matInput formControlName="modalidad" maxlength="80"></mat-form-field>\n      <mat-form-field appearance="outline">\n        <mat-label>Monto</mat-label>''')
          rep('frontend/src/app/features/costos-envio/costos-envio.component.html',
              '      <ng-container matColumnDef="monto">',
              '''      <ng-container matColumnDef="cobertura">\n        <th mat-header-cell *matHeaderCellDef>Cobertura / modalidad</th>\n        <td mat-cell *matCellDef="let item">{{ cobertura(item) }}</td>\n      </ng-container>\n      <ng-container matColumnDef="monto">''')
          rep('frontend/src/app/features/costos-envio/costos-envio.component.html',
              "{{ item.activo ? 'Activo' : 'Inactivo' }}",
              "{{ !item.activo ? 'Inactivo' : (item.estaVigente ? 'Vigente' : 'Fuera de vigencia') }}")

          # Venta solo presenta tarifas realmente vigentes.
          rep('frontend/src/app/features/ventas/venta-form.component.ts',
              '        const activos = res.data.filter((x) => x.activo);',
              '        const activos = res.data.filter((x) => x.activo && x.estaVigente);')

          # Regresión de cobertura exacta en cálculo.
          p=Path('backend/tests/InventoryApp.Tests/CalculoServiceTests.cs'); t=p.read_text()
          marker='    [Fact]\n    public async Task CalcularVentaAsync_ExoneracionSinMotivo_EsRechazada()'
          if marker not in t: raise SystemExit('Marcador CalculoServiceTests no encontrado')
          test='''    [Fact]\n    public async Task CalcularVentaAsync_CostoSeleccionado_PreservaCoberturaProfesional()\n    {\n        _costoEnvioRepository.Setup(r => r.GetByIdAsync(44)).ReturnsAsync(new CostoEnvio\n        {\n            Id = 44, Nombre = "Entrega Centro", Departamento = "Francisco Morazán", Ciudad = "Tegucigalpa",\n            Zona = "Centro", Modalidad = "Entrega local", Monto = 80m, Activo = true\n        });\n\n        var resultado = await _service.CalcularVentaAsync(\n            new List<DetalleCalculoInput> { new() { ProductoId = 1, Cantidad = 1, PrecioUnitario = 300m } },\n            null, null, null, costoEnvioId: 44);\n\n        Assert.Equal("Francisco Morazán", resultado.CostoEnvioDepartamento);\n        Assert.Equal("Tegucigalpa", resultado.CostoEnvioCiudad);\n        Assert.Equal("Centro", resultado.CostoEnvioZona);\n        Assert.Equal("Entrega local", resultado.CostoEnvioModalidad);\n    }\n\n'''
          p.write_text(t.replace(marker,test+marker,1))
          PY
      - name: Generar migración snapshots M7 y validar backend
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore InventoryApp.sln
          dotnet tool install --global dotnet-ef --version 8.0.8
          dotnet ef migrations add M7SnapshotsProfesionalesEnvio --project src/Infrastructure/InventoryApp.Infrastructure.csproj --startup-project src/API/InventoryApp.API.csproj --context AppDbContext --output-dir Persistence/Migrations
          dotnet build InventoryApp.sln --configuration Release --no-restore
          dotnet test InventoryApp.sln --configuration Release --no-build --filter "Category!=Integration"
      - name: Validar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build:prod
      - name: Publicar cierre funcional y retirar workflow temporal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m7-finalizar.yml
          git add backend frontend
          git diff --cached --check
          git commit -m 'feat(m7): preservar cobertura histórica y auditoría de envíos [ChatGPT]'
          git push origin HEAD:Desarrollo
