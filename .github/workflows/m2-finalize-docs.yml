name: M2 cierre documental certificado

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/m2-finalize-docs.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Cerrar documentación M2 con evidencia real
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          fase = Path('docs/FASE_M2_VARIANTES_MULTIDIMENSIONALES.md')
          text = fase.read_text(encoding='utf-8')

          old = 'Estado documental: **EN CERTIFICACIÓN AUTOMATIZADA FINAL**'
          new = 'Estado documental: **COMPLETADA / CERTIFICADA AUTOMÁTICAMENTE**'
          if text.count(old) != 1:
              raise SystemExit(f'FAIL-CLOSED: estado M2 esperado una vez, encontrado {text.count(old)}')
          text = text.replace(old, new, 1)

          old_ids = 'Los IDs finales de GitHub Actions se incorporarán en este mismo documento únicamente cuando los jobs del HEAD de cierre concluyan en `success`.'
          new_ids = '''Evidencia final del HEAD funcional certificado `98603c21fa4b05b6e6c72565b579ab247b902b19`:\n\n- `31325383762` — Desarrollo - Compilación y pruebas — **success**;\n- `31325383745` — Desarrollo - aceptación funcional integral — **success**;\n- `31325383744` — Fase 2 - Auditoría de configuración y dependencias — **success**;\n- `31325383748` — Bloque 2C.1 - Variante técnica y migración — **success**;\n- `31325383772` — Fase 8 - Validación completa automatizada — **success**;\n- `31325383746` — VariApp CI — **skipped** (registrado como tal, no contabilizado como verde).\n\nDentro de `31325383762` quedaron en **success** backend Release, pruebas unitarias, frontend lint/build de producción, Docker/higiene, historial de migraciones, migraciones actuales, integración MySQL 8.4, verificación de variante legacy/cargas/snapshot y SQL forward.'''
          if text.count(old_ids) != 1:
              raise SystemExit(f'FAIL-CLOSED: marcador de IDs esperado una vez, encontrado {text.count(old_ids)}')
          text = text.replace(old_ids, new_ids, 1)

          tail = '`VariApp CI` se reportará como `SKIPPED` cuando esa sea su conclusión real; nunca se contabilizará como workflow verde.'
          cierre = '''`VariApp CI` se reportó como `SKIPPED`, tal como ocurrió en el HEAD certificado, y no se contabiliza como workflow verde.\n\n---\n\n## 20. Dictamen final M2\n\n**M2 — Motor de Variantes Multidimensionales: COMPLETADA / CERTIFICADA AUTOMÁTICAMENTE.**\n\nCriterios de salida verificados:\n\n- no existen fallos P0/P1 introducidos por M2 en los gates automatizados ejecutados;\n- backend Release y pruebas: success;\n- MySQL 8.4 descartable, migraciones e integración: success;\n- snapshot EF: coherente;\n- frontend lint/build: success;\n- aceptación funcional integral: success;\n- auditoría de dependencias/configuración: success;\n- variante técnica/migración: success;\n- Fase 8 completa: success;\n- `main` y Producción no forman parte de este cierre.\n\nLas validaciones físicas/externas enumeradas en la sección 17 permanecen separadas y no se presentan como ejecutadas.\n\n**Fase siguiente: M3 — Configuración fiscal ISV/ISC.**'''
          if text.count(tail) != 1:
              raise SystemExit(f'FAIL-CLOSED: gate final esperado una vez, encontrado {text.count(tail)}')
          text = text.replace(tail, cierre, 1)
          fase.write_text(text, encoding='utf-8')

          plan = Path('docs/PLAN_MAESTRO_MEJORAS_EMPRESARIALES_2026.md')
          p = plan.read_text(encoding='utf-8')
          marker = '# FASE M2 — Motor de variantes multidimensionales\n\nObjetivo:'
          replacement = '# FASE M2 — Motor de variantes multidimensionales\n\nEstado: **COMPLETADA / CERTIFICADA AUTOMÁTICAMENTE (2026-08-09)**.\n\nEntregable: `docs/FASE_M2_VARIANTES_MULTIDIMENSIONALES.md`.\n\nObjetivo:'
          if p.count(marker) != 1:
              raise SystemExit(f'FAIL-CLOSED: encabezado M2 esperado una vez, encontrado {p.count(marker)}')
          plan.write_text(p.replace(marker, replacement, 1), encoding='utf-8')
          PY

          grep -Fq 'COMPLETADA / CERTIFICADA AUTOMÁTICAMENTE' docs/FASE_M2_VARIANTES_MULTIDIMENSIONALES.md
          grep -Fq '31325383762' docs/FASE_M2_VARIANTES_MULTIDIMENSIONALES.md
          grep -Fq 'Estado: **COMPLETADA / CERTIFICADA AUTOMÁTICAMENTE (2026-08-09)**.' docs/PLAN_MAESTRO_MEJORAS_EMPRESARIALES_2026.md

      - name: Publicar cierre y autoeliminar workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/m2-finalize-docs.yml
          git config user.name 'VariApp Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/FASE_M2_VARIANTES_MULTIDIMENSIONALES.md docs/PLAN_MAESTRO_MEJORAS_EMPRESARIALES_2026.md
          git add -u .github/workflows/m2-finalize-docs.yml
          git commit -m 'docs(m2): cerrar certificación de variantes multidimensionales [ChatGPT]'
          git push origin HEAD:Desarrollo
