name: SOLQARYN Canonical Identity Migration

on:
  push:
    branches:
      - Desarrollo
    paths:
      - ".github/workflows/solqaryn-identity-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Normalize non-workflow tree to SOLQARYN
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          retired = "vari" + "app"
          pattern = re.compile(re.escape(retired), re.IGNORECASE)

          def repl(match):
              value = match.group(0)
              if value.isupper():
                  return "SOLQARYN"
              if value.islower():
                  return "solqaryn"
              return "Solqaryn"

          def is_workflow(path):
              parts = path.parts
              return len(parts) >= 3 and parts[0] == ".github" and parts[1] == "workflows"

          changed = 0
          skipped_binary = 0
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts or is_workflow(path):
                  continue
              data = path.read_bytes()
              if b"\x00" in data:
                  skipped_binary += 1
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  skipped_binary += 1
                  continue
              new_text = pattern.sub(repl, text)
              if new_text != text:
                  path.write_text(new_text, encoding="utf-8", newline="")
                  changed += 1

          paths = [
              p for p in root.rglob("*")
              if ".git" not in p.parts and not is_workflow(p) and pattern.search(p.name)
          ]
          for path in sorted(paths, key=lambda p: len(p.parts), reverse=True):
              if not path.exists():
                  continue
              new_name = pattern.sub(repl, path.name)
              target = path.with_name(new_name)
              if target.exists():
                  raise RuntimeError(f"rename collision: {path} -> {target}")
              path.rename(target)

          changelog = root / "CHANGELOG_AI.md"
          marker = "## 2026-09-23 — Identidad canónica SOLQARYN consolidada"
          if changelog.exists():
              text = changelog.read_text(encoding="utf-8")
              if marker not in text:
                  entry = (
                      marker + "\n\n"
                      "- Repositorio canónico: `solqaryn/Solqaryn`.\n"
                      "- Identidad de proyecto: `PROJECT_ID=SOLQARYN`.\n"
                      "- Se normalizaron rutas, namespaces, scripts, documentación, guards y referencias operativas a SOLQARYN.\n"
                      "- La rama canónica continúa siendo `Desarrollo`.\n"
                      "- La migración no reescribe el historial Git; el árbol vigente queda gobernado únicamente por SOLQARYN.\n"
                      "- MAPA_ARQUITECTURA: identidad/namespaces actualizados sin cambiar las fronteras funcionales del dominio.\n\n"
                  )
                  changelog.write_text(entry + text, encoding="utf-8", newline="")

          print(f"text_files_changed={changed}")
          print(f"binary_files_skipped={skipped_binary}")
          PY

      - name: Verify retired identity is absent outside workflows
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          retired = "vari" + "app"
          pattern = re.compile(re.escape(retired), re.IGNORECASE)

          def is_workflow(path):
              parts = path.parts
              return len(parts) >= 3 and parts[0] == ".github" and parts[1] == "workflows"

          findings = []
          for path in Path(".").rglob("*"):
              if ".git" in path.parts or is_workflow(path):
                  continue
              if pattern.search(str(path)):
                  findings.append(f"path:{path}")
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if b"\x00" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              if pattern.search(text):
                  findings.append(f"content:{path}")
          if findings:
              print("\n".join(findings[:200]))
              sys.exit(1)
          print("SOLQARYN non-workflow identity verification: PASS")
          PY

      - name: Commit non-workflow canonical identity migration
        shell: bash
        run: |
          git config user.name "SOLQARYN Automation"
          git config user.email "solqaryn.platform@outlook.com"
          git add -A -- ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "No non-workflow changes to commit."
            exit 0
          fi
          git commit -m "refactor(identity): consolidate SOLQARYN canonical naming"
          git push origin HEAD:Desarrollo
