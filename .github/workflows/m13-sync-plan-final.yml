name: M13 - Sincronizar cierre final del Plan Maestro

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/m13-sync-plan-final.yml'

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Sincronizar M13 y cierre del Plan Maestro
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/PLAN_MAESTRO_MEJORAS_EMPRESARIALES_2026.md')
          text = path.read_text(encoding='utf-8')

          heading = '# FASE M13 — Auditoría integral, hardening y certificación final\n\nRevisar:'
          replacement = '''# FASE M13 — Auditoría integral, hardening y certificación final

Estado: **COMPLETADA / CERTIFICADA AUTOMÁTICAMENTE (2026-08-10)**.

Entregable: `docs/FASE_M13_AUDITORIA_INTEGRAL_HARDENING_CERTIFICACION_FINAL.md`.

HEAD funcional certificado: `19539c72d3a617d95bb3c03dfbde5f6b212ca1de`.

Dictamen automatizado: **APROBADO — P0/P1 abiertos = 0; Producción tocada = false; validación externa/física permanece separada y pendiente**.

Revisar:'''
          if heading not in text:
              raise SystemExit('No se encontró el encabezado M13 esperado')
          text = text.replace(heading, replacement, 1)

          old_order = '`M0 ✅ -> M0.B ✅ -> M1 -> M2 -> M3 -> M4 -> M5 -> M6 -> M7 -> M8 -> M9 -> M10 -> M11 -> M12 -> M13`'
          new_order = '`M0 ✅ -> M0.B ✅ -> M1 ✅ -> M2 ✅ -> M3 ✅ -> M4 ✅ -> M5 ✅ -> M6 ✅ -> M7 ✅ -> M8 ✅ -> M9 ✅ -> M10 ✅ -> M11 ✅ -> M12 ✅ -> M13 ✅`'
          if old_order not in text:
              raise SystemExit('No se encontró el orden obligatorio esperado')
          text = text.replace(old_order, new_order, 1)

          marker = '## Orden obligatorio de ejecución'
          closure = '''## Cierre del Plan Maestro M0–M13

El Plan Maestro de Mejoras Empresariales M0–M13 queda **COMPLETADO Y CERTIFICADO AUTOMÁTICAMENTE en `Desarrollo`** con M13.

Este cierre **no autoriza** merge del PR #2, cambios en `main`, auto-merge, despliegue productivo ni modificación de recursos de Producción. Las validaciones externas/físicas permanecen como proceso separado cuando correspondan.

No existe una fase M14 dentro del plan vigente; cualquier evolución posterior deberá abrir un nuevo plan o proceso formal de liberación/mantenimiento.

---

'''
          if marker not in text:
              raise SystemExit('No se encontró el marcador de orden obligatorio')
          if '## Cierre del Plan Maestro M0–M13' not in text:
              text = text.replace(marker, closure + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PLAN_MAESTRO_MEJORAS_EMPRESARIALES_2026.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'Plan Maestro ya sincronizado'; exit 0; }
          git commit -m "docs(m13): cerrar Plan Maestro M0-M13 [ChatGPT]"
          git push origin HEAD:Desarrollo
