name: M13 - Sincronizar cierre final del Plan Maestro

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/m13-sync-plan-final.yml'

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Sincronizar M13 y cierre del Plan Maestro
        run: python .github/scripts/m13_sync_plan.py

      - name: Publicar Plan Maestro
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PLAN_MAESTRO_MEJORAS_EMPRESARIALES_2026.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Plan Maestro ya sincronizado"
            exit 0
          fi
          git commit -m "docs(m13): cerrar Plan Maestro M0-M13 [ChatGPT]"
          git push origin HEAD:Desarrollo
