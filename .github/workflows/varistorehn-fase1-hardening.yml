name: VariStoreHn Fase 1 - hardening

on:
  push:
    branches:
      - chatgpt/varistorehn-fase1-hardening

permissions:
  contents: read

concurrency:
  group: varistorehn-fase1-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Fase 1 - lint, build y navegador
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint y guardas permanentes
        run: npm run lint

      - name: Build de produccion
        run: npm run build:prod

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Iniciar Angular
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > varistorehn-fase1-hardening.log 2>&1 &

      - name: Esperar Angular
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4200/varistorehn > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat varistorehn-fase1-hardening.log >&2 || true
          exit 1

      - name: Playwright Fase 1
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
        run: npx playwright test e2e/varistorehn-fase1.spec.ts --config=playwright.config.ts

      - name: Evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: varistorehn-fase1-hardening
          path: |
            frontend/varistorehn-fase1-hardening.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7
