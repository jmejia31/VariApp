name: Fase 4 - corregir mapeo de variante en factura

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/checkpoints/fase4-integrar-operaciones-variantes

permissions:
  contents: write

jobs:
  corregir:
    if: github.event.pull_request.head.ref == 'Desarrollo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Corregir propiedades de FacturaDetalle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/src/Application/Services/VentaService.cs')
          text = p.read_text(encoding='utf-8-sig')
          cambios = {
              'ProductoColor = d.ProductoColorSnapshot': 'VarianteColor = d.ProductoColorSnapshot',
              'ProductoSku = d.ProductoSkuSnapshot': 'VarianteSku = d.ProductoSkuSnapshot'
          }
          for old, new in cambios.items():
              if old not in text:
                  raise SystemExit(f'No se encontró: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Validar backend
        working-directory: backend
        run: |
          dotnet restore InventoryApp.sln
          dotnet build InventoryApp.sln --configuration Release --no-restore
          dotnet test InventoryApp.sln --configuration Release --no-build
      - name: Publicar corrección
        run: |
          git config user.name 'VariApp Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/src/Application/Services/VentaService.cs
          git commit -m 'fix: conservar color y SKU en detalle de factura'
          git pull --rebase origin Desarrollo
          git push origin HEAD:Desarrollo
