name: Fase 4 - diagnóstico de compilación

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/checkpoints/fase4-diagnostico-build

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'Desarrollo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Capturar diagnósticos seguros
        run: |
          set +e
          (cd backend && dotnet restore InventoryApp.sln && dotnet build InventoryApp.sln --configuration Release --no-restore) > docs/FASE4_BACKEND_DIAGNOSTICO.txt 2>&1
          backend_code=$?
          (cd frontend && npm ci && npm run build:prod) > docs/FASE4_FRONTEND_DIAGNOSTICO.txt 2>&1
          frontend_code=$?
          tail -n 180 docs/FASE4_BACKEND_DIAGNOSTICO.txt > docs/backend.tail
          tail -n 180 docs/FASE4_FRONTEND_DIAGNOSTICO.txt > docs/frontend.tail
          mv docs/backend.tail docs/FASE4_BACKEND_DIAGNOSTICO.txt
          mv docs/frontend.tail docs/FASE4_FRONTEND_DIAGNOSTICO.txt
          echo "EXIT_CODE=$backend_code" >> docs/FASE4_BACKEND_DIAGNOSTICO.txt
          echo "EXIT_CODE=$frontend_code" >> docs/FASE4_FRONTEND_DIAGNOSTICO.txt
          exit 0
      - name: Publicar diagnóstico
        run: |
          git config user.name 'VariApp Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/FASE4_BACKEND_DIAGNOSTICO.txt docs/FASE4_FRONTEND_DIAGNOSTICO.txt
          git commit -m 'chore: registrar diagnóstico de compilación fase 4'
          git push origin HEAD:Desarrollo
