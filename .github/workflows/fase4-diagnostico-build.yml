name: Fase 4 - diagnóstico de compilación

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/checkpoints/fase4-diagnostico-build

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'Desarrollo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Capturar diagnósticos seguros
        run: |
          set +e
          mkdir -p /tmp/fase4-diagnostico
          (cd backend && dotnet restore InventoryApp.sln && dotnet build InventoryApp.sln --configuration Release --no-restore) > /tmp/fase4-diagnostico/backend.txt 2>&1
          backend_code=$?
          (cd frontend && npm ci && npm run build:prod) > /tmp/fase4-diagnostico/frontend.txt 2>&1
          frontend_code=$?
          tail -n 220 /tmp/fase4-diagnostico/backend.txt > /tmp/fase4-diagnostico/backend.tail
          tail -n 220 /tmp/fase4-diagnostico/frontend.txt > /tmp/fase4-diagnostico/frontend.tail
          mv /tmp/fase4-diagnostico/backend.tail /tmp/fase4-diagnostico/backend.txt
          mv /tmp/fase4-diagnostico/frontend.tail /tmp/fase4-diagnostico/frontend.txt
          echo "EXIT_CODE=$backend_code" >> /tmp/fase4-diagnostico/backend.txt
          echo "EXIT_CODE=$frontend_code" >> /tmp/fase4-diagnostico/frontend.txt
          exit 0
      - name: Publicar artefacto diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: fase4-diagnostico-compilacion
          path: /tmp/fase4-diagnostico/*.txt
          if-no-files-found: error
          retention-days: 3
