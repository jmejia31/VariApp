name: PROD - Power on Aiven MySQL

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prod-aiven-poweron.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  power-on:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: PROD
    env:
      AIVEN_TOKEN: ${{ secrets.SOLQARYN_AIVEN_TOKEN }}
    steps:
      - name: Instalar Aiven CLI
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AIVEN_TOKEN"
          python3 -m pip install --disable-pip-version-check --quiet aiven-client

      - name: Encender servicio canónico y esperar RUNNING
        shell: bash
        run: |
          set -euo pipefail
          avn --auth-token "$AIVEN_TOKEN" --project solqaryn service update solqaryn-mysql --power-on
          avn --auth-token "$AIVEN_TOKEN" --project solqaryn service wait solqaryn-mysql

      - name: Verificar estado sin secretos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          token=os.environ["AIVEN_TOKEN"].strip()
          req=urllib.request.Request(
              "https://api.aiven.io/v1/project/solqaryn/service/solqaryn-mysql",
              headers={
                  "Authorization":f"aivenv1 {token}",
                  "Accept":"application/json",
                  "User-Agent":"SOLQARYN-PROD-PowerOn/1.0"
              }
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              payload=json.load(r)
          svc=payload.get("service",payload)
          result={
              "serviceName":svc.get("service_name"),
              "serviceType":svc.get("service_type"),
              "state":svc.get("state"),
              "plan":svc.get("plan"),
              "writeOperation":"POWER_ON_ONLY",
              "databaseWrites":False,
              "secretValuesPrinted":False
          }
          print(json.dumps(result,separators=(",",":")))
          if svc.get("service_name")!="solqaryn-mysql" or svc.get("service_type")!="mysql":
              raise SystemExit("AIVEN_SERVICE_MISMATCH")
          if svc.get("state")!="RUNNING":
              raise SystemExit(f"AIVEN_STATE_NOT_RUNNING={svc.get('state')}")
          PY

      - name: Resumen
        shell: bash
        run: |
          echo "AIVEN_PROD_SERVICE_POWER_ON=PASS"
          echo "DATABASE_WRITES=0"
          echo "RENDER_DEPLOY_TRIGGERED=FALSE"
