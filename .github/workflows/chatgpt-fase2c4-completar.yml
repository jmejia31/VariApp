name: Temporal ChatGPT - cierre frontend escáner 2C.4

on:
  push:
    branches:
      - Desarrollo
    paths:
      - .github/workflows/chatgpt-fase2c4-completar.yml
      - scripts/chatgpt_fase2c4_complete.py

permissions:
  contents: write

jobs:
  completar-y-validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Aplicar cierre funcional 2C.4
        run: |
          python3 scripts/chatgpt_fase2c4_complete.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/app/shared/codigo-scanner-dialog/codigo-scanner-dialog.component.ts')
          text = path.read_text(encoding='utf-8')
          expected = "{\n        formatsToSupport: ["
          replacement = "{\n        verbose: false,\n        formatsToSupport: ["
          count = text.count(expected)
          if count != 2:
              raise SystemExit(f'Se esperaban 2 configuraciones html5-qrcode y se encontraron {count}.')
          path.write_text(text.replace(expected, replacement), encoding='utf-8')
          PY

      - name: Instalar dependencias exactas
        working-directory: frontend
        run: npm ci

      - name: Validar TypeScript, calidad y contrato 2C.4
        working-directory: frontend
        run: npm run lint

      - name: Compilar frontend de producción
        working-directory: frontend
        run: npm run build:prod

      - name: Validar cambios preparados
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --porcelain)"
          test ! -e .github/workflows/chatgpt-fase2c4-completar.yml
          test ! -e .github/workflows/chatgpt-fase2c4-dependencia.yml
          test ! -e scripts/chatgpt_fase2c4_complete.py

      - name: Publicar Fase 2C.4 en Desarrollo
        run: |
          set -euo pipefail
          git config user.name 'jmejia31'
          git config user.email '93171442+jmejia31@users.noreply.github.com'
          git add -A
          git commit -m 'feat(escaner): completar frontend cámara y lectores físicos 2C.4 [ChatGPT]'
          git push origin HEAD:Desarrollo
