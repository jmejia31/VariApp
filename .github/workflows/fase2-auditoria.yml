name: Fase 2 - Auditoría de configuración y dependencias

on:
  push:
    branches:
      - Desarrollo
    paths:
      - .github/workflows/fase2-auditoria.yml
      - backend/**
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/vercel.json
      - render.yaml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fase2-auditoria.yml
      - backend/**
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/vercel.json
      - render.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fase2-auditoria-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Configuración, aislamiento y endurecimiento
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar configuración declarativa
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.safe_load(File.read('render.yaml'), permitted_classes: [], aliases: true)"
          node -e "JSON.parse(require('fs').readFileSync('frontend/vercel.json', 'utf8'))"

          grep -q 'branch: Desarrollo' render.yaml
          grep -q 'name: variapp-api-desarrollo' render.yaml
          grep -q 'healthCheckPath: /health/ready' render.yaml
          grep -A1 'AllowedHosts' render.yaml | grep -q 'variapp-api-desarrollo.onrender.com'
          grep -A1 'Database__ApplyMigrationsOnStartup' render.yaml | grep -q '"true"'
          grep -A1 'Security__LoginRateLimitPerMinute' render.yaml | grep -q '"20"'
          grep -A1 'Cloudinary__EnvironmentPrefix' render.yaml | grep -q 'varistorehn_desarrollo'
          grep -A1 'AppSettings__LogoPublicUrl' render.yaml | grep -q 'variapp-desarrollo.vercel.app'
          grep -q 'variapp-api-desarrollo.onrender.com' frontend/vercel.json
          grep -q 'variapp-api.onrender.com' frontend/vercel.json

          grep -Fq 'USER $APP_UID' backend/Dockerfile
          grep -q 'AddRateLimiter' backend/src/API/Program.cs
          grep -q '/health/ready' backend/src/API/Program.cs
          grep -q 'X-Content-Type-Options' backend/src/API/Program.cs
          grep -q 'EnableRateLimiting("AuthLogin")' backend/src/API/Controllers/AuthController.cs

          if grep -A1 'AppSettings__LogoPublicUrl' render.yaml | grep -q 'varistorehn.vercel.app'; then
            echo 'Render Desarrollo no debe depender del logo servido por Producción.' >&2
            exit 1
          fi

  backend-dependencies:
    name: Dependencias vulnerables de .NET
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Restaurar
        working-directory: backend
        run: dotnet restore InventoryApp.sln

      - name: Auditar paquetes vulnerables
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet list InventoryApp.sln package --vulnerable --include-transitive | tee dotnet-vulnerabilities.txt
          if grep -q 'has the following vulnerable packages' dotnet-vulnerabilities.txt; then
            echo 'Se detectaron paquetes .NET vulnerables.' >&2
            exit 1
          fi

      - name: Publicar evidencia .NET
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase2-dotnet-dependencies
          path: backend/dotnet-vulnerabilities.txt
          if-no-files-found: warn
          retention-days: 14

  frontend-dependencies:
    name: Dependencias productivas de npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Auditar vulnerabilidades altas o críticas
        run: npm audit --omit=dev --audit-level=high