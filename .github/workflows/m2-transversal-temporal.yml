name: M2 - Propagacion transversal temporal

on:
  push:
    branches: [Desarrollo]
    paths:
      - .github/workflows/m2-transversal-temporal.yml

permissions:
  contents: write

jobs:
  patch-build-migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Aplicar propagacion M2
        run: |
          python3 <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p=Path(path); s=p.read_text(encoding='utf-8-sig')
              actual=s.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: esperado >= {count}, encontrado {actual}: {old[:80]!r}')
              s=s.replace(old,new,count)
              p.write_text(s,encoding='utf-8')

          # Formulario de variantes: las cuatro dimensiones son operativas y opcionales.
          p=Path('backend/src/Application/DTOs/CreateProductoDto.cs')
          s=p.read_text(encoding='utf-8-sig')
          a=s.index('public class ProductoVarianteFormularioDto')
          b=s.index('\npublic class CreateProductoDto',a)
          nuevo='''public class ProductoVarianteFormularioDto
          {
              public int? Id { get; set; }
              public int? MarcaId { get; set; }
              public int? ModeloId { get; set; }
              public int? ColorId { get; set; }
              public int? TallaId { get; set; }
              public string? Sku { get; set; }
              public string? CodigoBarras { get; set; }
              public int Cantidad { get; set; }
              public int UmbralStockBajo { get; set; } = 5;
              public decimal Costo { get; set; }
              public decimal Precio { get; set; }
              public bool Activo { get; set; } = true;
          }
          '''
          s=s[:a]+nuevo+s[b:]
          s=s.replace('/// Colores/SKU del producto. El formulario nuevo siempre envía al menos uno.','/// Variantes físicas del producto. Cada fila puede combinar Marca/Modelo/Color/Talla.')
          p.write_text(s,encoding='utf-8')

          # Snapshots históricos completos.
          rep('backend/src/Domain/Entities/CompraDetalle.cs','    public string? ProductoColorSnapshot { get; set; }\n    public string? ProductoSkuSnapshot { get; set; }','    public string? ProductoColorSnapshot { get; set; }\n    public string? ProductoTallaSnapshot { get; set; }\n    public string? ProductoSkuSnapshot { get; set; }')
          rep('backend/src/Domain/Entities/VentaDetalle.cs','    public string? ProductoColorSnapshot { get; set; }\n    public string? ProductoSkuSnapshot { get; set; }','    public string? ProductoColorSnapshot { get; set; }\n    public string? ProductoTallaSnapshot { get; set; }\n    public string? ProductoSkuSnapshot { get; set; }')
          rep('backend/src/Domain/Entities/FacturaDetalle.cs','    public string? VarianteColor { get; set; }\n    public string? VarianteSku { get; set; }','    public string? VarianteColor { get; set; }\n    public string? VarianteTalla { get; set; }\n    public string? VarianteSku { get; set; }')
          rep('backend/src/Domain/Entities/MovimientoInventario.cs','    public string? ProductoColorSnapshot { get; set; }\n    public string? ProductoSkuSnapshot { get; set; }','    public string? ProductoMarcaSnapshot { get; set; }\n    public string? ProductoModeloSnapshot { get; set; }\n    public string? ProductoColorSnapshot { get; set; }\n    public string? ProductoTallaSnapshot { get; set; }\n    public string? ProductoSkuSnapshot { get; set; }')

          rep('backend/src/Infrastructure/Persistence/Configurations/CompraDetalleConfiguration.cs','        builder.Property(d => d.ProductoColorSnapshot).HasMaxLength(100);\n        builder.Property(d => d.ProductoSkuSnapshot).HasMaxLength(80);','        builder.Property(d => d.ProductoColorSnapshot).HasMaxLength(100);\n        builder.Property(d => d.ProductoTallaSnapshot).HasMaxLength(100);\n        builder.Property(d => d.ProductoSkuSnapshot).HasMaxLength(80);')
          rep('backend/src/Infrastructure/Persistence/Configurations/VentaDetalleConfiguration.cs','        builder.Property(d => d.ProductoColorSnapshot).HasMaxLength(100);\n        builder.Property(d => d.ProductoSkuSnapshot).HasMaxLength(80);','        builder.Property(d => d.ProductoColorSnapshot).HasMaxLength(100);\n        builder.Property(d => d.ProductoTallaSnapshot).HasMaxLength(100);\n        builder.Property(d => d.ProductoSkuSnapshot).HasMaxLength(80);')
          rep('backend/src/Infrastructure/Persistence/Configurations/FacturaDetalleConfiguration.cs','        builder.Property(d => d.ProductoCodigo).HasMaxLength(50);','        builder.Property(d => d.ProductoCodigo).HasMaxLength(50);\n        builder.Property(d => d.VarianteColor).HasMaxLength(100);\n        builder.Property(d => d.VarianteTalla).HasMaxLength(100);\n        builder.Property(d => d.VarianteSku).HasMaxLength(80);')
          rep('backend/src/Infrastructure/Persistence/Configurations/MovimientoInventarioConfiguration.cs','        builder.Property(m => m.ProductoColorSnapshot).HasMaxLength(100);\n        builder.Property(m => m.ProductoSkuSnapshot).HasMaxLength(80);','        builder.Property(m => m.ProductoMarcaSnapshot).HasMaxLength(100);\n        builder.Property(m => m.ProductoModeloSnapshot).HasMaxLength(100);\n        builder.Property(m => m.ProductoColorSnapshot).HasMaxLength(100);\n        builder.Property(m => m.ProductoTallaSnapshot).HasMaxLength(100);\n        builder.Property(m => m.ProductoSkuSnapshot).HasMaxLength(80);')

          rep('backend/src/Application/DTOs/CompraDto.cs','    public string? ProductoColor { get; set; }\n    public string? ProductoSku { get; set; }','    public string? ProductoColor { get; set; }\n    public string? ProductoTalla { get; set; }\n    public string? ProductoSku { get; set; }')
          rep('backend/src/Application/DTOs/VentaDto.cs','    public string? ProductoColor { get; set; }\n    public string? ProductoSku { get; set; }','    public string? ProductoColor { get; set; }\n    public string? ProductoTalla { get; set; }\n    public string? ProductoSku { get; set; }')

          # Compras: snapshot exacto de la variante y movimientos completos.
          rep('backend/src/Application/Services/CompraService.cs','                ProductoMarcaSnapshot = producto.Marca,\n                ProductoModeloSnapshot = producto.Modelo,\n                ProductoColorSnapshot = variante?.Color?.Nombre,\n                ProductoSkuSnapshot = variante?.Sku','                ProductoMarcaSnapshot = variante?.Marca?.Nombre ?? producto.Marca,\n                ProductoModeloSnapshot = variante?.Modelo?.Nombre ?? producto.Modelo,\n                ProductoColorSnapshot = variante?.Color?.Nombre,\n                ProductoTallaSnapshot = variante?.Talla?.Nombre,\n                ProductoSkuSnapshot = variante?.Sku')
          rep('backend/src/Application/Services/CompraService.cs','                    ProductoColorSnapshot = detalle.ProductoColorSnapshot,\n                    ProductoSkuSnapshot = detalle.ProductoSkuSnapshot,','                    ProductoMarcaSnapshot = detalle.ProductoMarcaSnapshot,\n                    ProductoModeloSnapshot = detalle.ProductoModeloSnapshot,\n                    ProductoColorSnapshot = detalle.ProductoColorSnapshot,\n                    ProductoTallaSnapshot = detalle.ProductoTallaSnapshot,\n                    ProductoSkuSnapshot = detalle.ProductoSkuSnapshot,',2)
          rep('backend/src/Application/Services/CompraService.cs','            ProductoColor = detalle.ProductoColorSnapshot,\n            ProductoSku = detalle.ProductoSkuSnapshot,','            ProductoColor = detalle.ProductoColorSnapshot,\n            ProductoTalla = detalle.ProductoTallaSnapshot,\n            ProductoSku = detalle.ProductoSkuSnapshot,')

          # Ventas: precio/costo de la variante exacta y snapshots completos.
          rep('backend/src/Application/Services/VentaService.cs','            var costoUnitario = variante?.Costo ?? producto.Costo;\n            var subtotal = input.Cantidad * input.PrecioUnitario;','            var costoUnitario = variante?.Costo ?? producto.Costo;\n            var precioUnitario = variante?.Precio ?? input.PrecioUnitario;\n            var subtotal = input.Cantidad * precioUnitario;')
          rep('backend/src/Application/Services/VentaService.cs','                PrecioUnitario = input.PrecioUnitario,','                PrecioUnitario = precioUnitario,')
          rep('backend/src/Application/Services/VentaService.cs','                ProductoMarcaSnapshot = producto.Marca,\n                ProductoModeloSnapshot = producto.Modelo,\n                ProductoColorSnapshot = variante?.Color?.Nombre,\n                ProductoSkuSnapshot = variante?.Sku','                ProductoMarcaSnapshot = variante?.Marca?.Nombre ?? producto.Marca,\n                ProductoModeloSnapshot = variante?.Modelo?.Nombre ?? producto.Modelo,\n                ProductoColorSnapshot = variante?.Color?.Nombre,\n                ProductoTallaSnapshot = variante?.Talla?.Nombre,\n                ProductoSkuSnapshot = variante?.Sku')
          rep('backend/src/Application/Services/VentaService.cs','                    ProductoColorSnapshot = detalle.ProductoColorSnapshot,\n                    ProductoSkuSnapshot = detalle.ProductoSkuSnapshot,','                    ProductoMarcaSnapshot = detalle.ProductoMarcaSnapshot,\n                    ProductoModeloSnapshot = detalle.ProductoModeloSnapshot,\n                    ProductoColorSnapshot = detalle.ProductoColorSnapshot,\n                    ProductoTallaSnapshot = detalle.ProductoTallaSnapshot,\n                    ProductoSkuSnapshot = detalle.ProductoSkuSnapshot,',2)
          rep('backend/src/Application/Services/VentaService.cs','                    VarianteColor = d.ProductoColorSnapshot,\n                    VarianteSku = d.ProductoSkuSnapshot,','                    VarianteColor = d.ProductoColorSnapshot,\n                    VarianteTalla = d.ProductoTallaSnapshot,\n                    VarianteSku = d.ProductoSkuSnapshot,')
          rep('backend/src/Application/Services/VentaService.cs','            ProductoColor = d.ProductoColorSnapshot,\n            ProductoSku = d.ProductoSkuSnapshot,','            ProductoColor = d.ProductoColorSnapshot,\n            ProductoTalla = d.ProductoTallaSnapshot,\n            ProductoSku = d.ProductoSkuSnapshot,')

          # Product builder: identidad exacta; SKU vacío lo genera el service, no el controller.
          p=Path('backend/src/API/Controllers/ProductosController.cs')
          s=p.read_text(encoding='utf-8-sig')
          s=s.replace('Producto y existencias por color creados correctamente.','Producto y variantes de existencia creados correctamente.')
          s=s.replace('Producto, colores y existencias actualizados correctamente.','Producto y variantes de existencia actualizados correctamente.')
          marker='    private async Task SincronizarVariantesAsync('
          a=s.index(marker)
          nuevo=r'''    private async Task SincronizarVariantesAsync(
              int productoId,
              IReadOnlyCollection<ProductoVarianteFormularioDto> solicitadas,
              IReadOnlyCollection<ProductoVarianteDto> existentes)
          {
              var tecnica = existentes.SingleOrDefault(v => v.EsTecnica);
              var comercialesExistentes = existentes.Where(v => !v.EsTecnica).ToList();

              if (solicitadas.Count == 0)
              {
                  if (comercialesExistentes.Any(v => v.Cantidad != 0))
                      throw new BusinessRuleException("No puedes convertir el producto en simple mientras alguna variante comercial tenga existencias.");
                  foreach (var comercial in comercialesExistentes)
                      await _varianteService.DeleteAsync(productoId, comercial.Id);
                  await _varianteService.AsegurarTecnicaAsync(productoId);
                  return;
              }

              if (tecnica is not null)
                  await _varianteService.RetirarTecnicaParaConversionAsync(productoId);

              if (solicitadas.Any(v => !v.MarcaId.HasValue && !v.ModeloId.HasValue && !v.ColorId.HasValue && !v.TallaId.HasValue))
                  throw new BusinessRuleException("Cada variante comercial debe definir al menos Marca, Modelo, Color o Talla.");
              if (solicitadas.Any(v => v.Cantidad < 0 || v.UmbralStockBajo < 0))
                  throw new BusinessRuleException("La cantidad y el umbral de cada variante no pueden ser negativos.");
              if (solicitadas.Any(v => v.Costo < 0 || v.Precio <= 0))
                  throw new BusinessRuleException("Cada variante debe tener costo no negativo y precio mayor que cero.");

              static string Clave(ProductoVarianteFormularioDto v) =>
                  $"{v.MarcaId ?? 0}:{v.ModeloId ?? 0}:{v.ColorId ?? 0}:{v.TallaId ?? 0}";
              if (solicitadas.GroupBy(Clave).Any(g => g.Count() > 1))
                  throw new BusinessRuleException("No puedes registrar dos veces la misma combinación de Marca, Modelo, Color y Talla.");

              var skus = solicitadas.Where(v => !string.IsNullOrWhiteSpace(v.Sku)).Select(v => v.Sku!.Trim().ToUpperInvariant()).ToList();
              if (skus.Distinct(StringComparer.OrdinalIgnoreCase).Count() != skus.Count)
                  throw new BusinessRuleException("No puedes repetir un SKU dentro del mismo producto.");
              var codigos = solicitadas.Where(v => !string.IsNullOrWhiteSpace(v.CodigoBarras)).Select(v => v.CodigoBarras!.Trim()).ToList();
              if (codigos.Distinct(StringComparer.OrdinalIgnoreCase).Count() != codigos.Count)
                  throw new BusinessRuleException("No puedes repetir un código de barras dentro del mismo producto.");

              var idsSolicitados = solicitadas.Where(v => v.Id.HasValue).Select(v => v.Id!.Value).ToHashSet();
              foreach (var existente in comercialesExistentes.Where(v => !idsSolicitados.Contains(v.Id)))
              {
                  if (existente.Cantidad > 0)
                      throw new BusinessRuleException($"No puedes retirar la variante '{existente.Etiqueta}' porque todavía tiene {existente.Cantidad} unidades.");
                  await _varianteService.DeleteAsync(productoId, existente.Id);
              }

              foreach (var solicitada in solicitadas)
              {
                  var existente = solicitada.Id.HasValue ? comercialesExistentes.FirstOrDefault(v => v.Id == solicitada.Id.Value) : null;
                  if (solicitada.Id.HasValue && existente is null)
                      throw new BusinessRuleException("Una de las variantes indicadas no pertenece al producto.");

                  if (existente is not null && solicitada.Cantidad != existente.Cantidad)
                      throw new BusinessRuleException($"El stock de '{existente.Etiqueta}' debe cambiarse mediante Ajustar inventario para conservar trazabilidad.");

                  if (existente is null)
                  {
                      var creada = await _varianteService.CreateAsync(productoId, new CreateProductoVarianteDto
                      {
                          MarcaId = solicitada.MarcaId,
                          ModeloId = solicitada.ModeloId,
                          ColorId = solicitada.ColorId,
                          TallaId = solicitada.TallaId,
                          Sku = solicitada.Sku,
                          CodigoBarras = solicitada.CodigoBarras,
                          Cantidad = solicitada.Cantidad,
                          UmbralStockBajo = solicitada.UmbralStockBajo,
                          Costo = solicitada.Costo,
                          Precio = solicitada.Precio
                      });
                      if (!solicitada.Activo)
                          await _varianteService.CambiarEstadoAsync(productoId, creada.Id, false);
                  }
                  else
                  {
                      var actualizada = await _varianteService.UpdateAsync(productoId, existente.Id, new UpdateProductoVarianteDto
                      {
                          MarcaId = solicitada.MarcaId,
                          ModeloId = solicitada.ModeloId,
                          ColorId = solicitada.ColorId,
                          TallaId = solicitada.TallaId,
                          Sku = solicitada.Sku,
                          CodigoBarras = solicitada.CodigoBarras,
                          Cantidad = existente.Cantidad,
                          UmbralStockBajo = solicitada.UmbralStockBajo,
                          Costo = solicitada.Costo,
                          Precio = solicitada.Precio
                      }) ?? throw new BusinessRuleException("No se pudo actualizar una de las variantes del producto.");
                      if (actualizada.Activo != solicitada.Activo)
                          await _varianteService.CambiarEstadoAsync(productoId, existente.Id, solicitada.Activo);
                  }
              }
          }
          }
          '''
          s=s[:a]+nuevo
          p.write_text(s,encoding='utf-8')
          PY
      - name: Restaurar y validar backend
        working-directory: backend
        run: |
          dotnet restore InventoryApp.sln
          dotnet build InventoryApp.sln --configuration Release --no-restore
          dotnet test InventoryApp.sln --configuration Release --no-build --filter "Category!=Integration"
          dotnet tool install --global dotnet-ef --version 8.0.8
      - name: Generar migracion de snapshots M2
        working-directory: backend
        run: |
          dotnet ef migrations add M2SnapshotsVariantesExactas \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext
          dotnet ef migrations has-pending-model-changes \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext
      - name: Publicar lote validado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git diff --cached --quiet && exit 1
          git commit -m "feat(m2): propagar variante exacta a operaciones e historicos [ChatGPT]"
          git push origin HEAD:Desarrollo
