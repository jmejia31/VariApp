name: M4 cerrar plan maestro

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/m4-wire-navigation-e2e.yml'

permissions:
  contents: write

jobs:
  close-plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Actualizar M4 en plan maestro
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('docs/PLAN_MAESTRO_MEJORAS_EMPRESARIALES_2026.md')
          text = path.read_text(encoding='utf-8')
          old = '''# FASE M4 — Estado persistente de filtros y navegación

- búsqueda;
- filtros;
- página;
- pageSize;
- orden;
- retorno desde detalle/edición;
- `Limpiar filtros`;
- query params + sessionStorage según necesidad;
- aislamiento por usuario cuando corresponda.

Cobertura inicial: Productos, Ventas, Compras, Clientes, Inventario y Finanzas.'''
          new = '''# FASE M4 — Estado persistente de filtros y navegación

Estado: **COMPLETADA / CERTIFICADA AUTOMÁTICAMENTE (2026-08-09)**.

Entregable: `docs/FASE_M4_PERSISTENCIA_FILTROS_NAVEGACION.md`.

- búsqueda;
- filtros;
- página;
- pageSize;
- orden;
- retorno desde detalle/edición;
- `Limpiar filtros`;
- query params + sessionStorage según necesidad;
- aislamiento por usuario cuando corresponda.

Cobertura completada: Productos, Ventas, Compras, Clientes, Inventario y Finanzas.

Evidencia enfocada: Playwright M4 sobre MySQL 8.4 descartable, run `31337474683` — **success**.'''
          if text.count(old) != 1:
              raise SystemExit(f'Bloque M4 esperado no encontrado de forma única: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Publicar actualización documental
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PLAN_MAESTRO_MEJORAS_EMPRESARIALES_2026.md
          git commit -m "docs(m4): certificar fase en plan maestro [ChatGPT]"
          git push origin HEAD:Desarrollo
