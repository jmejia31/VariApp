name: M4 validacion enfocada de navegacion

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/m4-wire-navigation-e2e.yml'
      - 'frontend/e2e/m4-navigation-state.spec.ts'
      - 'frontend/src/app/core/navigation/**'
      - 'frontend/src/app/features/productos/**'
      - 'frontend/src/app/features/ventas/**'
      - 'frontend/src/app/features/compras/**'
      - 'frontend/src/app/features/clientes/**'
      - 'frontend/src/app/features/inventario/**'
      - 'frontend/src/app/features/finanzas/**'

permissions:
  contents: read

jobs:
  m4-navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inventoryapp_m4_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: '5005'
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=inventoryapp_m4_e2e;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'true'
      Jwt__Secret: 'M4-E2E-Only-Secret-With-More-Than-32-Characters-2026'
      Jwt__Issuer: 'InventoryApp.API'
      Jwt__Audience: 'InventoryApp.Frontend'
      Jwt__ExpiraMinutos: '120'
      Security__LoginRateLimitPerMinute: '300'
      SeedAdmin__Username: 'e2e_admin'
      SeedAdmin__Password: 'E2E.Admin#2026!'
      Cors__AllowedOrigins__0: 'http://127.0.0.1:4200'
      Cors__AllowedOrigins__1: 'http://localhost:4200'
      AppSettings__BackendPublicUrl: 'https://preview.variapp.invalid'
      AppSettings__LogoPublicUrl: 'https://variapp-desarrollo.vercel.app/assets/varistorehn-logo.png'
      AppSettings__EnlacePublicoFacturaHorasValidez: '1'
      AppSettings__EnlacePublicoFacturaMaximoAccesos: '5'
      AppSettings__CorreoFacturaIdempotenciaMinutos: '15'
      Cloudinary__CloudName: 'e2e-not-used'
      Cloudinary__ApiKey: 'e2e-not-used'
      Cloudinary__ApiSecret: 'e2e-not-used'
      Smtp__Host: '127.0.0.1'
      Smtp__Port: '1025'
      Smtp__UsuarioSmtp: 'smtp-user'
      Smtp__PasswordSmtp: 'smtp-pass'
      Smtp__UsarSsl: 'false'
      Smtp__RequiereAutenticacion: 'false'
      Smtp__CorreoRemitente: 'm4@desarrollo.test'
      Smtp__CorreoRespuesta: 'm4@desarrollo.test'
      Smtp__NombreRemitente: 'VariApp M4 E2E'
      Smtp__TimeoutSeconds: '10'
      Smtp__MaxAttempts: '1'
      Smtp__RetryBaseDelayMilliseconds: '100'
      PHASE7_API_URL: 'http://127.0.0.1:5005'
      PHASE7_ADMIN_USERNAME: 'e2e_admin'
      PHASE7_ADMIN_PASSWORD: 'E2E.Admin#2026!'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar backend
        working-directory: backend
        run: |
          dotnet restore InventoryApp.sln
          dotnet build InventoryApp.sln --configuration Release --no-restore

      - name: Iniciar API descartable
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          nohup dotnet run --project src/API/InventoryApp.API.csproj --configuration Release --no-build --no-launch-profile > m4-api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5005/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat m4-api.log >&2 || true
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Preparar frontend y Chromium
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npx playwright install --with-deps chromium

      - name: Iniciar Angular
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > m4-frontend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4200/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat m4-frontend.log >&2 || true
          exit 1

      - name: Ejecutar regresion M4
        working-directory: frontend
        run: npx playwright test e2e/m4-navigation-state.spec.ts --config=playwright.config.ts
