name: N8.21.F - Purga temporal de artifact sensible

on:
  push:
    branches:
      - Desarrollo
    paths:
      - .github/workflows/n8-21-f-sensitive-artifact-cleanup.yml

permissions:
  contents: read
  actions: write

jobs:
  purge-n821-temp-backup:
    name: Eliminar artifact temporal de backup N8.21 validado
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Eliminar artifact 10452911215 de forma idempotente
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '10452911215'
        run: |
          set -euo pipefail
          endpoint="/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
          if gh api "$endpoint" >/dev/null 2>&1; then
            gh api -X DELETE "$endpoint"
          fi
          if gh api "$endpoint" >/dev/null 2>&1; then
            echo "Artifact sensible todavía presente después del cleanup." >&2
            exit 1
          fi
          echo "N8.21 temporary encrypted DB backup artifact is absent."
