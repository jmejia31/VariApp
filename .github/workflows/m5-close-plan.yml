name: M5 cerrar plan maestro

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/m5-close-plan.yml'

permissions:
  contents: write

jobs:
  close-plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Actualizar M5 en plan maestro
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/PLAN_MAESTRO_MEJORAS_EMPRESARIALES_2026.md')
          text = path.read_text(encoding='utf-8')
          old = "# FASE M5 — Clientes y segmentación\n\n- `TipoCliente` existente como base;\n- filtros y estadísticas por tipo;\n- reportes/exportaciones;\n- tipos administrables;\n- `SIN_CLASIFICAR` protegido;\n- segmentación extensible sin hardcodear etiquetas subjetivas.\n\nLa identidad de Cliente seguirá las reglas corregidas en M1."
          new = "# FASE M5 — Clientes y segmentación\n\nEstado: **COMPLETADA / CERTIFICADA AUTOMÁTICAMENTE (2026-08-09)**.\n\nEntregable: `docs/FASE_M5_CLIENTES_SEGMENTACION.md`.\n\n- `TipoCliente` existente como base;\n- filtros y estadísticas por tipo;\n- reportes/exportaciones;\n- tipos administrables;\n- `SIN_CLASIFICAR` protegido;\n- segmentación extensible sin hardcodear etiquetas subjetivas.\n\nCobertura completada: mantenimiento dinámico de `TipoCliente`, filtro persistente por clasificación, estadísticas comparativas, exportación CSV filtrada, protección `SIN_CLASIFICAR` y conservación de las reglas de identidad de M1.\n\nEvidencia enfocada: MySQL 8.4 + backend 17/17 + Playwright M5 3/3, run `31339633125` — **success**.\n\nLa identidad de Cliente sigue las reglas corregidas en M1."
          if text.count(old) != 1:
              raise SystemExit(f'Bloque M5 esperado no encontrado de forma única: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Publicar actualización documental
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PLAN_MAESTRO_MEJORAS_EMPRESARIALES_2026.md
          git commit -m "docs(m5): certificar fase en plan maestro [ChatGPT]"
          git push origin HEAD:Desarrollo
