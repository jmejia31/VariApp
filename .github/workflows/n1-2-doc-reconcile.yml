name: ERP-N1.2 - Preparar reconciliación documental

on:
  push:
    branches:
      - Desarrollo
    paths:
      - '.github/workflows/n1-2-doc-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar copias reconciliadas
        run: python scripts/n1_2_reconcile_docs.py
      - name: Publicar artefacto documental
        uses: actions/upload-artifact@v4
        with:
          name: n1-2-doc-reconciled
          path: /tmp/n12-docs/
          if-no-files-found: error
          retention-days: 1
