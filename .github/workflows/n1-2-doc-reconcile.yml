name: ERP-N1.2 - Finalizar reconciliación documental

on:
  push:
    branches:
      - Desarrollo
    paths:
      - '.github/workflows/n1-2-doc-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generar colaborativos reconciliados
        run: |
          set -euo pipefail
          python scripts/n1_2_reconcile_docs.py
          cp /tmp/n12-docs/TASKS.md TASKS.md
          cp /tmp/n12-docs/CHANGELOG_AI.md CHANGELOG_AI.md
      - name: Retirar helpers temporales y publicar cierre
        run: |
          set -euo pipefail
          git config user.name 'VariApp VAEP Runner'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/n1-2-doc-reconcile.yml scripts/n1_2_reconcile_docs.py
          git add TASKS.md CHANGELOG_AI.md
          git diff --cached --check
          git commit -m 'docs(N1.2.H): reconciliar cierre formal de almacenes'
          git push origin HEAD:Desarrollo
