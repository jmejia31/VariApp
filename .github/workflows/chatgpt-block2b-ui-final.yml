name: Temporal ChatGPT Block 2B UI Final

on:
  push:
    branches:
      - Desarrollo
    paths:
      - .github/workflows/chatgpt-block2b-ui-final.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Alinear existencias esperadas en UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/e2e/fase4-variantes.spec.ts')
          text = path.read_text(encoding='utf-8')
          old_total = "await expect(page.locator('.stock-summary').getByText('10 unidades', { exact: true })).toBeVisible();"
          new_total = "await expect(page.locator('.stock-summary').getByText('14 unidades', { exact: true })).toBeVisible();"
          old_variant = "await expect(fila.getByText('6', { exact: true })).toBeVisible();"
          new_variant = "await expect(fila.getByText('10', { exact: true })).toBeVisible();"
          if text.count(old_total) != 1:
              raise SystemExit('La expectativa de stock total no aparece exactamente una vez.')
          if text.count(old_variant) != 1:
              raise SystemExit('La expectativa de stock de variante no aparece exactamente una vez.')
          text = text.replace(old_total, new_total, 1)
          text = text.replace(old_variant, new_variant, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint

      - name: Publicar corrección en Desarrollo
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'jmejia31'
          git config user.email '93171442+jmejia31@users.noreply.github.com'
          git add frontend/e2e/fase4-variantes.spec.ts
          if git diff --cached --quiet; then
            echo 'No hay cambios para publicar.'
            exit 1
          fi
          git commit -m 'test(e2e): alinear stock UI con bloqueo conservador de compra [ChatGPT]'
          git push origin HEAD:Desarrollo
