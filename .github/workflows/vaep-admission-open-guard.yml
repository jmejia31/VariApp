name: VAEP admission OPEN invariant

on:
  push:
    branches: [Desarrollo]
    paths: ['vaep/control/dispatch-admission.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vaep-admission-open-invariant
  cancel-in-progress: false

jobs:
  enforce-open:
    name: Enforce global admission OPEN
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: Desarrollo
      ADMISSION_PATH: vaep/control/dispatch-admission.json
    steps:
      - name: Reject FROZEN as an operational state
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            payload="$(gh api "repos/$REPO/contents/$ADMISSION_PATH?ref=$BRANCH")"
            sha="$(jq -r '.sha' <<<"$payload")"
            decoded="$(jq -r '.content' <<<"$payload" | tr -d '\n' | base64 -d)"
            state="$(jq -r '.newDispatchAdmission // "INVALID"' <<<"$decoded" 2>/dev/null || printf 'INVALID')"
            allow="$(jq -r '.allowExistingActiveSessions // false' <<<"$decoded" 2>/dev/null || printf 'false')"

            if [[ "$state" == "OPEN" && "$allow" == "true" ]]; then
              echo "VAEP_ADMISSION_INVARIANT=PASS state=OPEN"
              exit 0
            fi

            now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            reason="GLOBAL_FREEZE_PROHIBITED__AUTO_REOPEN__prior_state=${state}__LANE_LEVEL_QUARANTINE_REVIEW_FIRST_ONLY"
            fixed="$(jq -n --arg now "$now" --arg reason "$reason" '{newDispatchAdmission:"OPEN",allowExistingActiveSessions:true,reason:$reason,updatedAtUtc:$now}')"
            encoded="$(printf '%s\n' "$fixed" | base64 -w0)"

            if jq -n \
              --arg message "fix(vaep): auto-reopen prohibited global admission state" \
              --arg content "$encoded" \
              --arg sha "$sha" \
              --arg branch "$BRANCH" \
              '{message:$message,content:$content,sha:$sha,branch:$branch}' \
              | gh api "repos/$REPO/contents/$ADMISSION_PATH" --method PUT --input - >/dev/null 2>&1; then
              echo "VAEP_ADMISSION_INVARIANT=REPAIRED prior_state=$state new_state=OPEN"
              exit 0
            fi

            sleep "$attempt"
          done

          payload="$(gh api "repos/$REPO/contents/$ADMISSION_PATH?ref=$BRANCH")"
          decoded="$(jq -r '.content' <<<"$payload" | tr -d '\n' | base64 -d)"
          jq -e '.newDispatchAdmission=="OPEN" and .allowExistingActiveSessions==true' <<<"$decoded" >/dev/null
          echo "VAEP_ADMISSION_INVARIANT=PASS_AFTER_RACE state=OPEN"
