name: Fase 3 - integrar presentación de envío

on:
  push:
    branches: [Desarrollo]
    paths:
      - .github/checkpoints/fase3-presentacion-envio

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - name: Actualizar rutas, factura web y PDF
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              if old not in text:
                  raise SystemExit(f'Patrón no encontrado en {path}: {old[:120]}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          routes = 'frontend/src/app/app.routes.ts'
          replace(routes,
          "  {\n    path: 'auditoria',\n    canActivate: [authGuard, permisoGuard],",
          "  {\n    path: 'costos-envio',\n    canActivate: [authGuard, permisoGuard],\n    data: { modulo: 'Facturacion', accion: 'Administrar' },\n    loadComponent: () => import('./features/costos-envio/costos-envio.component').then(m => m.CostosEnvioComponent)\n  },\n  {\n    path: 'auditoria',\n    canActivate: [authGuard, permisoGuard],")

          view = 'frontend/src/app/features/facturas/factura-view.component.html'
          replace(view,
          "        @if (f.impuestoAdicional > 0) {\n          <div><span>Impuesto adicional</span><span>+ L. {{ f.impuestoAdicional | number:'1.2-2' }}</span></div>\n        }\n        <div class=\"total\"><span>TOTAL</span><span>L. {{ f.total | number:'1.2-2' }}</span></div>",
          "        @if (f.impuestoAdicional > 0) {\n          <div><span>Impuesto adicional</span><span>+ L. {{ f.impuestoAdicional | number:'1.2-2' }}</span></div>\n        }\n        <div><span>{{ f.envioExonerado ? 'Envío exonerado' : (f.costoEnvioNombre || 'Costo de envío') }}</span><span>{{ f.envioExonerado ? 'L. 0.00' : ('L. ' + (f.costoEnvio | number:'1.2-2')) }}</span></div>\n        @if (f.envioExonerado && f.motivoExoneracionEnvio) {\n          <div><span>Motivo de exoneración</span><span>{{ f.motivoExoneracionEnvio }}</span></div>\n        }\n        <div class=\"total\"><span>TOTAL</span><span>L. {{ f.total | number:'1.2-2' }}</span></div>")

          pdf = 'backend/src/Infrastructure/Services/QuestPdfFacturaPerfilesService.cs'
          replace(pdf,
          '                            if (factura.ImpuestoAdicional > 0)\n                                FilaTotal(totales, "Impuesto adicional", factura.ImpuestoAdicional, false, compacto);\n                            FilaTotal(totales, "TOTAL A PAGAR", factura.Total, true, compacto, colorPrimario);',
          '                            if (factura.ImpuestoAdicional > 0)\n                                FilaTotal(totales, "Impuesto adicional", factura.ImpuestoAdicional, false, compacto);\n                            FilaTotal(totales, factura.EnvioExonerado ? "Envío exonerado" : (factura.CostoEnvioNombre ?? "Costo de envío"), factura.EnvioExonerado ? 0 : factura.CostoEnvio, false, compacto);\n                            FilaTotal(totales, "TOTAL A PAGAR", factura.Total, true, compacto, colorPrimario);')
          replace(pdf,
          '                    if (factura.ImpuestoAdicional > 0)\n                        FilaTermica(content, "Impuesto adicional", factura.ImpuestoAdicional, compacto);\n                    content.Item().PaddingTop(2).BorderTop(1).PaddingTop(3).Row(row =>',
          '                    if (factura.ImpuestoAdicional > 0)\n                        FilaTermica(content, "Impuesto adicional", factura.ImpuestoAdicional, compacto);\n                    FilaTermica(content, factura.EnvioExonerado ? "Envío exonerado" : (factura.CostoEnvioNombre ?? "Costo de envío"), factura.EnvioExonerado ? 0 : factura.CostoEnvio, compacto);\n                    if (factura.EnvioExonerado && !string.IsNullOrWhiteSpace(factura.MotivoExoneracionEnvio))\n                        content.Item().Text($"Motivo envío: {factura.MotivoExoneracionEnvio}").FontSize(compacto ? 5.5f : 6.5f);\n                    content.Item().PaddingTop(2).BorderTop(1).PaddingTop(3).Row(row =>')
          replace(pdf,
          '        if (factura.ImpuestosAplicados.Any())\n        {',
          '        columna.Item().PaddingTop(4).Text("ENVÍO").FontSize(compacto ? 6 : 8).Bold().FontColor(color);\n        columna.Item().Text(factura.EnvioExonerado\n                ? $"• Exonerado: {factura.MotivoExoneracionEnvio ?? "Sin motivo"}"\n                : $"• {factura.CostoEnvioNombre ?? "Costo de envío"}: L. {factura.CostoEnvio:N2}")\n            .FontSize(compacto ? 6 : 8);\n\n        if (factura.ImpuestosAplicados.Any())\n        {')
          PY
      - name: Publicar presentación
        run: |
          git config user.name 'VariApp Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/src/app/app.routes.ts frontend/src/app/features/facturas/factura-view.component.html backend/src/Infrastructure/Services/QuestPdfFacturaPerfilesService.cs
          git commit -m 'feat: mostrar costo de envío en factura y PDF'
          git push origin HEAD:Desarrollo
