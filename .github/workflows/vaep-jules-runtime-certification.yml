name: VAEP Tasks-First Runtime Certification

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/scripts/vaep-*.sh'
      - '.github/workflows/vaep-*.yml'
      - 'scripts/vaep/**'
      - 'vaep/**'
      - 'docs/VAEP_AUTHORITY.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaep-tasks-first-runtime-certification
  cancel-in-progress: false

jobs:
  runtime-contract:
    name: TASKS_FIRST runtime contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate TASKS_FIRST registry and authority
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/vaep/jules_registry_check.py
          bash .github/scripts/vaep-policy-parser.sh --validate docs/VAEP_AUTHORITY.md
          jq -e '.schemaVersion == "3.0"
            and .executionModel == "TASKS_FIRST_JULES_ON_DEMAND"
            and .runtimeMode == "OPTIONAL_ACCELERATORS_J1_J6"
            and .directExecutionDefault == true
            and .julesRequiredForProgress == false
            and .minimumUtilizationTarget == 0
            and .automaticRefillEnabled == false
            and .automaticQueueFloorEnabled == false
            and .offloadRequiresExplicitApproval == true
            and .offloadApprovalMarker == "JULES_OFFLOAD_APPROVED"
            and .offloadRequiresCriticalPathGain == true
            and .offloadRequiresNonOverlappingScope == true
            and .offloadMayBlockCurrentParent == false
            and .availableWorkers == ["J1","J2","J3","J4","J5","J6"]' vaep/control/jules-workers.json >/dev/null
          jq -e '.schemaVersion == "tasks-first.v1"
            and .executionModel == "TASKS_FIRST_JULES_ON_DEMAND"
            and .policy.directExecutionDefault == true
            and .policy.taskScopeLeaseRequired == true
            and .policy.julesRequiredForProgress == false
            and .policy.julesAutomaticRefill == false
            and .policy.julesAutomaticQueueFloor == false
            and .policy.julesMinimumUtilizationTarget == 0
            and .policy.noBusywork == true
            and .throughputPlan.julesOffload == "OPTIONAL_EXPLICIT_ONLY"' vaep/control/jules-autorefill-catalog.json >/dev/null
          grep -Fq 'EXECUTION_MODEL=TASKS_FIRST_JULES_ON_DEMAND' docs/VAEP_AUTHORITY.md
          grep -Fq 'DIRECT_EXECUTION_DEFAULT=TRUE' docs/VAEP_AUTHORITY.md
          grep -Fq 'JULES_REQUIRED_FOR_PROGRESS=FALSE' docs/VAEP_AUTHORITY.md
          grep -Fq 'JULES_MINIMUM_UTILIZATION_TARGET=0' docs/VAEP_AUTHORITY.md
          grep -Fq 'JULES_ACTIVE_WORKERS=J1,J2,J3,J4,J5,J6' docs/VAEP_AUTHORITY.md
          grep -Fq 'JULES_OFFLOAD_APPROVED' docs/VAEP_AUTHORITY.md

      - name: Verify transitional runtime cleanup
        shell: bash
        run: |
          set -euo pipefail
          removed=(
            docs/VAEP_J1_J6_PREPARATION.md
            scripts/vaep/j1_j6_cutover.py
            scripts/vaep/j1_j6_registry_check.py
            .github/workflows/vaep-j1-j6-cutover-apply.yml
            .github/workflows/vaep-j1-j6-cutover-dry-run.yml
            .github/workflows/vaep-j1-j6-readiness-gate.yml
            .github/workflows/vaep-j3-j4-legacy-readiness.yml
            .github/workflows/vaep-j5-j6-canary.yml
            .github/workflows/vaep-jules-secondary.yml
            .github/workflows/vaep-jules-secondary-b.yml
            .github/workflows/vaep-jules-secondary-c.yml
            .github/workflows/vaep-jules-secondary-d.yml
            .github/workflows/vaep-jules-a-recovery.yml
            .github/workflows/vaep-jules-b-recovery.yml
            .github/workflows/vaep-jules-c-recovery.yml
            .github/workflows/vaep-jules-d-recovery.yml
          )
          for path in "${removed[@]}"; do
            test ! -e "$path" || { echo "TRANSITIONAL_RUNTIME_PATH_FOUND=$path" >&2; exit 1; }
          done
          if grep -R -En 'secrets\.JULES_(API_KEY|B_API_KEY|C_API_KEY|D_API_KEY)' .github/workflows; then
            echo 'LEGACY_SECRET_REFERENCE_FOUND_IN_WORKFLOW_RUNTIME' >&2
            exit 1
          fi
          echo TASKS_FIRST_TRANSITIONAL_RUNTIME_REFERENCES=ZERO

      - name: Validate optional Jules transports
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            wf=".github/workflows/vaep-jules-j${i}.yml"
            test -f "$wf"
            grep -Fq 'EXECUTION_MODEL: TASKS_FIRST_JULES_ON_DEMAND' "$wf"
            grep -Fq "WORKER_ID: J${i}" "$wf"
            grep -Fq "secrets.JULES_J${i}_API_KEY" "$wf"
            grep -Fq 'Validate explicit offload transport' "$wf"
            grep -Fq "JULES_J${i}_API_KEY" .github/workflows/vaep-jules-feedback.yml
          done
          grep -Fq '(.workerId | type == "string" and test("^J[1-6]$"))' .github/workflows/vaep-jules-feedback.yml
          grep -Fq 'expected_title="VAEP-${WORKER_ID} ${DISPATCH_ID}"' .github/workflows/vaep-jules-feedback.yml

      - name: Validate active runtime syntax and self-tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/vaep/jules_registry_check.py scripts/vaep/jules_integration_metrics.py scripts/vaep/jules_runtime_contract.py scripts/vaep/terminal_handoff.py
          node --check scripts/vaep/dispatch-preflight.mjs
          bash -n .github/scripts/vaep-policy-parser.sh .github/scripts/vaep-jules-master.sh .github/scripts/vaep-jules-worker.sh .github/scripts/vaep-parent-close.sh .github/scripts/vaep-checkpoint.sh
          bash .github/scripts/vaep-policy-parser.sh --self-test
          bash .github/scripts/vaep-jules-master.sh --static-self-test
          bash .github/scripts/vaep-checkpoint.sh --self-test
          bash .github/scripts/vaep-parent-close.sh --self-test
          node scripts/vaep/dispatch-preflight-self-test.mjs
          python3 scripts/vaep/jules_integration_metrics.py --self-test
          python3 -m unittest discover -s scripts/vaep -p test_terminal_handoff.py
          git diff --check

  final:
    name: TASKS_FIRST runtime certificate
    needs: runtime-contract
    runs-on: ubuntu-latest
    steps:
      - name: Emit runtime certificate
        run: |
          echo TASKS_FIRST_RUNTIME_CONTRACT=PASS
          echo JULES_MODE=OPTIONAL_EXPLICIT_OFFLOAD_ONLY
          echo AUTOMATIC_REFILL=DISABLED
          echo AUTOMATIC_QUEUE_FLOOR=DISABLED
