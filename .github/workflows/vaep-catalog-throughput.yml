name: VAEP catalog throughput guard

on:
  push:
    branches: [Desarrollo]
    paths:
      - 'vaep/control/jules-autorefill-catalog.json'
      - '.github/workflows/vaep-catalog-throughput.yml'
  pull_request:
    branches: [main]
    paths:
      - 'vaep/control/jules-autorefill-catalog.json'
      - '.github/workflows/vaep-catalog-throughput.yml'

permissions:
  contents: read

jobs:
  validate-material-swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate material parallelism contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('vaep/control/jules-autorefill-catalog.json')
          catalog = json.loads(path.read_text(encoding='utf-8'))

          if catalog.get('authority') != 'docs/VAEP_AUTHORITY.md':
              raise SystemExit('catalog authority mismatch')

          canonical = {'J1','J2','J3','J4','J5','J6'}
          lanes = catalog.get('lanes')
          if set(lanes or {}) != canonical:
              raise SystemExit('all six canonical Jules lanes must be represented')

          tasks = [task for lane in lanes.values() for task in lane]
          task_ids = [task.get('taskId') for task in tasks]
          dispatch_ids = [task.get('dispatchId') for task in tasks]
          if len(task_ids) != len(set(task_ids)) or len(dispatch_ids) != len(set(dispatch_ids)):
              raise SystemExit('TASK_IDENTITY_UNIQUE violated')

          current = catalog.get('currentParent')
          for task in tasks:
              if task.get('dispatchEligible') is True and task.get('plannedParent') != current:
                  raise SystemExit('future-parent task is dispatchEligible')

          policy = catalog.get('policy') or {}
          if policy.get('noBusywork') is not True:
              raise SystemExit('noBusywork must remain true')
          if policy.get('requireDistinctWriteScopesWhenParallel') is not True:
              raise SystemExit('parallel distinct-write-scope guard missing')
          if policy.get('activeWorkerCount') != 6 or policy.get('activeWorkers') != ['J1','J2','J3','J4','J5','J6']:
              raise SystemExit('canonical six-worker policy mismatch')
          if policy.get('programmedBacklogTargetTotal') != 72:
              raise SystemExit('programmed backlog total must be 72')

          plan = catalog.get('throughputPlan') or {}
          next_parent = plan.get('nextParent')
          expected = plan.get('nextParentParallelMaterialScopes')
          if not isinstance(next_parent, str) or not next_parent.strip():
              raise SystemExit('next-parent throughput plan missing')
          # Zero is valid when the source-backed roadmap has not yielded safe
          # successor scopes yet. Forcing 1..6 here would contradict noBusywork
          # and dependency gating by requiring fabricated NEXT work.
          if not isinstance(expected, int) or isinstance(expected, bool) or not 0 <= expected <= 6:
              raise SystemExit('next-parent material scope count must be an integer from 0 to 6')
          if expected < 6 and policy.get('lowParallelismAction') != 'EXPLAIN_OR_SUBDIVIDE_MATERIAL_SCOPE__NO_BUSYWORK':
              raise SystemExit('lower material parallelism requires explicit no-busywork policy')

          planned = [task for task in tasks if task.get('plannedParent') == next_parent and task.get('readyForDispatch') is True]
          workers = {task.get('workerId') for task in planned}
          if len(planned) != expected or len(workers) != expected:
              raise SystemExit('next parent prearmed material scope count/worker ownership mismatch')
          if not workers.issubset(canonical):
              raise SystemExit('next parent references an unknown Jules lane')

          scopes = []
          for task in planned:
              raw = task.get('fileScopeHint')
              if not isinstance(raw, str) or not raw.strip():
                  raise SystemExit('material task missing FILE_SCOPE_HINT')
              if not isinstance(task.get('prompt'), str) or not task['prompt'].strip():
                  raise SystemExit('material task missing prompt')
              for token in raw.split(';'):
                  token = token.strip()
                  if token:
                      scopes.append((task['taskId'], token.rstrip('*').rstrip('/')))

          for index, (left_task, left) in enumerate(scopes):
              for right_task, right in scopes[index + 1:]:
                  if left_task == right_task:
                      continue
                  if left == right or left.startswith(right + '/') or right.startswith(left + '/'):
                      raise SystemExit(f'overlapping parallel write scopes: {left_task}:{left} vs {right_task}:{right}')

          print(f'VAEP_THROUGHPUT_GUARD=PASS current={current} next={next_parent} parallel_scopes={expected}')
          PY
