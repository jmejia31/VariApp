name: VAEP N7.5.H byte append recovery

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/vaep-n75h-byte-append-recovery.yml'

permissions:
  contents: write

concurrency:
  group: vaep-n75h-byte-append-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Recover N7.5.H append-only docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Verify exact blobs and append bytes
        shell: bash
        env:
          TASKS_B64: 
          CHANGELOG_B64: 
        run: |
          set -euo pipefail
          test "$(git hash-object TASKS.md)" = "367af7e6fa3201d09f5a123c32d616dce7566042"
          test "$(git hash-object CHANGELOG_AI.md)" = "ab4307cdd14e6ce6f88c60cff6e3adfcde2aa360"
          cp TASKS.md /tmp/TASKS.before
          cp CHANGELOG_AI.md /tmp/CHANGELOG.before
          printf '%s' "$TASKS_B64" | base64 -d >> TASKS.md
          printf '%s' "$CHANGELOG_B64" | base64 -d >> CHANGELOG_AI.md
          cmp -n "$(wc -c < /tmp/TASKS.before)" /tmp/TASKS.before TASKS.md
          cmp -n "$(wc -c < /tmp/CHANGELOG.before)" /tmp/CHANGELOG.before CHANGELOG_AI.md
          for f in TASKS.md CHANGELOG_AI.md; do
            stats="$(git diff --numstat -- "$f")"
            adds="$(printf '%s\n' "$stats" | awk '{print $1}')"
            dels="$(printf '%s\n' "$stats" | awk '{print $2}')"
            test -n "$adds" && test "$adds" -gt 0
            test -n "$dels" && test "$dels" -eq 0
          done
          changed="$(git diff --name-only)"
          test "$changed" = $'CHANGELOG_AI.md\nTASKS.md' || test "$changed" = $'TASKS.md\nCHANGELOG_AI.md'

      - name: Commit rollups and retire recovery workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VAEP Recovery"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/vaep-n75h-byte-append-recovery.yml
          git add TASKS.md CHANGELOG_AI.md
          git diff --cached --check
          git commit -m "docs(n7.5.h): append byte-safe closure rollups"
          git push origin HEAD:Desarrollo
