# Triggered after registration on Desarrollo; exact source/target hard guards below.
name: VAEP N3.7.H Exact Closure Publisher

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/vaep-n37h-exact-publish.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: vaep-n37h-exact-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Append N3.7 closure and hard verify history preservation
        shell: bash
        env:
          EXPECTED_SOURCE_BLOB: d53c56416ac7ac01beef761adab5172cf5297487
          EXPECTED_TARGET_BLOB: 4ae1376702e4ba9f2ed64930dd4dcfb150a765f9
          EXPECTED_SHA256: dbb13d667a638e567e3b24b9118b6e7c131f9980bab1768d73b697d7c3e24a16
        run: |
          set -euo pipefail
          git fetch origin Desarrollo --depth=1
          test "$(git rev-parse origin/Desarrollo)" = "$GITHUB_SHA"
          test "$(git hash-object CHANGELOG_AI.md)" = "$EXPECTED_SOURCE_BLOB"
          cp CHANGELOG_AI.md /tmp/CHANGELOG_AI.source

          cat >> CHANGELOG_AI.md <<'EOF'

          ## 2026-08-26 — ERP-N3.7 Nota de crédito de cliente — CIERRE FORMAL

          **Responsable:** ChatGPT/VAEP MASTER Closure Governor mediante QA takeover documental y hard verify history-preserving.

          **Objetivo/alcance:** cerrar formalmente N3.7.A-H sin reabrir código funcional ni inventar semánticas fiscales, stock, Kardex, caja o downstream no certificadas. `NotaCreditoCliente` conserva el alcance y contratos ya certificados por N3.7.A-G.

          **Evidencia:** N3.7.A Issue #752 `LISTO_REAL`; N3.7.B `46a250fcc0cfd1562306538375e772a94c39bea5`; N3.7.C `9810cf2e7fd0289a9374a8477a4131f3f73fef38`; N3.7.D `8bcacae8a45fe3c0072bf519610bcc1ec1203a4f`; N3.7.E `f9ef582749a79c8900741d1a40ff393039c7b287`; N3.7.F `943aa0e607af3221ed8987a0edac37a539561696`; N3.7.G Issue #781 `LISTO_REAL`. Los gates causales y P0/P1 atribuibles de esos padres quedaron certificados en sus cierres.

          **Cierre documental/control:** `TASKS.md` ya contiene el rollup N3.7 y esta publicación agrega únicamente este bloque a `CHANGELOG_AI.md`, preservando byte por byte todo el blob source `d53c56416ac7ac01beef761adab5172cf5297487` y sin eliminar ni reformular historia previa. Issue #782 es el control de cierre; PR #2 permanece Draft `Desarrollo → main`, sin merge. P0/P1 atribuibles conocidos al cierre: 0.

          **Promoción:** con esta publicación N3.7.H queda formalmente `LISTO`; el selector fail-closed puede promover `N3.8.A` y mantener N3.8.B como pipeline SAFE según dependencias.
          EOF

          sed -i 's/^          //' CHANGELOG_AI.md
          cmp -n "$(stat -c%s /tmp/CHANGELOG_AI.source)" /tmp/CHANGELOG_AI.source CHANGELOG_AI.md
          test "$(git hash-object CHANGELOG_AI.md)" = "$EXPECTED_TARGET_BLOB"
          test "$(sha256sum CHANGELOG_AI.md | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(wc -c < CHANGELOG_AI.md)" -eq 75830
          test "$(wc -l < CHANGELOG_AI.md)" -eq 577
          test "$(git diff --name-only)" = "CHANGELOG_AI.md"
          test "$(git diff --numstat -- CHANGELOG_AI.md)" = $'12\t0\tCHANGELOG_AI.md'
          git diff --check

          git config user.name 'VAEP Controller'
          git config user.email 'actions@users.noreply.github.com'
          git add CHANGELOG_AI.md
          git commit -m 'docs(N3.7.H): cerrar NotaCreditoCliente en changelog [VAEP MASTER] [skip ci]'

          git fetch origin Desarrollo --depth=1
          test "$(git rev-parse origin/Desarrollo)" = "$GITHUB_SHA"
          git push origin HEAD:Desarrollo
