name: Temporal ChatGPT - Generar migración base de Insumos

on:
  push:
    branches:
      - Desarrollo
    paths:
      - .github/workflows/chatgpt-insumos-generar-migracion.yml

permissions:
  contents: write

jobs:
  generar-migracion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar backend
        run: dotnet restore backend/InventoryApp.sln

      - name: Compilar modelo antes de migrar
        run: dotnet build backend/InventoryApp.sln --configuration Release --no-restore

      - name: Instalar dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 8.0.8

      - name: Generar migración EF de Insumos
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations add FaseInsumosAdministrativosBase \
            --project backend/src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project backend/src/API/InventoryApp.API.csproj \
            --context AppDbContext \
            --output-dir Migrations

      - name: Validar archivos generados
        run: |
          git status --short
          if git diff --quiet -- backend/src/Infrastructure/Migrations && \
             [ -z "$(git ls-files --others --exclude-standard backend/src/Infrastructure/Migrations)" ]; then
            echo "EF no generó cambios de migración." >&2
            exit 1
          fi

      - name: Publicar migración generada en Desarrollo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/Infrastructure/Migrations
          git commit -m "feat(insumos): generar migración base de inventario administrativo [ChatGPT]"
          git push origin HEAD:Desarrollo
