# VAEP MASTER exact history-preserving closure publisher for N3.9.H.
name: VAEP N3.9.H Exact Closure Publisher

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/vaep-n39h-exact-publish.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: vaep-n39h-exact-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Append N3.9 closure and hard verify history preservation
        shell: bash
        env:
          EXPECTED_SOURCE_BLOB: f9a5f400da040e5d0708cc83e9a23cb48d1838e6
          EXPECTED_TARGET_BLOB: 2374be85a7a3fd72ab4cff7cba03b76c09e9ec0e
          EXPECTED_SHA256: 675cbd9b43f69135f8860f5c52162ccf9f954cff542dca80adb8825cbfbe0641
        run: |
          set -euo pipefail
          git fetch origin Desarrollo --depth=1
          test "$(git rev-parse origin/Desarrollo)" = "$GITHUB_SHA"
          test "$(git hash-object CHANGELOG_AI.md)" = "$EXPECTED_SOURCE_BLOB"
          cp CHANGELOG_AI.md /tmp/CHANGELOG_AI.source

          cat >> CHANGELOG_AI.md <<'EOF'

          ## 2026-08-26 — ERP-N3.9 Cuentas por cobrar — CIERRE FORMAL

          **Responsable:** ChatGPT/VAEP MASTER Closure Governor mediante QA takeover documental y hard verify history-preserving.

          **Objetivo/alcance:** cerrar formalmente N3.9.A-H con base en hechos certificados. La proyección Cuentas por cobrar está implementada como una vista de solo lectura (GET /cuentas-por-cobrar) sobre la verdad operativa de Factura y FacturaPago, reutilizando el control RBAC existente (Facturacion/Ver) sin introducir libros contables mutables, esquemas propios, endpoints de escritura, lógica de mora/anticipos, ni nuevos permisos.

          **Evidencia:** N3.9.A-G están formalmente `LISTO_REAL`. La certificación canónica documental reposa en `docs/CERTIFICACION_N3_9_CUENTAS_POR_COBRAR.md`. P0/P1 atribuibles conocidos al cierre: 0.

          **Promoción:** con esta publicación, N3.9.H queda formalmente `LISTO`. El selector fail-closed puede promover el siguiente padre `N3.10.A`, respetando el bloqueo que impedía avanzar antes del cierre de H.
          EOF

          sed -i 's/^          //' CHANGELOG_AI.md
          cmp -n "$(stat -c%s /tmp/CHANGELOG_AI.source)" /tmp/CHANGELOG_AI.source CHANGELOG_AI.md
          test "$(git hash-object CHANGELOG_AI.md)" = "$EXPECTED_TARGET_BLOB"
          test "$(sha256sum CHANGELOG_AI.md | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(wc -c < CHANGELOG_AI.md)" -eq 77755
          test "$(wc -l < CHANGELOG_AI.md)" -eq 597
          test "$(git diff --name-only)" = "CHANGELOG_AI.md"
          test "$(git diff --numstat -- CHANGELOG_AI.md)" = $'10\t0\tCHANGELOG_AI.md'
          git diff --check

          git config user.name 'VAEP Controller'
          git config user.email 'actions@users.noreply.github.com'
          git add CHANGELOG_AI.md
          git commit -m 'docs(N3.9.H): cerrar Cuentas por cobrar en changelog [VAEP MASTER] [skip ci]'

          git fetch origin Desarrollo --depth=1
          test "$(git rev-parse origin/Desarrollo)" = "$GITHUB_SHA"
          git push origin HEAD:Desarrollo
