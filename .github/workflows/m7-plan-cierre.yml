name: M7 Plan Maestro cierre

on:
  push:
    branches:
      - Desarrollo
    paths:
      - .github/workflows/m7-plan-cierre.yml

permissions:
  contents: write

jobs:
  update-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
      - name: Actualizar Plan Maestro
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/PLAN_MAESTRO_MEJORAS_EMPRESARIALES_2026.md')
          t = p.read_text()
          m6 = '# FASE M6 — Mercadería, insumos administrativos y gastos\n\nSeparar y completar:'
          if m6 in t:
              t = t.replace(m6, '# FASE M6 — Mercadería, insumos administrativos y gastos\n\nEstado: **COMPLETADA / CERTIFICADA AUTOMÁTICAMENTE (2026-08-09)**.\n\nEntregable: `docs/FASE_M6_MERCADERIA_INSUMOS_GASTOS.md`.\n\nSeparación completada:', 1)
          m7 = '# FASE M7 — Costos de envío profesionales\n\nSobre la restricción de predeterminado ya reforzada en M1:'
          if m7 not in t:
              raise SystemExit('Bloque M7 no encontrado')
          t = t.replace(m7, '# FASE M7 — Costos de envío profesionales\n\nEstado: **COMPLETADA / CERTIFICADA AUTOMÁTICAMENTE (2026-08-09)**.\n\nEntregable: `docs/FASE_M7_COSTOS_ENVIO_PROFESIONALES.md`.\n\nSobre la restricción de predeterminado ya reforzada en M1:', 1)
          p.write_text(t)
          PY
      - name: Publicar y limpiar
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/m7-plan-cierre.yml
          git add docs/PLAN_MAESTRO_MEJORAS_EMPRESARIALES_2026.md
          git diff --cached --check
          git commit -m 'docs(m7): actualizar estado en Plan Maestro [ChatGPT]'
          git push origin HEAD:Desarrollo
