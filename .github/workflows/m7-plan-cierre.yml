name: M7 - actualizar Plan Maestro

on:
  push:
    branches: [Desarrollo]
    paths:
      - '.github/workflows/m7-plan-cierre.yml'

permissions:
  contents: write

jobs:
  update-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
      - name: Actualizar estados M6 y M7
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('docs/PLAN_MAESTRO_MEJORAS_EMPRESARIALES_2026.md')
          t=p.read_text()
          old='''# FASE M6 — Mercadería, insumos administrativos y gastos

Separar y completar:

- mercadería vendible;
- insumo administrativo físico no vendible;
- gasto financiero sin stock.

Incluye permisos, vistas, reportes, valoración, consumos y bloqueo backend contra venta de insumos.

---

# FASE M7 — Costos de envío profesionales

Sobre la restricción de predeterminado ya reforzada en M1:

- zona;
- ciudad;
- departamento;
- modalidad/tipo de envío;
- precio;
- prioridad;
- vigencia;
- activo;
- predeterminado;
- historial;
- snapshots de Venta/Factura;
- eliminación/desactivación segura.
'''
          new='''# FASE M6 — Mercadería, insumos administrativos y gastos

Estado: **COMPLETADA / CERTIFICADA AUTOMÁTICAMENTE (2026-08-09)**.

Entregable: `docs/FASE_M6_MERCADERIA_INSUMOS_GASTOS.md`.

Cobertura completada: separación operativa y contable entre mercadería vendible, insumos administrativos físicos no vendibles y gastos financieros sin stock; valoración separada, consumos trazables, permisos y bloqueo defensivo contra venta de insumos.

---

# FASE M7 — Costos de envío profesionales

Estado: **COMPLETADA / CERTIFICADA AUTOMÁTICAMENTE (2026-08-09)**.

Entregable: `docs/FASE_M7_COSTOS_ENVIO_PROFESIONALES.md`.

Sobre la restricción de predeterminado ya reforzada en M1 se completó:

- departamento, ciudad y zona opcionales como cobertura jerárquica;
- modalidad/tipo de envío;
- precio;
- prioridad;
- vigencia;
- activo;
- predeterminado único protegido en MySQL;
- resolución por especificidad y prioridad con fallback al predeterminado;
- historial y auditoría before/after;
- snapshots inmutables de cobertura en Venta/Factura;
- eliminación/desactivación segura;
- mantenimiento UI y selección de tarifas vigentes en Ventas.
'''
          if old not in t:
              raise SystemExit('Bloque M6/M7 esperado no encontrado; no se modifica el Plan Maestro')
          p.write_text(t.replace(old,new,1))
          PY
      - name: Publicar y retirar workflow temporal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/m7-plan-cierre.yml
          git add docs/PLAN_MAESTRO_MEJORAS_EMPRESARIALES_2026.md
          git diff --cached --check
          git commit -m 'docs(m7): actualizar estado en Plan Maestro [ChatGPT]'
          git push origin HEAD:Desarrollo
