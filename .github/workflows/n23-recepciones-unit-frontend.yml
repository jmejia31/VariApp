name: N2.3 - RecepcionCompra unit frontend

on:
  push:
    branches:
      - Desarrollo
    paths:
      - "frontend/angular.json"
      - "frontend/tsconfig.spec.json"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/src/app/features/recepciones-compra/**/*.spec.ts"
      - ".github/workflows/n23-recepciones-unit-frontend.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/angular.json"
      - "frontend/tsconfig.spec.json"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/src/app/features/recepciones-compra/**/*.spec.ts"
      - ".github/workflows/n23-recepciones-unit-frontend.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: n23-recepciones-unit-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Desarrollo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Calibrate Angular 20 unit dependencies
        working-directory: frontend
        run: npm install --save-dev vitest@^3.1.1 jsdom

      - name: Run RecepcionCompra unit tests
        working-directory: frontend
        run: npm test -- --no-watch

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend production
        working-directory: frontend
        run: npm run build:prod

      - name: Materialize calibrated package lock on Desarrollo
        if: github.event_name == 'push' && github.ref == 'refs/heads/Desarrollo'
        shell: bash
        run: |
          set -euo pipefail
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Calibrated dependencies already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(N2.3.G.1): fijar Vitest y jsdom reproducibles [ChatGPT]"
          git push origin HEAD:Desarrollo

      - name: Upload calibrated lockfiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n23-g1-unit-calibration
          path: |
            frontend/package.json
            frontend/package-lock.json
          if-no-files-found: error
          retention-days: 7
