name: Fase 3 - generar migración de envío en ventas

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/checkpoints/fase3-generar-migracion

permissions:
  contents: write

jobs:
  generar:
    if: github.event.pull_request.head.ref == 'Desarrollo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generar migración EF y capturar diagnóstico seguro
        working-directory: backend
        run: |
          set +e
          {
            dotnet restore
            dotnet tool install --global dotnet-ef --version 8.0.8
            export PATH="$PATH:$HOME/.dotnet/tools"
            dotnet ef migrations add Fase3CostoEnvioEnVentas \
              --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
              --startup-project src/API/InventoryApp.API.csproj \
              --context AppDbContext
          } > ../docs/FASE3_MIGRACION_DIAGNOSTICO.txt 2>&1
          code=$?
          tail -n 160 ../docs/FASE3_MIGRACION_DIAGNOSTICO.txt > ../docs/FASE3_MIGRACION_DIAGNOSTICO.tail
          mv ../docs/FASE3_MIGRACION_DIAGNOSTICO.tail ../docs/FASE3_MIGRACION_DIAGNOSTICO.txt
          echo "EXIT_CODE=$code" >> ../docs/FASE3_MIGRACION_DIAGNOSTICO.txt
          exit 0
      - name: Publicar migración o diagnóstico
        run: |
          git config user.name 'VariApp Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/src/Infrastructure/Migrations docs/FASE3_MIGRACION_DIAGNOSTICO.txt
          git commit -m 'chore: registrar resultado de generación EF fase 3'
          git push origin HEAD:Desarrollo
