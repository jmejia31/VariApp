name: Fase 3 - generar migración de envío en ventas

on:
  push:
    branches: [Desarrollo]
    paths:
      - .github/checkpoints/fase3-generar-migracion

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Desarrollo
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generar migración EF
        working-directory: backend
        run: |
          dotnet restore
          dotnet tool install --global dotnet-ef --version 8.0.8
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations add Fase3CostoEnvioEnVentas \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext
      - name: Publicar migración
        run: |
          git config user.name 'VariApp Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/src/Infrastructure/Migrations
          git commit -m 'feat: agregar migración de costo de envío en ventas'
          git push origin HEAD:Desarrollo
